  // ---------------------------------------------------------------- fundo (L0006)
  const ATRIBUICAO = {
    "esri-cinza": "Fundo: Esri, HERE, Garmin, © colaboradores do OpenStreetMap",
    vetorial: "Fundo: © OpenFreeMap · © colaboradores do OpenStreetMap",
  };
  const escuro = () => { const t = document.documentElement.dataset.theme; return t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); };
  const urlEsri = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${escuro() ? "World_Dark_Gray_Base" : "World_Light_Gray_Base"}/MapServer/tile/${z}/${y}/${x}`;
  const estiloVetorial = () => `https://tiles.openfreemap.org/styles/${escuro() ? "dark" : "positron"}`;
  // blocos de mapa (Web Mercator, mesma projeção do d3.geoMercator)
  const tileLon = (x, z) => (x / 2 ** z) * 360 - 180;
  const tileLat = (y, z) => { const n = Math.PI - (2 * Math.PI * y) / 2 ** z; return (180 / Math.PI) * Math.atan(Math.sinh(n)); };
  const lonTile = (lon, z) => Math.floor(((lon + 180) / 360) * 2 ** z);
  const latTile = (lat, z) => { const r = (lat * Math.PI) / 180; return Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z); };
  /** Fundo raster Esri cinza (L0006): os blocos visíveis com a transformação `t`, desenhados em `g` nas coordenadas da
   *  projeção (o grupo pai leva `t`); `s` = escala do desenho na página. Também usado por outros mapas (Lab.fundoRaster). */
  function desenharBlocos(g, proj, W, H, t, s = 1) {
    const z = Math.max(0, Math.min(17, Math.round(Math.log2((2 * Math.PI * proj.scale() * t.k * s * Math.min(2, devicePixelRatio || 1)) / 256))));
    const [lon0, lat0] = proj.invert(t.invert([0, 0])), [lon1, lat1] = proj.invert(t.invert([W, H]));
    const blocos = [];
    for (let x = lonTile(lon0, z); x <= lonTile(lon1, z); x++) for (let y = latTile(lat0, z); y <= latTile(lat1, z); y++) blocos.push([x, y, z]);
    if (blocos.length > 120) return;
    g.selectAll("image").data(blocos, (b) => b.join("/")).join("image")
      .attr("preserveAspectRatio", "none").attr("href", ([x, y]) => urlEsri(z, x, y))
      .each(function ([x, y]) {
        const [ax, ay] = proj([tileLon(x, z), tileLat(y, z)]), [bx, by] = proj([tileLon(x + 1, z), tileLat(y + 1, z)]);
        d3.select(this).attr("x", ax).attr("y", ay).attr("width", bx - ax + 0.5).attr("height", by - ay + 0.5);
      })
      .on("error", function () { d3.select(this).remove(); });
  }
  Lab.fundoRaster = { desenhar: desenharBlocos, atribuicao: ATRIBUICAO["esri-cinza"] };

  /** Transformação de zoom que realiza uma câmera (L0006). */
  function transformacaoCamera(camera, { caminho, proj, fc, W, H }) {
    if (!camera || camera === "estado") return d3.zoomIdentity;
    if (camera.centro) {
      const [x, y] = proj(camera.centro), k = Math.max(1, Math.min(ZOOM_MAX, camera.zoom || 1));
      return d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-x, -y);
    }
    if (camera.foco) {
      const ids = new Set([].concat(camera.foco));
      const feats = fc.features.filter((f) => ids.has(f.properties.id));
      if (!feats.length) return d3.zoomIdentity;
      const [[x0, y0], [x1, y1]] = caminho.bounds({ type: "FeatureCollection", features: feats });
      const ctx = camera.contexto || 1.5, [mt, mb] = camera.margens || [0, 0], Hu = Math.max(40, H - mt - mb);   // margens: faixa ocupada (ex.: card)
      const k = Math.max(1, Math.min(ZOOM_MAX, W / (Math.max(x1 - x0, 1) * ctx), Hu / (Math.max(y1 - y0, 1) * ctx)));
      return d3.zoomIdentity.translate(W / 2, mt + Hu / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    }
    return d3.zoomIdentity;
  }

  Lab.mapa = (alvoExterno, opts) => {
    const fc = opts.contornos;
    const detalhado = opts.detalhado ?? fc.features.length > 60;
    const nome = opts.nome || ((id) => id);
    const zoomAtivo = opts.zoom !== false;
    const editar = new URLSearchParams(location.search).has("editar");
    // estado que sobrevive aos redesenhos (Mapa | Círculos): câmera pedida, transformação atual, mapa vetorial
    const est = { camera: opts.camera || "estado", transform: null, geo: null, zoom: null, svg: null, vetorial: null, aoZoom: [] };
    let fundo = opts.fundo || null;
    if (fundo === "vetorial" && typeof maplibregl === "undefined") {
      if (!avisouMapLibre) { avisouMapLibre = true; console.warn("lab-mapa: MapLibre ausente — fundo vetorial desligado (inclua maplibre-gl no modelo do produto)."); }
      fundo = null;
    }
    // a troca Mapa | Círculos redesenha só este bloco (o resto da página não muda)
    const compacto = Boolean(opts.compacto);
    const alvo = el("div", { class: `bloco-mapa${compacto ? " compacto" : ""}` });
    alvoExterno.append(alvo);
    let ctrl = null;
    if (opts.tamanho && opts.forma) {
      ctrl = el("div", { class: "alternar pequeno no-mapa", role: "group", "aria-label": "Representação do mapa" });
      for (const [v, r] of [["mapa", "Mapa"], ["bolhas", "Círculos"]]) {
        ctrl.append(el("button", { type: "button", "aria-pressed": v === opts.forma.obter(), text: r, "data-chave": `Representação|${v}`, onclick: () => {
          if (v === opts.forma.obter()) return;
          const anterior = opts.forma.obter(); opts.forma.definir(v);
          for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
          desenhar(Lab.semMovimento() ? null : anterior);
          ctrl.querySelector(`[data-chave="Representação|${v}"]`)?.focus({ preventScroll: true });
        } }));
      }
    }
    const desenhar = (de) => {
      Lab.esconderDica();
      alvo.style.minHeight = alvo.offsetHeight ? `${alvo.offsetHeight}px` : "";
      alvo.replaceChildren();
      desenharMapa(de);
      requestAnimationFrame(() => { alvo.style.minHeight = ""; });
    };
    const desenharMapa = (de) => {
      const [W, H] = compacto && opts.dimensoes ? opts.dimensoes.map((v) => Math.max(120, Math.round(v))) : [560, 620];
      const bolhas = Boolean(opts.tamanho) && opts.forma?.obter() === "bolhas";
      // lupa: digitar o nome de uma unidade e destacá-la (sem sair do mapa)
      const nomes = fc.features.map((f) => [f.properties.id, nome(f.properties.id)]).sort((a, b) => a[1].localeCompare(b[1]));
      const idLista = `lista-${Math.random().toString(36).slice(2, 8)}`;
      const esc = Lab.escopoDe(alvoExterno);
      const busca = el("input", { type: "search", class: "busca-mapa", list: idLista, placeholder: opts.rotuloBusca || "Buscar…",
        "aria-label": "Buscar no mapa", onchange: (ev) => { const hit = nomes.find(([, n]) => n.toLowerCase() === ev.target.value.trim().toLowerCase()); if (hit && Lab.selecoes.get(esc) !== hit[0]) Lab.selecionar(hit[0], esc); } });
      // o "x" nativo do campo de busca (e apagar o texto) limpa a seleção do bloco
      const limparSeVazio = () => { if (!busca.value.trim() && Lab.selecoes.get(esc)) Lab.selecionar("", esc); };
      busca.addEventListener("search", limparSeVazio);
      busca.addEventListener("input", limparSeVazio);
      // barra sem fundo no topo do mapa: busca à esquerda, Mapa | Círculos à direita
      if (!compacto) alvo.append(el("div", { class: "barra-mapa" },
        el("div", { class: "lupa" }, el("span", { "aria-hidden": "true", text: "🔍" }), busca,
          el("datalist", { id: idLista }, ...nomes.map(([, n]) => el("option", { value: n })))),
        ctrl));
      // legendas (cor e, nos círculos, tamanho) logo abaixo do desenho; notas e textos depois delas
      const zonaLeg = el("div", { class: "legendas-mapa" });
      if (opts.legenda) zonaLeg.append(opts.legenda);
      const proj = d3.geoMercator().fitExtent([[12, 12], [W - 12, H - 12]], fc);
      const caminho = d3.geoPath(proj);
      est.geo = { caminho, proj, fc, W, H };
      const moldura = el("div", { class: `mapa-moldura${fundo ? " com-fundo" : ""}${compacto ? " compacto" : ""}` });
      alvo.append(moldura);
      // fundo vetorial: um mapa MapLibre sem interação, atrás do SVG, sincronizado com a câmera
      if (fundo === "vetorial") {
        if (!est.vetorial) {
          const caixa = el("div", { class: "mapa-fundo", "aria-hidden": "true" });
          est.vetorial = { caixa, mapa: null };
        }
        moldura.append(est.vetorial.caixa);
      }
      const svg = d3.select(moldura).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("class", "mapa")
        .attr("role", "img").attr("aria-label", (opts.rotuloAria || "Mapa.") + (bolhas ? ` Círculos: área proporcional a ${opts.rotuloTamanho}.` : ""))
        .style("width", "100%").style("max-width", compacto ? "none" : "560px").style("height", compacto ? "100%" : "auto");
      est.svg = svg.node();
      if (!compacto) alvo.append(zonaLeg);
      // lacunas (sem dado) em hachura, não em cinza liso
      const idHach = `hach-${Math.random().toString(36).slice(2, 8)}`;
      const pad = svg.append("defs").append("pattern").attr("id", idHach).attr("patternUnits", "userSpaceOnUse").attr("width", 5).attr("height", 5).attr("patternTransform", "rotate(45)");
      pad.append("rect").attr("width", 5).attr("height", 5).attr("fill", Lab.token("cor-superficie"));
      pad.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 5).attr("stroke", Lab.token("cor-eixo")).attr("stroke-width", 1.6);
      // com referência, o fundo do desenho tem o mesmo cinza dela: palcos largos não mostram faixas vazias
      if (opts.referencia) svg.append("rect").attr("class", "fundo-ref").attr("width", W).attr("height", H);
      const cena = svg.append("g").attr("class", "cena");   // tudo o que se move com a câmera
      const gTiles = fundo === "esri-cinza" ? cena.append("g").attr("class", "tiles").attr("opacity", bolhas ? 0 : 1) : null;
      if (opts.referencia) cena.append("g").attr("class", "referencia").selectAll("path").data(opts.referencia.features).join("path").attr("d", caminho);
      const semDado = Lab.token("cor-grade");
      let temLacuna = false;
      const preencherH = (id) => { const c = opts.preencher(id); if (c === semDado) { temLacuna = true; return `url(#${idHach})`; } return c; };
      const nos = fc.features.map((f) => { const c = caminho.centroid(f); return { f, id: f.properties.id, x0: c[0], y0: c[1], x: c[0], y: c[1], r: 0 }; });
      let escalaR = null;
      if (opts.tamanho) {
        // soma das áreas dos círculos = 30% da área desenhada (45% com poucas unidades); teto de raio;
        // raio mínimo visível (unidades pequenas não somem ao lado da maior)
        const valores = nos.map((n) => opts.tamanho(n.id) || 0);
        const fiel = opts.escalaBolhas === "fiel";   // L0006: área sempre proporcional, sem "fora de escala"
        const ea = Lab.escalaArea(valores, 1);
        const maxV = fiel ? d3.max(valores) || 1 : ea.teto;
        const total = d3.sum(valores, (v) => Math.min(v, maxV)) || 1;
        const area = d3.sum(fc.features, (f) => caminho.area(f));
        const fracao = nos.length <= 25 ? 0.45 : 0.3;
        const rMax = Math.min(detalhado ? (fiel ? 90 : 60) : 120, Math.sqrt((fracao * area * maxV) / (Math.PI * total)));
        escalaR = fiel ? d3.scaleSqrt().domain([0, maxV]).range([0, rMax]) : Lab.escalaArea(valores, rMax).s;
        est.escalaR = escalaR;
        const rMin = detalhado ? 2.5 : 8;
        for (const n of nos) { const v = opts.tamanho(n.id) || 0; n.r = v > 0 ? Math.max(rMin, escalaR(v)) : 0; n.fora = !fiel && ea.fora(v); }
        if (bolhas || de) posicionarBolhas(nos, W, H);
      }
      if (bolhas) cena.append("g").selectAll("path").data(fc.features).join("path").attr("d", caminho)
        .attr("fill", (f) => (opts.preencher(f.properties.id) === semDado ? `url(#${idHach})` : "none")).attr("stroke", Lab.token("cor-eixo")).attr("stroke-width", 0.5);
      const formas = cena.append("g").selectAll("path").data(bolhas ? [...nos].sort((a, b) => b.r - a.r) : nos).join("path").attr("class", "u")
        .attr("data-u", (n) => n.id)
        .classed("fora-escala", (n) => bolhas && n.fora)
        .attr("fill", (n) => preencherH(n.id))
        .style("fill-opacity", (n) => (opts.opacidade ? opts.opacidade(n.id) * (fundo ? 0.85 : 1) : null))   /* estilo: vence o .85 do fundo no CSS */
        .classed("foco", (n) => Boolean(opts.foco?.(n.id)))
        .on("pointermove", (ev, n) => {   // a unidade selecionada já está no card: sem dica repetida por cima
          if (ev.pointerType !== "mouse" || (Lab.selecoes.get(esc) === n.id && !painel.hidden)) { Lab.esconderDica(); return; }
          Lab.mostrarDica(ev, nome(n.id), [...opts.dica(n.id), bolhas ? `${opts.rotuloTamanho}: ${Lab.fmtInt.format(opts.tamanho(n.id) || 0)}` : null]);
        })
        .on("pointerleave", Lab.esconderDica)
        .on("click", (ev, n) => { Lab.esconderDica(); Lab.selecionar(n.id, esc); opts.aoClicar?.(n.id); });
      const final = (n) => (bolhas ? caminhoCirculo(n.x, n.y, Math.max(n.r, 0.01)) : caminho(n.f));
      // Transição Mapa ⇄ Círculos (design.yaml › padroes.mapa_transicao): morph de cada unidade com flubber; sem
      // flubber ou com muitas unidades, transição alternativa (polígonos desbotam enquanto os círculos crescem a partir
      // do centro de cada unidade, e o inverso). Sem animação com prefers-reduced-motion (de = null).
      const morph = typeof flubber !== "undefined" && nos.length <= MORPH_MAX;
      if (de && opts.tamanho && typeof flubber === "undefined" && !avisouFlubber) {
        avisouFlubber = true;
        console.warn("lab-mapa: flubber ausente — transição Mapa ⇄ Círculos sem morph (inclua flubber 0.4 no modelo do produto).");
      }
      if (de && opts.tamanho && !morph) {
        const interp = (n, ida) => { const xi = d3.interpolateNumber(ida ? n.x0 : n.x, ida ? n.x : n.x0), yi = d3.interpolateNumber(ida ? n.y0 : n.y, ida ? n.y : n.y0),
          ri = d3.interpolateNumber(ida ? 0 : n.r, ida ? n.r : 0); return (t) => caminhoCirculo(xi(t), yi(t), Math.max(ri(t), 0.01)); };
        if (bolhas) {   // mapa → círculos: polígonos (fantasmas) desbotam; círculos crescem do centro de cada unidade
          const fantasmas = cena.insert("g", () => formas.node().parentNode).attr("pointer-events", "none");
          fantasmas.selectAll("path").data(nos).join("path").attr("d", (n) => caminho(n.f)).attr("fill", (n) => preencherH(n.id))
            .transition().duration(DURACAO).ease(d3.easeCubicInOut).style("opacity", 0).remove();
          formas.attr("d", (n) => caminhoCirculo(n.x0, n.y0, 0.01)).transition().duration(DURACAO).ease(d3.easeCubicInOut).attrTween("d", (n) => interp(n, true));
        } else {        // círculos → mapa: círculos (fantasmas) encolhem para o centro; polígonos surgem
          formas.attr("d", final).style("opacity", 0).transition().duration(DURACAO).ease(d3.easeCubicInOut).style("opacity", 1);
          const fantasmas = cena.append("g").attr("pointer-events", "none");
          fantasmas.selectAll("path").data(nos.filter((n) => n.r > 0)).join("path").attr("fill", (n) => preencherH(n.id))
            .attr("stroke", Lab.token("cor-superficie")).attr("stroke-width", 0.6)
            .transition().duration(DURACAO).ease(d3.easeCubicInOut).attrTween("d", (n) => interp(n, false)).style("opacity", 0).remove();
        }
      } else if (de && opts.tamanho) {
        formas.attr("d", (n) => (bolhas ? anelPrincipal(n.f, caminho) : caminhoCirculo(n.x, n.y, Math.max(n.r, 0.01))))
          .transition().duration(DURACAO).ease(d3.easeCubicInOut)
          .attrTween("d", (n) => {
            const r = Math.max(n.r, 0.5);
            const it = bolhas ? flubber.toCircle(anelPrincipal(n.f, caminho), n.x, n.y, r, { maxSegmentLength: 4 })
                              : flubber.fromCircle(n.x, n.y, r, anelPrincipal(n.f, caminho), { maxSegmentLength: 4 });
            return (t) => (t < 1 ? it(t) : final(n));
          });
      } else formas.attr("d", final);
      // fora de escala: rótulo na margem esquerda (área vazia), na altura do círculo, ligado por uma linha
      if (bolhas) {
        const gf = cena.append("g").attr("class", "rotulos-fora").attr("pointer-events", "none");
        nos.filter((n) => n.fora).sort((p, q) => p.y - q.y).forEach((n, i) => {
          const tx = 10, ty = Math.max(16, n.y - 4 + i * 34);
          const t = gf.append("text").attr("class", "rotulo-fora").attr("x", tx).attr("y", ty);
          t.append("tspan").attr("x", tx).text(nome(n.id));
          t.append("tspan").attr("x", tx).attr("dy", 14).text(`${Lab.fmtCompacto(opts.tamanho(n.id) || 0)} · fora de escala`);
          const larg = t.node().getComputedTextLength ? t.node().getBBox().width : 110;
          const x0 = tx + larg + 6, x1 = n.x - n.r - 2;
          if (x1 > x0) gf.append("path").attr("d", `M${x0},${ty + 3} L${x1 - 6},${ty + 3} L${x1},${n.y}`)
            .attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario")).attr("stroke-width", 1);
        });
      }
      if (opts.sobreposicao && !bolhas) {
        cena.append("path").datum(opts.sobreposicao).attr("d", caminho).attr("fill", "none").attr("class", "sobreposicao")
          .attr("stroke", Lab.token("cor-texto")).attr("stroke-opacity", 0.12).attr("stroke-width", 0.3).attr("pointer-events", "none");
      }
      // rótulos de referência (poucas cidades), escondidos nos círculos (lá a posição é aproximada)
      const gRot = opts.rotulos && !bolhas ? cena.append("g").attr("class", "rotulos-ref").attr("pointer-events", "none") : null;
      if (gRot) gRot.selectAll("g").data(opts.rotulos).join((e) => {
        const g = e.append("g").attr("transform", (r) => `translate(${proj(r.coord)})`);
        g.append("circle").attr("r", 2.2);
        g.append("text").attr("x", 4).attr("y", -4).text((r) => r.nome);
        return g;
      });
      if (temLacuna || (bolhas && fc.features.some((f) => opts.preencher(f.properties.id) === semDado)))
        zonaLeg.append(el("div", { class: "legenda" }, el("span", { class: "chave" }, el("span", { class: "amostra hachura" }), "sem dados")));
      if (fundo) moldura.append(el("div", { class: "mapa-atribuicao", text: ATRIBUICAO[fundo] }));

      // ------------------------------------------------ card da unidade selecionada (clique ou busca)
      // computador: card flutuante perto da unidade; celular: logo abaixo do desenho, perto do toque (L0006)
      // compacto (story e bancada): o card encaixa no pé ou no alto do próprio mapa, do lado oposto à unidade
      const flutuante = !compacto && matchMedia("(hover: hover) and (pointer: fine)").matches;
      const painel = el("div", { class: `painel-sel${flutuante ? " flutuante" : compacto ? " rodape" : ""}`, "aria-live": "polite" });
      if (flutuante || compacto) moldura.append(painel); else alvo.insertBefore(painel, zonaLeg);
      const posicionarPainel = () => {
        if (!(flutuante || compacto) || painel.hidden) return;
        const sel = Lab.selecoes.get(esc) || "", n = nos.find((x) => x.id === sel);
        if (!n) return;
        const t = est.transform || d3.zoomIdentity, s = est.svg.clientWidth / W;
        const [px, py] = t.apply(bolhas ? [n.x, n.y] : [n.x0, n.y0]).map((v) => v * s);
        if (compacto) { painel.classList.toggle("topo", py > est.svg.clientHeight * 0.55); return; }
        const lw = painel.offsetWidth, lh = painel.offsetHeight, mw = moldura.clientWidth, mh = est.svg.clientHeight;
        let x = px + 16, y = py - lh / 2;
        if (x + lw > mw - 4) x = Math.max(4, px - lw - 16);
        y = Math.max(4, Math.min(mh - lh - 4, y));
        painel.style.left = `${x}px`; painel.style.top = `${y}px`;
      };
      const atualizarPainel = () => {
        const sel = Lab.selecoes.get(esc) || "";
        const u = sel && fc.features.some((f) => f.properties.id === sel) ? sel : null;
        painel.hidden = !u;
        if (!u) { busca.value = ""; return; }
        busca.value = nome(u);
        // compacto: "Aproximar" leva a câmera até a unidade (⟲ volta ao enquadramento do cartão)
        const aproximar = compacto && est.zoom ? el("button", { type: "button", class: "voltar", text: "⊕ Aproximar", onclick: () => {
          painel.classList.remove("topo");   // o card fica no pé; a unidade, na faixa livre acima dele
          api.camera({ foco: u, contexto: 1.6, margens: [0, (painel.offsetHeight + 12) * (W / (est.svg.clientWidth || W))] }, true, { base: false });
        } }) : null;
        Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: opts.dica(u), abrir: opts.abrir, rotuloAbrir: opts.rotuloAbrir, esc, acoes: [aproximar] });
        requestAnimationFrame(posicionarPainel);
      };
      Lab.registrarPainel(esc, atualizarPainel, alvo);   // um registro por mapa (o redesenho troca, não acumula)
      atualizarPainel();
      // troca de cores e textos sem redesenhar (story: o mesmo mapa muda de estado entre cartões)
      est.recolorir = (animar) => {
        temLacuna = false;
        const sel = animar && !Lab.semMovimento() ? formas.transition().duration(650) : formas;
        sel.attr("fill", (n) => preencherH(n.id)).style("fill-opacity", (n) => (opts.opacidade ? opts.opacidade(n.id) * (fundo ? 0.85 : 1) : null))   /* estilo: vence o .85 do fundo no CSS */;
        formas.classed("foco", (n) => Boolean(opts.foco?.(n.id)));
        atualizarPainel();
      };
      if (alvo.isConnected) Lab.aplicarSelecao(esc);
      if (bolhas && !compacto) zonaLeg.append(Lab.legendaTamanho(escalaR, opts.rotuloTamanho));
      if (bolhas && !compacto) alvo.append(Lab.notaFora(nos.filter((n) => n.fora).map((n) => nome(n.id))),
        el("p", { class: "nota", text: "Círculos: cada um parte do centro da unidade e é afastado o mínimo para não se sobrepor; a posição é aproximada." }));

      // ------------------------------------------------ fundo raster: blocos visíveis no zoom atual
      const atualizarTiles = () => { if (gTiles) desenharBlocos(gTiles, proj, W, H, est.transform || d3.zoomIdentity, (est.svg.clientWidth || W) / W); };
      // ------------------------------------------------ fundo vetorial: centro e zoom do MapLibre = câmera do SVG
      const sincronizarVetorial = () => {
        const v = est.vetorial;
        if (!v) return;
        const sv = est.svg, cw = sv.clientWidth, ch = sv.clientHeight;
        if (!cw) return;
        v.caixa.style.width = `${cw}px`; v.caixa.style.height = `${ch}px`;
        v.caixa.style.opacity = bolhas ? 0 : 1;
        const t = est.transform || d3.zoomIdentity;
        const centro = proj.invert(t.invert([W / 2, H / 2]));
        const zoomML = Math.log2((2 * Math.PI * proj.scale() * t.k * (cw / W)) / 512);
        if (!v.mapa) {
          try {
            v.mapa = new maplibregl.Map({ container: v.caixa, style: estiloVetorial(), center: centro, zoom: zoomML, interactive: false, attributionControl: false, fadeDuration: 0 });
            v.mapa.on("error", (e) => console.warn("lab-mapa: fundo vetorial com erro —", e?.error?.message || e));
          } catch (e) {   // sem WebGL, por exemplo: o mapa segue sem fundo
            console.warn("lab-mapa: fundo vetorial indisponível —", e.message);
            v.caixa.remove(); est.vetorial = null;
            moldura.classList.remove("com-fundo"); moldura.querySelector(".mapa-atribuicao")?.remove();
          }
        } else { v.mapa.resize(); v.mapa.jumpTo({ center: centro, zoom: zoomML }); }
      };

      // ------------------------------------------------ câmera, zoom e arrasto (L0006)
      const aplicar = (t) => {
        est.transform = t;
        cena.attr("transform", t);
        // rótulos e marcadores mantêm o tamanho na tela (descontados o zoom e a escala do desenho na página)
        const f = (W / (est.svg.clientWidth || W)) / t.k;
        cena.selectAll(".rotulos-ref text, .rotulo-fora").style("font-size", (d, i, n) => `${(n[i].classList.contains("rotulo-fora") ? 11 : 12) * f}px`)
          .style("stroke-width", `${3 * f}px`);
        cena.selectAll(".rotulos-ref text").attr("x", 4 * f).attr("y", -4 * f);
        cena.selectAll(".rotulos-ref circle").attr("r", 2.4 * f);
        const vistos = [];
        cena.selectAll(".rotulos-ref > g").each(function () {
          this.style.display = "";
          const r = this.getBoundingClientRect();
          const bate = r.width && vistos.some((v) => r.left < v.right + 2 && r.right > v.left - 2 && r.top < v.bottom && r.bottom > v.top);
          if (bate) this.style.display = "none"; else if (r.width) vistos.push(r);
        });
        // no enquadramento inicial, um dedo é da página (ou do story, que passa o cartão deslizando para o lado)
        svg.style("touch-action", t.k > 1.01 ? "none" : compacto ? "pan-y" : "pan-x pan-y");
        posicionarPainel();
        sincronizarVetorial();
        for (const f of est.aoZoom) f(t);
      };
      const inicial = est.transform || transformacaoCamera(est.camera, est.geo);
      if (zoomAtivo) {
        const zoom = d3.zoom().scaleExtent([1, ZOOM_MAX]).translateExtent([[-W * 0.3, -H * 0.3], [W * 1.3, H * 1.3]]).clickDistance(4)
          .filter((ev) => {
            const k = (est.transform || d3.zoomIdentity).k;
            if (ev.type === "wheel") return ev.ctrlKey || ev.metaKey;           // roda sozinha rola a página
            if (ev.type.startsWith("touch")) return ev.touches.length > 1;   // um dedo nunca move o mapa (rola a página ou passa o cartão); dois dedos movem e ampliam (L0013)
            if (ev.type === "mousedown") return !ev.button && k > 1.01;          // arrastar só quando ampliado
            return !ev.button;
          })
          .on("zoom", (ev) => aplicar(ev.transform))
          .on("end", () => atualizarTiles());
        est.zoom = zoom;
        svg.call(zoom).on("dblclick.zoom", null);
        svg.style("touch-action", "pan-x pan-y");   // um dedo fica com a página (rolar, passar cartão); a pinça fica com o mapa
        svg.call(zoom.transform, inicial);
        // aviso: Ctrl + roda amplia (a roda sozinha continua rolando a página); dois dedos movem no celular
        const textoRoda = `${/Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl"} + roda do mouse para ampliar`;
        const avisoRoda = el("div", { class: "mapa-aviso", hidden: "", text: textoRoda });
        moldura.append(avisoRoda);
        let tAviso = null;
        function avisar(t) { avisoRoda.textContent = t; avisoRoda.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(() => { avisoRoda.hidden = true; }, 1400); }
        svg.on("wheel.aviso", (ev) => { if (ev.ctrlKey || ev.metaKey) return; avisar(textoRoda); });
        // arrastar com um dedo no mapa ampliado: lembrete dos dois dedos (tocar, sem arrastar, não avisa)
        svg.node().addEventListener("touchmove", (ev) => { if (ev.touches.length === 1 && (est.transform || d3.zoomIdentity).k > 1.01) avisar("Use dois dedos para mover o mapa"); }, { passive: true });
        const mover = (f) => { const s = d3.select(est.svg); (Lab.semMovimento() ? s : s.transition().duration(350)).call(f); };
        moldura.append(el("div", { class: "mapa-controles", role: "group", "aria-label": "Zoom do mapa" },
          el("button", { type: "button", "aria-label": "Ampliar", title: "Ampliar", text: "+", onclick: () => mover((s) => zoom.scaleBy(s, PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Reduzir", title: "Reduzir", text: "−", onclick: () => mover((s) => zoom.scaleBy(s, 1 / PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Voltar ao enquadramento inicial", title: "Voltar ao enquadramento", text: "⟲",
            onclick: () => api.camera(est.camera) })));
      } else {
        aplicar(inicial);
      }
      atualizarTiles();
      // modo de edição (?editar=1): mostra a câmera atual para copiar no roteiro
      if (editar) {
        const saida = el("code");
        const textoCamera = () => {
          const t = est.transform || d3.zoomIdentity, [lon, lat] = proj.invert(t.invert([W / 2, H / 2]));
          return `camera: {centro: [${lon.toFixed(3)}, ${lat.toFixed(3)}], zoom: ${t.k.toFixed(2)}}`;
        };
        const atualizarSaida = () => { saida.textContent = textoCamera(); };
        est.aoZoom = [atualizarSaida];
        atualizarSaida();
        moldura.append(el("div", { class: "mapa-editar" }, saida,
          el("button", { type: "button", text: "Copiar câmera", onclick: async (ev) => {
            try { await navigator.clipboard.writeText(textoCamera()); ev.target.textContent = "Copiado ✓"; } catch (e) { window.prompt("Copie a câmera:", textoCamera()); }
            setTimeout(() => { ev.target.textContent = "Copiar câmera"; }, 1500);
          } })));
      }
      if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => { aplicar(est.transform || d3.zoomIdentity); }).observe(est.svg);
      requestAnimationFrame(() => { sincronizarVetorial(); atualizarTiles(); });
    };

    const api = {
      /** Move a câmera ("estado" | {foco, contexto} | {centro, zoom}); animada, salvo prefers-reduced-motion. */
      camera(camera, animar = true, { base = true } = {}) {
        // base: a câmera do cartão (para onde o ⟲ volta); "Aproximar" move sem trocar a base
        if (base) est.camera = camera || "estado";
        if (!est.geo) return;
        const t = transformacaoCamera(camera || "estado", est.geo);
        if (!est.zoom) { est.transform = t; desenhar(null); return; }
        const s = d3.select(est.svg);
        (animar && !Lab.semMovimento() ? s.transition().duration(DURACAO).ease(d3.easeCubicInOut) : s).call(est.zoom.transform, t);
      },
      /** Troca cores, textos, opacidade e foco sem redesenhar (com transição). */
      atualizar(parcial = {}, { animar = true } = {}) {
        Object.assign(opts, parcial);
        if (est.recolorir) est.recolorir(animar);
      },
      /** Troca a forma (Mapa | Círculos) com a transição do design system. */
      forma(v, animar = true) {
        if (!opts.forma || !opts.tamanho || opts.forma.obter() === v) return;
        const anterior = opts.forma.obter();
        opts.forma.definir(v);
        if (ctrl) for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
        desenhar(animar && !Lab.semMovimento() ? anterior : null);
      },
      redesenhar() { desenhar(null); },
      /** Escala de raio das bolhas (para a legenda de tamanho no modo compacto — Q-062); null sem tamanho. */
      escalaTamanho() { return est.escalaR || null; },
    };
    desenharMapa(null);
    return api;
  };
})();

/* ==== web/componentes/lab-metodologia.js ==== */
/* lab-metodologia.js — bloco "Fontes de Dados, Metodologia e Códigos", padrão de todos os produtos (ADR L0003).
 * Modelo: README do Agregador de Pesquisas (O POVO/DATADOC). O conteúdo vem pronto do Python
 * (labdados.metodologia.montar): textos do produto (src/metodologia.yaml) + partes automáticas
 * (fontes com datas e hashes do manifesto, ADRs, trechos de código, conferência de qualidade, versão).
 *
 * Lab.blocoMetodologia(m, { baixar: { rotulo, acao }, linkAutor: { href, texto } })
 * Lab.rodapePagina(m, opts) → bloco + assinatura final (preenche o <footer id="rodape">).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Seções do bloco (o mesmo conteúdo no fim da página ou em camadas na folha ✎ Notas e fontes — L0014). */
  const secoesMetodologia = (m, { baixar = null, linkAutor = null, endereco = null } = {}, secao) => {
    const fontes = el("div", { class: "rolagem" }, Lab.tabela(["Base", "Órgão", "Arquivos (gerado na fonte · baixado em · hash)", "Link"],
      m.fontes.map((f) => [
        [el("code", { text: f.id }), el("div", { class: "nota", text: f.descricao })],
        f.orgao,
        [el("ul", { class: "arquivos" }, ...f.arquivos.map((a) => el("li", {}, el("code", { text: a.arquivo }),
          ` · ${a.gerado_na_fonte ? a.gerado_na_fonte.replace(/ \d\d:\d\d:\d\d GMT$/, "") : "—"} · ${a.baixado_em || "—"} · ${a.sha256 || "—"}`)))],
        f.url ? [el("a", { href: f.url, target: "_blank", rel: "noopener", text: "página oficial ↗" })] : "—"])));
    const passos = el("ol", { class: "passos" }, ...m.passos.map((p) => el("li", {},
      el("b", { text: p.titulo }), el("p", { text: p.texto }),
      p.adrs ? el("div", { class: "nota" }, "Decisões: ", ...p.adrs.flatMap((id, k) => [k ? ", " : "", el("a", { href: `#adr-${id}`, text: id })])) : null,
      p.trecho ? el("details", { class: "codigo" }, el("summary", {}, "Ver código"), el("pre", {}, el("code", { text: p.trecho }))) : null)));
    const q = m.qualidade || {};
    const adrs = el("ul", { class: "adrs" }, ...m.adrs.map((a) => el("li", { id: `adr-${a.id}` },
      el("b", { text: `${a.id} — ${a.titulo}` }), el("span", { class: "nota", text: ` (${a.status})` }), el("div", { text: a.decisao }),
      el("div", { class: "nota" }, "No repositório: ", el("code", { text: a.arquivo })))));
    const codigos = el("div", { class: "rolagem" }, Lab.tabela(["Arquivo", "O que faz"], m.codigos.map((c) => [[el("code", { text: c.arquivo })], c.papel])));
    const v = m.versao;
    const citar = `${m.citacao || ""} Disponível em: ${endereco || location.href.split("#")[0]}. Acesso em: ${new Date().toLocaleDateString("pt-BR")}.`.trim();
    return [
        secao("Sobre este produto", el("p", { text: m.apresentacao })),
        secao("Fontes de dados", fontes,
          el("p", { class: "nota", text: "Datas de geração informadas pela própria fonte; o hash identifica a versão exata de cada arquivo usado." }),
          baixar ? el("button", { type: "button", class: "voltar", text: baixar.rotulo, onclick: baixar.acao }) : null),
        secao("Passo a passo da metodologia", passos),
        q.colunas ? secao("Conferência de qualidade", el("p", { text: `Situação: ${m.status_qualidade}. ${q.texto || ""}` }),
          el("div", { class: "rolagem" }, Lab.tabela(q.colunas, q.linhas))) : null,
        secao("Decisões metodológicas", adrs),
        secao("Principais códigos", codigos, el("p", { class: "nota", text: "Os códigos estão no repositório do laboratório; o pacote reprodutível deste produto (dados, códigos e decisões) é gerado com ferramentas/exportar.py." })),
        m.limitacoes?.length ? secao("Limitações", el("ul", {}, ...m.limitacoes.map((t) => el("li", { text: t })))) : null,
        m.perguntas?.length ? secao("Perguntas frequentes", ...m.perguntas.map((p) => el("details", { class: "pergunta" }, el("summary", { text: p.p }), el("p", { text: p.r })))) : null,
        secao("Autoria, uso de IA e licença",
          el("p", {}, m.sobre, " ", linkAutor ? el("a", { href: linkAutor.href, target: "_blank", rel: "noopener", text: linkAutor.texto }) : null),
          el("p", {}, el("b", { text: "Uso de IA: " }), m.uso_de_ia),
          el("p", {}, el("b", { text: "Licença: " }), m.licenca),
          el("p", {}, el("b", { text: "Versão: " }), `${v.numero ? `${v.numero}${v.data_versao ? ` (${new Date(v.data_versao + "T12:00").toLocaleDateString("pt-BR")})` : ""} · ` : ""}${v.status_produto}, dados gerados em ${new Date(v.gerado_em).toLocaleString("pt-BR")}`,
            v.commit ? ` · código no commit ${v.commit}${v.alteracoes_nao_commitadas ? " (com alterações ainda não registradas)" : ""}` : ""),
          el("p", {}, el("b", { text: "Como citar: " }), citar))].filter(Boolean);
  };

  Lab.blocoMetodologia = (m, opts = {}) => {
    const secao = (titulo, ...filhos) => el("section", { class: "met-secao" }, el("h3", { text: titulo }), ...filhos);
    return el("details", { class: "metodologia", id: Lab.cfg.ancoraMetodologia },
      el("summary", {}, el("span", { class: "met-titulo", text: "Fontes de Dados, Metodologia e Códigos" }),
        el("span", { class: "met-sub", text: "bases oficiais, passo a passo, códigos e decisões" })),
      el("div", { class: "met-corpo" }, ...secoesMetodologia(m, opts, secao)));
  };

  /** O bloco em camadas, para a folha ✎ Notas e fontes de Visualizações e stories (L0014): cada seção recolhida; os
   *  links para as decisões abrem a seção e rolam até o ADR dentro da folha (sem mexer no endereço da página). */
  Lab.metodologiaEmCamadas = (m, opts = {}) => {
    const secao = (titulo, ...filhos) => el("details", { class: "met-camada" }, el("summary", { text: titulo }), el("div", { class: "met-corpo-camada" }, ...filhos));
    const caixa = el("div", { class: "met-camadas" }, ...secoesMetodologia(m, opts, secao));
    caixa.addEventListener("click", (ev) => {
      const a = ev.target.closest('a[href^="#adr-"]');
      if (!a) return;
      ev.preventDefault();
      const alvo = caixa.querySelector(a.getAttribute("href"));
      if (!alvo) return;
      alvo.closest("details.met-camada").open = true;
      alvo.scrollIntoView({ block: "nearest", behavior: Lab.semMovimento() ? "auto" : "smooth" });
    });
    return caixa;
  };

  /** Rodapé da página: bloco de metodologia + assinatura com link para a página do autor. */
  Lab.rodapePagina = (m, { baixar = null, linkAutor = null } = {}) => {
    const rodape = document.getElementById(Lab.cfg.ancoraRodape);
    rodape.replaceChildren(Lab.blocoMetodologia(m, { baixar, linkAutor }),
      el("p", { class: "assinatura-final" }, `Análise e visualização: ${Lab.cfg.autor}`,
        linkAutor ? " · " : null, linkAutor ? el("a", { href: linkAutor.href, target: "_blank", rel: "noopener", text: linkAutor.rotuloCurto || linkAutor.texto }) : null));
    // só o link interno ("Fontes, métodos e códigos ↓") leva à metodologia; o nome do autor abre o portfólio em nova aba
    for (const a of document.querySelectorAll('.assinatura a[href^="#"]')) a.addEventListener("click", Lab.irRodape);
  };
})();

/* ==== web/componentes/lab-viz.js ==== */
/* lab-viz.js — renderizador da Visualização declarativa (L0007, L0008, L0011–L0013).
 *
 * Recebe o PLANO compilado em Python (labdados.viz.compilar, a partir do viz.yaml) e desenha a peça: moldura (chapéu,
 * título com controles, subtítulo, abas do companheiro, palco, N, legenda, barra fixa com folhas), cartão de detalhe,
 * legenda interativa, anotações, imagem PNG do estado do momento, CSV e código para embutir. Os gráficos vêm de
 * ADAPTADORES por componente do registro do DS (design/padrao/componentes.yaml): Lab.viz.adaptadores.<id>.
 *
 * Só desenha (L0002): todo número e todo texto com número chega pronto do Python, por estado ({e.…} no plano).
 * Nada de cor ou tamanho fixo: tokens do DS (Lab.token) e cores do produto declaradas no plano (estilo.tokens).
 * Comportamentos decididos na bancada de formatos (docs/bancada.html, fase 0) e registrados na L0013. */
(function () {
  "use strict";
  const { el } = Lab;
  const tok = (n) => Lab.token(n);
  const FORMATOS = { retrato: { w: 360, h: 450, rot: "Retrato 4:5" }, quadrado: { w: 400, h: 400, rot: "Quadrado 1:1" }, paisagem: { w: 640, h: 360, rot: "Paisagem 16:9" } };
  const ANOT_MAX = { retrato: 1, quadrado: 2, paisagem: 3 };       // prioridade máxima visível por formato (L0008)
  const ROTULOS_MAX = { retrato: 3, quadrado: 3, paisagem: 5 };    // rótulos diretos de pontos
  const LIMITE_TEXTO = { retrato: 110, quadrado: 140, paisagem: 200 };   // acima disso, “…” que abre no clique (Q-036)
  const ALTURA_GRAFICO = { retrato: 0.95, quadrado: 0.7, paisagem: 0.5 }; // altura do palco pela largura (altura livre)
  const TAM_IMG = { retrato: [360, 450], quadrado: [400, 400], paisagem: [640, 360] };
  const TETO_IMG = { retrato: 16 / 9, quadrado: 5 / 4, paisagem: 3 / 4 };  // a imagem cresce até 9:16, 4:5, 4:3
  const ESCALA_IMG = 3;
  const formatoFluido = (w) => (w < 480 ? "retrato" : w < 720 ? "quadrado" : "paisagem");
  const formatoQuadro = (w, h) => { const r = w / h; return r < 0.9 ? "retrato" : r <= 1.25 ? "quadrado" : "paisagem"; };
  const negrito = (t) => String(t).split(/⟦|⟧/).map((p, i) => (i % 2 ? el("b", { text: p }) : p));
  const semMarcas = (t) => String(t).replace(/⟦|⟧/g, "");
  const curto = (n, k = 24) => (n.length > k ? `${n.slice(0, k - 1)}…` : n);
  const caixaRelativa = (no, palco) => { const r = no.getBoundingClientRect(), p = palco.getBoundingClientRect(); return { x: r.left - p.left, y: r.top - p.top, w: r.width, h: r.height }; };

  // ------------------------------------------------------------------ marcadores do plano
  /** "{e.caminho}" sozinho devolve o valor (número, objeto, null); dentro de um texto, é substituído. "{c.id}" fica
   *  para quem monta o título (controle no lugar). Um trecho "$id" no caminho é o valor atual do controle `id`
   *  ({e.explore.$variavel.dados}): dados e frases de um cartão variam com o seletor, todos calculados no Python. */
  const pegar = (obj, caminho) => caminho.split(".").reduce((o, k) => (o == null ? undefined : o[k.startsWith("$") ? obj?.$?.[k.slice(1)] : k]), obj);
  function resolver(v, e) {
    if (typeof v !== "string") return Array.isArray(v) ? v.map((x) => resolver(x, e)) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolver(x, e)])) : v;
    const so = v.match(/^\{e\.([\w.$]+)\}$/);
    if (so) return pegar(e, so[1]);
    return v.replace(/\{e\.([\w.$]+)\}/g, (_, c) => { const x = pegar(e, c); return x == null ? "" : String(x); });
  }

  // ------------------------------------------------------------------ peça
  /** Monta a Visualização em `alvo`. opcoes: { host: "pagina" | "embed", carregarFatia(chave) → Promise<fatia> }. */
  function montar(alvo, P, opcoes = {}) {
    const host = opcoes.host || "pagina";
    const est = { aba: "principal", sel: null, legFixa: null, anotAberta: false, cam: null };
    for (const c of P.controles || []) est[c.id] = c.inicial;
    // estado inicial pelo endereço: #municipio=2211001&aba=mapa (um link reproduz a vista)
    try {
      const q = new URLSearchParams(location.hash.slice(1));
      for (const c of P.controles || []) if (q.has(c.id)) est[c.id] = q.get(c.id);
      if (q.get("aba") === "mapa") est.aba = "mapa";
      if (q.has("cartao")) est.cartao = q.get("cartao");
    } catch (erro) { /* mantém o padrão */ }
    const ctl = Object.fromEntries((P.controles || []).map((c) => [c.id, c]));
    const fatiador = (P.controles || []).find((c) => c.tipo === "busca" && P.fatias && c.campo === P.fatias.campo);
    let fatia = null, e = {}, linhas = [];
    const indice = P.fatias ? new Map(P.fatias.indice.map(([k, nome, uf]) => [k, { nome, uf, rotulo: uf ? `${nome} (${uf})` : nome }])) : null;

    let reuso = null;   // estado entre cartões: {componente, inst, palco} do cartão anterior (irCartao → desenharPalco)
    // ---------------------------------------------------------------- story (Q-066): cartões sobre o mesmo plano
    const story = Array.isArray(P.cartoes) && P.cartoes.length > 0;
    /** Condição do cartão, calculada no Python (textos da fatia); "!" inverte. */
    const condicao = (se) => { if (!se) return true; const v = Boolean(e[se.replace(/^!/, "")]); return se.startsWith("!") ? !v : v; };
    const cartoesVisiveis = () => (story ? P.cartoes.filter((k) => condicao(k.se)) : []);
    const cartaoAtual = () => { if (!story) return null; const ks = cartoesVisiveis(); return ks.find((k) => k.id === est.cartao) || ks[0]; };

    const lerFatia = (f) => {
      const L = (f.linhas || []).map((r) => Object.fromEntries((f.colunas || []).map((c, i) => [c, r[i]])));
      const esc = Object.fromEntries(Object.entries(f).filter(([, v]) => v === null || typeof v !== "object"));
      const ee = { ...esc, ...(f.textos || {}) };
      Object.defineProperty(ee, "$", { value: est, enumerable: false });   // marcadores com "$controle"
      return { linhas: L, e: ee };
    };
    async function irPara(chave) {
      const f = await opcoes.carregarFatia(chave);
      fatia = f; ({ linhas, e } = lerFatia(f));
      est.sel = null; est.legFixa = null; est.anotAberta = false; est.cam = null;
      // troca de recorte (ex.: outra cidade): o desenho velho esmaece e o novo surge, como na troca de cartão
      const atual = alvoRaiz.querySelector("article.viz");
      if (atual?._palco && host !== "embed") trocarCartao(atual, () => {}); else render();
    }
    function guardarEndereco() {
      const q = new URLSearchParams();
      if (fatiador) q.set(fatiador.id, est[fatiador.id]);
      if (est.aba === "mapa" && !story) q.set("aba", "mapa");
      if (story && est.cartao) q.set("cartao", est.cartao);
      try { history.replaceState(null, "", `${location.pathname}${location.search}#${q}`); } catch (erro) { /* sem âncora */ }
    }
    const enderecoAtual = (embed = false) => {
      const base = P.endereco || `${location.origin}${location.pathname}`;
      const q = new URLSearchParams();
      if (fatiador) q.set(fatiador.id, est[fatiador.id]);
      if (est.aba === "mapa" && !story) q.set("aba", "mapa");
      return `${base}${embed ? "?embed=1" : ""}#${q}`;
    };

    // ---------------------------------------------------------------- escalas
    const pontaCor = (p) => (p.cor.startsWith("#") ? p.cor : tok(p.cor));
    function escalaCor() {
      const c = P.escalas?.cor;
      if (!c) return { cores: [], cor: () => tok("cor-texto-secundario"), classe: () => "0" };
      const sup = tok("cor-superficie"), [a, b] = c.pontas.map(pontaCor), n = c.cortes.length + 1, meio = (n - 1) / 2;
      const neutro = d3.lab(sup).l < 50 ? 0.8 : 0.55;   // tema escuro: o neutro afasta-se do cinza de fora do destaque (Q-064)
      // divergente pelas pontas: intensidade cresce para fora; a classe do meio é neutra (L0013, escala em quadrados)
      const cores = d3.range(n).map((k) => (k === meio ? d3.interpolateLab(sup, tok("cor-texto-secundario"))(neutro)
        : d3.interpolateLab(sup, k < meio ? a : b)(Math.abs(k - meio) >= meio ? 0.95 : 0.5)));
      const classe = (v) => (v === null || v === undefined ? null : d3.bisectRight(c.cortes, v));
      return { cores, cor: (v) => { const k = classe(v); return k === null ? null : cores[k]; }, classe };
    }

    // ---------------------------------------------------------------- moldura
    function moldura({ fmt, rep, hostQ, fixo = false, tamanho = null, largura = null, legendaRec = false, cartao = "sobre" }) {
      if (story) return molduraStory({ fmt, rep, hostQ, fixo, tamanho, largura });
      const f = el("article", { class: `viz fmt-${fmt} rep-${rep} host-${hostQ}${fixo ? " fixo" : ""}`, tabindex: "0", "aria-label": semMarcas(P.titulo) });
      if (fixo) { f.style.setProperty("--w", `${tamanho.w}px`); f.style.setProperty("--h", `${tamanho.h}px`); }
      if (!fixo && largura) f.style.maxWidth = `${largura}px`;   // fluida: acompanha o contêiner
      Object.assign(f.dataset, { fmt, rep, host: hostQ });
      f._opc = { cartao };
      const interativa = rep === "interativa";
      if (P.chapeu) f.append(el("div", { class: "viz-topo" }, el("p", { class: "viz-chapeu" }, ...textoComControles(P.chapeu, interativa, f))));
      f.append(el("h3", { class: "viz-titulo" }, ...textoComControles(P.titulo, interativa, f)));
      const sub = resolver(P.subtitulo, e);
      if (sub) f.append(el("p", { class: "viz-sub" }, ...textoLimitado(sub, LIMITE_TEXTO[fmt], interativa)));
      const comp = P.grafico.companheiro;
      const lado = Boolean(comp) && fmt === "paisagem";
      if (comp && interativa && !lado && linhas.length) f.append(el("div", { class: "viz-abas so-interativo", role: "tablist" },
        ...[["principal", P.grafico.rotulo_aba || "Gráfico"], ["mapa", comp.rotulo_aba || "Mapa"]].map(([k, r]) => el("button", { type: "button", role: "tab", "aria-pressed": est.aba === k, onclick: () => trocarAba(f, k) }, r))));
      const corpo = el("div", { class: "viz-corpo" }), palco = el("div", { class: "viz-palco" });
      corpo.append(palco);
      let palcoCompa = null;
      if (comp && interativa && lado) { palcoCompa = el("div", { class: "viz-palco compa" }); corpo.append(palcoCompa); }
      f.append(corpo, el("p", { class: "viz-n" }), el("ol", { class: "viz-anot-lista", hidden: "" }));
      if (!linhas.length && !P.grafico.dados) f.append(el("div", { class: "viz-legenda", hidden: "" }));   // sem dados, sem legenda
      else if (legendaRec && interativa) f.append(el("details", { class: "viz-legenda-rec so-interativo" }, el("summary", {}, "◧ Legenda"), el("div", { class: "viz-legenda" })));
      else f.append(el("div", { class: "viz-legenda" }));
      f.append(interativa ? barraBase(f, fmt, hostQ) : rodapeMinimo());
      f._palco = palco; f._palcoCompa = palcoCompa; f._lado = lado;
      if (est.buscando && interativa && fatiador) abrirBusca(f, fatiador, false);   // continua aberta depois de um redesenho
      return f;
    }
    /** Story: barra de progresso, chapéu com a cidade, título e texto do cartão, palco (se o cartão tiver vista ou
     *  componente), navegação (toque nos botões, deslizar, setas do teclado) e a mesma barra fixa da Visualização. */
    function molduraStory({ fmt, rep, hostQ, fixo = false, tamanho = null, largura = null }) {
      const ks = cartoesVisiveis(), K = cartaoAtual(), i = ks.indexOf(K), interativa = rep === "interativa";
      est.cartao = K.id;
      const soTexto = !K.capa && !K.fim && !(K.vista || K.componente || K.componentes);   // cartão só de texto: tipografia maior (pesquisador, 2026-10-12)
      const f = el("article", { class: `viz story fmt-${fmt} rep-${rep} host-${hostQ}${fixo ? " fixo" : ""}${K.capa ? " capa" : ""}${K.fim ? " fim" : ""}${soTexto ? " so-texto" : ""}${K.capa && K.imagem ? " com-imagem" : ""}`, tabindex: "0",
        "aria-label": `${semMarcas(textoPlano(K.titulo))} — cartão ${i + 1} de ${ks.length}` });
      if (fixo) { f.style.setProperty("--w", `${tamanho.w}px`); f.style.setProperty("--h", `${tamanho.h}px`); }
      if (!fixo && largura) f.style.maxWidth = `${largura}px`;
      Object.assign(f.dataset, { fmt, rep, host: hostQ, cartao: K.id });
      f._opc = { cartao: "abaixo" };
      f.append(el("div", { class: "story-progresso", "aria-hidden": "true" }, ...ks.map((k, j) => el("span", { class: j < i ? "lido" : j === i ? "atual" : "" }))));
      const chapeu = K.capitulo || P.chapeu;   // o capítulo do cartão, quando houver, faz as vezes do chapéu
      if (chapeu) f.append(el("div", { class: "viz-topo" }, el("p", { class: "viz-chapeu" }, ...textoComControles(chapeu, interativa, f))));
      if (soTexto || (K.capa && !K.imagem)) f.append(el("div", { class: "story-vao antes" }));   // centra o texto na altura
      f.append(el(K.capa ? "h2" : "h3", { class: "viz-titulo" }, ...textoComControles(K.titulo, interativa, f).flatMap((x) => (typeof x === "string" ? negrito(x) : [x]))));
      const tx = resolver(K.texto, e);
      if (tx) f.append(el("p", { class: "viz-sub story-texto" }, ...textoComControles(tx, interativa, f).flatMap((x) => (typeof x === "string" ? negrito(x) : [x]))));
      const temPalco = Boolean(K.vista || K.componente || K.componentes);
      const palco = el("div", { class: "viz-palco" });
      const nota = resolver(K.nota, e);
      if (temPalco) f.append(el("div", { class: "viz-corpo" }, palco), el("p", { class: "viz-n" }), el("ol", { class: "viz-anot-lista", hidden: "" }), el("div", { class: "viz-legenda" }),
        ...(nota ? [el("p", { class: "story-nota" }, ...negrito(nota))] : []));
      else f.append(K.capa && K.imagem ? el("div", { class: "capa-imagem", "aria-hidden": "true" }) : el("div", { class: "story-vao" }), ...(nota ? [el("p", { class: "story-nota" }, ...negrito(nota))] : []));
      if (K.fim) f.append(el("div", { class: "story-fim" }, ...(K.links || []).map((l) => el("a", { href: resolver(l.href, e), target: "_blank", rel: "noopener" }, `${resolver(l.rotulo, e)} ↗`)),
        interativa && fatiador ? el("button", { type: "button", onclick: () => abrirBusca(f, fatiador) }, "Trocar de cidade") : null,
        interativa ? el("button", { type: "button", onclick: () => irCartao(0) }, "↺ Ver de novo") : null));
      if (interativa) f.append(el("div", { class: "story-nav so-interativo" },
        el("button", { type: "button", class: "ant", disabled: i === 0 ? "" : null, "aria-label": "Cartão anterior", onclick: () => irCartao(i - 1) }, "‹"),
        el("span", { class: "pos", "aria-live": "polite", text: `${i + 1} de ${ks.length}` }),
        el("button", { type: "button", class: "prox", disabled: i === ks.length - 1 ? "" : null, "aria-label": "Próximo cartão", onclick: () => irCartao(i + 1) }, K.capa ? "Começar ›" : "›")));
      f.append(interativa ? barraBase(f, fmt, hostQ) : rodapeMinimo());
      f._palco = temPalco ? palco : null; f._palcoCompa = null; f._lado = false;
      if (interativa) gestos(f, i);
      if (est.buscando && interativa && fatiador) abrirBusca(f, fatiador, false);
      return f;
    }
    /** Deslizar para o lado (fora dos botões, campos e folhas) e setas do teclado trocam de cartão. */
    function gestos(f, i) {
      let x0 = null, y0 = 0;
      // mapa com zoom no palco (vista de mapa ou cartão de mapa): o gesto é do mapa; segundo dedo (pinça) cancela
      const mapaNoPalco = (n) => { const pal = n.closest(".viz-palco"); return pal && (f.dataset.vista === "mapa" || pal.querySelector(".zoom-pontos, .mapa-moldura")); };
      f.addEventListener("pointerdown", (ev) => { x0 = !ev.isPrimary || ev.target.closest("button, a, input, .viz-folha, .viz-busca, .viz-cartao") || mapaNoPalco(ev.target) ? null : ev.clientX; y0 = ev.clientY; });
      f.addEventListener("pointerup", (ev) => {
        if (x0 === null) return;
        const dx = ev.clientX - x0, dy = ev.clientY - y0; x0 = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) irCartao(i + (dx < 0 ? 1 : -1));
      });
      f.addEventListener("pointercancel", () => { x0 = null; });
      f.addEventListener("keydown", (ev) => {
        if (ev.target.closest("input, textarea") || ev.altKey || ev.ctrlKey || ev.metaKey) return;
        if (ev.key === "ArrowRight") { ev.preventDefault(); irCartao(i + 1); }
        if (ev.key === "ArrowLeft") { ev.preventDefault(); irCartao(i - 1); }
      });
    }
    function irCartao(j) {
      const ks = cartoesVisiveis();
      if (j < 0 || j >= ks.length) return;
      const a = cartaoAtual(), b = ks[j];
      if (a === b) return;
      const f = alvoRaiz.querySelector("article.viz");
      const mudar = () => { est.cartao = b.id; est.sel = null; est.anotAberta = false; est.legFixa = null; };
      // gráfico ⇄ mapa entre cartões: os mesmos pontos se movem (como a troca de aba, L0013)
      // demais pares: TROCA da matriz (design.yaml › padroes.transicoes, L0016) — esmaece e surge; o título fica
      if (a.vista && b.vista && f?._palco) animarTroca(f, mudar);
      else if (a.componente && a.componente === b.componente && f?._palco && !Lab.semMovimento()) {
        if (f._inst?.atualizar) { reuso = { componente: a.componente, inst: f._inst, palco: f._palco }; const y = scrollY; mudar(); guardarEndereco(); render(); scrollTo(0, y); }
        else animarEstado(f, mudar);
      } else trocarCartao(f, mudar);
      alvoRaiz.querySelector("article.viz")?.focus({ preventScroll: true });
    }
    /** Texto com marcadores e controles como texto puro (imagem, aria). */
    /** Opções de um controle: no plano, ou da base do Python ("{e.opcoes.municipio}", para listas longas). */
    const valoresDe = (c) => (typeof c?.valores === "string" ? resolver(c.valores, e) : c?.valores) || {};
    const textoPlano = (t) => resolver(t || "", e).replace(/\{c\.(\w+)\}/g, (_, id) => (ctl[id]?.tipo === "busca" ? rotuloFatia() : valoresDe(ctl[id])[est[id]] ?? ""));
    function textoLimitado(t, lim, interativa) {
      const puro = semMarcas(t);
      if (!interativa || puro.length <= lim) return negrito(t);
      const k = puro.lastIndexOf(" ", lim - 1);
      const span = el("span", {}, puro.slice(0, k > lim * 0.6 ? k : lim - 1),
        el("button", { type: "button", class: "mais-texto", "aria-label": "Ler o texto inteiro", onclick: () => span.replaceWith(el("span", {}, ...negrito(t))) }, "…"));
      return [span];
    }
    /** Texto do chapéu ou do título com {c.id} no lugar do controle (L0011: o seletor faz parte da frase). */
    function textoComControles(t, interativa, f) {
      return resolver(t, e).split(/(\{c\.\w+\})/).filter(Boolean).map((p) => {
        const m = p.match(/^\{c\.(\w+)\}$/);
        return m ? controleNaFrase(ctl[m[1]], interativa, f) : p;
      });
    }
    const rotuloFatia = () => indice?.get(est[fatiador?.id])?.rotulo || e.nome || "";
    function controleNaFrase(c, interativa, f) {
      if (!c) return "";
      if (c.tipo === "busca") {
        if (!interativa) return el("span", { text: rotuloFatia() });
        return el("button", { type: "button", class: "viz-busca-botao", "aria-label": `${c.rotulo || "Escolher"}: ${rotuloFatia()}. Trocar`, onclick: () => abrirBusca(f, c) }, `${rotuloFatia()} ▾`);
      }
      const ops = Object.entries(valoresDe(c));
      const atual = est[c.id];
      if (!interativa) return el("span", { text: valoresDe(c)[atual] ?? String(atual) });
      const mudar = (v) => trocarSuave(() => { est[c.id] = v; });
      return ops.length <= 3 ? Lab.seletorTitulo(c.rotulo || c.id, ops, atual, mudar) : Lab.seletorTituloLista(c.rotulo || c.id, ops, atual, mudar);
    }
    /** Busca de lugar (5.570 cidades): campo com lista; Enter ou escolha na lista troca a fatia. */
    function abrirBusca(f, c, focar = true) {
      if (f.querySelector(".viz-busca")) { f.querySelector(".viz-busca input").focus(); return; }
      est.buscando = true;
      const idLista = `lista-${P.id}-${c.id}`;
      if (!document.getElementById(idLista)) document.body.append(el("datalist", { id: idLista }, ...[...indice.values()].map((m) => el("option", { value: m.rotulo }))));
      const campo = el("input", { type: "search", list: idLista, placeholder: "Digite o nome da cidade", "aria-label": c.rotulo || "Cidade", autocomplete: "off" });
      const fechar = () => { est.buscando = false; caixa.remove(); };
      const escolher = () => {
        const v = campo.value.trim().toLowerCase();
        if (!v) return;
        const hit = [...indice].find(([, m]) => m.rotulo.toLowerCase() === v) || [...indice].find(([, m]) => m.nome.toLowerCase() === v);
        if (!hit) { campo.setCustomValidity("Escolha uma cidade da lista."); campo.reportValidity(); return; }
        campo.setCustomValidity("");
        est[c.id] = hit[0]; est.buscando = false; guardarEndereco();
        irPara(hit[0]).catch(falhou);
      };
      campo.addEventListener("change", escolher);
      campo.addEventListener("keydown", (ev) => { if (ev.key === "Enter") escolher(); if (ev.key === "Escape") fechar(); });
      const caixa = el("div", { class: "viz-busca so-interativo" }, campo, el("button", { type: "button", onclick: fechar }, "Cancelar"));
      campo.value = est.buscaTexto || "";
      campo.addEventListener("input", () => { est.buscaTexto = campo.value; });
      (f.querySelector(".viz-titulo") || f.firstChild).after(caixa);
      if (focar) campo.focus();
    }

    // ---------------------------------------------------------------- barra fixa e folhas (padrão do story piloto, L0013)
    function barraBase(f, fmt, hostQ) {
      const folha = el("div", { class: "viz-folha so-interativo", role: "dialog", "aria-modal": "false", hidden: "" });
      const fechar = () => { folha.hidden = true; };
      f.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fechar(); });
      const abrir = (titulo, ...corpo) => {
        folha.replaceChildren(el("div", { class: "alca", "aria-hidden": "true" }),
          el("div", { class: "cab" }, el("h4", { text: titulo }), el("button", { type: "button", "aria-label": "Fechar", onclick: fechar }, "✕")), ...corpo);
        folha.hidden = false;
        folha.querySelector(".cab button").focus();
      };
      const explorar = (P.controles || []).filter((c) => (c.local || "explorar") === "explorar" || c.explorar);
      const valorControle = (c) => est[c.id] ?? opcaoAtual(c.opcao, (est.aba === "mapa" ? P.grafico.companheiro : P.grafico)?.opcoes?.[c.opcao]);
      const botoes = el("div", { class: "botoes" },
        el("button", { type: "button", onclick: () => abrir("Como ler", ...(P.como_ler ? [el("p", {}, ...negrito(P.como_ler))] : []), tabelaAlternativa()) }, "ⓘ Como ler"),
        // ✎ Notas e fontes = a metodologia inteira, em camadas: notas, fonte e data em cima; o bloco recolhido embaixo (L0014)
        el("button", { type: "button", onclick: () => abrir("Notas e fontes", ...(P.notas || []).map((t) => el("p", {}, ...negrito(resolver(t, e)))),
          el("p", {}, el("b", { text: "Fonte: " }), P.fonte),
          P.metodologia ? Lab.metodologiaEmCamadas(P.metodologia, { endereco: P.endereco, linkAutor: { href: P.portfolio, texto: "Página do autor ↗" } })
            : P.decisoes?.length ? el("p", { class: "fraco", text: `Decisões metodológicas: ${P.decisoes.join(", ")}` }) : null) }, "✎ Notas e fontes"),
        explorar.length ? el("button", { type: "button", onclick: () => abrir("Explorar", ...explorar.map((c) => Lab.seletor(c.rotulo || c.id, Object.entries(valoresDe(c)), valorControle(c), (v) => { est[c.id] = v; render(); }))) }, "⇄ Explorar") : null);
      const compartilhar = el("button", { type: "button", class: "comp", onclick: () => abrirCompartilhar(abrir, fechar, fmt) }, "↗ Baixar ou Compartilhar");
      const linha2 = el("div", { class: "linha2" },
        el("span", { class: "assina" }, el("span", {}, "por ", el("a", { href: P.portfolio, target: "_blank", rel: "noopener", text: P.autor })),
          P.fonte_curta ? el("span", { class: "fonte-curta", text: P.fonte_curta }) : null),   // fonte e data sempre visíveis (L0010, L0014)
        hostQ === "embed" ? el("span", {}, el("a", { href: enderecoAtual(), target: "_blank", rel: "noopener" }, "tela cheia ↗"), " · ", compartilhar) : compartilhar);
      f.append(folha);
      return el("nav", { class: "viz-base", "aria-label": "Recursos da visualização" }, botoes, linha2);
    }
    function abrirCompartilhar(abrir, fechar, fmt) {
      const url = enderecoAtual(), titulo = semMarcas(P.titulo), lugar = rotuloFatia();

  /** Quebra aproximada de texto em SVG (sem medir): ~0,55 em por caractere. */

    // borda "muitos" (contrato): cabem ~(altura útil ÷ 14) rótulos; rotula as maiores no fim, e as menores só se couberem

  /** barras100 — barras empilhadas de 100%, uma por linha, em SVG (L0012); linha pontilhada de 50% (elemento implícito).
   *  dados: {categorias: [{id, rotulo, cor}], linhas: [{rotulo, valores: {cat: %}, absolutos?: {cat: texto}}], maioria?: bool} */
  adaptadores.barras100 = (C) => {
    C.passarDestaca = true;   // passar o mouse numa marca destaca a categoria dela

    const W = C.alvo.clientWidth, H = Math.max(120, C.alvo.clientHeight), larg = W - 2;
    const passo = Math.min(72, (H - 6) / L.length), bh = Math.max(12, Math.min(34, passo * 0.5));
