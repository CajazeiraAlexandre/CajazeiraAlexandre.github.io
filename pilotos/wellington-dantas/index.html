    for (const { s, y } of rotDir) rot(grupos.get(s), x1 + 9, y, `${fmt(s.valores[n - 1])} ${s.rotulo}`, "start");
    const itensLeg = [];
    if (legenda) {
      const leg = Lab.el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Séries: passe o mouse ou toque para destacar" });
      for (const s of series) {
        const amostra = Lab.el("span", { class: `amostra-linha${s.tracejado ? " tracejada" : ""}`, "aria-hidden": "true" });
        amostra.style.color = s.cor;
        const it = Lab.el("button", { type: "button", class: "item-legenda", "aria-pressed": "false" }, amostra, ` ${s.rotulo}`);
        it.addEventListener("pointerenter", () => destacar(s));
        it.addEventListener("pointerleave", () => destacar(null));
        it.addEventListener("focus", () => destacar(s));
        it.addEventListener("blur", () => destacar(null));
        it.addEventListener("click", () => { fixa = fixa === s ? null : s; itensLeg.forEach(([x, b]) => b.setAttribute("aria-pressed", String(x === fixa))); destacar(null); });
        itensLeg.push([s, it]);
        leg.append(it);
      }
      alvo.append(leg);
    }
  };
  /** Duas pontas (antes → depois): atalho de Lab.linhasPontas. series: [{cor, v0, v1, rotulo, dica0, dica1}]. */
  Lab.linhasDuasPontas = (alvo, { pontas, series, fmt, aria, largura = 500, legenda = false }) => Lab.linhasPontas(alvo, { pontas, fmt, aria, largura, legenda,
    series: series.map((s) => ({ cor: s.cor, valores: [s.v0, s.v1], rotulo: s.rotulo, dicas: [s.dica0, s.dica1], tracejado: s.tracejado })) });

  /** Distribuição sem eixo vertical (beeswarm): cada unidade na posição do seu valor; 0 no centro.
   *  opts: { pontos: [{u, d, peso}], cor(d), simlog (bool: eixo logarítmico simétrico), marcas, fmtMarca,
   *          rotuloEsq, rotuloDir, rotuloEixo, porPeso, rotuloPeso, raio (fixo), rMaxPeso, alturaMax,
   *          nome(u), dica(u) → linhas, aria } */
  Lab.distribuicao = (alvo, o) => {
    const W = 440, HMAX = o.alturaMax || 360, mg = { t: 30, r: 18, b: 34, l: 18 };
    const M = d3.max(o.pontos, (p) => Math.abs(p.d)) || 1;
    const sx = o.simlog ? d3.scaleSymlog().constant(100).domain([-M, M]).range([mg.l, W - mg.r])
      : d3.scaleLinear().domain([-M, M]).nice().range([mg.l, W - mg.r]);
    const marcas = o.simlog ? (o.marcas || [-100000, -10000, -1000, 0, 1000, 10000, 100000]).filter((v) => Math.abs(v) <= M * 1.0001) : sx.ticks(Lab.estreito() ? 5 : 7);
    const ea = Lab.escalaArea(o.pontos.map((p) => p.peso), o.rMaxPeso || 16);
    const raio = (p) => (o.porPeso ? Math.max(2.5, ea.s(p.peso)) : o.raio || 4.5);
    const meio = (mg.t + HMAX - mg.b) / 2;
    const nos = o.pontos.map((p) => ({ ...p, x: sx(p.d), y: meio, r: raio(p) }));
    const sim = d3.forceSimulation(nos).force("x", d3.forceX((n) => sx(n.d)).strength(1)).force("y", d3.forceY(meio).strength(0.06))
      .force("colisao", d3.forceCollide((n) => n.r + 0.7).iterations(3)).stop();
    for (let i = 0; i < 220; i++) { sim.tick(); for (const n of nos) n.y = Math.max(mg.t + n.r, Math.min(HMAX - mg.b - n.r, n.y)); }
    // altura do desenho = altura ocupada pelos círculos (sem faixa vazia)
    const topoN = d3.min(nos, (n) => n.y - n.r) ?? mg.t, baseN = d3.max(nos, (n) => n.y + n.r) ?? mg.t;
    for (const n of nos) n.y += mg.t + 4 - topoN;
    const H = Math.max(120, baseN - topoN + mg.t + mg.b + 8);
    if (o.porPeso) alvo.append(Lab.legendaTamanho(ea.s, o.rotuloPeso));
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).style("width", "100%").style("max-width", `${W}px`).style("height", "auto")
      .attr("role", "img").attr("aria-label", o.aria);
    const x0 = sx(0);
    svg.append("line").attr("x1", x0).attr("x2", x0).attr("y1", mg.t - 8).attr("y2", H - mg.b).attr("stroke", tok("cor-eixo")).attr("stroke-dasharray", "4 3");
    svg.append("text").attr("x", x0 - 8).attr("y", 14).attr("text-anchor", "end").style("font-size", "12px").style("fill", tok("cor-texto-secundario")).text(`← ${o.rotuloEsq}`);
    svg.append("text").attr("x", x0 + 8).attr("y", 14).style("font-size", "12px").style("fill", tok("cor-texto-secundario")).text(`${o.rotuloDir} →`);
    svg.append("g").attr("transform", `translate(0,${H - mg.b})`).call(d3.axisBottom(sx).tickValues(marcas).tickFormat(o.fmtMarca)).call(Lab.eixo);
    svg.append("text").attr("x", W - mg.r).attr("y", H - 2).attr("text-anchor", "end").style("font-size", "11px").style("fill", tok("cor-texto-secundario")).text(o.rotuloEixo);
    svg.append("g").selectAll("circle").data([...nos].sort((a, b) => b.r - a.r)).join("circle").attr("class", (n) => `ponto${o.porPeso && ea.fora(n.peso) ? " fora-escala" : ""}`)
      .attr("data-u", (n) => n.u).attr("cx", (n) => n.x).attr("cy", (n) => n.y).attr("r", (n) => n.r)
      .attr("fill", (n) => o.cor(n.d)).attr("stroke", tok("cor-superficie")).attr("stroke-width", 0.8).style("cursor", "pointer")
      .on("pointermove", (ev, n) => Lab.mostrarDica(ev, o.nome(n.u), o.dica(n.u)))
      .on("pointerleave", Lab.esconderDica).on("click", (ev, n) => Lab.selecionar(n.u, ev.currentTarget));
    return { foraIds: o.porPeso ? nos.filter((n) => ea.fora(n.peso)).map((n) => n.u) : [] };
  };

  /** Dispersão x × y com linha de igualdade tracejada (mesma escala nos dois eixos).
   *  opts: { pontos: [{u, x, y, peso}], cor, fmtEixo, rotuloX, rotuloY, porPeso, rotuloPeso, raio, rMaxPeso, nome(u), dica(u), aria } */
  Lab.dispersao = (alvo, o) => {
    const W = 440, H = 400, mg = { t: 14, r: 14, b: 42, l: 46 };
    const lim = Math.max(d3.max(o.pontos, (p) => p.x), d3.max(o.pontos, (p) => p.y)) || 1;
    const sx = d3.scaleLinear().domain([0, lim]).nice().range([mg.l, W - mg.r]), sy = d3.scaleLinear().domain(sx.domain()).range([H - mg.b, mg.t]);
    const ea = Lab.escalaArea(o.pontos.map((p) => p.peso), o.rMaxPeso || 22);
    const raio = (p) => (o.porPeso ? Math.max(3, ea.s(p.peso)) : o.raio || 5);
    if (o.porPeso) alvo.append(Lab.legendaTamanho(ea.s, o.rotuloPeso));
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).style("width", "100%").style("max-width", `${W}px`).style("height", "auto")
      .attr("role", "img").attr("aria-label", o.aria);
    svg.append("line").attr("x1", sx(0)).attr("y1", sy(0)).attr("x2", sx(sx.domain()[1])).attr("y2", sy(sx.domain()[1])).attr("stroke", tok("cor-eixo")).attr("stroke-dasharray", "4 3");
    svg.append("g").attr("transform", `translate(0,${H - mg.b})`).call(d3.axisBottom(sx).ticks(5).tickFormat(o.fmtEixo)).call(Lab.eixo);
    svg.append("g").attr("transform", `translate(${mg.l},0)`).call(d3.axisLeft(sy).ticks(5).tickFormat(o.fmtEixo)).call(Lab.eixo);
    svg.append("text").attr("x", W - mg.r).attr("y", H - 6).attr("text-anchor", "end").text(o.rotuloX);
    svg.append("text").attr("x", mg.l + 4).attr("y", mg.t + 10).text(o.rotuloY);
    svg.append("g").selectAll("circle").data([...o.pontos].sort((a, b) => raio(b) - raio(a))).join("circle").attr("class", (p) => `ponto${o.porPeso && ea.fora(p.peso) ? " fora-escala" : ""}`)
      .attr("data-u", (p) => p.u).attr("cx", (p) => sx(p.x)).attr("cy", (p) => sy(p.y)).attr("r", raio)
      .attr("fill", o.cor).attr("fill-opacity", o.porPeso ? 0.55 : 0.75).style("cursor", "pointer")
      .on("pointermove", (ev, p) => Lab.mostrarDica(ev, o.nome(p.u), o.dica(p.u)))
      .on("pointerleave", Lab.esconderDica).on("click", (ev, p) => Lab.selecionar(p.u, ev.currentTarget));
    return { foraIds: o.porPeso ? o.pontos.filter((p) => ea.fora(p.peso)).map((p) => p.u) : [] };
  };

  /** Boxplot horizontal por categoria + um círculo por unidade (posição vertical determinística).
   *  Resumo (quartis, bigodes de Tukey) vem pronto da base Python.
   *  opts: { linhas: [{rotulo, sub, cor, resumo: {n,min,q1,mediana,q3,max,bigode_inf,bigode_sup}, pontos: [{u, v, peso, dica: [título, linhas]}]}],
   *          dominio: [min, max], referencias: [valores com linha fina], fmt, porPeso, rotuloPeso, nomeUnidades, aria } */
  Lab.boxplot = (alvo, o) => {
    const estreito = Lab.estreito();
    const faixa = estreito ? 64 : 72;
    const W = Lab.largura(760), H = faixa * o.linhas.length + 44, mg = { l: estreito ? 84 : 104, r: 16, t: 10, b: 30 };
    const sx = d3.scaleLinear().domain(o.dominio).range([mg.l, W - mg.r]).clamp(true);
    const ea = Lab.escalaArea(o.linhas.flatMap((l) => l.pontos).map((p) => p.peso), estreito ? 22 : 28);
    const raio = (p) => (o.porPeso ? Math.max(3, ea.s(p.peso)) : 4.6);
    if (o.porPeso) alvo.append(Lab.legendaTamanho(ea.s, o.rotuloPeso));
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H).style("max-width", "100%").style("height", "auto")
      .attr("role", "img").attr("aria-label", o.aria);
    svg.append("g").attr("transform", `translate(0,${H - mg.b})`).call(d3.axisBottom(sx).ticks(estreito ? 4 : 8).tickFormat((v) => `${v}%`)).call(Lab.eixo);
    for (const v of o.referencias || []) svg.append("line").attr("x1", sx(v)).attr("x2", sx(v)).attr("y1", mg.t).attr("y2", H - mg.b).attr("stroke", tok("cor-grade"));
    const tinta = tok("cor-texto");
    o.linhas.forEach((l, i) => {
      const y = mg.t + faixa * i + faixa / 2;
      const cor = l.cor, r = l.resumo;
      const g = svg.append("g");
      // nome em até duas linhas (nomes longos quebram no espaço)
      const linhasNome = l.rotulo.length > 12 ? l.rotulo.split(" ") : [l.rotulo];
      const tn = g.append("text").attr("x", mg.l - 10).attr("y", y - 3 - (linhasNome.length - 1) * 13).attr("text-anchor", "end").style("font-weight", 600).style("fill", tinta);
      linhasNome.forEach((t, k) => tn.append("tspan").attr("x", mg.l - 10).attr("dy", k ? 13 : 0).text(t));
      if (l.sub) g.append("text").attr("x", mg.l - 10).attr("y", y + 12).attr("text-anchor", "end").style("font-size", "11px").text(l.sub);
      // hastes e caixa
      g.append("line").attr("x1", sx(r.bigode_inf)).attr("x2", sx(r.q1)).attr("y1", y).attr("y2", y).attr("stroke", tinta).attr("stroke-width", 1.2);
      g.append("line").attr("x1", sx(r.q3)).attr("x2", sx(r.bigode_sup)).attr("y1", y).attr("y2", y).attr("stroke", tinta).attr("stroke-width", 1.2);
      for (const v of [r.bigode_inf, r.bigode_sup]) g.append("line").attr("x1", sx(v)).attr("x2", sx(v)).attr("y1", y - 7).attr("y2", y + 7).attr("stroke", tinta).attr("stroke-width", 1.2);
      // faixa interquartil hachurada na cor da categoria
      const idP = `iq-${i}-${Math.random().toString(36).slice(2, 6)}`;
      const pat = svg.append("defs").append("pattern").attr("id", idP).attr("patternUnits", "userSpaceOnUse").attr("width", 6).attr("height", 6).attr("patternTransform", "rotate(45)");
      pat.append("rect").attr("width", 6).attr("height", 6).attr("fill", d3.interpolateRgb(tok("cor-superficie"), cor)(0.16));
      pat.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 6).attr("stroke", cor).attr("stroke-width", 1.2).attr("stroke-opacity", 0.45);
      g.append("text").attr("x", sx(r.mediana)).attr("y", y - 17).attr("text-anchor", "middle").style("font-size", "11px").style("font-weight", 600).style("fill", tinta).text(`Med. ${o.fmt(r.mediana)}`);
      g.append("rect").attr("x", sx(r.q1)).attr("y", y - 13).attr("width", Math.max(2, sx(r.q3) - sx(r.q1))).attr("height", 26).attr("rx", 3)
        .attr("fill", `url(#${idP})`).attr("stroke", cor).attr("stroke-width", 1.5)
        .on("pointermove", (ev) => Lab.mostrarDica(ev, `${l.rotulo} · ${r.n} ${o.nomeUnidades || "unidades"}`, [`mediana: ${o.fmt(r.mediana)}`, `1º–3º quartil: ${o.fmt(r.q1)} a ${o.fmt(r.q3)}`, `menor–maior: ${o.fmt(r.min)} a ${o.fmt(r.max)}`]))
        .on("pointerleave", Lab.esconderDica);
      g.append("line").attr("x1", sx(r.mediana)).attr("x2", sx(r.mediana)).attr("y1", y - 13).attr("y2", y + 13).attr("stroke", tinta).attr("stroke-width", 2.5).attr("pointer-events", "none");
      // um círculo por unidade, espalhado na vertical (posição determinística)
      const pts = [...l.pontos].sort((a, b) => a.v - b.v).map((p, k) => ({ ...p, dy: ((k * 37) % 23) - 11 }))
        .sort((a, b) => raio(b) - raio(a));   // maiores atrás
      const circ = g.append("g").selectAll("g").data(pts).join("g").style("cursor", "pointer")
        .on("pointermove", (ev, p) => Lab.mostrarDica(ev, p.dica[0], p.dica[1]))
        .on("pointerleave", Lab.esconderDica)
        .on("click", (ev, p) => Lab.selecionar(p.u, ev.currentTarget));
      circ.append("circle").attr("cx", (p) => sx(p.v)).attr("cy", (p) => y + p.dy).attr("r", (p) => Math.max(9, raio(p))).attr("fill", "transparent");
      circ.attr("data-u", (p) => p.u);
      circ.append("circle").attr("class", (p) => `ponto${p.v < r.bigode_inf || p.v > r.bigode_sup ? " discrepante" : ""}${o.porPeso && ea.fora(p.peso) ? " fora-escala" : ""}`).attr("cx", (p) => sx(p.v)).attr("cy", (p) => y + p.dy).attr("r", raio)
        .attr("fill", cor).attr("fill-opacity", o.porPeso ? 0.55 : 0.8);
    });
    return { foraIds: o.porPeso ? o.linhas.flatMap((l) => l.pontos).filter((p) => ea.fora(p.peso)).map((p) => p.u) : [] };
  };

  // ------------------------------------------------------------ pontos conectados (desproporções)
  /** Pontos conectados para exploratórios (D12; promovido da Visualização — design.yaml › graficos.pontos_conectados): uma
   *  linha por grupo, um ponto por medida (ex.: % da população, % dos contemplados, % do valor) no mesmo eixo, ligados do
   *  menor ao maior. Lê "quanto cada grupo pesa em cada régua"; a distância entre os pontos é a desproporção.
   *  Lab.pontosConectados(alvo, { grupos: [rótulo], medidas: [{chave, rotulo, cor, vazado}], valor(g, chave) → número | null,
   *    fmt(v) → texto, dica(g) → linhas, aria, largura })
   *  Valor nulo (célula suprimida) não desenha o ponto; o grupo fica com a nota "1 a 4". Legenda: passar o mouse num item
   *  realça a medida; tocar fixa. */
  // ausente: texto de valor ausente na dica e sufixo do rótulo (padrão: supressão "1 a 4"; ex.: "sem dado" quando a fonte não tem a medida)
  Lab.pontosConectados = (alvo, { grupos, medidas, valor, fmt = (v) => `${v.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%`, dica = null, aria = "", largura = 760, ausente = "1 a 4", sufixoAusente = true, fmtEixo = (v) => `${v}%`, delta = true, referencia = null }) => {
    // referencia (opcional): {valor, rotulo} — linha vertical tracejada (ex.: a meta, ou 1 = iguais)
    const W = Math.min(largura, Math.max(320, alvo.clientWidth || largura)), estreito = W < 560;
    const mRot = estreito ? 0 : Math.min(230, W * 0.32), lh = estreito ? 44 : 30, topo = referencia ? 24 : 8, pe = 26;
    const H = topo + pe + grupos.length * lh;
    const vals = grupos.flatMap((g) => medidas.map((m) => valor(g, m.chave))).filter((v) => v !== null && v !== undefined);
    const x = d3.scaleLinear().domain([0, Math.max(1, d3.max(vals), referencia ? referencia.valor : 0)]).nice().range([mRot + 8, W - 46]);
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", "100%").attr("role", "img").attr("aria-label", aria).style("max-width", `${W}px`).style("overflow", "visible");
    Lab.comDados(svg.node(), { cab: ["Grupo", ...medidas.map((m) => m.rotulo)], linhas: grupos.map((g) => [g, ...medidas.map((m) => valor(g, m.chave))]) });
    svg.append("g").attr("transform", `translate(0,${H - pe + 4})`).call(d3.axisBottom(x).ticks(estreito ? 4 : 6).tickFormat(fmtEixo)).call(Lab.eixo).call((g) => g.select(".domain").remove());
    svg.append("g").selectAll("line").data(x.ticks(estreito ? 4 : 6)).join("line").attr("x1", x).attr("x2", x).attr("y1", topo).attr("y2", H - pe).attr("stroke", Lab.token("cor-grade")).attr("stroke-width", 1);
    if (referencia) {
      const xr = x(referencia.valor);
      svg.append("line").attr("x1", xr).attr("x2", xr).attr("y1", topo - 4).attr("y2", H - pe).attr("stroke", Lab.token("cor-texto"))
        .attr("stroke-width", 1.5).attr("stroke-dasharray", "4 3");
      if (referencia.rotulo) svg.append("text").attr("x", xr).attr("y", topo - 10).attr("text-anchor", xr > W * 0.7 ? "end" : "start").attr("dx", xr > W * 0.7 ? -4 : 4)
        .style("font-size", "11.5px").style("font-weight", "600").attr("fill", Lab.token("cor-texto")).text(referencia.rotulo);
    }
    const linhas = svg.append("g").selectAll("g").data(grupos).join("g").attr("transform", (g, i) => `translate(0,${topo + i * lh + (estreito ? 30 : lh / 2)})`).style("cursor", dica ? "pointer" : null);
    linhas.append("text").attr("x", estreito ? x.range()[0] : mRot).attr("y", estreito ? -16 : 4).attr("text-anchor", estreito ? "start" : "end")
      .style("font-size", "13px").attr("fill", Lab.token("cor-texto")).text((g) => g + (sufixoAusente && medidas.some((m) => valor(g, m.chave) == null) ? ` (${ausente})` : ""));
    linhas.append("line").attr("x1", (g) => x(d3.min(medidas, (m) => valor(g, m.chave)) ?? 0)).attr("x2", (g) => x(d3.max(medidas, (m) => valor(g, m.chave)) ?? 0))
      .attr("stroke", Lab.token("cor-texto-suave")).attr("stroke-width", 3).attr("stroke-opacity", 0.55).attr("stroke-linecap", "round");
    const pts = linhas.selectAll("circle").data((g) => medidas.filter((m) => valor(g, m.chave) != null).map((m) => ({ g, m, v: valor(g, m.chave) }))).join("circle")
      .attr("class", "pc-ponto").attr("cx", (d) => x(d.v)).attr("r", (d) => (d.m.vazado ? 6 : 7))
      .attr("fill", (d) => (d.m.vazado ? Lab.token("cor-superficie") : d.m.cor)).attr("stroke", (d) => (d.m.vazado ? d.m.cor : Lab.token("cor-superficie")))
      .attr("stroke-width", (d) => (d.m.vazado ? 2.5 : 1.5));   // vazado = régua de referência (ex.: % da população)
    linhas.append("text").attr("class", "pc-rot").attr("x", (g) => x(d3.max(medidas, (m) => valor(g, m.chave)) ?? 0) + 9).attr("y", 4).style("font-size", "11.5px").attr("fill", Lab.token("cor-texto-secundario"))
      .text((g) => { const vs = medidas.map((m) => valor(g, m.chave)).filter((v) => v != null); return delta && vs.length > 1 ? `Δ ${fmt(d3.max(vs) - d3.min(vs)).replace("%", " p.p.")}` : ""; });
    if (dica) linhas.on("pointermove", (ev, g) => Lab.mostrarDica(ev, g, [...medidas.map((m) => `${m.rotulo}: ${valor(g, m.chave) == null ? ausente : fmt(valor(g, m.chave))}`), ...(dica(g) || [])])).on("pointerleave", Lab.esconderDica);
    let fixa = null;
    const realcar = (k) => pts.attr("opacity", (d) => (k && d.m.chave !== k ? 0.2 : 1));
    const leg = Lab.el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Medidas" }, ...medidas.map((m) => {
      const am = Lab.el("span", { class: "amostra" }); am.style.borderRadius = "50%";
      if (m.vazado) { am.style.background = "transparent"; am.style.border = `2.5px solid ${m.cor}`; am.style.boxSizing = "border-box"; } else am.style.background = m.cor;
      return Lab.el("button", { type: "button", class: "item-legenda", "aria-pressed": "false", onpointerenter: () => realcar(m.chave), onpointerleave: () => realcar(fixa),
        onclick: (ev) => { fixa = fixa === m.chave ? null : m.chave; leg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === ev.currentTarget && fixa !== null))); realcar(fixa); } }, am, m.rotulo);
    }));
    alvo.insertBefore(leg, svg.node());
    return svg.node();
  };
})();

/* ==== web/componentes/lab-sankey.js ==== */
/* lab-sankey.js — diagrama de fluxos entre etapas (quem liderava cada unidade em cada momento). ADR L0003.
 * Requer d3-sankey. Mostra mudança de categoria por unidade, não transferência de votos/pessoas.
 *
 * Lab.sankey(alvo, {
 *   etapas: ["Dep. Estadual 2022", "Prefeito 2024", …],
 *   sequencias: { id: [categoria na etapa 0, na etapa 1, …] },
 *   fluxos: [{ etapa, de, para, … }], valor(f) → largura da faixa,
 *   ordem: [categorias na ordem fixa], cor(cat), nome(cat), nomeItem(id),
 *   dicaFluxo(f) → linhas, dicaNo({cat, etapa, ids, pct, conta(i)}) → linhas,
 *   nota: texto sob o diagrama,
 *   rotuloEtapa(t): forma curta do nome da etapa, usada com mais de 3 etapas (padrão: só o ano),
 *   contagem(id): quantas unidades cada sequência representa (padrão 1) — para fluxos de VALOR com sequências
 *                 agregadas (ex.: combinações região → região, contando aportes); o rótulo "% (n)" usa essa soma,
 *   semLista: true esconde "Ver lista" (sequências agregadas não são itens nomeáveis),
 *   vertical: etapas de cima para baixo. PADRÃO com 2 etapas (validado pelo pesquisador em 2026-10-08, melhor no
 *             celular); com 3 ou mais, horizontal. `vertical: false|true` força a orientação,
 *   Legenda interativa: passar o mouse num item destaca os fluxos que tocam a categoria; clicar fixa (Esc desfaz),
 *   Legendas por lado: com categorias diferentes no primeiro e no último lado (duas variáveis), a legenda do primeiro
 *             fica ACIMA do diagrama e a do último ABAIXO, centralizadas; com as mesmas categorias, uma só, acima,
 *   formatoValor(v) → texto do valor de um fluxo ou total (ex.: "R$ 1,2 bi", "831 proponentes"); padrão: número inteiro.
 *   Distribuição do destaque (como o card do mapa): passar o mouse numa barra ou num item da legenda mostra, numa dica,
 *             "Para onde vai" (destinos, com valor e parte do que saiu da categoria) e "De onde vem" (origens, com a parte
 *             do que chegou nela); clicar fixa o destaque e mostra a mesma distribuição num card abaixo do desenho,
 *   cabecalhoLados: [nó, nó] — conteúdo no início da legenda de cada lado (ex.: o seletor da variável daquele lado);
 *             com ele, as duas linhas de legenda sempre aparecem,
 * })
 * Rótulo de cada barra: "% da coluna (nº de unidades)". Clique fixa o destaque e libera "Ver lista".
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  let escAtual = null;   // um só ouvinte de Esc por página

  Lab.sankey = (alvo, o) => {
    const estreito = Lab.estreito(), vert = o.vertical ?? o.etapas.length === 2;
    const W = Lab.largura(760), H = vert ? (estreito ? 460 : 420) + 60 * Math.max(0, o.etapas.length - 2) : estreito ? 520 : 460, mx = estreito ? 58 : 90;
    const nE = o.etapas.length, ult = nE - 1;
    const xs = d3.range(nE).map((i) => (nE === 1 ? W / 2 : mx + ((W - 2 * mx) * i) / (nE - 1)));
    // margens da versão vertical: rótulos das barras acima e abaixo (+ títulos das etapas, quando não há cabeçalhos nas legendas)
    const vTop = o.cabecalhoLados ? 24 : 44, vBase = o.cabecalhoLados ? 20 : 34, vLado = estreito ? 8 : 16;
    const seqs = Object.entries(o.sequencias);
    const nos = [], idx = new Map();
    const no = (etapa, g) => { const k = `${etapa}|${g}`; if (!idx.has(k)) { idx.set(k, nos.length); nos.push({ k, etapa, g }); } return idx.get(k); };
    for (let e = 0; e < nE; e++) for (const g of o.ordem) if (seqs.some(([, s]) => s[e] === g)) no(e, g);
    const links = o.fluxos.map((f) => ({ source: idx.get(`${f.etapa}|${f.de}`), target: idx.get(`${f.etapa + 1}|${f.para}`), value: o.valor(f), f }))
      .filter((l) => l.value > 0);
    // vertical: a disposição é calculada na horizontal com os eixos trocados (profundidade = altura) e depois transposta
    const gerador = d3.sankey().nodeId((d) => d.index).nodeWidth(vert ? 16 : 18).nodePadding(vert ? 14 : 10).nodeSort((a, b) => o.ordem.indexOf(a.g) - o.ordem.indexOf(b.g))
      .extent(vert ? [[vTop, vLado], [H - vBase, W - vLado]] : [[mx, 24], [W - mx, H - 10]]);
    const grafo = gerador({ nodes: nos.map((d) => ({ ...d })), links: links.map((d) => ({ ...d })) });
    if (vert) for (const n of grafo.nodes) [n.x0, n.x1, n.y0, n.y1] = [n.y0, n.y1, n.x0, n.x1];
    const caminhoFluxo = vert
      ? (d) => { const sy = d.source.y1, ty = d.target.y0, m = (sy + ty) / 2; return `M${d.y0},${sy}C${d.y0},${m} ${d.y1},${m} ${d.y1},${ty}`; }
      : d3.sankeyLinkHorizontal();
    const presentes = o.ordem.filter((g) => nos.some((n) => n.g === g));
    const doLado = (e) => o.ordem.filter((g) => nos.some((n) => n.g === g && n.etapa === e));
    const [catsIni, catsFim] = [doLado(0), doLado(ult)];
    const porLado = Boolean(o.cabecalhoLados) || catsIni.some((g) => !catsFim.includes(g)) || catsFim.some((g) => !catsIni.includes(g));
    /** Linha de legenda centralizada e interativa; cada item guarda a sua categoria (data-cat). */
    const linhaLegenda = (cats, cabecalho) => {
      const lg = Lab.legendaCategorias(cats.map((g) => [o.cor(g), o.nome(g)]));
      lg.classList.add("legenda-interativa", "legenda-sankey");
      [...lg.querySelectorAll(".chave")].forEach((item, i) => { item.dataset.cat = cats[i]; });
      if (cabecalho) lg.prepend(el("span", { class: "lado-legenda" }, cabecalho));
      return lg;
    };
    const legendas = porLado ? [linhaLegenda(catsIni, o.cabecalhoLados?.[0]), linhaLegenda(catsFim, o.cabecalhoLados?.[1])] : [linhaLegenda(presentes)];
    alvo.append(legendas[0]);
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("class", "sankey").attr("width", W).attr("height", H).style("max-width", "100%").style("height", "auto")
      .attr("role", "img").attr("aria-label", `Diagrama de fluxos: ${o.etapas.join(" → ")}. A tabela abaixo traz os números.`);
    Lab.comDados(svg.node(), { cab: ["De (etapa)", "De", "Para (etapa)", "Para", "Valor"], linhas: () => o.fluxos.map((f) => [o.etapas[f.etapa], (o.nome || String)(f.de), o.etapas[f.etapa + 1] ?? "", (o.nome || String)(f.para), o.valor ? o.valor(f) : f.valor]) });
    const soAno = (t) => (t.match(/\d{4}/) || [t])[0];
    const curto = (t) => (estreito ? soAno(t) : nE > 3 ? (o.rotuloEtapa || soAno)(t) : t);
    if (estreito && !o.cabecalhoLados) alvo.append(el("p", { class: "nota", text: o.etapas.join(" → ") }));
    // trilho claro de cada coluna = 100%
    const colunas = d3.groups(grafo.nodes, (d) => d.etapa).map(([e, ns]) => ({ e, x0: d3.min(ns, (d) => d.x0), x1: d3.max(ns, (d) => d.x1), y0: d3.min(ns, (d) => d.y0), y1: d3.max(ns, (d) => d.y1), total: d3.sum(ns, (d) => d.value) }));
    const totalColuna = new Map(colunas.map((c) => [c.e, c.total]));
    svg.append("g").selectAll("rect").data(colunas).join("rect").attr("x", (c) => c.x0 - 3).attr("width", (c) => c.x1 - c.x0 + 6)
      .attr("y", (c) => c.y0 - 3).attr("height", (c) => c.y1 - c.y0 + 6).attr("rx", 3).attr("fill", Lab.token("cor-grade")).attr("opacity", 0.55);
    const c0 = colunas.find((c) => c.e === 0);
    if (c0 && !vert) {
      svg.append("text").attr("x", c0.x0 - 8).attr("y", c0.y0 + 4).attr("text-anchor", "end").style("font-size", "10px").text("100%");
      svg.append("text").attr("x", c0.x0 - 8).attr("y", c0.y1).attr("text-anchor", "end").style("font-size", "10px").text("0%");
    }
    // com cabeçalhos nas legendas (cabecalhoLados), os nomes das etapas já estão neles: nada desenhado aqui
    if (o.cabecalhoLados) { /* sem títulos de etapa no desenho */ }
    else if (vert) colunas.forEach((c) => svg.append("text").attr("x", vLado).attr("y", c.e === ult ? c.y1 + 30 : c.y0 - 24).style("font-weight", 600).text(o.etapas[c.e]));
    else o.etapas.forEach((t, i) => svg.append("text").attr("x", xs[i]).attr("y", 12).attr("text-anchor", i === 0 ? "start" : i === ult ? "end" : "middle").style("font-weight", 600).text(curto(t)));
    svg.append("g").selectAll("path").data(grafo.links).join("path").attr("class", "fluxo")
      .attr("d", caminhoFluxo).attr("stroke", (d) => o.cor(d.source.g)).attr("stroke-width", (d) => Math.max(1, d.width))
      .style("cursor", "pointer")
      .on("pointerenter", (ev, d) => { if (!fixo) destacar((x) => x === d); })
      .on("pointermove", (ev, d) => Lab.mostrarDica(ev, `${o.nome(d.source.g)} → ${o.nome(d.target.g)}`, [...o.dicaFluxo(d.f), fixo ? null : "clique para fixar o destaque"]))
      .on("pointerleave", () => { Lab.esconderDica(); if (!fixo) destacar(null); })
      .on("click", (ev, d) => fixar(`f|${d.f.etapa}|${d.f.de}|${d.f.para}`, Object.assign((x) => x === d, { link: d }),
        { titulo: `${o.nome(d.f.de)} → ${o.nome(d.f.para)} (${o.etapas[d.f.etapa]} → ${o.etapas[d.f.etapa + 1]})`, filtro: (s) => s[d.f.etapa] === d.f.de && s[d.f.etapa + 1] === d.f.para }));
    const gNos = svg.append("g").selectAll("g").data(grafo.nodes).join("g");
    const pctNo = (d) => (100 * d.value) / (totalColuna.get(d.etapa) || 1);
    const resumoNo = (d) => {
      const ms = seqs.filter(([, s]) => s[d.etapa] === d.g);
      const conta = (i) => d3.rollups(ms, (v) => v.length, ([, s]) => s[i]).sort((a, b) => b[1] - a[1]).map(([g, n]) => `${o.nome(g)} ${n}`).join(", ");
      return [...o.dicaNo({ cat: d.g, etapa: d.etapa, ids: ms.map(([m]) => m), pct: pctNo(d), conta, ultima: ult }), ...linhasDist(distribuicao(d.g, d.etapa)), fixo ? null : "clique para fixar o destaque"];
    };
    gNos.append("rect").attr("x", (d) => d.x0 - 3).attr("y", (d) => d.y0).attr("width", (d) => d.x1 - d.x0 + 6).attr("height", (d) => Math.max(6, d.y1 - d.y0)).attr("fill", "transparent");
    gNos.append("rect").attr("x", (d) => d.x0).attr("y", (d) => d.y0).attr("width", (d) => d.x1 - d.x0).attr("height", (d) => Math.max(1, d.y1 - d.y0)).attr("fill", (d) => o.cor(d.g));
    const ligado = (d) => Object.assign((x) => (x.source.etapa === d.etapa && x.source.g === d.g) || (x.target.etapa === d.etapa && x.target.g === d.g), { foco: { g: d.g, etapa: d.etapa } });
    gNos.style("cursor", "pointer")
      .on("pointerenter", (ev, d) => { if (!fixo) destacar(ligado(d)); })
      .on("pointermove", (ev, d) => Lab.mostrarDica(ev, `${o.nome(d.g)} · ${o.etapas[d.etapa]}`, resumoNo(d)))
      .on("pointerleave", () => { Lab.esconderDica(); if (!fixo) destacar(null); })
      .on("click", (ev, d) => fixar(`n|${d.etapa}|${d.g}`, ligado(d), { titulo: `${o.nome(d.g)} · ${o.etapas[d.etapa]}`, filtro: (s) => s[d.etapa] === d.g }));
    // rótulo = parte da coluna e número de unidades (a categoria é identificada pela cor e pela legenda)
    const contar = o.contagem || (() => 1);
    const nNo = d3.rollup(seqs.flatMap(([id, sq]) => sq.map((g, i) => [`${i}|${g}`, contar(id)])), (v) => d3.sum(v, (x) => x[1]), (x) => x[0]);
    const rotNo = (d) => `${Math.round(pctNo(d))}% (${Lab.fmtInt.format(nNo.get(`${d.etapa}|${d.g}`) || 0)})`;
    const meio = (d) => d.etapa > 0 && d.etapa < ult;
    if (vert) {   // rótulos acima da primeira linha e abaixo da última; no meio, ao lado do nó
      gNos.append("text").attr("x", (d) => (meio(d) ? d.x1 + 4 : (d.x0 + d.x1) / 2)).attr("y", (d) => (d.etapa === 0 ? d.y0 - 6 : d.etapa === ult ? d.y1 + 14 : (d.y0 + d.y1) / 2))
        .attr("dy", (d) => (meio(d) ? "0.35em" : 0)).attr("text-anchor", (d) => (meio(d) ? "start" : "middle")).style("font-size", "11px").style("font-weight", 600)
        .style("fill", Lab.token("cor-texto")).text((d) => (d.x1 - d.x0 >= 46 ? rotNo(d) : d.x1 - d.x0 >= 26 ? `${Math.round(pctNo(d))}%` : ""));
    } else
    gNos.filter((d) => !meio(d)).append("text").attr("x", (d) => (d.etapa === ult ? d.x1 + 6 : d.x0 - 8)).attr("y", (d) => (d.y0 + d.y1) / 2).attr("dy", "0.35em")
      .attr("text-anchor", (d) => (d.etapa === ult ? "start" : "end")).style("font-weight", 600).style("fill", Lab.token("cor-texto"))
      .text((d) => (d.y1 - d.y0 >= 9 ? rotNo(d) : ""));
    if (!vert) gNos.filter(meio).append("text").attr("x", (d) => d.x1 + 5).attr("y", (d) => (d.y0 + d.y1) / 2).attr("dy", "0.35em").style("font-size", "11px").style("font-weight", 600)
      .text((d) => (d.y1 - d.y0 >= 12 ? rotNo(d) : ""));

    // destaque: passar o mouse mostra; clicar fixa (para leitura ou print); "Limpar", novo clique ou Esc desfazem
    let fixo = null, alvoLista = null;
    const limpar = el("button", { class: "voltar", type: "button", text: "Limpar destaque", onclick: () => fixar(null) });
    const verLista = el("button", { class: "voltar", type: "button", "aria-expanded": "false", onclick: () => alternarLista() });
    const caixaLista = el("div", { class: "caixa-lista" });
    limpar.hidden = verLista.hidden = caixaLista.hidden = true;
    const itensDe = (filtro) => seqs.filter(([, s]) => filtro(s)).map(([m]) => o.nomeItem(m)).sort((a, b) => a.localeCompare(b));
    function alternarLista(fechar = false) {
      const abrir = !fechar && caixaLista.hidden && alvoLista;
      caixaLista.hidden = !abrir;
      verLista.setAttribute("aria-expanded", String(Boolean(abrir)));
      if (abrir) {
        const ms = itensDe(alvoLista.filtro);
        caixaLista.replaceChildren(el("div", { class: "nota", text: `${alvoLista.titulo}: ${ms.length} ${o.nomeUnidades || "unidades"}` }),
          el("ul", { class: "lista-mun" }, ...ms.map((n) => el("li", { text: n }))));
      }
      verLista.textContent = abrir ? "Fechar lista" : `Ver lista (${alvoLista ? itensDe(alvoLista.filtro).length : 0})`;
    }
    // distribuição de uma categoria destacada (dica ao passar o mouse; card ao fixar)
    const fmtV = o.formatoValor || ((v) => Lab.fmtInt.format(Math.round(v)));
    function distribuicao(g, etapa) {
      const blocos = [];
      const porEtapa = (lista, papel) => d3.groups(lista, (l) => (papel === "saida" ? l.source.etapa : l.target.etapa)).sort((a, b) => a[0] - b[0]).forEach(([e, ls]) => {
        const tot = d3.sum(ls, (l) => l.value);
        const titulo = papel === "saida" ? (nE > 2 ? `De ${o.etapas[e]} para ${o.etapas[e + 1]}` : "Para onde vai") : (nE > 2 ? `De ${o.etapas[e - 1]} para ${o.etapas[e]}` : "De onde vem");
        blocos.push({ titulo: `${titulo} (${fmtV(tot)})`, linhas: [...ls].sort((a, b) => b.value - a.value)
          .map((l) => `${papel === "saida" ? "→" : "←"} ${o.nome(papel === "saida" ? l.target.g : l.source.g)}: ${fmtV(l.value)} (${(100 * l.value) / tot < 0.05 ? "<0,1%" : Lab.fmtPct((100 * l.value) / tot)})`) });
      });
      porEtapa(grafo.links.filter((l) => l.source.g === g && (etapa === undefined || l.source.etapa === etapa)), "saida");
      // chegadas: no nó do meio ou do fim; pela legenda, só com dois lados (com 3+ etapas a lista ficaria longa demais)
      if (etapa !== undefined || nE === 2) porEtapa(grafo.links.filter((l) => l.target.g === g && (etapa === undefined || l.target.etapa === etapa)), "chegada");
      return blocos;
    }
    const linhasDist = (blocos) => blocos.flatMap((b) => [b.titulo, ...b.linhas]);
    const painel = el("div", { class: "painel-sel painel-sankey", "aria-live": "polite" });
    painel.hidden = true;
    function mostrarCard(foco, link) {
      if (!foco && !link) { painel.hidden = true; return; }
      const titulo = foco ? `${o.nome(foco.g)}${foco.etapa !== undefined ? ` · ${o.etapas[foco.etapa]}` : ""}` : `${o.nome(link.source.g)} → ${o.nome(link.target.g)}`;
      const corpo = foco ? distribuicao(foco.g, foco.etapa).map((b) => el("div", { class: "bloco-dist" }, el("strong", { text: b.titulo }), ...b.linhas.map((l) => el("span", { text: l }))))
        : [el("div", { class: "bloco-dist" }, ...o.dicaFluxo(link.f).filter(Boolean).map((l) => el("span", { text: l })))];
      painel.replaceChildren(el("b", { text: titulo }), ...corpo, el("div", { class: "acoes-sel" }, limpar, o.semLista ? null : verLista));
      painel.hidden = false;
    }
    function destacar(pred) {
      svg.selectAll("path.fluxo").classed("realce", (x) => Boolean(pred && pred(x))).classed("apagado", (x) => Boolean(pred && !pred(x)));
    }
    function fixar(chave, pred, lista) {
      fixo = chave && chave !== fixo ? chave : null;
      alvoLista = fixo ? lista : null;
      destacar(fixo ? pred : null);
      limpar.hidden = !fixo;
      verLista.hidden = !fixo || Boolean(o.semLista);
      mostrarCard(fixo ? pred.foco : null, fixo && !pred.foco ? pred.link : null);
      alternarLista(true);
      Lab.esconderDica();
    }
    // legenda interativa: cada item destaca (passar o mouse / foco) ou fixa (clique, Enter) os fluxos da sua categoria
    const tocaCat = (g) => Object.assign((x) => x.source.g === g || x.target.g === g, { foco: { g } });
    legendas.flatMap((lg) => [...lg.querySelectorAll(".chave")]).forEach((item) => {
      const g = item.dataset.cat;
      item.setAttribute("tabindex", "0"); item.setAttribute("role", "button");
      item.setAttribute("aria-label", `Destacar os fluxos de ${o.nome(g)}`);
      item.addEventListener("pointerenter", () => { if (!fixo) destacar(tocaCat(g)); });
      item.addEventListener("pointerleave", () => { if (!fixo) destacar(null); Lab.esconderDica(); });
      item.addEventListener("pointermove", (ev) => { if (!fixo) Lab.mostrarDica(ev, o.nome(g), [...linhasDist(distribuicao(g)), "clique para fixar"]); });
      item.addEventListener("focus", () => { if (!fixo) destacar(tocaCat(g)); });
      item.addEventListener("blur", () => { if (!fixo) destacar(null); });
      const fixarCat = () => { Lab.esconderDica(); fixar(`c|${g}`, tocaCat(g), { titulo: o.nome(g), filtro: (s) => s.includes(g) }); };
      item.addEventListener("click", fixarCat);
      item.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fixarCat(); } });
    });
    if (escAtual) removeEventListener("keydown", escAtual);
    escAtual = (ev) => { if (ev.key === "Escape" && fixo) fixar(null); };
    addEventListener("keydown", escAtual);
    alvo.append(painel);                          // card da distribuição fixada, logo abaixo do desenho (como no mapa)
    if (legendas[1]) alvo.append(legendas[1]);   // legenda do último lado, abaixo do diagrama
    alvo.append(o.nota ? el("p", { class: "nota", text: o.nota }) : "", caixaLista);
  };
})();

/* ==== web/componentes/lab-metodologia.js ==== */
/* lab-metodologia.js — bloco "Fontes de Dados, Metodologia e Códigos", padrão de todos os produtos (ADR L0003).
 * Modelo: README do Agregador de Pesquisas (O POVO/DATADOC). O conteúdo vem pronto do Python
 * (labdados.metodologia.montar): textos do produto (src/metodologia.yaml) + partes automáticas
 * (fontes com datas e hashes do manifesto, ADRs, trechos de código, conferência de qualidade, versão).
 *
 * Lab.blocoMetodologia(m, { baixar: { rotulo, acao }, linkAutor: { href, texto } })
 * Lab.rodapePagina(m, opts) → bloco + assinatura final (preenche o <footer id="rodape">).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Diagrama de fluxo dos dados (pesquisador, 2026-10-12; vale para os exploratórios): bases que entram → operações
   *  (cruzamentos, filtros, agrupamentos…) → saídas do produto. Declarado em src/metodologia.yaml › fluxo:
   *    entradas: [{id, rotulo, nota?, restrita?}] · operacoes: [{id, rotulo, tipo, de: [ids], nota?}] · saidas: [{id, rotulo, de, link?, nota?}]
   *    transversais: [{id, rotulo, tipo, nota?, exceto?: [ids de saídas]}] — operações que valem para todas as saídas (ex.:
   *    supressão de 1 a 4): ficam numa faixa à parte, sob o diagrama, sem uma ligação para cada saída; passar o mouse na
   *    faixa acende as saídas a que ela se aplica (pesquisador, 2026-10-14).
   *  Colunas por profundidade (uma operação que parte de outra vai para a coluna seguinte); ligações em SVG redesenhadas a
   *  cada mudança de tamanho. Passar o mouse (ou focar) num nó acende o caminho dele — de onde vem e para onde vai. No
   *  celular, uma coluna só, e cada nó diz de onde vem ("← …"). */
  const TIPOS_FLUXO = { base: "base", cruzamento: "⨝ cruzamento", filtro: "⧩ filtro", agrupamento: "Σ agrupamento", derivacao: "ƒ derivação",
    conferencia: "✓ conferência", supressao: "▦ supressão", saida: "saída" };
  Lab.diagramaFluxo = (f) => {
    const nos = new Map();
    const add = (n, papel) => nos.set(n.id, { ...n, papel, de: [].concat(n.de || []) });
    (f.entradas || []).forEach((n) => add(n, "entrada"));
    (f.operacoes || []).forEach((n) => add(n, "operacao"));
    (f.saidas || []).forEach((n) => add(n, "saida"));
    const prof = new Map();
    const nivel = (id, pilha = new Set()) => {
      if (prof.has(id)) return prof.get(id);
      const n = nos.get(id);
      if (!n || pilha.has(id)) return 0;
      pilha.add(id);
      const v = n.papel === "entrada" ? 0 : 1 + Math.max(0, ...n.de.map((d) => nivel(d, pilha)));
      prof.set(id, v);
      return v;
    };
    [...nos.keys()].forEach((id) => nivel(id));
    // três faixas: bases | operações (uma coluna, na ordem do caminho — profundidade, depois a ordem declarada) | saídas
    const ordemDecl = [...nos.keys()];
    const faixa = (papel) => [...nos.values()].filter((n) => n.papel === papel).sort((a, b) => (papel === "operacao" ? prof.get(a.id) - prof.get(b.id) : 0) || ordemDecl.indexOf(a.id) - ordemDecl.indexOf(b.id));
    const colunas = [["Bases que entram", faixa("entrada")], ["Operações", faixa("operacao")], ["Saídas", faixa("saida")]];
    const cor = { entrada: Lab.token("cor-cat-1"), operacao: Lab.token("cor-cat-3"), saida: Lab.token("cor-cat-2") };
    const caixa = el("div", { class: "fluxo", role: "group", "aria-label": "Fluxo dos dados: bases, operações e saídas" });
    const els = new Map();
    for (const [k, [titulo, col]] of colunas.entries()) {
      caixa.append(el("div", { class: `fluxo-col fluxo-col-${k}` }, el("h4", { text: titulo }), ...col.map((n) => {
        const tipo = n.papel === "entrada" ? "base" : n.papel === "saida" ? "saida" : n.tipo || "derivacao";
        const nomeDe = n.de.map((d) => nos.get(d)?.rotulo || d).join(", ");
        const no = el("div", { class: `fluxo-no${n.restrita ? " restrita" : ""}`, tabindex: "0", "data-id": n.id,
          "aria-label": `${n.rotulo}${nomeDe ? `, a partir de: ${nomeDe}` : ""}${n.nota ? `. ${n.nota}` : ""}` },
          el("span", { class: "tipo", text: TIPOS_FLUXO[tipo] || tipo }),
          n.link ? el("b", {}, el("a", { href: n.link, text: n.rotulo })) : el("b", { text: n.rotulo }),
          n.nota ? el("span", { class: "nota", text: n.nota }) : null,
          nomeDe ? el("span", { class: "de", text: `← ${nomeDe}` }) : null);
        no.style.setProperty("--cor-fluxo", cor[n.papel]);
        els.set(n.id, no);
        return no;
      })));
    }
    const svg = d3.select(caixa).append("svg").attr("aria-hidden", "true");
    const arestas = [...nos.values()].flatMap((n) => n.de.filter((d) => nos.has(d)).map((d) => ({ de: d, para: n.id })));
    const desenhar = () => {
      const r0 = caixa.getBoundingClientRect();
      if (!r0.width) return;
      const ops = faixa("operacao").map((n) => n.id);
      svg.selectAll("path").data(arestas).join("path").attr("d", (a) => {
        const A = els.get(a.de).getBoundingClientRect(), B = els.get(a.para).getBoundingClientRect();
        const y1 = A.top + A.height / 2 - r0.top, y2 = B.top + B.height / 2 - r0.top;
        if (nos.get(a.de).papel === "operacao" && nos.get(a.para).papel === "operacao") {   // dentro da coluna: arco pela margem esquerda
          const x1 = A.left - r0.left, x2 = B.left - r0.left, g = 10 + 5 * Math.min(4, Math.abs(ops.indexOf(a.para) - ops.indexOf(a.de)) - 1);
          return `M${x1},${y1}C${x1 - g},${y1} ${x2 - g},${y2} ${x2},${y2}`;
        }
        const x1 = A.right - r0.left, x2 = B.left - r0.left, m = (x1 + x2) / 2;
        return `M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}`;
      });
    };
    new ResizeObserver(desenhar).observe(caixa);
    // operações transversais: faixa à parte, aplicada a todas as saídas (menos as de `exceto`)
    const transv = (f.transversais || []).map((t) => {
      const exceto = new Set(t.exceto || []), alvo = faixa("saida").filter((n) => !exceto.has(n.id)).map((n) => n.id);
      const nomesExc = [...exceto].map((id) => nos.get(id)?.rotulo || id);
      const no = el("div", { class: "fluxo-no fluxo-transversal", tabindex: "0", "data-id": t.id,
        "aria-label": `${t.rotulo}: vale para todas as saídas${nomesExc.length ? `, exceto ${nomesExc.join(", ")}` : ""}${t.nota ? `. ${t.nota}` : ""}` },
        el("span", { class: "tipo", text: `${TIPOS_FLUXO[t.tipo] || t.tipo || "operação"} · transversal` }), el("b", { text: t.rotulo }),
        t.nota ? el("span", { class: "nota", text: t.nota }) : null,
        el("span", { class: "nota alcance", text: `Vale para todas as saídas${nomesExc.length ? `, exceto: ${nomesExc.join(", ")}` : ""}.` }));
      no.style.setProperty("--cor-fluxo", cor.operacao);
      return { t, no, alvo };
    });
    const faixaT = transv.length ? el("div", { class: "fluxo-transversais" }, el("h4", { text: "Operações transversais" }), ...transv.map((x) => x.no)) : null;
    const focarT = (x) => {
      caixa.classList.toggle("focado", !!x);
      const lig = new Set(x ? x.alvo : []);
      for (const [k, no] of els) no.classList.toggle("ligado", lig.has(k));
      svg.selectAll("path").classed("ligado", false);
      for (const y of transv) y.no.classList.toggle("ligado", y === x);
    };
    for (const x of transv) {
      x.no.addEventListener("pointerenter", () => focarT(x)); x.no.addEventListener("pointerleave", () => focarT(null));
      x.no.addEventListener("focus", () => focarT(x)); x.no.addEventListener("blur", () => focarT(null));
    }
    // caminho de um nó: ancestrais e descendentes
    const sobe = (id, s = new Set()) => { for (const a of arestas) if (a.para === id && !s.has(a.de)) { s.add(a.de); sobe(a.de, s); } return s; };
    const desce = (id, s = new Set()) => { for (const a of arestas) if (a.de === id && !s.has(a.para)) { s.add(a.para); desce(a.para, s); } return s; };
    const focar = (id) => {
      caixa.classList.toggle("focado", !!id);
      const lig = id ? new Set([id, ...sobe(id), ...desce(id)]) : new Set();
      for (const [k, no] of els) no.classList.toggle("ligado", lig.has(k));
      svg.selectAll("path").classed("ligado", (a) => lig.has(a.de) && lig.has(a.para));
      // a faixa transversal acende junto quando o caminho chega a uma saída a que ela se aplica
      for (const x of transv) x.no.classList.toggle("ligado", !!id && x.alvo.some((s) => lig.has(s)));
    };
    for (const [k, no] of els) {
      no.addEventListener("pointerenter", () => focar(k)); no.addEventListener("pointerleave", () => focar(null));
      no.addEventListener("focus", () => focar(k)); no.addEventListener("blur", () => focar(null));
    }
    caixa.classList.toggle("com-transversais", !!faixaT);
    return faixaT ? el("div", { class: "fluxo-envelope" }, caixa, faixaT) : caixa;
  };

  /** Seções do bloco (o mesmo conteúdo no fim da página ou em camadas na folha ✎ Notas e fontes — L0014). */
  const secoesMetodologia = (m, { baixar = null, linkAutor = null, endereco = null } = {}, secao) => {
    const fontes = el("div", { class: "rolagem" }, Lab.tabela(["Base", "Órgão", "Arquivos (gerado na fonte · baixado em · hash)", "Link"],
      m.fontes.map((f) => [
        [el("code", { text: f.id }), el("div", { class: "nota", text: f.descricao })],
        f.orgao,
        [el("ul", { class: "arquivos" }, ...f.arquivos.map((a) => el("li", {}, el("code", { text: a.arquivo }),
          ` · ${a.gerado_na_fonte ? a.gerado_na_fonte.replace(/ \d\d:\d\d:\d\d GMT$/, "") : "—"} · ${a.baixado_em || "—"} · ${a.sha256 || "—"}`)))],
        f.url ? [el("a", { href: f.url, target: "_blank", rel: "noopener", text: "página oficial ↗" })] : "—"])));
    const passos = el("ol", { class: "passos" }, ...m.passos.map((p) => el("li", {},
      el("b", { text: p.titulo }), el("p", { text: p.texto }),
      p.adrs ? el("div", { class: "nota" }, "Decisões: ", ...p.adrs.flatMap((id, k) => [k ? ", " : "", el("a", { href: `#adr-${id}`, text: id })])) : null,
      p.trecho ? el("details", { class: "codigo" }, el("summary", {}, "Ver código"), el("pre", {}, el("code", { text: p.trecho }))) : null)));
    const q = m.qualidade || {};
    const adrs = el("ul", { class: "adrs" }, ...m.adrs.map((a) => el("li", { id: `adr-${a.id}` },
      el("b", { text: `${a.id} — ${a.titulo}` }), el("span", { class: "nota", text: ` (${a.status})` }), el("div", { text: a.decisao }),
      el("div", { class: "nota" }, "No repositório: ", el("code", { text: a.arquivo })))));
    // sem a lista de códigos no metodologia.yaml, a seção some (antes, m.codigos ausente quebrava a folha inteira — 2026-10-16)
    const codigos = m.codigos?.length ? el("div", { class: "rolagem" }, Lab.tabela(["Arquivo", "O que faz"], m.codigos.map((c) => [[el("code", { text: c.arquivo })], c.papel]))) : null;
    const v = m.versao;
    const citar = `${m.citacao || ""} Disponível em: ${endereco || location.href.split("#")[0]}. Acesso em: ${new Date().toLocaleDateString("pt-BR")}.`.trim();
    return [
        secao("Sobre este produto", el("p", { text: m.apresentacao })),
        m.fluxo ? secao("Fluxo dos dados", el("p", { class: "nota", text: "Das bases oficiais às saídas desta página: passe o mouse (ou toque) num item para ver de onde ele vem e para onde vai." }), Lab.diagramaFluxo(m.fluxo)) : null,
        secao("Fontes de dados", fontes,
          el("p", { class: "nota", text: "Datas de geração informadas pela própria fonte; o hash identifica a versão exata de cada arquivo usado." }),
          baixar ? el("button", { type: "button", class: "voltar", text: baixar.rotulo, onclick: baixar.acao }) : null),
        secao("Passo a passo da metodologia", passos),
        q.colunas ? secao("Conferência de qualidade", el("p", { text: `Situação: ${m.status_qualidade}. ${q.texto || ""}` }),
          el("div", { class: "rolagem" }, Lab.tabela(q.colunas, q.linhas))) : null,
        secao("Decisões metodológicas", adrs),
        !codigos ? null : secao("Principais códigos", codigos, el("p", { class: "nota", text: "Os códigos estão no repositório do laboratório; o pacote reprodutível deste produto (dados, códigos e decisões) é gerado com ferramentas/exportar.py." })),
        m.limitacoes?.length ? secao("Limitações", el("ul", {}, ...m.limitacoes.map((t) => el("li", { text: t })))) : null,
        m.perguntas?.length ? secao("Perguntas frequentes", ...m.perguntas.map((p) => el("details", { class: "pergunta" }, el("summary", { text: p.p }), el("p", { text: p.r })))) : null,
        secao("Autoria, uso de IA e licença",
          el("p", {}, m.sobre, " ", linkAutor ? el("a", { href: linkAutor.href, target: "_blank", rel: "noopener", text: linkAutor.texto }) : null),
          el("p", {}, el("b", { text: "Uso de IA: " }), m.uso_de_ia),
          el("p", {}, el("b", { text: "Licença: " }), m.licenca),
          el("p", {}, el("b", { text: "Versão: " }), `${v.numero ? `${v.numero}${v.data_versao ? ` (${new Date(v.data_versao + "T12:00").toLocaleDateString("pt-BR")})` : ""} · ` : ""}${v.status_produto}, dados gerados em ${new Date(v.gerado_em).toLocaleString("pt-BR")}`,
            v.commit ? ` · código no commit ${v.commit}${v.alteracoes_nao_commitadas ? " (com alterações ainda não registradas)" : ""}` : ""),
          el("p", {}, el("b", { text: "Como citar: " }), citar))].filter(Boolean);
  };

  Lab.blocoMetodologia = (m, opts = {}) => {
    const secao = (titulo, ...filhos) => el("section", { class: "met-secao" }, el("h3", { text: titulo }), ...filhos);
    return el("details", { class: "metodologia", id: Lab.cfg.ancoraMetodologia },
      el("summary", {}, el("span", { class: "met-titulo", text: "Fontes de Dados, Metodologia e Códigos" }),
        el("span", { class: "met-sub", text: "bases oficiais, passo a passo, códigos e decisões" })),
      el("div", { class: "met-corpo" }, ...secoesMetodologia(m, opts, secao)));
  };

  /** O bloco em camadas, para a folha ✎ Notas e fontes de Visualizações e stories (L0014): cada seção recolhida; os
   *  links para as decisões abrem a seção e rolam até o ADR dentro da folha (sem mexer no endereço da página). */
  Lab.metodologiaEmCamadas = (m, opts = {}) => {
    const secao = (titulo, ...filhos) => el("details", { class: "met-camada" }, el("summary", { text: titulo }), el("div", { class: "met-corpo-camada" }, ...filhos));
    const caixa = el("div", { class: "met-camadas" }, ...secoesMetodologia(m, opts, secao));
    caixa.addEventListener("click", (ev) => {
      const a = ev.target.closest('a[href^="#adr-"]');
      if (!a) return;
      ev.preventDefault();
      const alvo = caixa.querySelector(a.getAttribute("href"));
      if (!alvo) return;
      alvo.closest("details.met-camada").open = true;
      alvo.scrollIntoView({ block: "nearest", behavior: Lab.semMovimento() ? "auto" : "smooth" });
    });
    return caixa;
  };

  /** Rodapé da página: bloco de metodologia + assinatura com link para a página do autor. */
  Lab.rodapePagina = (m, { baixar = null, linkAutor = null } = {}) => {
    const rodape = document.getElementById(Lab.cfg.ancoraRodape);
    rodape.replaceChildren(Lab.blocoMetodologia(m, { baixar, linkAutor }),
      el("p", { class: "assinatura-final" }, `Análise e visualização: ${Lab.cfg.autor}`,
        linkAutor ? " · " : null, linkAutor ? el("a", { href: linkAutor.href, target: "_blank", rel: "noopener", text: linkAutor.rotuloCurto || linkAutor.texto }) : null));
    // só o link interno ("Fontes, métodos e códigos ↓") leva à metodologia; o nome do autor abre o portfólio em nova aba
    // o mesmo para o item do menu do topo marcado com data-metodologia (exploratórios; pesquisador, 2026-10-12)
    for (const a of document.querySelectorAll('.assinatura a[href^="#"], a[data-metodologia]')) a.addEventListener("click", Lab.irRodape);
  };
})();

<script>

/* app.js — story "Wellington Dantas: o voto em Picos, 2012–2024" (roteiro v2, validado em 2026-11-10).
 * Página própria em cartões (decisão do pesquisador): celular = tela cheia com deslizar; tela larga = slide 16:9.
 * Textos e números chegam prontos da base Python (src/preparar_story.py ← base do exploratório, conferida com o TSE);

(async function () {
  "use strict";
  const { el, fmtInt, fmtPct } = Lab;
  const app = document.getElementById("app");
  const base = await Lab.decodificar(document.getElementById("dados").textContent.trim());
  Lab.configurar({ raiz: app, autor: "Alexandre Ribeiro Cajazeira Ramos", orgaos: { tse: "TSE", ibge: "IBGE" }, artigos: { TSE: "do TSE" } });

  const C = base.cartoes;
  const ANOS = base.meta.anos.map(String);
  const L = base.lugares, G = base.grupos;
  const porId = Object.fromEntries(L.map((lg) => [lg.id, lg]));
  const bairroDe = Object.fromEntries(G.filter((g) => g.tipo === "bairro").map((g) => [g.id, g]));
  const idBairro = Object.fromEntries(G.filter((g) => g.tipo === "bairro").map((g) => [g.nome, g.id]));
  const NOME = base.meta.candidatura.nome;
  const COR = "#d73027";
  const CORTES = [1, 3, 5, 10, 20];
  const CORES = ["#fde0dc", "#f8b4a9", "#ef8573", "#dc5440", "#bb2b1c", "#86140d"];
  const ROT = ["< 1%", "1–3%", "3–5%", "5–10%", "10–20%", "≥ 20%"];
  const cor = (v) => (v === null || v === undefined ? null : CORES[d3.bisectRight(CORTES, v)]);
  const tok = Lab.token;

  // ---------------------------------------------------------------- estado no endereço
  const est = { cartao: C[0].id, forma: "pontos", fundo: "ruas", bairros: "", modo: "" };
  try { const p = new URLSearchParams(location.hash.slice(1)); for (const k of Object.keys(est)) if (p.has(k)) est[k] = p.get(k); } catch (e) { /* padrão */ }
  let i = Math.max(0, C.findIndex((c) => c.id === est.cartao));
  if (!["pontos", "bairros"].includes(est.forma)) est.forma = "pontos";
  const gravar = () => history.replaceState(null, "", `#${new URLSearchParams({ cartao: C[i].id, forma: est.forma, fundo: est.fundo, ...(est.bairros ? { bairros: est.bairros } : {}), ...(est.modo ? { modo: est.modo } : {}) })}`);
  // cartão dos bairros (pesquisador, 2026-11-10): todos os bairros com voto, a zona rural e os povoados podem entrar no
  // gráfico pelo Explorar; abre com os sete maiores de 2024. Até 8 linhas por vez (as 8 cores categóricas, sem repetir);
  // cada bairro guarda a cor enquanto estiver marcado (a cor segue o bairro, não a posição)

    .sort((a, b) => (b.anos["2024"]?.votos ?? -1) - (a.anos["2024"]?.votos ?? -1));

    return ids.slice(0, MAX_LINHAS);

  const FUNDOS = {

    osm: { rotulo: "OpenStreetMap", camadas: [(z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`], atrib: "© colaboradores do OpenStreetMap", soPublicado: true },

  // ---------------------------------------------------------------- moldura (padrão dos stories do laboratório: lab-viz)
  // progresso no topo; embaixo, a navegação e a barra de base: ⓘ Como ler · ✎ Notas e fontes · ⇄ Explorar (mapas) ·
  // ↗ Baixar ou Compartilhar, com autoria e fonte sempre visíveis; as folhas sobem de baixo (L0014, Q-098)
  const progresso = el("div", { class: "progresso", role: "tablist", "aria-label": "Cartões" });
  C.forEach((c, k) => progresso.append(el("button", { type: "button", "aria-label": `Cartão ${k + 1}: ${c.titulo}`, onclick: () => ir(k) })));
  const folha = el("div", { class: "viz-folha", role: "dialog", "aria-modal": "false", hidden: "" });
  const fecharFolha = () => { folha.hidden = true; folha.replaceChildren(); };
  const abrirFolha = (titulo, ...conteudo) => {
    folha.replaceChildren(el("div", { class: "alca", "aria-hidden": "true" }),
      el("div", { class: "cab" }, el("h4", { text: titulo }), el("button", { type: "button", "aria-label": "Fechar", text: "✕", onclick: fecharFolha })), ...conteudo.filter(Boolean));
    folha.hidden = false;
    folha.querySelector(".cab button").focus();

  function comoLer() {
    const c = C[i], dados = dadosCartao(c);
    abrirFolha("Como ler", el("p", { text: COMO_LER[c.palco.grafico] || "Use as setas ou deslize para o lado para passar de cartão. O botão ✎ Notas e fontes traz a metodologia inteira." }),
      dados ? el("div", { class: "tabela-alt" }, Lab.tabela(dados.cab, dados.linhas.map((l) => l.map((x) => (typeof x === "number" ? (Number.isInteger(x) ? fmtInt.format(x) : x.toLocaleString("pt-BR", { maximumFractionDigits: 1 })) : String(x ?? "—")))))) : null);
  }
  /** Linhas de dados do cartão (tabela do Como ler e CSV): as mesmas que o gráfico desenha. */
  function dadosCartao(c) {
    const g = c.palco.grafico, ano = String(c.palco.eleicao || "2024");
    if (g === "mapa" || g === "mapa_rural") {
      const ls = L.filter((lg) => lg.anos[ano] && (g === "mapa_rural" ? lg.area === "rural" : !c.palco.destaque || lg.bairro === idBairro[c.palco.destaque]))
        .sort((a, b) => b.anos[ano].votos - a.anos[ano].votos);
      return { cab: ["Local de votação", "Área", `Votos ${ano}`, `% dos válidos ${ano}`], linhas: ls.map((lg) => [lg.nome, lg.area === "bairro" ? lg.bairro_nome : lg.area === "rural" ? "Zona rural" : "Fora dos bairros", lg.anos[ano].votos, lg.anos[ano].pct]) };
    }
    if (g === "linha") return { cab: ["Eleição", `Votos de ${NOME}`, "% dos válidos", "Mediana dos outros eleitos"], linhas: base.trajetoria.map((t) => [String(t.ano), t.votos, t.pct, Math.round(base.mediana[String(t.ano)])]) };
    if (g === "bairros") return { cab: ["Bairro", ...ANOS], linhas: OPCOES_BAIRRO.map((b) => [nomeGrupo(b), ...ANOS.map((a) => b.anos[a]?.votos ?? null)]) };   // todos, não só os marcados
    if (g === "saldo") return { cab: ["Bairro", "Votos 2020", "Votos 2024", "Saldo"], linhas: base.saldo.map((x) => [x.nome, x.antes, x.depois, x.dv]) };
    if (g === "concentracao") return { cab: ["Eleição", "% dos votos nos 5 locais mais fortes", "Locais com voto"], linhas: base.concentracao.map((x) => [x.ano, x.top5, x.locais_com_voto]) };
    return null;
  }
  function baixarCSV(c) {
    const d = dadosCartao(c);
    const txt = "\ufeff" + [d.cab, ...d.linhas].map((l) => l.map((x) => (typeof x === "number" ? String(x).replace(".", ",") : `"${String(x ?? "").replaceAll('"', '""')}"`)).join(";")).join("\n");
    const a = el("a", { href: URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })), download: `wellington-dantas-${c.id}.csv` });
    document.body.append(a); a.click(); a.remove();
  }
  function compartilhar() {
    const c = C[i], url = `${location.href.split("#")[0].split("?")[0]}#cartao=${c.id}`, titulo = base.meta.titulo;
    const img = `imagens/cartao-${String(i + 1).padStart(2, "0")}-${c.id}.png`;
    const bLink = el("button", { type: "button" }, el("span", { class: "ic", text: "🔗" }), el("span", { text: "Copiar link (deste cartão)" }));
    bLink.onclick = async () => { try { await navigator.clipboard.writeText(url); bLink.lastChild.textContent = "Link copiado"; } catch (e) { prompt("Copie o link:", url); } };
    const bEnviar = el("button", { type: "button", hidden: "" }, el("span", { class: "ic", text: "↗" }), "Enviar a imagem deste cartão");
    // celular com Web Share de arquivos: envia a imagem pronta (9:16) direto para o WhatsApp e outros apps
    if (navigator.canShare && location.protocol !== "file:") fetch(img).then((r) => (r.ok ? r.blob() : null)).then((b) => {
      if (!b) return;
      const arq = new File([b], img.split("/").pop(), { type: "image/png" });
      if (navigator.canShare({ files: [arq] })) { bEnviar.hidden = false; bEnviar.onclick = () => navigator.share({ files: [arq], title: titulo, text: url }).catch(() => {}); }
    }).catch(() => {});
    abrirFolha("Baixar ou Compartilhar", el("div", { class: "opcoes-comp" }, bLink,
      el("a", { href: `https://wa.me/?text=${encodeURIComponent(`${titulo} ${url}`)}`, target: "_blank", rel: "noopener" }, el("span", { class: "ic", text: "💬" }), "WhatsApp"),
      el("a", { href: `mailto:?subject=${encodeURIComponent(titulo)}&body=${encodeURIComponent(`${titulo}\n${url}`)}` }, el("span", { class: "ic", text: "✉" }), "E-mail"),
      bEnviar,
      el("a", { href: img, download: img.split("/").pop() }, el("span", { class: "ic", text: "⤓" }), "Baixar imagem deste cartão (9:16)"),
      dadosCartao(c) ? el("button", { type: "button", onclick: () => baixarCSV(c) }, el("span", { class: "ic", text: "▦" }), "Baixar dados do cartão (CSV)") : null));
  }
  function dicaLocal(ev, lg, ano) {
    const v = lg.anos[ano];
    Lab.mostrarDica(ev, lg.nome, [lg.area === "bairro" ? lg.bairro_nome : lg.area === "rural" ? "Zona rural" : "Fora dos bairros do IBGE",
      v ? `${ano}: ${fmtInt.format(v.votos)} votos · ${fmtPct(v.pct)} dos válidos` : `${ano}: não funcionou`,
      ANOS.map((a) => `${a}: ${lg.anos[a] ? fmtInt.format(lg.anos[a].votos) : "—"}`).join(" · ")]);
  }
  function dicaBairro(ev, b, ano) {
    if (!b) return;
    const v = b.anos[ano];
    Lab.mostrarDica(ev, b.nome, [v ? `${ano}: ${fmtInt.format(v.votos)} votos · ${fmtPct(v.pct)} dos válidos · ${fmtPct(v.peso)} do total dele` : "sem local de votação",
      ANOS.map((a) => `${a}: ${b.anos[a] ? fmtInt.format(b.anos[a].votos) : "—"}`).join(" · ")]);
  }

  // ---------------------------------------------------------------- gráficos
  const largura = (fig) => Math.max(280, Math.min(640, fig.clientWidth));
  function linha(fig) {
    const T = base.trajetoria;
    Lab.linhasPontas(fig, { pontas: ANOS, largura: largura(fig), legenda: true, fmt: (v) => fmtInt.format(Math.round(v)),
      aria: `Votos de ${NOME} e mediana dos outros eleitos, por eleição`,
      series: [{ cor: COR, rotulo: NOME, valores: T.map((t) => t.votos), dicas: T.map((t) => [`${t.ano}`, [`${fmtInt.format(t.votos)} votos · ${fmtPct(t.pct)} dos válidos`, `${t.posicao}º de ${t.candidaturas}`]]) },
        { cor: tok("cor-cat-1"), tracejado: true, rotulo: "Mediana dos eleitos", valores: ANOS.map((a) => base.mediana[a]),
          dicas: ANOS.map((a) => [`${a}`, [`Mediana: ${fmtInt.format(Math.round(base.mediana[a]))} votos`, `entre os ${base.n_mediana[a]} outros eleitos`]]) }] });
  }
  function bairros(fig) {
    const ids = bairrosMarcados(), corDe = corBairro(ids);
    if (!ids.length) {
      fig.append(el("p", { class: "legenda-s", text: "Nenhum bairro marcado. Use ⇄ Explorar para escolher os bairros." }));
      return;
    }
    Lab.linhasPontas(fig, { pontas: ANOS, largura: largura(fig), legenda: true, fmt: (v) => fmtInt.format(Math.round(v)), aria: `Votos por bairro nas quatro eleições: ${ids.map((id) => nomeGrupo(porGrupo[id])).join(", ")}`,
      series: ids.map((id) => { const b = porGrupo[id]; return { cor: corDe(id), rotulo: nomeGrupo(b), tracejado: b.tipo === "rural", valores: ANOS.map((a) => b.anos[a]?.votos ?? null),
        dicas: ANOS.map((a) => [`${nomeGrupo(b)} · ${a}`, b.anos[a] ? [`${fmtInt.format(b.anos[a].votos)} votos · ${fmtPct(b.anos[a].peso)} do total dele`] : ["sem local de votação nesta eleição"]]) }; }) });
    const padrao = !est.bairros;
    fig.append(el("p", { class: "legenda-s" }, padrao ? "Os sete com mais votos em 2024. " : `${ids.length} ${ids.length === 1 ? "bairro escolhido" : "bairros escolhidos"}. `,
      el("button", { type: "button", class: "link-explorar", onclick: () => explorar() }, "⇄ Ver outros bairros")));
  }
  function concentracao(fig) {
    // uma barra de 100 votos por eleição: os 5 locais mais fortes × os demais locais com voto (sem cinza: dois tons do vermelho)
    const caixa = el("div", { class: "barras100-s grafico", role: "img", "aria-label": "De cada 100 votos dele, quantos vieram dos 5 locais mais fortes, por eleição" });
    for (const c of base.concentracao) {
      const a = el("span", { class: "seg forte", text: `${Math.round(c.top5)}` }), b = el("span", { class: "seg resto", text: `${100 - Math.round(c.top5)}` });
      a.style.width = `${c.top5}%`; a.style.background = COR; b.style.width = `${100 - c.top5}%`; b.style.background = CORES[1];
      caixa.append(el("div", { class: "ln" }, el("span", { class: "ano", text: c.ano }), el("span", { class: "trilho" }, a, b),
        el("span", { class: "v", text: `${c.locais_com_voto} locais` })));
    }
    fig.append(caixa, el("div", { class: "legenda-s" }, el("span", {}, Lab.chip(COR), " dos 5 locais mais fortes"), el("span", {}, Lab.chip(CORES[1]), " dos demais locais com voto"),
      el("span", { text: "· de cada 100 votos dele" })));
  }
  function saldo(fig) {
    const max = d3.max(base.saldo, (s) => Math.abs(s.dv)) || 1;   // mesma escala para ganhos e perdas
    const caixa = el("div", { class: "barras-s grafico", role: "img", "aria-label": "Saldo de votos por bairro de 2020 para 2024" });
    const lista = [...base.saldo.filter((s) => s.dv > 0).slice(0, 5), ...base.saldo.filter((s) => s.dv < 0).slice(-5)];
    for (const s of lista) {
      const b = el("span", { class: "b" }); b.style.width = `${(100 * Math.abs(s.dv)) / max}%`; b.style.background = s.dv > 0 ? tok("cor-div-2") : tok("cor-div-6");
      caixa.append(el("div", { class: "ln" }, el("span", { text: s.nome }), el("span", { class: "neg" }, s.dv < 0 ? b : ""), el("span", { class: "pos" }, s.dv > 0 ? b : ""),
        el("span", { class: "v", text: `${s.dv > 0 ? "+" : "−"}${fmtInt.format(Math.abs(s.dv))}` })));
    }
    fig.append(caixa, el("div", { class: "legenda-s" }, el("span", {}, Lab.chip(tok("cor-div-2")), " ganhou"), el("span", {}, Lab.chip(tok("cor-div-6")), " perdeu"),
      el("span", { text: "· votos em 2024 menos votos em 2020, soma dos locais do bairro" })));
  }
  function fim(fig) {
    fig.append(el("div", { class: "fim-s" },
      el("ul", {},
        el("li", { text: "Votos do TSE por seção eleitoral, 1º turno, somados por local de votação; a soma bate com o total oficial de cada eleição." }),
        el("li", { text: "Bairros: os 27 do IBGE (Censo 2022). Cada local conta no bairro em que está. Local de votação não é moradia." }),
        el("li", { text: "O mesmo local em eleições diferentes: mesmo nome ou até 100 m de distância. Regra e cores provisórias (WD0001)." })),
      el("p", {}, el("button", { type: "button", class: "botao-notas", text: "✎ Notas, fontes e métodos", onclick: abrirNotas })),
      el("p", { class: "nota-s", text: `Análise e visualização: Alexandre Ribeiro Cajazeira Ramos · Laboratório de Dados Públicos · ${base.meta.fonte}` })));
  }

  let espera = null;
  window.addEventListener("resize", () => { clearTimeout(espera); espera = setTimeout(desenhar, 200); });
  desenhar();
})().catch((erro) => {
  console.error(erro);
  document.getElementById("app").textContent = `Não foi possível carregar a página: ${erro}. Use um navegador atualizado.`;
});

</script>
</body>
</html>
