.amostra-50{display:inline-block;width:0;height:14px;border-left:2px dotted var(--cor-texto)}

.instrucao{font-size:14px;color:var(--cor-texto-secundario);margin:2px 0 8px}

.sankey path.fluxo{fill:none;stroke-opacity:.35}

.lista-mun{font-size:13px;columns:4 150px;column-gap:16px;margin:6px 0 0;padding-left:16px;line-height:1.45}
.caixa-lista{max-height:220px;overflow:auto;border:1px solid var(--cor-borda);border-radius:var(--raio);padding:8px 12px;margin-top:8px;background:var(--cor-fundo)}
.botoes-sankey{display:flex;gap:8px;flex-wrap:wrap}

button.tile-botao{font:inherit;color:inherit;text-align:left;cursor:pointer;border:1px solid var(--cor-borda)}

footer{margin-top:var(--espaco-gg);border-top:1px solid var(--cor-borda);padding-top:var(--espaco-m)}
details.metodologia{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--raio)}
details.metodologia > summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
details.metodologia > summary::-webkit-details-marker{display:none}
details.metodologia > summary::before{content:"▸";font-size:14px;color:var(--cor-texto-secundario);transition:transform .2s}
details.metodologia[open] > summary::before{transform:rotate(90deg)}
.met-titulo{font-size:19px;font-weight:700;color:var(--cor-texto)}
.met-sub{font-size:13px;color:var(--cor-texto-secundario)}
.met-corpo{padding:0 18px 18px;font-size:14.5px}
.met-secao{border-top:1px solid var(--cor-grade);padding-top:6px;margin-top:10px}
.met-secao h3{font-size:16px;margin:8px 0}

ol.passos{padding-left:20px} ol.passos li{margin:10px 0} ol.passos p{margin:4px 0}
ul.arquivos{margin:0;padding-left:14px;font-size:12px;color:var(--cor-texto-secundario)}
ul.adrs{padding-left:18px} ul.adrs li{margin:8px 0}
/* bloco em camadas na folha ✎ Notas e fontes (L0014) */
.met-camadas{display:grid;gap:0;margin-top:8px;border-top:1px solid var(--cor-grade)}
details.met-camada{border-bottom:1px solid var(--cor-grade)}
details.met-camada > summary{cursor:pointer;font-weight:600;padding:8px 2px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.met-camada > summary::-webkit-details-marker{display:none}
details.met-camada > summary::after{content:"▸";color:var(--cor-texto-secundario);transition:transform .2s}
details.met-camada[open] > summary::after{transform:rotate(90deg)}
.met-corpo-camada{padding:0 2px 10px;font-size:13px;min-width:0}
.met-corpo-camada pre{white-space:pre;overflow-x:auto;font-size:11px;max-width:100%}
.met-corpo-camada table{font-size:12px}
details.codigo summary,details.pergunta summary{cursor:pointer;font-size:13px;color:var(--cor-texto-secundario)}
details.pergunta{margin:6px 0} details.pergunta summary{font-size:14.5px;color:var(--cor-texto);font-weight:600}
details.codigo pre{background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:10px;overflow:auto;font-size:12px;max-height:360px}
.assinatura-final{font-size:13px;color:var(--cor-texto-secundario);margin:12px 0 0}
.fora-escala{stroke-dasharray:4 3;stroke:var(--cor-texto)!important;stroke-opacity:1!important;stroke-width:1.6!important}
.rotulo-fora{font-size:11px;font-weight:600;fill:var(--cor-texto);paint-order:stroke;stroke:var(--cor-superficie);stroke-width:3px}
footer p{margin:4px 0;max-width:none}
.assinatura{font-size:14px;color:var(--cor-texto-secundario);margin:0 0 var(--espaco-p)}
.assinatura a{color:var(--cor-texto);text-decoration-color:var(--cor-eixo)}
/* separa o nome do autor do link para o bloco de metodologia (não parecem um link só) */
.assinatura .sep-assinatura{display:inline-block;margin:0 14px;color:var(--cor-eixo)}
button.voltar{font:inherit;font-size:15px;border:1px solid var(--cor-borda);background:var(--cor-superficie);color:var(--cor-texto);
     border-radius:var(--raio);padding:10px 14px;cursor:pointer;min-height:44px;margin-top:var(--espaco-m)}
a{color:var(--cor-destaque)}
.carregando{padding:var(--espaco-gg) 0;color:var(--cor-texto-secundario)}

/* legenda interativa (Lab.sankey): item destaca os fluxos da categoria */
.legenda-interativa .chave{cursor:pointer;border-radius:3px;padding:1px 4px;margin:-1px -4px}
.legenda-interativa .chave:hover,.legenda-interativa .chave:focus-visible{background:var(--cor-grade);outline:none}
/* legendas do sankey: centralizadas; com duas variáveis, uma acima (primeiro lado) e outra abaixo (último lado) */
.legenda-sankey{justify-content:center;text-align:center;margin:10px auto 12px}
.legenda-sankey .lado-legenda{flex-basis:100%;font-weight:700;font-size:14px;margin-bottom:2px}
svg.sankey{display:block;margin-left:auto;margin-right:auto}
/* card da distribuição do destaque no sankey (mesmo visual do card do mapa) */
.painel-sankey{max-width:620px;margin:10px auto}
.painel-sankey .bloco-dist{flex-basis:100%;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.painel-sankey .bloco-dist strong{font-size:13px;margin-top:4px}
/* mapa: câmera, zoom, card flutuante, referência e fundo opcional (L0006; design.yaml › padroes.mapa_camera) */
.mapa{position:relative;z-index:1;display:block}
.mapa path,.mapa circle{vector-effect:non-scaling-stroke}
.mapa-moldura>.mapa-fundo{position:absolute!important;left:0;top:0;z-index:0;pointer-events:none;transition:opacity .4s;background:transparent}
.mapa .referencia path{fill:var(--cor-grade);fill-opacity:.55;stroke:var(--cor-eixo);stroke-opacity:.55;stroke-width:.6}
.com-fundo .mapa .referencia path{fill-opacity:.1}
.mapa .fundo-ref{fill:var(--cor-grade);fill-opacity:.55}
.com-fundo .mapa .fundo-ref{fill-opacity:0}
.com-fundo .mapa path.u{fill-opacity:.85}
.mapa .rotulos-ref text{font-size:11.5px;font-weight:600;fill:var(--cor-texto);paint-order:stroke;stroke:var(--cor-superficie);stroke-width:3px}
.mapa .rotulos-ref circle{fill:var(--cor-texto)}
.mapa-controles{position:absolute;top:8px;right:8px;z-index:3;display:flex;flex-direction:column;gap:4px}
.mapa-controles button{width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--cor-borda);background:var(--cor-superficie);color:var(--cor-texto);font:inherit;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapa-controles button:hover{border-color:var(--cor-texto)}
.mapa-aviso{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:rgba(0,0,0,.72);color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;pointer-events:none;white-space:nowrap}
.mapa-aviso[hidden],.mapa-moldura .painel-sel[hidden]{display:none}
.mapa-atribuicao{position:absolute;right:4px;bottom:4px;z-index:3;font-size:10px;line-height:1.3;color:var(--cor-texto-secundario);background:color-mix(in srgb,var(--cor-superficie) 82%,transparent);padding:1px 5px;border-radius:3px;max-width:90%}
.painel-sel.flutuante{position:absolute;z-index:4;max-width:min(280px,80%);margin:0;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.mapa-editar{position:absolute;left:4px;top:4px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:80%;background:var(--cor-superficie);border:1px dashed var(--cor-destaque);border-radius:6px;padding:6px 8px;font-size:11px}
.bloco-mapa.compacto,.mapa-moldura.compacto{height:100%;max-width:none}
.mapa path.u.foco{stroke:var(--cor-texto);stroke-opacity:1;stroke-width:2}
.painel-sel.rodape{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;margin:0;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.painel-sel.rodape{font-size:12.5px;line-height:1.35;padding:6px 10px;gap:1px 10px;max-height:46%;overflow:auto}
.painel-sel.rodape b{font-size:14px}
.painel-sel.rodape .acoes-sel button{margin-top:2px;padding:2px 8px;font-size:12px;min-height:28px}
.painel-sel.rodape.topo{top:8px;bottom:auto}
.painel-sel.rodape span{flex-basis:100%}

/* ==== web/componentes/lab-viz.css ==== */
/* lab-viz.css — moldura da Visualização (L0007, L0008, L0011–L0013), usada por lab-viz.js.
 * Vem da bancada de formatos (fase 0); regras de forma em design/padrao/design.yaml › padroes.visualizacao_moldura,
 * detalhe, anotacoes, legendas, imagem e mapa_pontos. Só tokens do DS; nenhuma cor fixa, exceto sombras e o aviso
 * sobre o mapa (texto branco sobre véu escuro, legível nos dois temas). */
.viz{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;overflow:hidden;position:relative;box-sizing:border-box;container-type:inline-size;color:var(--cor-texto)}
.viz.fixo{width:var(--w);height:var(--h)}
.viz-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}
.viz-chapeu{font-size:12px;font-weight:600;color:var(--cor-texto-secundario);margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viz-titulo{font-size:18px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.fmt-paisagem .viz-titulo{font-size:19px}
.viz-sub{font-size:13px;color:var(--cor-texto-secundario);margin:0;line-height:1.35}
.viz-sub b{color:var(--cor-texto)}
.mais-texto{font:inherit;border:0;background:var(--cor-grade);color:var(--cor-texto);border-radius:4px;padding:0 5px;margin-left:2px;cursor:pointer}
/* controle de busca no chapéu ou no título (ex.: cidade): parece texto com ▾; abre um campo com a lista */
.viz-busca-botao{font:inherit;font-weight:700;color:var(--cor-texto);background:none;border:0;border-bottom:1px dotted var(--cor-texto);padding:0 1px;min-height:24px;cursor:pointer}
.viz-busca{display:flex;gap:6px;align-items:center;margin:2px 0}
.viz-busca input{font:inherit;font-size:16px;flex:1 1 auto;min-width:0;padding:5px 8px;border:1px solid var(--cor-borda);border-radius:6px;background:var(--cor-fundo);color:var(--cor-texto)}
.viz-busca button{font:inherit;font-size:13px;border:1px solid var(--cor-borda);background:none;color:var(--cor-texto);border-radius:999px;padding:3px 10px;cursor:pointer}
.viz-abas{display:flex;gap:4px;margin-top:2px}
.viz-abas button{font:inherit;font-size:12px;border:1px solid var(--cor-borda);background:none;color:var(--cor-texto);border-radius:6px;padding:2px 8px;min-height:26px;cursor:pointer}
.viz-abas button[aria-pressed="true"]{background:var(--cor-texto);color:var(--cor-superficie)}
.viz-corpo{flex:1 1 auto;min-height:0;display:flex;gap:10px}
.viz-palco{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden}
.viz-palco.compa{flex:0 0 42%}
.viz-palco svg{display:block}
.viz-vazio{display:grid;place-items:center;height:100%;font-size:13px;color:var(--cor-texto-secundario);text-align:center;padding:12px}
.viz-n{margin:2px 0 0;font-size:11.5px;font-weight:600;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}
/* legenda (L0013): itens com amostra própria; interativos (hover destaca, clique fixa, Esc desfaz) */
.viz-legenda{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--cor-texto-secundario)}
.viz-legenda-rec summary{font-size:12px;color:var(--cor-texto-secundario);cursor:pointer;list-style:none;display:inline-block;border:1px solid var(--cor-borda);border-radius:999px;padding:0 9px}
.viz-legenda-rec summary::-webkit-details-marker{display:none}
.viz-legenda-rec[open] summary{margin-bottom:4px}
.item-leg{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;color:var(--cor-texto-secundario);background:none;border:1px solid transparent;border-radius:999px;padding:2px 7px 2px 3px;text-align:left}
button.item-leg{cursor:pointer}
button.item-leg:hover,button.item-leg:focus-visible{border-color:var(--cor-borda);color:var(--cor-texto)}
button.item-leg[aria-pressed="true"]{border-color:var(--cor-texto);color:var(--cor-texto)}
.amostra-leg{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 12px}
.amostra-leg.circ{border-radius:50%}
.item-extra{display:inline-flex;align-items:center;gap:4px}
.leg-titulo{flex-basis:100%;font-size:11.5px;color:var(--cor-texto-secundario)}
.leg-escala{flex-basis:100%;display:grid;gap:2px;max-width:330px}
.leg-escala .pontas{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--cor-texto)}
.leg-escala .quadros{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:2px}
.item-leg.quadro{flex-direction:column;align-items:stretch;gap:2px;padding:2px;border-radius:4px;font-size:10.5px;text-align:center}
.amostra-leg.quadro{width:100%;height:14px;border-radius:2px;flex:none}
.leg-tamanho{flex-basis:100%;font-size:11.5px;color:var(--cor-texto-secundario)}
.leg-tamanho .legenda{display:grid;gap:2px;font-size:11.5px}
.leg-tamanho svg text{fill:var(--cor-texto-secundario);font-size:10.5px}
/* anotações (L0008, L0013): "ao tocar" (ⓘ + balão com ✕) ou rótulo leve; sem lugar, numerada */
.viz-anot-lista{margin:0;padding:0;list-style:none;font-size:12px}
.viz-anot-lista li{display:flex;gap:6px;align-items:baseline}
.num-anot{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--cor-texto);color:var(--cor-superficie);font-size:10px;font-weight:700;flex:0 0 16px}
.viz-anot{position:absolute;inset:0;pointer-events:none}
.viz-anot .marcador{position:absolute;transform:translate(-50%,-50%)}
.rotulo-anot{position:absolute;font-size:11.5px;line-height:1.3;max-width:170px;color:var(--cor-texto);text-shadow:0 0 3px var(--cor-superficie),0 0 3px var(--cor-superficie),0 0 2px var(--cor-superficie)}
.fmt-retrato .rotulo-anot{max-width:150px}
.balao{position:absolute;font-size:11.5px;line-height:1.3;background:var(--cor-superficie);border:1px solid var(--cor-texto-secundario);border-radius:6px;padding:3px 6px;max-width:180px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.anot-toque{position:absolute;width:20px;height:20px;border-radius:50%;border:1px solid var(--cor-texto);background:var(--cor-superficie);color:var(--cor-texto);font:italic 700 12px/18px Georgia,serif;padding:0;cursor:pointer;pointer-events:auto}
.viz-anot .balao-toque{pointer-events:auto;padding:5px 30px 5px 8px;font-size:12px;max-width:220px;cursor:pointer}
.x-anot{position:absolute;top:0;right:0;min-width:28px;min-height:28px;border:0;background:none;color:var(--cor-texto);font-size:13px;cursor:pointer}
/* cartão de detalhe único (L0008): sobre o palco; no celular, abaixo do desenho */
.viz-cartao{position:absolute;z-index:2;background:var(--cor-superficie);border:1px solid var(--cor-texto-secundario);border-radius:8px;padding:6px 36px 6px 9px;font-size:12px;line-height:1.35;max-width:240px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.viz-cartao[hidden]{display:none}
.viz-cartao.doca{left:4px!important;right:4px;max-width:none}
.viz-cartao.abaixo{position:relative;max-width:none;margin:2px 0}
.viz-cartao .ctx{color:var(--cor-texto-secundario);font-size:11px}
.viz-cartao .x{position:absolute;top:0;right:0;min-width:32px;min-height:32px;border:0;background:none;color:var(--cor-texto);font-size:15px;cursor:pointer;line-height:1}
.viz .realce{stroke:var(--cor-texto)!important;stroke-width:2.5px!important}
.rep-estatica .so-interativo{display:none!important}
/* mapa de pontos (experimental): zoom, aviso de dois dedos, atribuição, tamanho */
.viz-palco .ruas image{filter:grayscale(1) opacity(.6)}
.zoom-pontos{position:absolute;top:8px;right:8px;display:grid;gap:4px}
.zoom-pontos button{width:32px;height:32px;border:1px solid var(--cor-borda);border-radius:6px;background:var(--cor-superficie);color:var(--cor-texto);font-size:16px;cursor:pointer}
.aviso-roda{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;pointer-events:none}
.mapa-atribuicao-mini{position:absolute;right:3px;bottom:2px;font-size:9.5px;background:var(--cor-superficie);padding:0 3px;border-radius:3px;color:var(--cor-texto-secundario)}
.mapa-atribuicao-mini a{color:inherit}
.fundo-mini{position:absolute;top:6px;left:6px;display:flex;border:1px solid var(--cor-borda);border-radius:999px;overflow:hidden;background:var(--cor-superficie);font-size:11.5px}
.fundo-mini button{font:inherit;border:0;background:none;color:var(--cor-texto-secundario);padding:3px 9px;min-height:26px;cursor:pointer}
.fundo-mini .rot-mini{padding:3px 4px 3px 9px;color:var(--cor-texto-secundario);align-self:center}
.fundo-mini button[aria-pressed="true"]{background:var(--cor-texto);color:var(--cor-superficie)}
/* barra fixa no pé (Como ler · Notas e fontes · Explorar; autor e Compartilhar) e folha que sobe */
.viz-base{margin:auto -14px -12px;border-top:1px solid var(--cor-grade);background:var(--cor-superficie);padding:0 10px 3px;display:grid;flex:0 0 auto}
.viz-base .botoes{display:flex;justify-content:space-around}
.viz-base .botoes button{font:inherit;font-size:12.5px;color:var(--cor-texto-secundario);background:none;border:0;min-height:32px;padding:0 6px;cursor:pointer}
.viz-base .botoes button:hover,.viz-base .comp:hover{color:var(--cor-texto)}
.viz-base .linha2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--cor-texto-secundario);padding:0 6px}
.viz-base .assina{display:grid;line-height:1.3;min-width:0}
.viz-base .fonte-curta{font-size:10.5px}
.viz-base a{color:inherit;text-decoration:underline dotted;text-underline-offset:2px}
.viz-base .comp{font:inherit;font-size:11.5px;color:var(--cor-texto-secundario);background:none;border:1px solid var(--cor-borda);border-radius:999px;padding:1px 9px;min-height:26px;cursor:pointer}
.viz-folha{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:var(--cor-fundo);border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.18);z-index:6;padding:4px 14px 12px;font-size:13px;line-height:1.45}
.viz-folha[hidden]{display:none}
.viz-folha .alca{width:36px;height:4px;border-radius:2px;background:var(--cor-eixo);margin:4px auto}
.viz-folha .cab{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-4px;background:var(--cor-fundo)}
.viz-folha h4{margin:0;font-size:15px}
.viz-folha .cab button{font:inherit;font-size:16px;background:none;border:0;color:var(--cor-texto);cursor:pointer;min-width:32px;min-height:32px}
.viz-folha p{margin:6px 0}
.viz-folha .fraco{color:var(--cor-texto-secundario);font-size:12px}
.viz-folha a{color:inherit}
.viz-folha .campo{display:grid;gap:2px;font-size:12.5px;margin:6px 0}
.viz-folha .tabela-alt{max-height:240px;overflow:auto;border:1px solid var(--cor-grade);border-radius:6px}
.viz-folha .tabela-alt table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.viz-folha .tabela-alt th,.viz-folha .tabela-alt td{padding:3px 6px;border-bottom:1px solid var(--cor-grade);text-align:left}
.viz-folha .tabela-alt .n{text-align:right}
.viz-folha .tabela-alt th{position:sticky;top:0;background:var(--cor-fundo)}
.opcoes-comp a,.opcoes-comp button{display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;text-align:left;font:inherit;font-size:13.5px;background:none;border:0;border-bottom:1px solid var(--cor-grade);color:var(--cor-texto);padding:9px 2px;cursor:pointer;text-decoration:none}
.opcoes-comp .ic{width:24px;text-align:center;color:var(--cor-texto-secundario)}
textarea.viz-texto{width:100%;box-sizing:border-box;font:11px ui-monospace,monospace;background:var(--cor-superficie);color:var(--cor-texto);border:1px solid var(--cor-borda);border-radius:6px}
.viz-folha .comp{font:inherit;font-size:12.5px;color:var(--cor-texto);background:none;border:1px solid var(--cor-borda);border-radius:999px;padding:2px 12px;cursor:pointer}
/* imagem do leitor: prévia antes de baixar */
.veu-imagem{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.caixa-imagem{background:var(--cor-superficie);color:var(--cor-texto);border-radius:12px;padding:12px;max-height:94vh;overflow:auto;max-width:100%;box-sizing:border-box}
.caixa-imagem img{display:block;max-width:100%;height:auto;border:1px solid var(--cor-borda);border-radius:6px}
.caixa-imagem p{font-size:13px;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.caixa-imagem a,.caixa-imagem button{font:inherit;font-size:13px;border:1px solid var(--cor-borda);background:none;color:var(--cor-texto);border-radius:999px;padding:2px 12px;cursor:pointer;text-decoration:none}
/* barras 100% com rótulo em cima quando o quadro é estreito (regra por contêiner, L0008) */
@container (max-width: 420px){.composicao .linha{grid-template-columns:minmax(0,1fr);gap:2px;margin:4px 0}.composicao .linha .rot{font-size:13px;font-weight:600}}
/* hospedeiros: página avulsa e embed */
body.viz-pagina{margin:0;background:var(--cor-fundo);color:var(--cor-texto);font-family:var(--fonte-texto);line-height:1.5}
.viz-pagina main{max-width:760px;margin:0 auto;padding:12px 8px 40px;box-sizing:border-box}
.viz-selo-teste{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cor-texto-secundario);border:1px solid var(--cor-borda);border-radius:999px;padding:0 8px;margin:0 0 6px}
body.viz-embed{background:transparent;overflow:hidden}
body.viz-embed main{max-width:none;padding:0}
body.viz-embed .viz{border:0;border-radius:0}

/* ---------------------------------------------------------------- story (Q-066): cartões sobre o mesmo plano */
.viz.story{touch-action:pan-y;gap:6px;padding-top:10px}
.story-progresso{display:flex;gap:3px}
.story-progresso span{flex:1;height:3px;border-radius:2px;background:var(--cor-grade)}
.story-progresso span.lido{background:var(--cor-texto-secundario)}
.story-progresso span.atual{background:var(--cor-texto)}
.viz.story .viz-titulo{font-size:20px}
.viz.story.capa .viz-titulo{font-size:28px;line-height:1.15;margin-top:18px}
.viz.story .story-texto{font-size:15px;line-height:1.45;color:var(--cor-texto)}
.viz.story .story-texto b{font-weight:700}
.story-vao{flex:1 1 auto;min-height:80px}
.story-fim{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.story-fim a,.story-fim button{font:inherit;font-size:14px;text-align:left;color:var(--cor-texto);background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:8px;padding:10px 12px;cursor:pointer;text-decoration:none}
.story-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.story-nav button{font:inherit;font-size:15px;font-weight:700;min-width:44px;min-height:40px;border-radius:999px;border:1px solid var(--cor-borda);background:none;color:var(--cor-texto);padding:0 14px;cursor:pointer}
.story-nav button.prox{background:var(--cor-texto);color:var(--cor-superficie);border-color:var(--cor-texto)}
.story-nav button:disabled{opacity:.3;cursor:default}
.story-nav .pos{font-size:12px;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}
.viz.story.host-pagina{height:calc(100svh - 16px);min-height:600px;max-height:940px;margin:0 auto}
.viz.story .viz-corpo{min-height:200px}
.viz.story .viz-palco svg text{font-family:inherit}
.viz-palco .fundo-mini.dir{left:auto;right:4px;top:2px}
/* interação comum dos componentes de cartão (2026-10-11): card informativo, marca selecionada, legenda acesa */
.viz-cartao:not(.fixo){pointer-events:none;padding-right:9px}
.viz-palco .marca-sel,.viz-palco g.marca-sel>circle,.viz-palco g.marca-sel>rect{stroke:var(--cor-texto)!important;stroke-width:2px!important}
button.item-leg.ativo{border-color:var(--cor-borda);color:var(--cor-texto)}
.viz-palco g.faixa-t>rect{stroke:none!important}
.viz-palco g.faixa-t line{opacity:0;pointer-events:none}
.viz-palco g.faixa-t:hover line,.viz-palco g.faixa-t.marca-sel line{opacity:.45}
.viz-palco g.faixa-t:hover>rect,.viz-palco g.faixa-t.marca-sel>rect{fill:var(--cor-texto);fill-opacity:.06}
.viz-palco>.fundo-mini,.viz-palco>.zoom-pontos,.viz-palco>.aviso-roda,.viz-palco>.mapa-atribuicao-mini{z-index:5}   /* controles acima do desenho (o mapa compacto empilha o SVG) */
/* story: nota curta do cartão; pilha de componentes no palco (L0015, extensões de 2026-10-12) */
.story-nota{margin:2px 0 0;font-size:11.5px;line-height:1.35;color:var(--cor-texto-secundario)}
.viz-palco.pilha{display:flex;flex-direction:column;gap:6px}
.viz-palco-pilha{position:relative;min-height:0}
/* mapa no palco do story: preenche o palco (a altura muda entre cartões quando o mesmo mapa segue de um para o outro) */
.viz-palco{position:relative}
.viz-palco>.bloco-mapa.compacto{position:absolute;inset:0;height:auto}
.leg-tamanho-sobre{position:absolute;left:4px;top:4px;max-width:46%;z-index:3;background:color-mix(in srgb,var(--cor-superficie) 88%,transparent);border-radius:6px;padding:2px 6px;pointer-events:none;font-size:10.5px;color:var(--cor-texto-secundario)}
.leg-tamanho-sobre .legenda{display:grid;gap:0}
.leg-tamanho-sobre,.leg-tamanho-sobre *{font-size:10px!important;line-height:1.25}
.leg-tamanho-sobre svg text{fill:var(--cor-texto-secundario);font-size:10px}

<script>
/* ==== web/componentes/lab-nucleo.js ==== */
/* lab-nucleo.js — núcleo dos componentes de interface do Laboratório de Dados Públicos.
 * Design system padrão (design/padrao/design.yaml, seção `padroes`); ADR L0003.
 *
 * Sem build: os produtos embutem os arquivos lab-*.js no HTML único (L0002), nesta ordem:
 *   lab-nucleo → lab-selecao → lab-escalas → lab-mapa → lab-graficos → lab-sankey → lab-metodologia.
 * Requer D3 v7 global (lab-sankey requer d3-sankey; lab-mapa usa flubber, se presente).
 * Tudo fica em window.Lab. Os componentes só desenham: nenhum cálculo analítico (L0002).
 *
 * Uso mínimo:
 *   Lab.configurar({ raiz: document.getElementById("app"), autor: "Nome", orgaos: { tse: "TSE" } });
 *   sec.append(el("h3", {}, "Votos de ", Lab.seletorTituloLista("Grupo", opcoes, atual, aoMudar)));
 */
(function () {
  "use strict";
  const Lab = (window.Lab = window.Lab || {});

  // ------------------------------------------------------------ configuração do produto
  // raiz: elemento onde a página desenha (seleção e rótulos procuram dentro dele)
  // autor: nome curto do rodapé dos gráficos · orgaos: chave da fonte → órgão (rodapé curto)
  // artigos: forma com artigo quando há um só órgão ("TSE" → "do TSE")
  // autorUrl (GitHub do autor) e projeto ({nome, url} do repositório) chegam da montagem (labdados.produto_web)
  Lab.cfg = { raiz: document.body, autor: "", autorUrl: null, projeto: null, orgaos: {}, artigos: {}, ancoraMetodologia: "metodologia", ancoraRodape: "rodape" };
  Lab.configurar = (c) => Object.assign(Lab.cfg, c);

  // ------------------------------------------------------------ formatos (pt-BR)
  const fmtInt = new Intl.NumberFormat("pt-BR");
  const vazio = (v) => v === null || v === undefined;
  Lab.fmtInt = fmtInt;
  Lab.fmtPct = (v, d = 1) => (vazio(v) ? "—" : `${v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d })}%`);
  Lab.fmtPP = (v) => (vazio(v) ? "—" : `${v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} p.p.`);
  Lab.fmtR = (v) => (vazio(v) ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  /** Número grande abreviado: 1,23 mi · 460 mil · 9.876. */
  Lab.fmtCompacto = (v) => (vazio(v) ? "—" : Math.abs(v) >= 1e6 ? `${(v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 })} mi`
    : Math.abs(v) >= 1e4 ? `${Math.round(v / 1000).toLocaleString("pt-BR")} mil` : fmtInt.format(v));
  /** Com sinal explícito (+, −) e o formato do módulo. */
  Lab.comSinal = (v, fmt) => (vazio(v) ? "—" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${fmt(Math.abs(v))}`);

  // ------------------------------------------------------------ elementos e tokens
  /** el("div", {class, text, onclick, "data-x"}, ...filhos) — textos sempre por textContent. */
  Lab.el = (tag, attrs = {}, ...filhos) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const f of filhos) if (f !== null && f !== undefined && f !== false) n.append(f);
    return n;
  };
  const el = Lab.el;
  /** Valor de um token do design system (variável CSS --nome). */
  Lab.token = (nome) => getComputedStyle(document.documentElement).getPropertyValue(`--${nome}`).trim();
  const token = Lab.token;
  Lab.semMovimento = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  /** Tinta legível sobre uma cor de fundo (pela luminância). */
  Lab.tinta = (c) => (d3.lab(c).l > 62 ? "#111" : "#fff");
  /** Texto sobre cor: tinta pela luminância + contorno contrastante (--halo). */
  Lab.comHalo = (n, fundo) => { const t = Lab.tinta(fundo); n.style.color = t; n.style.setProperty("--halo", t === "#111" ? "rgba(255,255,255,.75)" : "rgba(0,0,0,.45)"); return n; };
  /** Base embutida em gzip+base64 (labdados.produto_web.codificar_base). */
  Lab.decodificar = async (b64) => {
    const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const fluxo = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(fluxo).text());
  };

  // ------------------------------------------------------------ dica (tooltip)
  let dica = null;
  const caixaDica = () => dica || (dica = document.getElementById("dica")
    || document.body.appendChild(el("div", { class: "dica", id: "dica", role: "status", "aria-live": "polite" })));
  /** Dica junto ao ponteiro: título em negrito + linhas (as vazias são ignoradas). */
  Lab.mostrarDica = (ev, titulo, linhas) => {
    const d = caixaDica();
    d.replaceChildren(el("b", { text: titulo }), ...linhas.filter(Boolean).map((t) => el("div", { text: t })));
    d.style.display = "block";
    d.style.left = `${Math.min(ev.clientX + 14, innerWidth - d.offsetWidth - 8)}px`;
    d.style.top = `${Math.min(ev.clientY + 14, innerHeight - d.offsetHeight - 8)}px`;
  };
  Lab.esconderDica = () => { if (dica) dica.style.display = "none"; };

  // ------------------------------------------------------------ controles
  /** Botões de alternância; `pequeno` = versão compacta, usada abaixo dos gráficos (Tamanho, Largura). */
  Lab.alternar = (rotuloGrupo, opcoes, atual, aoMudar, pequeno = false) => {
    const a = el("div", { class: pequeno ? "alternar pequeno" : "alternar", role: "group", "aria-label": rotuloGrupo });
    for (const [v, r] of opcoes) a.append(el("button", { "aria-pressed": v === atual, text: r, "data-chave": `${rotuloGrupo}|${v}`, onclick: () => aoMudar(v) }));
    return el("div", { class: pequeno ? "campo compacto" : "campo" }, rotuloGrupo, a);
  };
  /** Seletor dentro do título (poucas opções): as opções fazem parte da frase; a escolhida fica sublinhada. */
  Lab.seletorTitulo = (rotulo, opcoes, atual, aoMudar) => {
    const grupo = el("span", { class: "seletor-titulo", role: "group", "aria-label": rotulo });
    opcoes.forEach(([v, r], i) => {
      if (i) grupo.append(el("span", { class: "sep", "aria-hidden": "true", text: " / " }));
      grupo.append(el("button", { type: "button", "aria-pressed": v === atual, "data-chave": `${rotulo}|${v}`, text: r, onclick: () => aoMudar(v) }));
    });
    return grupo;
  };
  /** Lista dentro do título (muitas opções): parece texto sublinhado com ▾; abre a lista nativa. */
  Lab.seletorTituloLista = (rotulo, opcoes, atual, aoMudar) => {
    const s = el("select", { class: "lista-titulo", "aria-label": rotulo, "data-chave": rotulo, onchange: (e) => aoMudar(e.target.value) });
    for (const [v, r] of opcoes) s.append(el("option", { value: v, text: r }));
    s.value = atual;
    // largura = texto escolhido (o select nativo mediria a opção mais longa)
    requestAnimationFrame(() => {
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = getComputedStyle(s).font;
      s.style.width = `${Math.ceil(ctx.measureText(s.selectedOptions[0]?.text || "").width) + 24}px`;
    });
    return s;
  };
  /** Lista com rótulo acima (formulários; nos gráficos, prefira seletorTituloLista). */
  Lab.seletor = (rotuloCampo, opcoes, atual, aoMudar) => {
    const s = el("select", { "data-chave": rotuloCampo, onchange: (e) => aoMudar(e.target.value) });
    for (const [v, r] of opcoes) s.append(el("option", { value: v, text: r }));
    s.value = atual;
    return el("label", { class: "campo" }, rotuloCampo, s);
  };
  /** Botão que troca o modo de uma seção (ex.: "Detalhar distribuição de um único grupo" ⇄ "← Mapa de lideranças"). */
  Lab.botaoModo = (texto, aoClicar, chave = "modo") => el("button", { type: "button", class: "botao-modo", "data-chave": chave, text: texto, onclick: aoClicar });

  // ------------------------------------------------------------ amostras de cor
  const amostra = (cor, classe = "amostra") => { const s = el("span", { class: classe }); s.style.background = cor; return s; };
  /** Item de legenda: amostra + texto. */
  Lab.chave = (cor, texto) => el("span", { class: "chave" }, amostra(cor), texto);
  /** Quadradinho de cor para tabelas e quadros. */
  Lab.chip = (cor) => amostra(cor, "chip");

  // ------------------------------------------------------------ textos de apoio
  /** Orientações de leitura: escondidas num "ⓘ Como ler o gráfico" sutil. Aceita vários parágrafos (ou elementos). */
  Lab.instrucao = (...textos) => el("details", { class: "info" }, el("summary", {}, "ⓘ Como ler o gráfico"),
    ...textos.filter(Boolean).map((t) => (typeof t === "string" ? el("p", { text: t }) : t)));
  /** Subtítulo com os números (curto; o título não leva números). */
  Lab.placar = (texto) => el("p", { class: "placar", text: texto });
  /** Leva ao bloco de metodologia (abre o bloco). */
  Lab.irRodape = (ev) => {
    ev?.preventDefault();
    const bloco = document.getElementById(Lab.cfg.ancoraMetodologia);
    if (bloco) bloco.open = true;
    (bloco || document.getElementById(Lab.cfg.ancoraRodape))?.scrollIntoView({ behavior: Lab.semMovimento() ? "auto" : "smooth" });
  };
  /** Rodapé de cada gráfico: fonte curta (link para a metodologia) + autoria; cobertura e notas num "ⓘ notas" recolhível.
   *  fontes: chaves de Lab.cfg.orgaos. O gráfico se sustenta sozinho num print. */
  Lab.rodape = ({ fontes = [], cobertura = null, nota = null } = {}) => {
    const orgaos = [...new Set(fontes.map((k) => Lab.cfg.orgaos[k] || k))];
    const deQuem = orgaos.length === 1 && Lab.cfg.artigos[orgaos[0]] ? Lab.cfg.artigos[orgaos[0]] : `de ${orgaos.join(", ")}`;
    const f = el("div", { class: "rodape-grafico" },
      el("span", {}, `Fonte: bases oficiais ${deQuem}. `),
      el("a", { href: `#${Lab.cfg.ancoraRodape}`, onclick: Lab.irRodape, text: "Saiba mais ↓" }), " · ",
      el("span", {}, "Análise e visualização: ", Lab.cfg.autorUrl ? el("a", { href: Lab.cfg.autorUrl, target: "_blank", rel: "noopener", text: Lab.cfg.autor }) : Lab.cfg.autor),
      Lab.cfg.projeto ? el("span", {}, " · Projeto: ", el("a", { href: Lab.cfg.projeto.url, target: "_blank", rel: "noopener", text: `${Lab.cfg.projeto.nome} ↗` })) : null);
    if (cobertura || nota) f.append(el("details", { class: "info info-notas" }, el("summary", {}, "ⓘ notas"),
      ...[cobertura, nota].filter(Boolean).map((t) => el("p", { text: t }))));
    return f;
  };

  // ------------------------------------------------------------ tabelas e quadros
  /** Tabela simples; colunas numéricas alinhadas à direita (detecção automática ou `numericas`).
   *  Célula pode ser texto ou lista de nós (ex.: [chip, "nome"]). */
  Lab.tabela = (cab, linhas, numericas = false) => {
    const ehNum = (c) => typeof c === "string" && /([\d—]|%|p\.p\.)$/.test(c.trim()) && /\d|—/.test(c);
    const num = cab.map((_, i) => i > 0 && (numericas || (linhas.length > 0 && linhas.every((l) => ehNum(l[i])))));
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, ...cab.map((c, i) => el("th", { class: num[i] ? "n" : null, scope: "col" }, ...(Array.isArray(c) ? c : [c]))))));
    t.append(el("tbody", {}, ...linhas.map((l) => el("tr", {}, ...l.map((c, i) => el("td", { class: num[i] ? "n" : null }, ...(Array.isArray(c) ? c : [c])))))));
    return t;
  };
  /** Quadros com um número grande por item. itens: [{chave, rotulo, cor, valor}].
   *  Com `aoEscolher`, viram botões (o escolhido ganha a borda na cor do item). */
  Lab.quadros = (itens, { atual = null, aoEscolher = null, chaveDado = "Quadro", rotulo = "Escolha" } = {}) =>
    el("div", aoEscolher ? { class: "tiles", role: "group", "aria-label": rotulo } : { class: "tiles" }, ...itens.map((it) => {
      const corpo = [el("div", { class: "rot" }, Lab.chip(it.cor), it.rotulo), el("div", { class: "val", text: it.valor })];
      if (!aoEscolher) return el("div", { class: "tile" }, ...corpo);
      const b = el("button", { type: "button", class: "tile tile-botao", "aria-pressed": it.chave === atual, "data-chave": `${chaveDado}|${it.chave}`, onclick: () => aoEscolher(it.chave) }, ...corpo);
      b.style.setProperty("--cor-grupo", it.cor);
      return b;
    }));

  // ------------------------------------------------------------ barra 100% (composição)
  /** Uma linha de barra empilhada de 100%. segmentos: [{cor, pct, texto, medio, curto, dica: [título, linhas]}].
   *  O rótulo encolhe (texto → medio → curto) ou sai quando não cabe: ver Lab.ajustarRotulos. */
  Lab.linhaBarra100 = ({ rotulo, segmentos, abaixo = null, aria = null }) => {
    const barra = el("div", { class: "barra", role: aria ? "img" : null, "aria-label": aria });
    for (const s of segmentos) {
      if (vazio(s.pct) || s.pct <= 0) continue;
      const sp = el("span"); sp.style.width = `${s.pct}%`; sp.style.background = s.cor;
      if (s.texto) { const b = el("b", { text: s.texto, "data-medio": s.medio || null, "data-curto": s.curto || null }); Lab.comHalo(b, s.cor); sp.append(b); }
      if (s.dica) { sp.addEventListener("pointermove", (ev) => Lab.mostrarDica(ev, s.dica[0], s.dica[1])); sp.addEventListener("pointerleave", Lab.esconderDica); }
      barra.append(sp);
    }
    return el("div", { class: "linha" }, el("span", { class: "rot", text: rotulo }), el("div", {}, barra, abaixo ? el("div", { class: "vazio", text: abaixo }) : null));
  };
  /** Rótulos de barra que não cabem: tenta a forma média, depois a curta; se nada couber, sai (fica na dica e na tabela). */
  Lab.ajustarRotulos = (raiz = Lab.cfg.raiz) => {
    const cabe = (b) => { const t = document.createElement("span"); t.textContent = b.textContent; t.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:600 12px var(--fonte-texto)";
      document.body.append(t); const ok = t.offsetWidth <= b.parentElement.clientWidth - 6; t.remove(); return ok; };
    for (const b of raiz.querySelectorAll(".barra span b")) {
      if (cabe(b)) continue;
      if (b.dataset.medio) { b.textContent = b.dataset.medio; if (cabe(b)) continue; }
      if (b.dataset.curto) b.textContent = b.dataset.curto;
      if (!cabe(b)) b.remove();
    }
  };

  // ------------------------------------------------------------ eixos e atualização
  /** Eixo padronizado: linhas na cor de eixo, rótulos 12px secundários. Uso: g.call(d3.axisBottom(x)).call(Lab.eixo). */
  Lab.eixo = (g) => g.call((x) => x.selectAll("line,path").attr("stroke", token("cor-eixo")))
    .call((x) => x.selectAll("text").style("font-size", "12px").style("fill", token("cor-texto-secundario")));
  /** Atualiza no lugar: mantém altura, posição de rolagem e o foco do controle usado (data-chave). */
  Lab.noLugar = (fazer, raiz = Lab.cfg.raiz) => {
    const y = scrollY;
    const chave = document.activeElement?.dataset?.chave;
    raiz.style.minHeight = `${raiz.offsetHeight}px`;
    fazer();
    scrollTo(0, y);
    if (chave) raiz.querySelector(`[data-chave="${CSS.escape(chave)}"]`)?.focus({ preventScroll: true });
    requestAnimationFrame(() => { raiz.style.minHeight = ""; });
  };
  /** Largura útil de um gráfico na raiz (entre 320 px e `max`). */
  Lab.largura = (max) => Math.max(320, Math.min(max, Lab.cfg.raiz.clientWidth - 34));
  Lab.estreito = () => Lab.cfg.raiz.clientWidth < 600;
})();

/* ==== web/componentes/lab-selecao.js ==== */
/* lab-selecao.js — seleção de unidades (clique no mapa, no gráfico ou na busca). ADR L0003.
 *
 * Cada bloco (um mapa e o gráfico ligado a ele, ou um gráfico sozinho) marca-se com
 * data-escopo="nome" e tem a sua seleção: selecionar num bloco não afeta os outros.
 * As marcas selecionáveis levam data-u="<id>". A seleção fica só na memória da página.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const selecoes = new Map();   // escopo → unidade
  const paineis = [];           // [escopo, atualizar, chave?] — registrados a cada desenho
  Lab.selecoes = selecoes;

  /** Escopo de um nó (o data-escopo mais próximo) ou o próprio nome, se for texto. */
  Lab.escopoDe = (n) => (typeof n === "string" ? n : n?.closest?.("[data-escopo]")?.dataset.escopo || "geral");
  Lab.selecaoDe = (n) => selecoes.get(Lab.escopoDe(n)) || "";
  /** Seleciona `u` no bloco de `noh` (clicar de novo desfaz); `u` vazio limpa a seleção do bloco. */
  Lab.selecionar = (u, noh) => {
    const esc = Lab.escopoDe(noh);
    if (u && selecoes.get(esc) !== u) selecoes.set(esc, u); else selecoes.delete(esc);
    Lab.aplicarSelecao(esc);
  };
  /** Marca .selecionado nas marcas do bloco, traz a selecionada para a frente e atualiza os painéis. */
  Lab.aplicarSelecao = (esc) => {
    const u = selecoes.get(esc) || "";
    for (const bloco of Lab.cfg.raiz.querySelectorAll(`[data-escopo="${CSS.escape(esc)}"]`)) {
      for (const n of bloco.querySelectorAll("[data-u]")) {
        const sim = Boolean(u) && n.dataset.u === u;
        n.classList.toggle("selecionado", sim);
        if (sim && n.parentNode) n.parentNode.appendChild(n);   // por cima dos vizinhos
      }
      for (const sv of bloco.querySelectorAll("svg")) sv.classList.toggle("com-selecao", Boolean(u) && Boolean(sv.querySelector(".selecionado")));
    }
    for (const [e, atualizar] of paineis) if (e === esc) atualizar();
  };
  /** Reaplica todas as seleções (chamar depois de redesenhar a página). */
  Lab.aplicarSelecoes = () => { for (const esc of selecoes.keys()) Lab.aplicarSelecao(esc); };
  /** Registra um painel; com `chave`, substitui o registro anterior da mesma chave (redesenho não acumula). */
  Lab.registrarPainel = (esc, atualizar, chave = null) => {
    const reg = chave ? paineis.find((p) => p[2] === chave) : null;
    if (reg) reg[1] = atualizar; else paineis.push([esc, atualizar, chave]);
  };
  /** Esquece os painéis (chamar no início de cada redesenho da página). */
  Lab.limparPaineis = () => { paineis.length = 0; };

  /** Conteúdo do painel da unidade: nome, linhas de dados, "Ver ficha" (opcional) e "Limpar seleção". */
  Lab.conteudoPainel = (painel, { u, nome, linhas, abrir = null, rotuloAbrir = "Ver ficha →", esc, acoes = [] }) =>
    painel.replaceChildren(el("b", { text: nome }), ...linhas.filter(Boolean).map((t) => el("span", { text: t })),
      el("div", { class: "acoes-sel" },
        abrir ? el("button", { type: "button", class: "voltar", text: rotuloAbrir, onclick: () => abrir(u) }) : null, ...acoes.filter(Boolean),
        el("button", { type: "button", class: "voltar", text: "Limpar seleção", onclick: () => Lab.selecionar("", esc) })));

  /** Painel da unidade selecionada sob um gráfico. Em telas largas, dentro de .grade2 (mapa ao lado), fica oculto
   *  por CSS; no celular aparece logo abaixo do gráfico tocado. opts: {nome(u), dica(u) → linhas, abrir(u), rotuloAbrir}. */
  Lab.painelGrafico = (alvo, { nome, dica, abrir = null, rotuloAbrir } = {}) => {
    const painel = el("div", { class: "painel-sel painel-grafico", "aria-live": "polite" });
    alvo.append(painel);
    const esc = Lab.escopoDe(alvo);
    const atualizar = () => {
      const u = selecoes.get(esc) || "";
      const existe = u && alvo.querySelector(`[data-u="${CSS.escape(u)}"]`);
      painel.hidden = !existe;
      if (existe) Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: dica(u), abrir, rotuloAbrir, esc });
    };
    Lab.registrarPainel(esc, atualizar);
    atualizar();
    return painel;
  };

  /** Destaque ligado: passar o mouse numa unidade acende a mesma unidade em todos os gráficos da grade. */
  Lab.ligarDestaque = (grade) => {
    const acender = (ev, sim) => { const u = ev.target.closest("[data-u]")?.dataset.u; if (u) for (const n of grade.querySelectorAll(`[data-u="${CSS.escape(u)}"]`)) n.classList.toggle("ligado", sim); };
    grade.addEventListener("pointerover", (ev) => acender(ev, true));
    grade.addEventListener("pointerout", (ev) => acender(ev, false));
  };
})();

/* ==== web/componentes/lab-escalas.js ==== */
/* lab-escalas.js — escalas de tamanho e legendas de cor. ADR L0003.
 *
 * Regras (design.yaml › padroes): legendas de escala ocupam ~70% da largura do gráfico; nos mapas
 * ficam logo abaixo do desenho; texto da legenda em tinta de texto, nunca na cor da série.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Escala de área (raiz) com teto "fora de escala": se a maior unidade tem mais de 3× o valor da segunda,
   *  a escala vai até a segunda e a maior fica no tamanho máximo, com contorno tracejado (decisão de 2026-10-06). */
  Lab.escalaArea = (valores, rMax) => {
    const ord = valores.filter((v) => v > 0).sort((a, b) => b - a);
    const fora = ord.length > 2 && ord[0] > 3 * ord[1];
    const teto = fora ? ord[1] : ord[0] || 1;
    const s = d3.scaleSqrt().domain([0, teto]).range([0, rMax]).clamp(true);
    return { s, teto, fora: (v) => fora && v > teto };
  };
  /** Nota sob o gráfico com as unidades fora de escala. Sem unidades, devolve "" (pode ir direto em append:
   *  o append nativo escreveria "null"). */
  Lab.notaFora = (nomes) => (nomes.length ? el("p", { class: "nota", text: `Fora de escala (contorno tracejado): ${nomes.join(", ")}. O valor é mais de três vezes o da segunda maior unidade; o círculo fica no tamanho máximo para não esmagar os demais.` }) : "");

  /** Legenda de tamanho: três círculos de referência ("Área ∝ …"). */
  Lab.legendaTamanho = (escalaR, rotuloTamanho) => {
    const max = escalaR.domain()[1];
    const ref = d3.ticks(0, max, 3).filter((v) => v > 0).slice(-3);
    const H = 2 * escalaR(d3.max(ref)) + 22;
    const svg = d3.create("svg").attr("width", 260).attr("height", H).attr("role", "img").attr("aria-label", `Legenda de tamanho: ${ref.map((v) => Lab.fmtInt.format(v)).join(", ")}`);
    let x = 4;
    for (const v of ref) {
      const r = escalaR(v), cx = x + Math.max(r, 26);
      svg.append("circle").attr("cx", cx).attr("cy", H - 4 - r).attr("r", r).attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario"));
      svg.append("text").attr("x", cx).attr("y", H - 6 - 2 * r).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", Lab.token("cor-texto-secundario")).text(Lab.fmtInt.format(v));
      x += Math.max(2 * r, 52) + 10;
    }
    svg.attr("width", x + 4);   // largura conforme os círculos (não corta o maior)
    return el("div", { class: "legenda" }, el("span", { text: `Área ∝ ${rotuloTamanho}` }), svg.node());
  };

  /** Rampa de cores (quadros iguais). */
  Lab.rampa = (cores) => el("span", { class: "rampa" }, ...cores.map((c) => { const s = el("span"); s.style.background = c; return s; }));
  /** Escala contínua: rampa na largura toda e rótulos das pontas embaixo (sequencial ou divergente). */
  Lab.legendaRampa = (cores, esquerda, direita) => el("div", { class: "legenda legenda-larga" }, el("span", { text: esquerda }), Lab.rampa(cores), el("span", { text: direita }));
  /** Escala divergente com três marcos: início, centro (neutro) e fim. */
  Lab.legendaTres = (cores, inicio, centro, fim) => el("div", { class: "legenda legenda-tres" }, Lab.rampa(cores), el("span", { text: inicio }), el("span", { text: centro }), el("span", { text: fim }));
  /** Legenda de classes por categoria: uma linha por categoria, quadros de largura fixa com a faixa escrita sobre a cor.
   *  linhas: [{nome, cores: [uma por classe]}] · rotulos: texto de cada classe ("< 40%", "40–50%"…). */
  Lab.legendaClasses = (linhas, rotulos, aria) => {
    const caixa = el("div", { class: "legenda-intensidade", role: "img", "aria-label": aria || `Legenda: ${rotulos.join(", ")}` });
    for (const l of linhas) {
      caixa.append(el("span", { class: "nome", text: l.nome.replaceAll("/", "/​") }));   // quebra após "/" no celular
      l.cores.forEach((cor, i) => { const q = el("span", { class: "quadro", text: rotulos[i] }); q.style.background = cor; Lab.comHalo(q, cor); caixa.append(q); });
    }
    return caixa;
  };
  /** Legenda categórica: amostra + nome, na ordem fixa das categorias. itens: [[cor, texto]]. */
  Lab.legendaCategorias = (itens, ...extras) => el("div", { class: "legenda" }, ...itens.map(([cor, texto]) => Lab.chave(cor, texto)), ...extras);
})();

/* ==== web/componentes/lab-mapa.js ==== */
/* lab-mapa.js — mapa coroplético com alternativa em círculos proporcionais (cartograma de Dorling). ADR L0003, L0006.
 *
 * Anatomia (design.yaml › padroes.mapa): barra sem fundo no topo (busca à esquerda, Mapa | Círculos à
 * direita) → desenho (com controles + − ⟲ no canto) → card da unidade selecionada → legendas → notas.
 * Lacunas em hachura (nunca cinza liso). Fora de escala: rótulo na margem esquerda com linha de ligação.
 *
 * Camadas (de baixo para cima — L0006): fundo opcional (raster Esri cinza ou vetorial OpenFreeMap) → referência
 * (UFs vizinhas, do IBGE; funciona offline) → unidades → limites finos (sobreposicao) → rótulos de referência →
 * seleção e foco.
 *
 * const m = Lab.mapa(alvo, {
 *   contornos,            // FeatureCollection; properties.id = chave da unidade
 *   sobreposicao,         // FeatureCollection fina desenhada por cima (ex.: municípios sob regiões) — opcional
 *   nome(id), preencher(id) → cor (token("cor-grade") = sem dado), dica(id) → linhas,
 *   abrir(id), rotuloAbrir, // botão do card (ex.: "Ver ficha do município →") — opcional
 *   rotuloAria, rotuloBusca,
 *   tamanho(id), rotuloTamanho,              // habilita Mapa | Círculos
 *   forma: { obter() → "mapa"|"bolhas", definir(v) },
 *   legenda,               // elemento de legenda de cor
 *   detalhado,             // muitas unidades pequenas (padrão: mais de 60): raios menores
 *   // ---- L0006 (todos opcionais) ----
 *   camera,                // "estado" (padrão) | {foco: id | [ids], contexto: 1.5, margens?: [topo, pé]} | {centro: [lon, lat], zoom: k}
 *   zoom,                  // false desliga zoom e arrasto (padrão: ligado)
 *   referencia,            // FeatureCollection de contexto (UFs vizinhas) desenhada por baixo, em cinza
 *   rotulos,               // [{nome, coord: [lon, lat]}] — poucas cidades de referência
 *   fundo,                 // null (padrão) | "esri-cinza" | "vetorial" (OpenFreeMap; o modelo carrega o MapLibre)
 *   escalaBolhas,          // "ds" (padrão: fora de escala acima de 3× a segunda) | "fiel" (área sempre proporcional)
 *   compacto, dimensoes,   // story: sem barra, legendas e notas; desenho [W, H] ocupando o contêiner; card dentro do mapa
 *   opacidade(id), foco(id), aoClicar(id)   // opcionais: opacidade do preenchimento, contorno de foco, aviso do toque
 * })
 * m.camera(camera, animar = true)  // move a câmera (story: um enquadramento por cartão)
 * m.atualizar({preencher, dica, opacidade, foco, nome}, {animar})   // troca cores e textos sem redesenhar
 * m.forma("mapa" | "bolhas", animar = true)                          // troca a forma (com a transição suave)
 * m.redesenhar()
 * Com ?editar=1 no endereço, o mapa mostra a câmera atual e "Copiar câmera" (para colar no roteiro de um story).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const DURACAO = 1400;      // ms, ida e volta (design.yaml › padroes.mapa_transicao) — vale também para a câmera
  const MORPH_MAX = 600;     // acima disso, transição alternativa (morph de milhares de polígonos trava o navegador)
  const ZOOM_MAX = 14;
  const PASSO_ZOOM = 1.8;
  let avisouFlubber = false, avisouMapLibre = false;
  const caminhoCirculo = (x, y, r) => `M${x - r},${y}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0Z`;
  function anelPrincipal(f, caminho) {
    const g = f.geometry, polis = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
    const maior = d3.greatest(polis, (p) => d3.geoArea({ type: "Polygon", coordinates: p }));
    return caminho({ type: "Polygon", coordinates: [maior[0]] });
  }
  /** Afasta os círculos o mínimo para não se sobreporem, partindo do centro de cada unidade. */
  function posicionarBolhas(nos, W, H) {
    const sim = d3.forceSimulation(nos).force("x", d3.forceX((n) => n.x0).strength(0.2)).force("y", d3.forceY((n) => n.y0).strength(0.2))
      .force("colisao", d3.forceCollide((n) => (n.r > 0 ? n.r + 0.8 : 0)).iterations(3)).stop();
    for (let i = 0; i < 300; i++) {
      sim.tick();
      for (const n of nos) {   // mantém as bolhas dentro da área do desenho
        n.x = Math.max(n.r + 2, Math.min(W - n.r - 2, n.x));
        n.y = Math.max(n.r + 2, Math.min(H - n.r - 2, n.y));
      }
    }
  }

  // ---------------------------------------------------------------- fundo (L0006)
  const ATRIBUICAO = {
    "esri-cinza": "Fundo: Esri, HERE, Garmin, © colaboradores do OpenStreetMap",
    vetorial: "Fundo: © OpenFreeMap · © colaboradores do OpenStreetMap",
  };
  const escuro = () => { const t = document.documentElement.dataset.theme; return t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); };
  const urlEsri = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${escuro() ? "World_Dark_Gray_Base" : "World_Light_Gray_Base"}/MapServer/tile/${z}/${y}/${x}`;
  const estiloVetorial = () => `https://tiles.openfreemap.org/styles/${escuro() ? "dark" : "positron"}`;
  // blocos de mapa (Web Mercator, mesma projeção do d3.geoMercator)
  const tileLon = (x, z) => (x / 2 ** z) * 360 - 180;
  const tileLat = (y, z) => { const n = Math.PI - (2 * Math.PI * y) / 2 ** z; return (180 / Math.PI) * Math.atan(Math.sinh(n)); };
  const lonTile = (lon, z) => Math.floor(((lon + 180) / 360) * 2 ** z);
  const latTile = (lat, z) => { const r = (lat * Math.PI) / 180; return Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z); };
  /** Fundo raster Esri cinza (L0006): os blocos visíveis com a transformação `t`, desenhados em `g` nas coordenadas da
   *  projeção (o grupo pai leva `t`); `s` = escala do desenho na página. Também usado por outros mapas (Lab.fundoRaster). */
  function desenharBlocos(g, proj, W, H, t, s = 1) {
    const z = Math.max(0, Math.min(17, Math.round(Math.log2((2 * Math.PI * proj.scale() * t.k * s * Math.min(2, devicePixelRatio || 1)) / 256))));
    const [lon0, lat0] = proj.invert(t.invert([0, 0])), [lon1, lat1] = proj.invert(t.invert([W, H]));
    const blocos = [];

  /** Transformação de zoom que realiza uma câmera (L0006). */
  function transformacaoCamera(camera, { caminho, proj, fc, W, H }) {

      const feats = fc.features.filter((f) => ids.has(f.properties.id));
      if (!feats.length) return d3.zoomIdentity;
      const [[x0, y0], [x1, y1]] = caminho.bounds({ type: "FeatureCollection", features: feats });

  Lab.mapa = (alvoExterno, opts) => {

          for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
          desenhar(Lab.semMovimento() ? null : anterior);

        } }));
      }
    }
    const desenhar = (de) => {
      Lab.esconderDica();
      alvo.style.minHeight = alvo.offsetHeight ? `${alvo.offsetHeight}px` : "";
      alvo.replaceChildren();
      desenharMapa(de);
      requestAnimationFrame(() => { alvo.style.minHeight = ""; });
    };
    const desenharMapa = (de) => {
      const [W, H] = compacto && opts.dimensoes ? opts.dimensoes.map((v) => Math.max(120, Math.round(v))) : [560, 620];
      const bolhas = Boolean(opts.tamanho) && opts.forma?.obter() === "bolhas";

      const nomes = fc.features.map((f) => [f.properties.id, nome(f.properties.id)]).sort((a, b) => a[1].localeCompare(b[1]));
      const idLista = `lista-${Math.random().toString(36).slice(2, 8)}`;

      busca.addEventListener("search", limparSeVazio);
      busca.addEventListener("input", limparSeVazio);
      // barra sem fundo no topo do mapa: busca à esquerda, Mapa | Círculos à direita

      const caminho = d3.geoPath(proj);

      const moldura = el("div", { class: `mapa-moldura${fundo ? " com-fundo" : ""}${compacto ? " compacto" : ""}` });

        .attr("role", "img").attr("aria-label", (opts.rotuloAria || "Mapa.") + (bolhas ? ` Círculos: área proporcional a ${opts.rotuloTamanho}.` : ""))
        .style("width", "100%").style("max-width", compacto ? "none" : "560px").style("height", compacto ? "100%" : "auto");

      const pad = svg.append("defs").append("pattern").attr("id", idHach).attr("patternUnits", "userSpaceOnUse").attr("width", 5).attr("height", 5).attr("patternTransform", "rotate(45)");
      pad.append("rect").attr("width", 5).attr("height", 5).attr("fill", Lab.token("cor-superficie"));
      pad.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 5).attr("stroke", Lab.token("cor-eixo")).attr("stroke-width", 1.6);

      if (opts.referencia) cena.append("g").attr("class", "referencia").selectAll("path").data(opts.referencia.features).join("path").attr("d", caminho);
      const semDado = Lab.token("cor-grade");

        escalaR = fiel ? d3.scaleSqrt().domain([0, maxV]).range([0, rMax]) : Lab.escalaArea(valores, rMax).s;

      if (bolhas) cena.append("g").selectAll("path").data(fc.features).join("path").attr("d", caminho)
        .attr("fill", (f) => (opts.preencher(f.properties.id) === semDado ? `url(#${idHach})` : "none")).attr("stroke", Lab.token("cor-eixo")).attr("stroke-width", 0.5);
      const formas = cena.append("g").selectAll("path").data(bolhas ? [...nos].sort((a, b) => b.r - a.r) : nos).join("path").attr("class", "u")
        .attr("data-u", (n) => n.id)

      const final = (n) => (bolhas ? caminhoCirculo(n.x, n.y, Math.max(n.r, 0.01)) : caminho(n.f));

            .attr("stroke", Lab.token("cor-superficie")).attr("stroke-width", 0.6)

      // fora de escala: rótulo na margem esquerda (área vazia), na altura do círculo, ligado por uma linha

          t.append("tspan").attr("x", tx).text(nome(n.id));
          t.append("tspan").attr("x", tx).attr("dy", 14).text(`${Lab.fmtCompacto(opts.tamanho(n.id) || 0)} · fora de escala`);

          .attr("stroke", Lab.token("cor-texto")).attr("stroke-opacity", 0.12).attr("stroke-width", 0.3).attr("pointer-events", "none");

          try {
            v.mapa = new maplibregl.Map({ container: v.caixa, style: estiloVetorial(), center: centro, zoom: zoomML, interactive: false, attributionControl: false, fadeDuration: 0 });
            v.mapa.on("error", (e) => console.warn("lab-mapa: fundo vetorial com erro —", e?.error?.message || e));
          } catch (e) {   // sem WebGL, por exemplo: o mapa segue sem fundo
            console.warn("lab-mapa: fundo vetorial indisponível —", e.message);
            v.caixa.remove(); est.vetorial = null;
            moldura.classList.remove("com-fundo"); moldura.querySelector(".mapa-atribuicao")?.remove();
          }
        } else { v.mapa.resize(); v.mapa.jumpTo({ center: centro, zoom: zoomML }); }
      };

      // ------------------------------------------------ câmera, zoom e arrasto (L0006)
      const aplicar = (t) => {
        est.transform = t;
        cena.attr("transform", t);
        // rótulos e marcadores mantêm o tamanho na tela (descontados o zoom e a escala do desenho na página)
        const f = (W / (est.svg.clientWidth || W)) / t.k;
        cena.selectAll(".rotulos-ref text, .rotulo-fora").style("font-size", (d, i, n) => `${(n[i].classList.contains("rotulo-fora") ? 11 : 12) * f}px`)
          .style("stroke-width", `${3 * f}px`);
        cena.selectAll(".rotulos-ref text").attr("x", 4 * f).attr("y", -4 * f);
        cena.selectAll(".rotulos-ref circle").attr("r", 2.4 * f);
        const vistos = [];
        cena.selectAll(".rotulos-ref > g").each(function () {
          this.style.display = "";
          const r = this.getBoundingClientRect();
          const bate = r.width && vistos.some((v) => r.left < v.right + 2 && r.right > v.left - 2 && r.top < v.bottom && r.bottom > v.top);
          if (bate) this.style.display = "none"; else if (r.width) vistos.push(r);
        });
        // no enquadramento inicial, um dedo é da página (ou do story, que passa o cartão deslizando para o lado)
        svg.style("touch-action", t.k > 1.01 ? "none" : compacto ? "pan-y" : "pan-x pan-y");
        posicionarPainel();
        sincronizarVetorial();
        for (const f of est.aoZoom) f(t);
      };
      const inicial = est.transform || transformacaoCamera(est.camera, est.geo);
      if (zoomAtivo) {
        const zoom = d3.zoom().scaleExtent([1, ZOOM_MAX]).translateExtent([[-W * 0.3, -H * 0.3], [W * 1.3, H * 1.3]]).clickDistance(4)
          .filter((ev) => {
            const k = (est.transform || d3.zoomIdentity).k;
            if (ev.type === "wheel") return ev.ctrlKey || ev.metaKey;           // roda sozinha rola a página
            if (ev.type.startsWith("touch")) return ev.touches.length > 1;   // um dedo nunca move o mapa (rola a página ou passa o cartão); dois dedos movem e ampliam (L0013)
            if (ev.type === "mousedown") return !ev.button && k > 1.01;          // arrastar só quando ampliado
            return !ev.button;
          })
          .on("zoom", (ev) => aplicar(ev.transform))
          .on("end", () => atualizarTiles());
        est.zoom = zoom;
        svg.call(zoom).on("dblclick.zoom", null);
        svg.style("touch-action", "pan-x pan-y");   // um dedo fica com a página (rolar, passar cartão); a pinça fica com o mapa
        svg.call(zoom.transform, inicial);
        // aviso: Ctrl + roda amplia (a roda sozinha continua rolando a página); dois dedos movem no celular
        const textoRoda = `${/Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl"} + roda do mouse para ampliar`;
        const avisoRoda = el("div", { class: "mapa-aviso", hidden: "", text: textoRoda });
        moldura.append(avisoRoda);
        let tAviso = null;
        function avisar(t) { avisoRoda.textContent = t; avisoRoda.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(() => { avisoRoda.hidden = true; }, 1400); }
        svg.on("wheel.aviso", (ev) => { if (ev.ctrlKey || ev.metaKey) return; avisar(textoRoda); });
        // arrastar com um dedo no mapa ampliado: lembrete dos dois dedos (tocar, sem arrastar, não avisa)
        svg.node().addEventListener("touchmove", (ev) => { if (ev.touches.length === 1 && (est.transform || d3.zoomIdentity).k > 1.01) avisar("Use dois dedos para mover o mapa"); }, { passive: true });
        const mover = (f) => { const s = d3.select(est.svg); (Lab.semMovimento() ? s : s.transition().duration(350)).call(f); };
        moldura.append(el("div", { class: "mapa-controles", role: "group", "aria-label": "Zoom do mapa" },
          el("button", { type: "button", "aria-label": "Ampliar", title: "Ampliar", text: "+", onclick: () => mover((s) => zoom.scaleBy(s, PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Reduzir", title: "Reduzir", text: "−", onclick: () => mover((s) => zoom.scaleBy(s, 1 / PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Voltar ao enquadramento inicial", title: "Voltar ao enquadramento", text: "⟲",
            onclick: () => api.camera(est.camera) })));
      } else {
        aplicar(inicial);
      }
      atualizarTiles();
      // modo de edição (?editar=1): mostra a câmera atual para copiar no roteiro
      if (editar) {
        const saida = el("code");
        const textoCamera = () => {
          const t = est.transform || d3.zoomIdentity, [lon, lat] = proj.invert(t.invert([W / 2, H / 2]));
          return `camera: {centro: [${lon.toFixed(3)}, ${lat.toFixed(3)}], zoom: ${t.k.toFixed(2)}}`;
        };
        const atualizarSaida = () => { saida.textContent = textoCamera(); };
        est.aoZoom = [atualizarSaida];
        atualizarSaida();
        moldura.append(el("div", { class: "mapa-editar" }, saida,
          el("button", { type: "button", text: "Copiar câmera", onclick: async (ev) => {
            try { await navigator.clipboard.writeText(textoCamera()); ev.target.textContent = "Copiado ✓"; } catch (e) { window.prompt("Copie a câmera:", textoCamera()); }
            setTimeout(() => { ev.target.textContent = "Copiar câmera"; }, 1500);
          } })));
      }
      if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => { aplicar(est.transform || d3.zoomIdentity); }).observe(est.svg);
      requestAnimationFrame(() => { sincronizarVetorial(); atualizarTiles(); });
    };

    const api = {
      /** Move a câmera ("estado" | {foco, contexto} | {centro, zoom}); animada, salvo prefers-reduced-motion. */
      camera(camera, animar = true) {
        est.camera = camera || "estado";
        if (!est.geo) return;
        const t = transformacaoCamera(est.camera, est.geo);
        if (!est.zoom) { est.transform = t; desenhar(null); return; }
        const s = d3.select(est.svg);
        (animar && !Lab.semMovimento() ? s.transition().duration(DURACAO).ease(d3.easeCubicInOut) : s).call(est.zoom.transform, t);
      },
      /** Troca cores, textos, opacidade e foco sem redesenhar (com transição). */
      atualizar(parcial = {}, { animar = true } = {}) {
        Object.assign(opts, parcial);
        if (est.recolorir) est.recolorir(animar);
      },
      /** Troca a forma (Mapa | Círculos) com a transição do design system. */
      forma(v, animar = true) {
        if (!opts.forma || !opts.tamanho || opts.forma.obter() === v) return;
        const anterior = opts.forma.obter();
        opts.forma.definir(v);
        if (ctrl) for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
        desenhar(animar && !Lab.semMovimento() ? anterior : null);
      },
      redesenhar() { desenhar(null); },
      /** Escala de raio das bolhas (para a legenda de tamanho no modo compacto — Q-062); null sem tamanho. */
      escalaTamanho() { return est.escalaR || null; },
    };
    desenharMapa(null);
    return api;
  };
})();

/* ==== web/componentes/lab-viz.js ==== */
/* lab-viz.js — renderizador da Visualização declarativa (L0007, L0008, L0011–L0013).
 *
 * Recebe o PLANO compilado em Python (labdados.viz.compilar, a partir do viz.yaml) e desenha a peça: moldura (chapéu,
 * título com controles, subtítulo, abas do companheiro, palco, N, legenda, barra fixa com folhas), cartão de detalhe,
 * legenda interativa, anotações, imagem PNG do estado do momento, CSV e código para embutir. Os gráficos vêm de
 * ADAPTADORES por componente do registro do DS (design/padrao/componentes.yaml): Lab.viz.adaptadores.<id>.
 *
 * Só desenha (L0002): todo número e todo texto com número chega pronto do Python, por estado ({e.…} no plano).
 * Nada de cor ou tamanho fixo: tokens do DS (Lab.token) e cores do produto declaradas no plano (estilo.tokens).
 * Comportamentos decididos na bancada de formatos (docs/bancada.html, fase 0) e registrados na L0013. */
(function () {
  "use strict";
  const { el } = Lab;
  const tok = (n) => Lab.token(n);
  const FORMATOS = { retrato: { w: 360, h: 450, rot: "Retrato 4:5" }, quadrado: { w: 400, h: 400, rot: "Quadrado 1:1" }, paisagem: { w: 640, h: 360, rot: "Paisagem 16:9" } };
  const ANOT_MAX = { retrato: 1, quadrado: 2, paisagem: 3 };       // prioridade máxima visível por formato (L0008)
  const ROTULOS_MAX = { retrato: 3, quadrado: 3, paisagem: 5 };    // rótulos diretos de pontos
  const LIMITE_TEXTO = { retrato: 110, quadrado: 140, paisagem: 200 };   // acima disso, “…” que abre no clique (Q-036)
  const ALTURA_GRAFICO = { retrato: 0.95, quadrado: 0.7, paisagem: 0.5 }; // altura do palco pela largura (altura livre)
  const TAM_IMG = { retrato: [360, 450], quadrado: [400, 400], paisagem: [640, 360] };
  const TETO_IMG = { retrato: 16 / 9, quadrado: 5 / 4, paisagem: 3 / 4 };  // a imagem cresce até 9:16, 4:5, 4:3
  const ESCALA_IMG = 3;
  const formatoFluido = (w) => (w < 480 ? "retrato" : w < 720 ? "quadrado" : "paisagem");
  const formatoQuadro = (w, h) => { const r = w / h; return r < 0.9 ? "retrato" : r <= 1.25 ? "quadrado" : "paisagem"; };
  const negrito = (t) => String(t).split(/⟦|⟧/).map((p, i) => (i % 2 ? el("b", { text: p }) : p));
  const semMarcas = (t) => String(t).replace(/⟦|⟧/g, "");
  const curto = (n, k = 24) => (n.length > k ? `${n.slice(0, k - 1)}…` : n);
  const caixaRelativa = (no, palco) => { const r = no.getBoundingClientRect(), p = palco.getBoundingClientRect(); return { x: r.left - p.left, y: r.top - p.top, w: r.width, h: r.height }; };

  // ------------------------------------------------------------------ marcadores do plano
  /** "{e.caminho}" sozinho devolve o valor (número, objeto, null); dentro de um texto, é substituído. "{c.id}" fica
   *  para quem monta o título (controle no lugar). Um trecho "$id" no caminho é o valor atual do controle `id`
   *  ({e.explore.$variavel.dados}): dados e frases de um cartão variam com o seletor, todos calculados no Python. */
  const pegar = (obj, caminho) => caminho.split(".").reduce((o, k) => (o == null ? undefined : o[k.startsWith("$") ? obj?.$?.[k.slice(1)] : k]), obj);
  function resolver(v, e) {
    if (typeof v !== "string") return Array.isArray(v) ? v.map((x) => resolver(x, e)) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolver(x, e)])) : v;
    const so = v.match(/^\{e\.([\w.$]+)\}$/);
    if (so) return pegar(e, so[1]);
    return v.replace(/\{e\.([\w.$]+)\}/g, (_, c) => { const x = pegar(e, c); return x == null ? "" : String(x); });
  }

  // ------------------------------------------------------------------ peça
  /** Monta a Visualização em `alvo`. opcoes: { host: "pagina" | "embed", carregarFatia(chave) → Promise<fatia> }. */
  function montar(alvo, P, opcoes = {}) {
    const host = opcoes.host || "pagina";
    const est = { aba: "principal", sel: null, legFixa: null, anotAberta: false, cam: null };
    for (const c of P.controles || []) est[c.id] = c.inicial;
    // estado inicial pelo endereço: #municipio=2211001&aba=mapa (um link reproduz a vista)
    try {
      const q = new URLSearchParams(location.hash.slice(1));
      for (const c of P.controles || []) if (q.has(c.id)) est[c.id] = q.get(c.id);
      if (q.get("aba") === "mapa") est.aba = "mapa";
      if (q.has("cartao")) est.cartao = q.get("cartao");
    } catch (erro) { /* mantém o padrão */ }
    const ctl = Object.fromEntries((P.controles || []).map((c) => [c.id, c]));
    const fatiador = (P.controles || []).find((c) => c.tipo === "busca" && P.fatias && c.campo === P.fatias.campo);
    let fatia = null, e = {}, linhas = [];
    const indice = P.fatias ? new Map(P.fatias.indice.map(([k, nome, uf]) => [k, { nome, uf, rotulo: uf ? `${nome} (${uf})` : nome }])) : null;

    let reuso = null;   // estado entre cartões: {componente, inst, palco} do cartão anterior (irCartao → desenharPalco)
    // ---------------------------------------------------------------- story (Q-066): cartões sobre o mesmo plano
    const story = Array.isArray(P.cartoes) && P.cartoes.length > 0;
    /** Condição do cartão, calculada no Python (textos da fatia); "!" inverte. */
    const condicao = (se) => { if (!se) return true; const v = Boolean(e[se.replace(/^!/, "")]); return se.startsWith("!") ? !v : v; };
    const cartoesVisiveis = () => (story ? P.cartoes.filter((k) => condicao(k.se)) : []);
    const cartaoAtual = () => { if (!story) return null; const ks = cartoesVisiveis(); return ks.find((k) => k.id === est.cartao) || ks[0]; };

    const lerFatia = (f) => {
      const L = (f.linhas || []).map((r) => Object.fromEntries((f.colunas || []).map((c, i) => [c, r[i]])));
      const esc = Object.fromEntries(Object.entries(f).filter(([, v]) => v === null || typeof v !== "object"));
      const ee = { ...esc, ...(f.textos || {}) };
      Object.defineProperty(ee, "$", { value: est, enumerable: false });   // marcadores com "$controle"
      return { linhas: L, e: ee };
    };
    async function irPara(chave) {
      const f = await opcoes.carregarFatia(chave);
      fatia = f; ({ linhas, e } = lerFatia(f));
      est.sel = null; est.legFixa = null; est.anotAberta = false; est.cam = null;
      // troca de recorte (ex.: outra cidade): o desenho velho esmaece e o novo surge, como na troca de cartão
      const atual = alvoRaiz.querySelector("article.viz");
      if (atual?._palco && host !== "embed") trocarCartao(atual, () => {}); else render();
    }
    function guardarEndereco() {
      const q = new URLSearchParams();
