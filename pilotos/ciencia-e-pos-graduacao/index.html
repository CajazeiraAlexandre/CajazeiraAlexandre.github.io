<style>
/* ==== web/componentes/lab.css ==== */
/* lab.css — estilos dos componentes de interface do Laboratório de Dados Públicos.
 * Design system padrão (design/padrao/design.yaml, seção `padroes`); ADR L0003.
 * Usa só os tokens de design/<ds>/tokens.css (--cor-*, --fs-*, --espaco-*…): nenhuma cor fixa
 * além de sombras e do halo de rótulos. Os produtos embutem este arquivo no HTML único (L0002).
 *
 * Seções: página e episódios · controles · cartões e grades · marcas e seleção · mapa ·
 *         seletores no título · legendas · barras 100% · textos de apoio · tabelas e quadros ·
 *         dica · fluxos (Sankey) · rodapé e bloco de metodologia
 */
*{box-sizing:border-box}
html{overflow-anchor:none}
body{margin:0;background:var(--cor-fundo);color:var(--cor-texto);font-family:var(--fonte-texto);font-size:var(--fs-texto);line-height:var(--entrelinha)}
main{max-width:var(--largura-max);margin:0 auto;padding:0 var(--margem-lateral, var(--espaco-m)) var(--espaco-g)}
header.capa{max-width:var(--largura-texto);padding:var(--espaco-g) 0 var(--espaco-m)}
h1{font-family:var(--fonte-titulo);font-size:var(--fs-titulo);font-weight:var(--peso-titulo);line-height:1.15;margin:0 0 var(--espaco-p)}
h2{font-size:var(--fs-subtitulo);line-height:1.2;margin:var(--espaco-g) 0 var(--espaco-p)}
h3{font-size:var(--fs-grafico-titulo);margin:var(--espaco-m) 0 var(--espaco-p);line-height:1.25}
p{max-width:var(--largura-texto)}
.lead{color:var(--cor-texto-secundario)}
.nota{font-size:var(--fs-nota);color:var(--cor-texto-secundario)}
.aviso{border-left:3px solid var(--cor-status-atencao);background:var(--cor-superficie);padding:var(--espaco-p) var(--espaco-m);font-size:var(--fs-nota);margin:var(--espaco-p) 0;max-width:var(--largura-texto)}
/* navegação entre episódios: fixa no topo, rolável no celular */
nav.episodios{position:sticky;top:0;z-index:10;background:var(--cor-fundo);border-bottom:1px solid var(--cor-borda);
     display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0;-webkit-overflow-scrolling:touch}
nav.episodios::-webkit-scrollbar{display:none}
nav.episodios button{flex:0 0 auto;font:inherit;font-size:14px;border:1px solid var(--cor-borda);background:var(--cor-superficie);
     color:var(--cor-texto);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
nav.episodios button[aria-current="true"]{background:var(--cor-texto);color:var(--cor-fundo);border-color:var(--cor-texto)}
nav.episodios .num{font-variant-numeric:tabular-nums;opacity:.7;margin-right:4px}
section.episodio{display:none}
section.episodio.entrando{animation:entrar .25s ease}
section.episodio.ativo{display:block}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.episodio.entrando{animation:none}html{scroll-behavior:auto}}
.passo{display:flex;justify-content:space-between;gap:var(--espaco-m);margin-top:var(--espaco-g);border-top:1px solid var(--cor-borda);padding-top:var(--espaco-m)}
.passo button{font:inherit;font-size:15px;border:1px solid var(--cor-borda);background:var(--cor-superficie);color:var(--cor-texto);
     border-radius:var(--raio);padding:10px 14px;cursor:pointer;min-height:44px;max-width:48%}
.passo button.proximo{margin-left:auto;background:var(--cor-texto);color:var(--cor-fundo);border-color:var(--cor-texto)}
.controles{display:flex;flex-wrap:wrap;gap:var(--espaco-m);align-items:flex-end;margin:var(--espaco-m) 0}
.campo{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-nota);color:var(--cor-texto-secundario);min-width:0}
select{font:inherit;font-size:15px;color:var(--cor-texto);background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:8px;max-width:100%;min-height:40px}
.alternar{display:inline-flex;flex-wrap:wrap;align-self:flex-start;width:fit-content;border:1px solid var(--cor-borda);border-radius:var(--raio);overflow:hidden;max-width:100%}
.alternar button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--cor-texto);padding:8px 12px;cursor:pointer;min-height:40px}
.alternar button[aria-pressed="true"]{background:var(--cor-texto);color:var(--cor-fundo)}
/* versão compacta, abaixo dos gráficos (Mapa | Círculos, Tamanho) */
.campo.compacto{flex-direction:row;align-items:center;gap:8px;margin:var(--espaco-s,8px) 0;font-size:12px}
.alternar.pequeno button{font-size:12px;padding:3px 10px;min-height:28px}
.botao-modo{font:inherit;font-size:14px;border:1px solid var(--cor-borda);background:var(--cor-superficie);color:var(--cor-texto);
  border-radius:var(--raio);padding:8px 12px;min-height:40px;cursor:pointer}
.botao-modo:hover,.botao-modo:focus-visible{border-color:var(--cor-texto)}
.grade2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--espaco-g);align-items:start}
@media (max-width:768px){.grade2{grid-template-columns:minmax(0,1fr)}}
.cartao{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:var(--espaco-m);min-width:0}
svg{display:block}
svg text{fill:var(--cor-texto-secundario);font-size:var(--fs-grafico-eixo)}
/* contorno padrão de todas as marcas (polígonos, círculos fixos ou proporcionais, pontos) */
.mapa path.u,circle.ponto{stroke:var(--cor-texto);stroke-opacity:.42;stroke-width:.7}
circle.ponto.discrepante{stroke-opacity:1;stroke-width:1.6}
.com-selecao path.u:not(.selecionado),.com-selecao [data-u]:not(.selecionado) circle.ponto,.com-selecao circle.ponto[data-u]:not(.selecionado){opacity:.45}
.mapa path.u.selecionado,[data-u].selecionado circle.ponto,circle.ponto.selecionado{stroke:var(--cor-texto);stroke-opacity:1;stroke-width:2.6}
.lupa{display:flex;align-items:center;gap:6px;margin:6px 0;max-width:340px}
.lupa input{flex:1;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--cor-borda);border-radius:var(--raio);background:var(--cor-superficie);color:var(--cor-texto);min-height:38px}
.painel-sel[hidden]{display:none}
/* Mapa | Círculos sobre o canto inferior direito do desenho */
.mapa-moldura{position:relative;max-width:560px}
.barra-mapa{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;max-width:560px;margin:6px 0 2px}
.barra-mapa .lupa{margin:0;flex:0 1 300px;min-width:0}
.barra-mapa .lupa input{min-width:0;width:100%}
.barra-mapa .alternar{flex:none}
.alternar.no-mapa button{font-size:12px;padding:3px 9px;min-height:30px}
/* seletor dentro do título: as opções são parte da frase */
.seletor-titulo button{font:inherit;border:0;background:none;padding:0 1px;margin:0;cursor:pointer;color:var(--cor-texto-secundario);
  text-decoration:underline dotted;text-underline-offset:4px}
.seletor-titulo button[aria-pressed="true"]{color:var(--cor-texto);text-decoration:underline solid 2px;text-underline-offset:4px}
.seletor-titulo button:hover,.seletor-titulo button:focus-visible{color:var(--cor-destaque)}
.lista-titulo{font:inherit;color:var(--cor-texto);background:transparent;border:0;border-bottom:2px solid var(--cor-texto);border-radius:0;
  padding:0 1.1em 0 1px;cursor:pointer;max-width:100%;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.lista-titulo:hover,.lista-titulo:focus-visible{color:var(--cor-destaque);border-bottom-color:var(--cor-destaque)}
.lista-titulo option{font-weight:400}
.seletor-titulo .sep{color:var(--cor-texto-secundario);font-weight:400}
.legendas-mapa{margin:4px 0 var(--espaco-p);max-width:560px}
.legendas-mapa > .legenda:first-child,.legendas-mapa > .legenda-intensidade:first-child{margin-top:0}
/* painel sob o gráfico: só quando o mapa não está ao lado (celular / coluna única) */
@media (min-width:769px){.grade2 .painel-sel.painel-grafico{display:none}}
/* legenda da liderança: grade fixa — mesma largura de quadro para todos os grupos, faixa escrita sobre a cor */
.legenda-intensidade{display:grid;grid-template-columns:minmax(0,8em) repeat(4,minmax(36px,46px));gap:2px;align-items:center;
  margin-top:var(--espaco-p);font-size:13px;color:var(--cor-texto)}
.legenda-intensidade .nome{font-weight:600;font-size:12px;padding-right:6px;line-height:1.1;overflow-wrap:anywhere;min-width:0}
.legenda-intensidade .quadro{height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  border-radius:2px;white-space:nowrap;text-shadow:0 0 2px var(--halo,transparent),0 0 1px var(--halo,transparent)}
.painel-sel{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;background:var(--cor-fundo);border:1px solid var(--cor-borda);border-left:4px solid var(--cor-texto);border-radius:var(--raio);padding:8px 12px;margin-top:8px;font-size:14px}
.painel-sel b{font-size:16px;flex-basis:100%}
.painel-sel .acoes-sel{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap}
.painel-sel .acoes-sel button{margin-top:4px}
details.info{margin:2px 0 10px;font-size:13px;color:var(--cor-texto-secundario)}
details.info summary{cursor:pointer;display:inline-block;color:var(--cor-texto-secundario);list-style:none;border:1px solid var(--cor-borda);border-radius:999px;padding:2px 10px;font-size:12.5px}
details.info summary::-webkit-details-marker{display:none}
details.info[open] summary{color:var(--cor-texto)}
details.info p{margin:6px 0 0;max-width:var(--largura-texto)}
details.info-notas{display:inline;margin:0 0 0 6px}
details.info-notas[open]{display:block;margin:6px 0 0}
h2.sub{font-size:20px;margin-top:var(--espaco-gg)}
.mapa path.u:hover{stroke-opacity:1;stroke-width:1.6}
.mapa path.u.ligado{stroke:var(--cor-texto);stroke-opacity:1;stroke-width:2.4}
circle.ponto.ligado{stroke:var(--cor-texto);stroke-width:2.6;fill-opacity:1}
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--cor-texto-secundario);margin-top:var(--espaco-p);align-items:center}
/* legenda interativa (Lab.linhasPontas › legenda): destaca a série no hover/foco; tocar fixa (L0003, graficos.linhas_pontas) */
.legenda-interativa{gap:6px 8px}
.legenda-interativa .item-legenda{font:inherit;font-size:14px;color:var(--cor-texto-secundario);background:none;border:1px solid transparent;border-radius:var(--raio);padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.legenda-interativa .item-legenda:hover,.legenda-interativa .item-legenda:focus-visible{border-color:var(--cor-borda);color:var(--cor-texto)}
.legenda-interativa .item-legenda[aria-pressed="true"]{border-color:var(--cor-texto);color:var(--cor-texto)}
.legenda-interativa .item-legenda.apagada{opacity:.4}
.amostra-linha{display:inline-block;width:20px;height:0;border-top:3px solid currentColor;border-radius:2px}
.amostra-linha.tracejada{border-top-style:dashed}
.chave{display:inline-flex;align-items:center;gap:6px}
.chave .amostra{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 12px}   /* amostra própria do item, em qualquer contêiner (L0013) */
.legenda .chave{display:inline-flex;align-items:center;gap:8px}
.legenda .amostra{width:18px;height:18px;border-radius:3px;display:inline-block}
.legenda .rampa{display:inline-flex;gap:2px}
.legenda .rampa span{width:22px;height:16px;display:inline-block}
/* legendas de escala: ~70% da largura do gráfico */
.legenda-larga{width:min(70%,100%);max-width:560px;flex-wrap:nowrap}
.legenda-larga .rampa{flex:1;display:flex}
.legenda-larga .rampa span{flex:1;width:auto}
.legenda.legenda-larga:has(.chave){flex-wrap:wrap;width:min(100%,560px)}
/* escala contínua: rampa na largura toda, rótulos das pontas embaixo */
.legenda-larga:not(:has(.chave)){display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.legenda-larga:not(:has(.chave)) > .rampa{grid-column:1/-1;grid-row:1}
.legenda-larga:not(:has(.chave)) > span:first-child{grid-row:2;justify-self:start}
.legenda-larga:not(:has(.chave)) > span:last-child{grid-row:2;justify-self:end}
.legenda.legenda-larga .chave{flex:1 1 30%;min-width:140px}
/* rampa divergente com três marcos: início, centro e fim */
.legenda-tres{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;width:min(100%,560px)}
.legenda-tres > .rampa{grid-column:1/-1;display:flex}
.legenda-tres > .rampa span{flex:1;width:auto}
.legenda-tres > span:nth-child(2){justify-self:start}
.legenda-tres > span:nth-child(3){justify-self:center;text-align:center}
.legenda-tres > span:nth-child(4){justify-self:end;text-align:right}
.legenda.legenda-larga .chave .rampa{flex:1}
.composicao{container-type:inline-size}   /* as quebras seguem o espaço do bloco, não a tela (L0008) */
.composicao .linha{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;margin:6px 0;font-size:14px}
@container (max-width:420px){.composicao .linha{grid-template-columns:minmax(0,1fr);gap:2px;margin:4px 0}.composicao .linha .rot{font-weight:600}}
@media (max-width:480px){.composicao .linha{grid-template-columns:minmax(0,1fr)}.composicao .linha .rot{font-weight:600}}
.composicao .barra{display:flex;height:22px;gap:2px}
.composicao .barra span{height:100%;min-width:2px;position:relative}
.composicao .barra span:first-child{border-radius:4px 0 0 4px}
.composicao .barra span:last-child{border-radius:0 4px 4px 0}
.composicao .barra span b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
     text-shadow:0 0 2px var(--halo,transparent),0 0 2px var(--halo,transparent),0 0 1px var(--halo,transparent)}
.composicao .barra{position:relative}
.composicao .barra::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:2px dotted var(--cor-texto);opacity:.75;pointer-events:none}
.amostra-50{display:inline-block;width:0;height:14px;border-left:2px dotted var(--cor-texto)}
.amostra.hachura{background:repeating-linear-gradient(45deg,var(--cor-ausente-contorno,var(--cor-eixo)) 0 1.5px,var(--cor-ausente,var(--cor-superficie)) 1.5px 5px);border:1px solid var(--cor-ausente-contorno,var(--cor-eixo))}
.instrucao{font-size:14px;color:var(--cor-texto-secundario);margin:2px 0 8px}
.placar{font-size:15px;font-weight:600;margin:4px 0 2px;max-width:none}
.rodape-grafico{font-size:12.5px;line-height:1.5;color:var(--cor-texto-secundario);border-top:1px solid var(--cor-borda);margin-top:12px;padding-top:8px}
.rodape-grafico a{color:inherit}
.grade-evolucao{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:var(--espaco-m)}
.frases-quartis{font-size:13px;color:var(--cor-texto-secundario);margin:8px 0 0;padding-left:18px}
.composicao .vazio{font-size:var(--fs-nota);color:var(--cor-texto-suave)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:var(--espaco-p);margin:var(--espaco-p) 0}
.tile{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:10px 12px}
.tile .rot{font-size:14px;color:var(--cor-texto-secundario);display:flex;align-items:center;gap:6px}
.tile .val{font-size:24px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--cor-grade);text-align:left;vertical-align:top}
th{color:var(--cor-texto-secundario);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rolagem{overflow-x:auto;max-width:100%}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:7px;vertical-align:-2px}
.dica{position:fixed;pointer-events:none;background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--raio);
      padding:6px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.15);display:none;z-index:30;max-width:280px}
.dica b{display:block;font-size:15px}
.sankey path.fluxo{fill:none;stroke-opacity:.35}
.sankey path.fluxo:hover{stroke-opacity:.7}
.sankey path.fluxo{transition:stroke-opacity .2s}
.sankey path.fluxo.realce{stroke-opacity:.8}
.sankey path.fluxo.apagado{stroke-opacity:.07}
@media (prefers-reduced-motion:reduce){.sankey path.fluxo{transition:none}}
.sankey rect{shape-rendering:crispEdges}
.lista-mun{font-size:13px;columns:4 150px;column-gap:16px;margin:6px 0 0;padding-left:16px;line-height:1.45}
.caixa-lista{max-height:220px;overflow:auto;border:1px solid var(--cor-borda);border-radius:var(--raio);padding:8px 12px;margin-top:8px;background:var(--cor-fundo)}
.botoes-sankey{display:flex;gap:8px;flex-wrap:wrap}
.botoes-sankey button{margin-top:0}
button.tile-botao{font:inherit;color:inherit;text-align:left;cursor:pointer;border:1px solid var(--cor-borda)}
button.tile-botao:hover{border-color:var(--cor-grupo)}
button.tile-botao[aria-pressed="true"]{border:2px solid var(--cor-grupo);box-shadow:inset 0 0 0 1px var(--cor-grupo);padding:9px 11px}
button.tile-botao:focus-visible{outline:2px solid var(--cor-texto);outline-offset:2px}
footer{margin-top:var(--espaco-gg);border-top:1px solid var(--cor-borda);padding-top:var(--espaco-m)}
details.metodologia{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--raio)}
details.metodologia > summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
details.metodologia > summary::-webkit-details-marker{display:none}
details.metodologia > summary::before{content:"▸";font-size:14px;color:var(--cor-texto-secundario);transition:transform .2s}
details.metodologia[open] > summary::before{transform:rotate(90deg)}
.met-titulo{font-size:19px;font-weight:700;color:var(--cor-texto)}
.met-sub{font-size:13px;color:var(--cor-texto-secundario)}
.met-corpo{padding:0 18px 18px;font-size:14.5px}
.met-secao{border-top:1px solid var(--cor-grade);padding-top:6px;margin-top:10px}
.met-secao h3{font-size:16px;margin:8px 0}
.met-secao p{max-width:var(--largura-texto)}
ol.passos{padding-left:20px} ol.passos li{margin:10px 0} ol.passos p{margin:4px 0}
ul.arquivos{margin:0;padding-left:14px;font-size:12px;color:var(--cor-texto-secundario)}
ul.adrs{padding-left:18px} ul.adrs li{margin:8px 0}
/* bloco em camadas na folha ✎ Notas e fontes (L0014) */
.met-camadas{display:grid;gap:0;margin-top:8px;border-top:1px solid var(--cor-grade)}
details.met-camada{border-bottom:1px solid var(--cor-grade)}
details.met-camada > summary{cursor:pointer;font-weight:600;padding:8px 2px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.met-camada > summary::-webkit-details-marker{display:none}
details.met-camada > summary::after{content:"▸";color:var(--cor-texto-secundario);transition:transform .2s}
details.met-camada[open] > summary::after{transform:rotate(90deg)}
.met-corpo-camada{padding:0 2px 10px;font-size:13px;min-width:0}
.met-corpo-camada pre{white-space:pre;overflow-x:auto;font-size:11px;max-width:100%}
.met-corpo-camada table{font-size:12px}
details.codigo summary,details.pergunta summary{cursor:pointer;font-size:13px;color:var(--cor-texto-secundario)}
details.pergunta{margin:6px 0} details.pergunta summary{font-size:14.5px;color:var(--cor-texto);font-weight:600}
details.codigo pre{background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:10px;overflow:auto;font-size:12px;max-height:360px}
.assinatura-final{font-size:13px;color:var(--cor-texto-secundario);margin:12px 0 0}
.fora-escala{stroke-dasharray:4 3;stroke:var(--cor-texto)!important;stroke-opacity:1!important;stroke-width:1.6!important}
.rotulo-fora{font-size:11px;font-weight:600;fill:var(--cor-texto);paint-order:stroke;stroke:var(--cor-superficie);stroke-width:3px}
footer p{margin:4px 0;max-width:none}
.assinatura{font-size:14px;color:var(--cor-texto-secundario);margin:0 0 var(--espaco-p)}
.assinatura a{color:var(--cor-texto);text-decoration-color:var(--cor-eixo)}
/* separa o nome do autor do link para o bloco de metodologia (não parecem um link só) */
.assinatura .sep-assinatura{display:inline-block;margin:0 14px;color:var(--cor-eixo)}
button.voltar{font:inherit;font-size:15px;border:1px solid var(--cor-borda);background:var(--cor-superficie);color:var(--cor-texto);
     border-radius:var(--raio);padding:10px 14px;cursor:pointer;min-height:44px;margin-top:var(--espaco-m)}
a{color:var(--cor-destaque)}
.carregando{padding:var(--espaco-gg) 0;color:var(--cor-texto-secundario)}

/* legenda interativa (Lab.sankey): item destaca os fluxos da categoria */
.legenda-interativa .chave{cursor:pointer;border-radius:3px;padding:1px 4px;margin:-1px -4px}
.legenda-interativa .chave:hover,.legenda-interativa .chave:focus-visible{background:var(--cor-grade);outline:none}
/* legendas do sankey: centralizadas; com duas variáveis, uma acima (primeiro lado) e outra abaixo (último lado) */
.legenda-sankey{justify-content:center;text-align:center;margin:10px auto 12px}
.legenda-sankey .lado-legenda{flex-basis:100%;font-weight:700;font-size:14px;margin-bottom:2px}
svg.sankey{display:block;margin-left:auto;margin-right:auto}
/* card da distribuição do destaque no sankey (mesmo visual do card do mapa) */
.painel-sankey{max-width:620px;margin:10px auto}
.painel-sankey .bloco-dist{flex-basis:100%;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.painel-sankey .bloco-dist strong{font-size:13px;margin-top:4px}
/* mapa: câmera, zoom, card flutuante, referência e fundo opcional (L0006; design.yaml › padroes.mapa_camera) */
.mapa{position:relative;z-index:1;display:block}
.mapa path,.mapa circle{vector-effect:non-scaling-stroke}
.mapa-moldura>.mapa-fundo{position:absolute!important;left:0;top:0;z-index:0;pointer-events:none;transition:opacity .4s;background:transparent}
.mapa .referencia path{fill:var(--cor-grade);fill-opacity:.55;stroke:var(--cor-eixo);stroke-opacity:.55;stroke-width:.6}
.com-fundo .mapa .referencia path{fill-opacity:.1}
.mapa .fundo-ref{fill:var(--cor-grade);fill-opacity:.55}
.com-fundo .mapa .fundo-ref{fill-opacity:0}
.com-fundo .mapa path.u{fill-opacity:.85}
.mapa .rotulos-ref text{font-size:11.5px;font-weight:600;fill:var(--cor-texto);paint-order:stroke;stroke:var(--cor-superficie);stroke-width:3px}
.mapa .rotulos-ref circle{fill:var(--cor-texto)}
.mapa-controles{position:absolute;top:8px;right:8px;z-index:3;display:flex;flex-direction:column;gap:4px}
.mapa-controles button{width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--cor-borda);background:var(--cor-superficie);color:var(--cor-texto);font:inherit;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapa-controles button:hover{border-color:var(--cor-texto)}
.mapa-aviso{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:rgba(0,0,0,.72);color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;pointer-events:none;white-space:nowrap}
.mapa-aviso[hidden],.mapa-moldura .painel-sel[hidden]{display:none}
.mapa-atribuicao{position:absolute;right:4px;bottom:4px;z-index:3;font-size:10px;line-height:1.3;color:var(--cor-texto-secundario);background:color-mix(in srgb,var(--cor-superficie) 82%,transparent);padding:1px 5px;border-radius:3px;max-width:90%}
.painel-sel.flutuante{position:absolute;z-index:4;max-width:min(280px,80%);margin:0;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.mapa-editar{position:absolute;left:4px;top:4px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:80%;background:var(--cor-superficie);border:1px dashed var(--cor-destaque);border-radius:6px;padding:6px 8px;font-size:11px}
.bloco-mapa.compacto,.mapa-moldura.compacto{height:100%;max-width:none}
.mapa path.u.foco{stroke:var(--cor-texto);stroke-opacity:1;stroke-width:2}
.painel-sel.rodape{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;margin:0;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.painel-sel.rodape{font-size:12.5px;line-height:1.35;padding:6px 10px;gap:1px 10px;max-height:46%;overflow:auto}
.painel-sel.rodape b{font-size:14px}
.painel-sel.rodape .acoes-sel button{margin-top:2px;padding:2px 8px;font-size:12px;min-height:28px}
.painel-sel.rodape.topo{top:8px;bottom:auto}
.painel-sel.rodape span{flex-basis:100%}

/* legenda-foco (Lab.legendaFoco): categoria destacada; as demais esmaecem — barras e linhas de tabela (pesquisador, 2026-10-12) */
.barra span[data-cat]{transition:opacity .2s}
.barra span.esmaecido{opacity:.22}
tr[data-cat].esmaecido td{opacity:.4}
tr[data-cat].em-foco td{font-weight:600}
.legenda-interativa .item-legenda .amostra{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.barra span[data-cat]{transition:none}}
/* tabela de dados (Lab.tabelaDados): linhas recolhidas, busca e CSV */
.tabela-dados{margin:var(--espaco-p) 0}
.tabela-barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:6px}
.tabela-barra .nota{margin-right:auto}
.tabela-busca{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--cor-borda);border-radius:var(--raio);background:var(--cor-superficie);color:var(--cor-texto);min-width:0;flex:0 1 220px}
.tabela-baixar,.tabela-mais{font:inherit;font-size:13px;font-weight:600;padding:4px 12px;border:1px solid var(--cor-borda);border-radius:999px;background:var(--cor-superficie);color:var(--cor-texto);cursor:pointer;min-height:32px}
.tabela-baixar:hover,.tabela-mais:hover,.tabela-baixar:focus-visible,.tabela-mais:focus-visible{border-color:var(--cor-texto)}
.tabela-mais{margin-top:6px}
/* barra na célula (D15) e cor nas células (D16) — padroes.tabelas */
.tabela-dados td.cel-barra{background:linear-gradient(90deg,color-mix(in srgb,var(--cor-cat-1) 26%,transparent) var(--p),transparent var(--p)) left center/100% 72% no-repeat}
.tabela-dados td.cel-calor{background:color-mix(in srgb,var(--cor-seq-6,var(--cor-cat-1)) var(--p),transparent)}
/* diagrama de fluxo dos dados (Lab.diagramaFluxo): bases → operações → saídas (pesquisador, 2026-10-12) */
.fluxo{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:var(--espaco-p) 48px;margin:var(--espaco-p) 0;align-items:start;max-width:980px}
.fluxo-col-1{padding-left:30px}   /* margem para os arcos entre operações */
.fluxo-col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.fluxo-col > h4{margin:0 0 2px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--cor-texto-secundario)}
.fluxo-no{border:1px solid var(--cor-borda);border-left:4px solid var(--cor-fluxo,var(--cor-borda));border-radius:var(--raio);background:var(--cor-superficie);padding:7px 9px;font-size:13.5px;line-height:1.3;transition:opacity .2s;cursor:default}
.fluxo-no b{display:block;font-size:14px}
.fluxo-no .tipo{display:inline-block;font-size:11px;font-weight:700;color:var(--cor-texto-secundario);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.fluxo-no .nota{display:block;margin-top:2px}
.fluxo-no .de{display:none}
.fluxo-no a{color:inherit}
.fluxo-no.restrita .tipo::after{content:" · restrita";color:var(--cor-status-grave)}
.fluxo.focado .fluxo-no:not(.ligado){opacity:.28}
/* operações transversais (ex.: supressão): faixa à parte, sob as três colunas, sem ligações (pesquisador, 2026-10-14) */
.fluxo-envelope{max-width:980px}
.fluxo-transversais{margin:var(--espaco-p) 0;padding:8px 10px 10px;border:1px dashed var(--cor-borda);border-radius:var(--raio);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:stretch}
.fluxo-transversais > h4{flex:1 0 100%;margin:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--cor-texto-secundario)}
.fluxo-transversal{flex:1 1 260px}
.fluxo-transversal .alcance{color:var(--cor-texto-secundario);font-size:12.5px}
.fluxo-envelope:has(.fluxo.focado) .fluxo-transversal:not(.ligado){opacity:.28}
.fluxo.focado path:not(.ligado){opacity:.12}
.fluxo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.fluxo path{fill:none;stroke:var(--cor-eixo);stroke-width:1.4;transition:opacity .2s}
.fluxo path.ligado{stroke:var(--cor-texto);stroke-width:2}
@media (max-width:760px){
  .fluxo{grid-template-columns:minmax(0,1fr);gap:var(--espaco-p)}
  .fluxo-col-1{padding-left:0}
  .fluxo svg{display:none}
  .fluxo-no .de{display:block;font-size:12px;color:var(--cor-texto-secundario);margin-top:3px}
}
@media (prefers-reduced-motion:reduce){.fluxo-no,.fluxo path{transition:none}}

/* ordenação no cabeçalho (Lab.tabelaDados) */
.tabela-dados th .tabela-ordenar{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;display:inline-flex;align-items:baseline;gap:4px}
.tabela-dados th.n .tabela-ordenar{flex-direction:row-reverse}
.tabela-dados th .tabela-ordenar:hover,.tabela-dados th .tabela-ordenar:focus-visible{color:var(--cor-texto);text-decoration:underline}
.tabela-dados th .seta::after{content:"↕";opacity:.35;font-size:.9em}
.tabela-dados th[aria-sort="ascending"] .seta::after{content:"↑";opacity:1}
.tabela-dados th[aria-sort="descending"] .seta::after{content:"↓";opacity:1}

/* círculos sobrepostos (milhares de unidades; lab-mapa.js › SOBREPOR_MIN): translúcidos, com contorno claro */
.mapa path.u.sobreposto{fill-opacity:.72;stroke:var(--cor-superficie);stroke-opacity:.9;stroke-width:.5}

/* ==== web/componentes/lab-viz.css ==== */
/* lab-viz.css — moldura da Visualização (L0007, L0008, L0011–L0013), usada por lab-viz.js.
 * Vem da bancada de formatos (fase 0); regras de forma em design/padrao/design.yaml › padroes.visualizacao_moldura,
 * detalhe, anotacoes, legendas, imagem e mapa_pontos. Só tokens do DS; nenhuma cor fixa, exceto sombras e o aviso
 * sobre o mapa (texto branco sobre véu escuro, legível nos dois temas). */
.viz{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;overflow:hidden;position:relative;box-sizing:border-box;container-type:inline-size;color:var(--cor-texto)}
.viz.fixo{width:var(--w);height:var(--h)}
.viz-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}
.viz-chapeu{font-size:12px;font-weight:600;color:var(--cor-texto-secundario);margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viz-titulo{font-size:18px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.fmt-paisagem .viz-titulo{font-size:19px}
.viz-sub{font-size:13px;color:var(--cor-texto-secundario);margin:0;line-height:1.35}
.viz-sub b{color:var(--cor-texto)}
.mais-texto{font:inherit;border:0;background:var(--cor-grade);color:var(--cor-texto);border-radius:4px;padding:0 5px;margin-left:2px;cursor:pointer}
/* controle de busca no chapéu ou no título (ex.: cidade): parece texto com ▾; abre um campo com a lista */
.viz-busca-botao{font:inherit;font-weight:700;color:var(--cor-texto);background:none;border:0;border-bottom:1px dotted var(--cor-texto);padding:0 1px;min-height:24px;cursor:pointer}
.viz-busca{display:flex;gap:6px;align-items:center;margin:2px 0}
.viz-busca input{font:inherit;font-size:16px;flex:1 1 auto;min-width:0;padding:5px 8px;border:1px solid var(--cor-borda);border-radius:6px;background:var(--cor-fundo);color:var(--cor-texto)}
.viz-busca button{font:inherit;font-size:13px;border:1px solid var(--cor-borda);background:none;color:var(--cor-texto);border-radius:999px;padding:3px 10px;cursor:pointer}
.viz-abas{display:flex;gap:4px;margin-top:2px}
.viz-abas button{font:inherit;font-size:12px;border:1px solid var(--cor-borda);background:none;color:var(--cor-texto);border-radius:6px;padding:2px 8px;min-height:26px;cursor:pointer}
.viz-abas button[aria-pressed="true"]{background:var(--cor-texto);color:var(--cor-superficie)}
.viz-corpo{flex:1 1 auto;min-height:0;display:flex;gap:10px}
.viz-palco{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden}
.viz-palco.compa{flex:0 0 42%}
.viz-palco svg{display:block}
.viz-vazio{display:grid;place-items:center;height:100%;font-size:13px;color:var(--cor-texto-secundario);text-align:center;padding:12px}
.viz-n{margin:2px 0 0;font-size:11.5px;font-weight:600;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}
/* legenda (L0013): itens com amostra própria; interativos (hover destaca, clique fixa, Esc desfaz) */
.viz-legenda{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--cor-texto-secundario)}
.viz-legenda-rec summary{font-size:12px;color:var(--cor-texto-secundario);cursor:pointer;list-style:none;display:inline-block;border:1px solid var(--cor-borda);border-radius:999px;padding:0 9px}

/* ==== web/componentes/lab-nucleo.js ==== */
/* lab-nucleo.js — núcleo dos componentes de interface do Laboratório de Dados Públicos.
 * Design system padrão (design/padrao/design.yaml, seção `padroes`); ADR L0003.
 *
 * Sem build: os produtos embutem os arquivos lab-*.js no HTML único (L0002), nesta ordem:
 *   lab-nucleo → lab-selecao → lab-escalas → lab-mapa → lab-graficos → lab-sankey → lab-metodologia.
 * Requer D3 v7 global (lab-sankey requer d3-sankey; lab-mapa usa flubber, se presente).
 * Tudo fica em window.Lab. Os componentes só desenham: nenhum cálculo analítico (L0002).
 *
 * Uso mínimo:
 *   Lab.configurar({ raiz: document.getElementById("app"), autor: "Nome", orgaos: { tse: "TSE" } });
 *   sec.append(el("h3", {}, "Votos de ", Lab.seletorTituloLista("Grupo", opcoes, atual, aoMudar)));
 */
(function () {
  "use strict";
  const Lab = (window.Lab = window.Lab || {});

  // ------------------------------------------------------------ configuração do produto
  // raiz: elemento onde a página desenha (seleção e rótulos procuram dentro dele)
  // autor: nome curto do rodapé dos gráficos · orgaos: chave da fonte → órgão (rodapé curto)
  // artigos: forma com artigo quando há um só órgão ("TSE" → "do TSE")
  // autorUrl (GitHub do autor) e projeto ({nome, url} do repositório) chegam da montagem (labdados.produto_web)
  Lab.cfg = { raiz: document.body, autor: "", autorUrl: null, projeto: null, orgaos: {}, artigos: {}, ancoraMetodologia: "metodologia", ancoraRodape: "rodape" };
  Lab.configurar = (c) => Object.assign(Lab.cfg, c);

  // ------------------------------------------------------------ formatos (pt-BR)
  const fmtInt = new Intl.NumberFormat("pt-BR");
  const vazio = (v) => v === null || v === undefined;
  Lab.fmtInt = fmtInt;
  Lab.fmtPct = (v, d = 1) => (vazio(v) ? "—" : `${v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d })}%`);
  Lab.fmtPP = (v) => (vazio(v) ? "—" : `${v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} p.p.`);
  Lab.fmtR = (v) => (vazio(v) ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  /** Número grande abreviado: 1,23 mi · 460 mil · 9.876. */
  Lab.fmtCompacto = (v) => (vazio(v) ? "—" : Math.abs(v) >= 1e6 ? `${(v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 })} mi`
    : Math.abs(v) >= 1e4 ? `${Math.round(v / 1000).toLocaleString("pt-BR")} mil` : fmtInt.format(v));
  /** Com sinal explícito (+, −) e o formato do módulo. */
  Lab.comSinal = (v, fmt) => (vazio(v) ? "—" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${fmt(Math.abs(v))}`);

  // ------------------------------------------------------------ elementos e tokens
  /** el("div", {class, text, onclick, "data-x"}, ...filhos) — textos sempre por textContent. */
  Lab.el = (tag, attrs = {}, ...filhos) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const f of filhos) if (f !== null && f !== undefined && f !== false) n.append(f);
    return n;
  };
  const el = Lab.el;
  /** Valor de um token do design system (variável CSS --nome). */
  Lab.token = (nome) => getComputedStyle(document.documentElement).getPropertyValue(`--${nome}`).trim();
  const token = Lab.token;
  Lab.semMovimento = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  /** Tinta legível sobre uma cor de fundo (pela luminância). */
  Lab.tinta = (c) => (d3.lab(c).l > 62 ? "#111" : "#fff");
  /** Texto sobre cor: tinta pela luminância + contorno contrastante (--halo). */
  Lab.comHalo = (n, fundo) => { const t = Lab.tinta(fundo); n.style.color = t; n.style.setProperty("--halo", t === "#111" ? "rgba(255,255,255,.75)" : "rgba(0,0,0,.45)"); return n; };
  /** Base embutida em gzip+base64 (labdados.produto_web.codificar_base). */
  Lab.decodificar = async (b64) => {
    const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const fluxo = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(fluxo).text());
  };

  // ------------------------------------------------------------ dica (tooltip)
  let dica = null;
  const caixaDica = () => dica || (dica = document.getElementById("dica")
    || document.body.appendChild(el("div", { class: "dica", id: "dica", role: "status", "aria-live": "polite" })));
  /** Dica junto ao ponteiro: título em negrito + linhas (as vazias são ignoradas). */
  Lab.mostrarDica = (ev, titulo, linhas) => {
    const d = caixaDica();
    d.replaceChildren(el("b", { text: titulo }), ...linhas.filter(Boolean).map((t) => el("div", { text: t })));
    d.style.display = "block";
    d.style.left = `${Math.min(ev.clientX + 14, innerWidth - d.offsetWidth - 8)}px`;
    d.style.top = `${Math.min(ev.clientY + 14, innerHeight - d.offsetHeight - 8)}px`;
  };
  Lab.esconderDica = () => { if (dica) dica.style.display = "none"; };

  // ------------------------------------------------------------ controles
  /** Botões de alternância; `pequeno` = versão compacta, usada abaixo dos gráficos (Tamanho, Largura). */
  Lab.alternar = (rotuloGrupo, opcoes, atual, aoMudar, pequeno = false) => {
    const a = el("div", { class: pequeno ? "alternar pequeno" : "alternar", role: "group", "aria-label": rotuloGrupo });
    for (const [v, r] of opcoes) a.append(el("button", { "aria-pressed": v === atual, text: r, "data-chave": `${rotuloGrupo}|${v}`, onclick: () => aoMudar(v) }));
    return el("div", { class: pequeno ? "campo compacto" : "campo" }, rotuloGrupo, a);
  };
  /** Seletor dentro do título (poucas opções): as opções fazem parte da frase; a escolhida fica sublinhada. */
  Lab.seletorTitulo = (rotulo, opcoes, atual, aoMudar) => {
    const grupo = el("span", { class: "seletor-titulo", role: "group", "aria-label": rotulo });
    opcoes.forEach(([v, r], i) => {
      if (i) grupo.append(el("span", { class: "sep", "aria-hidden": "true", text: " / " }));
      grupo.append(el("button", { type: "button", "aria-pressed": v === atual, "data-chave": `${rotulo}|${v}`, text: r, onclick: () => aoMudar(v) }));
    });
    return grupo;
  };
  /** Lista dentro do título (muitas opções): parece texto sublinhado com ▾; abre a lista nativa. */
  Lab.seletorTituloLista = (rotulo, opcoes, atual, aoMudar) => {
    const s = el("select", { class: "lista-titulo", "aria-label": rotulo, "data-chave": rotulo, onchange: (e) => aoMudar(e.target.value) });
    // opções simples [valor, rótulo] ou agrupadas {grupo, opcoes: [[valor, rótulo], …]} (optgroup)
    for (const o of opcoes) {
      if (Array.isArray(o)) s.append(el("option", { value: o[0], text: o[1] }));
      else { const g = el("optgroup", { label: o.grupo }); for (const [v, r] of o.opcoes) g.append(el("option", { value: v, text: r })); s.append(g); }
    }
    s.value = atual;
    // largura = texto escolhido (o select nativo mediria a opção mais longa)
    requestAnimationFrame(() => {
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = getComputedStyle(s).font;
      s.style.width = `${Math.ceil(ctx.measureText(s.selectedOptions[0]?.text || "").width) + 24}px`;
    });
    return s;
  };
  /** Lista com rótulo acima (formulários; nos gráficos, prefira seletorTituloLista). */
  Lab.seletor = (rotuloCampo, opcoes, atual, aoMudar) => {
    const s = el("select", { "data-chave": rotuloCampo, onchange: (e) => aoMudar(e.target.value) });
    // opções simples [valor, rótulo] ou agrupadas {grupo, opcoes: [[valor, rótulo], …]} (optgroup)
    for (const o of opcoes) {
      if (Array.isArray(o)) s.append(el("option", { value: o[0], text: o[1] }));
      else { const g = el("optgroup", { label: o.grupo }); for (const [v, r] of o.opcoes) g.append(el("option", { value: v, text: r })); s.append(g); }
    }
    s.value = atual;
    return el("label", { class: "campo" }, rotuloCampo, s);
  };
  /** Botão que troca o modo de uma seção (ex.: "Detalhar distribuição de um único grupo" ⇄ "← Mapa de lideranças"). */
  Lab.botaoModo = (texto, aoClicar, chave = "modo") => el("button", { type: "button", class: "botao-modo", "data-chave": chave, text: texto, onclick: aoClicar });

  // ------------------------------------------------------------ amostras de cor
  const amostra = (cor, classe = "amostra") => { const s = el("span", { class: classe }); s.style.background = cor; return s; };
  /** Item de legenda: amostra + texto. */
  Lab.chave = (cor, texto) => el("span", { class: "chave" }, amostra(cor), texto);
  /** Quadradinho de cor para tabelas e quadros. */
  Lab.chip = (cor) => amostra(cor, "chip");

  // ------------------------------------------------------------ textos de apoio
  /** Orientações de leitura: escondidas num "ⓘ Como ler o gráfico" sutil. Aceita vários parágrafos (ou elementos). */
  Lab.instrucao = (...textos) => el("details", { class: "info" }, el("summary", {}, "ⓘ Como ler o gráfico"),
    ...textos.filter(Boolean).map((t) => (typeof t === "string" ? el("p", { text: t }) : t)));
  /** Subtítulo com os números (curto; o título não leva números). */
  Lab.placar = (texto) => el("p", { class: "placar", text: texto });
  /** Leva ao bloco de metodologia (abre o bloco). */
  Lab.irRodape = (ev) => {
    ev?.preventDefault();
    const bloco = document.getElementById(Lab.cfg.ancoraMetodologia);
    if (bloco) bloco.open = true;
    (bloco || document.getElementById(Lab.cfg.ancoraRodape))?.scrollIntoView({ behavior: Lab.semMovimento() ? "auto" : "smooth" });
  };
  /** Rodapé de cada gráfico: fonte curta (link para a metodologia) + autoria; cobertura e notas num "ⓘ notas" recolhível.
   *  fontes: chaves de Lab.cfg.orgaos. O gráfico se sustenta sozinho num print. */
  Lab.rodape = ({ fontes = [], cobertura = null, nota = null } = {}) => {
    const orgaos = [...new Set(fontes.map((k) => Lab.cfg.orgaos[k] || k))];
    const deQuem = orgaos.length === 1 && Lab.cfg.artigos[orgaos[0]] ? Lab.cfg.artigos[orgaos[0]] : `de ${orgaos.join(", ")}`;
    const f = el("div", { class: "rodape-grafico" },
      el("span", {}, `Fonte: bases oficiais ${deQuem}. `),
      el("a", { href: `#${Lab.cfg.ancoraRodape}`, onclick: Lab.irRodape, text: "Saiba mais ↓" }), " · ",
      el("span", {}, "Análise e visualização: ", Lab.cfg.autorUrl ? el("a", { href: Lab.cfg.autorUrl, target: "_blank", rel: "noopener", text: Lab.cfg.autor }) : Lab.cfg.autor),
      Lab.cfg.projeto ? el("span", {}, " · Projeto: ", el("a", { href: Lab.cfg.projeto.url, target: "_blank", rel: "noopener", text: `${Lab.cfg.projeto.nome} ↗` })) : null);
    if (cobertura || nota) f.append(el("details", { class: "info info-notas" }, el("summary", {}, "ⓘ notas"),
      ...[cobertura, nota].filter(Boolean).map((t) => el("p", { text: t }))));
    return f;
  };

  // ------------------------------------------------------------ tabelas e quadros
  /** Tabela simples; colunas numéricas alinhadas à direita (detecção automática ou `numericas`).
   *  Célula pode ser texto ou lista de nós (ex.: [chip, "nome"]). */
  Lab.tabela = (cab, linhas, numericas = false) => {
    const ehNum = (c) => typeof c === "string" && /([\d—]|%|p\.p\.)$/.test(c.trim()) && /\d|—/.test(c);
    const num = cab.map((_, i) => i > 0 && (numericas || (linhas.length > 0 && linhas.every((l) => ehNum(l[i])))));
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, ...cab.map((c, i) => el("th", { class: num[i] ? "n" : null, scope: "col" }, ...(Array.isArray(c) ? c : [c]))))));
    t.append(el("tbody", {}, ...linhas.map((l) => el("tr", {}, ...l.map((c, i) => el("td", { class: num[i] ? "n" : null }, ...(Array.isArray(c) ? c : [c])))))));
    return t;
  };
  /** Tabela de dados — PADRÃO DE TODA TABELA DE DADOS DO LABORATÓRIO (design.yaml › padroes.tabelas; pesquisador,
   *  2026-10-12 e 2026-10-14):
   *  - ordenar ao clicar no cabeçalho (crescente → decrescente → ordem original); ordena pelos números sem formatação
   *    (`bruto`) ou, sem eles, pelo texto lido como número em pt-BR ("R$ 1,2 mi", "45,3%", "1.234"); "—" e "1 a 4" vão
   *    para o fim; linhas fixas (`fixas(i)`; padrão: a que começa com "Total") ficam sempre no fim;
   *  - até `limite` linhas visíveis (10) e "Mostrar todas as N";
   *  - "Baixar tabela (CSV)" na ordem da tela, com os números SEM formatação (`bruto`; sem ela, o texto das células):
   *    ";" como separador, vírgula decimal e BOM (abre no Excel);
   *  - filtro de linhas opcional: `filtro` "auto" (quando passa do limite), true ou false.
   *  `cat(i)`: id da linha para a Lab.legendaFoco. Aceita `tabela` (um <table> de Lab.tabela) no lugar de cab/linhas.
   *  `arquivo`: nome sem extensão, ou função (caixa) → nome, chamada no clique. `ordenar: false` para tabelas com
   *  hierarquia (linhas "dos quais"). */
  Lab.tabelaDados = ({ cab, linhas, tabela = null, bruto = null, arquivo = "tabela", limite = 10, numericas = false, cat = null,
    ordenar = true, filtro = "auto", fixas = null, barras = null, calor = null }) => {
    const t = tabela || Lab.tabela(cab, linhas, numericas);
    if (tabela) {   // tabela já montada (Lab.tabela): cabeçalho e linhas lidos do próprio elemento
      cab = [...t.tHead.rows[0].cells].map((c) => c.textContent);
      linhas = [...t.tBodies[0].rows].map((tr) => [...tr.cells].map((c) => c.textContent));
    }
    const tbody = t.tBodies[0];
    const norm = (x) => String(x).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const fixa = fixas || ((i) => /^total\b/i.test(String(linhas[i]?.[0]?.textContent ?? linhas[i]?.[0] ?? "").trim()));
    const R = [...tbody.rows].map((tr, i) => ({ tr, i, texto: norm(tr.textContent), fixa: !!fixa(i) }));
    if (cat) R.forEach((r) => { const c = cat(r.i); if (c !== undefined && c !== null) r.tr.dataset.cat = String(c); });
    // valor de ordenação de uma célula: número (do bruto ou lido do texto) ou texto; vazio → null (vai para o fim)
    const numTexto = (s) => {
      const x = String(s ?? "").trim();
      if (!x || /^(—|-|1 a 4)$/.test(x)) return null;
      const m = x.replace(/\s/g, " ").match(/^(R\$\s*)?([-−]?[\d.]+(,\d+)?)\s*(%|p\.p\.|mil|mi|bi)?\b/i);
      if (!m) return undefined;
      const v = Number(m[2].replace("−", "-").replaceAll(".", "").replace(",", "."));
      return v * ({ mil: 1e3, mi: 1e6, bi: 1e9 }[(m[4] || "").toLowerCase()] || 1);
    };
    const chave = (r, j) => {
      const b = bruto?.[r.i]?.[j];
      if (typeof b === "number") return b;
      const cel = r.tr.cells[j]?.textContent ?? "";
      const n = typeof b === "string" && b !== "" ? numTexto(b) : numTexto(cel);
      if (n === null) return null;
      return n === undefined ? norm(typeof b === "string" && b !== "" ? b : cel) : n;
    };
    // barra na célula (D15): proporcional ao maior valor da coluna; cor nas células (D16): escala comum às colunas (matrizes)
    const numDe = (r, j) => { const v = chave(r, j); return typeof v === "number" && Number.isFinite(v) ? v : null; };
    const corpoR = R.filter((r) => !r.fixa);
    for (const j of barras || []) {
      const max = Math.max(0, ...corpoR.map((r) => Math.abs(numDe(r, j) ?? 0)));
      if (max > 0) for (const r of corpoR) { const v = numDe(r, j), td = r.tr.cells[j]; if (v === null || !td) continue; td.classList.add("cel-barra"); td.style.setProperty("--p", `${(100 * Math.abs(v)) / max}%`); }
    }
    if (calor?.length) {
      const vs = corpoR.flatMap((r) => calor.map((j) => numDe(r, j))).filter((v) => v !== null), lo = Math.min(...vs), hi = Math.max(...vs);
      if (vs.length && hi > lo) for (const r of corpoR) for (const j of calor) { const v = numDe(r, j), td = r.tr.cells[j]; if (v === null || !td) continue; td.classList.add("cel-calor"); td.style.setProperty("--p", `${Math.round(6 + (50 * (v - lo)) / (hi - lo))}%`); }
    }
    let ordem = null, todas = false, termo = "";
    const longa = linhas.length > limite;
    const mais = longa ? el("button", { type: "button", class: "tabela-mais" }) : null;
    const contagem = el("span", { class: "nota" });
    const ordenadas = () => {
      const corpo = R.filter((r) => !r.fixa), fim = R.filter((r) => r.fixa);
      if (!ordem) return [...corpo, ...fim];
      const { j, dir } = ordem;
      const cmp = (a, b) => {
        const x = chave(a, j), y = chave(b, j);
        if (x === null && y === null) return a.i - b.i;
        if (x === null) return 1; if (y === null) return -1;
        const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR");
        return (c || a.i - b.i) * (c ? dir : 1);
      };
      return [...corpo.sort(cmp), ...fim];
    };
    const aplicar = () => {
      const L = ordenadas();
      tbody.replaceChildren(...L.map((r) => r.tr));
      let vis = 0;
      for (const r of L) { const casa = !termo || r.texto.includes(termo); const mostra = casa && (todas || termo || r.fixa || vis < limite); r.tr.hidden = !mostra; if (mostra && !r.fixa) vis++; }
      const casam = termo ? R.filter((r) => r.texto.includes(termo)).length : linhas.length;
      contagem.textContent = termo ? `${casam} de ${linhas.length} linhas` : longa && !todas ? `${limite} de ${linhas.length} linhas` : `${linhas.length} linhas`;
      if (mais) { mais.hidden = !!termo; mais.textContent = todas ? "Mostrar menos" : `Mostrar todas as ${linhas.length} linhas`; }
      if (ordenar) [...t.tHead.rows[0].cells].forEach((th, j) => th.setAttribute("aria-sort", ordem?.j === j ? (ordem.dir > 0 ? "ascending" : "descending") : "none"));
    };
    if (ordenar) [...t.tHead.rows[0].cells].forEach((th, j) => {
      const rot = [...th.childNodes];
      const bt = el("button", { type: "button", class: "tabela-ordenar", title: "Ordenar por esta coluna" }, ...rot, el("span", { class: "seta", "aria-hidden": "true" }));
      bt.addEventListener("click", () => {
        ordem = ordem?.j !== j ? { j, dir: th.classList.contains("n") ? -1 : 1 } : ordem.dir === (th.classList.contains("n") ? -1 : 1) ? { j, dir: -ordem.dir } : null;   // 3º clique: ordem original
        aplicar();
      });
      th.replaceChildren(bt);
    });
    mais?.addEventListener("click", () => { todas = !todas; aplicar(); });
    const csv = () => {
      const cel = (v) => { if (v === null || v === undefined) return ""; if (typeof v === "number") return String(Math.round(v * 1e6) / 1e6).replace(".", ","); const s = Array.isArray(v) ? v.map((n) => n.textContent ?? n).join(" ") : String(v?.textContent ?? v); return /[;"\n]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s; };
      const corpo = ordenadas().map((r) => (bruto || linhas)[r.i].map(cel).join(";"));
      const texto = "﻿" + [cab.map(cel).join(";"), ...corpo].join("\r\n");
      const a = el("a", { href: URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" })), download: `${typeof arquivo === "function" ? arquivo(caixa) : arquivo}.csv` });
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const comFiltro = filtro === true || (filtro === "auto" && longa);
    const busca = comFiltro ? el("input", { type: "search", class: "tabela-busca", placeholder: "Filtrar linhas…", "aria-label": "Filtrar linhas da tabela" }) : null;
    busca?.addEventListener("input", () => { termo = norm(busca.value.trim()); aplicar(); });
    const barra = el("div", { class: "tabela-barra" }, busca, contagem,
      el("button", { type: "button", class: "tabela-baixar", onclick: csv, title: "Na ordem da tela; números sem formatação, separador ponto e vírgula" }, "▦ Baixar tabela (CSV)"));
    aplicar();
    const caixa = el("div", { class: "tabela-dados" }, barra, el("div", { class: "rolagem" }, t), mais);
    return caixa;
  };
  /** Quadros com um número grande por item. itens: [{chave, rotulo, cor, valor}].
   *  Com `aoEscolher`, viram botões (o escolhido ganha a borda na cor do item). */
  Lab.quadros = (itens, { atual = null, aoEscolher = null, chaveDado = "Quadro", rotulo = "Escolha" } = {}) =>
    el("div", aoEscolher ? { class: "tiles", role: "group", "aria-label": rotulo } : { class: "tiles" }, ...itens.map((it) => {
      const corpo = [el("div", { class: "rot" }, Lab.chip(it.cor), it.rotulo), el("div", { class: "val", text: it.valor })];
      if (!aoEscolher) return el("div", { class: "tile" }, ...corpo);
      const b = el("button", { type: "button", class: "tile tile-botao", "aria-pressed": it.chave === atual, "data-chave": `${chaveDado}|${it.chave}`, onclick: () => aoEscolher(it.chave) }, ...corpo);
      b.style.setProperty("--cor-grupo", it.cor);
      return b;
    }));

  // ------------------------------------------------------------ barra 100% (composição)
  /** Uma linha de barra empilhada de 100%. segmentos: [{id?, cor, pct, texto, medio, curto, dica: [título, linhas]}]
   *  (`id` liga o segmento à Lab.legendaFoco).
   *  O rótulo encolhe (texto → medio → curto) ou sai quando não cabe: ver Lab.ajustarRotulos. */
  Lab.linhaBarra100 = ({ rotulo, segmentos, abaixo = null, aria = null }) => {
    const barra = el("div", { class: "barra", role: aria ? "img" : null, "aria-label": aria });
    for (const s of segmentos) {
      if (vazio(s.pct) || s.pct <= 0) continue;
      const sp = el("span"); sp.style.width = `${s.pct}%`; sp.style.background = s.cor;
      if (s.id !== undefined && s.id !== null) sp.dataset.cat = String(s.id);
      if (s.texto) { const b = el("b", { text: s.texto, "data-medio": s.medio || null, "data-curto": s.curto || null }); Lab.comHalo(b, s.cor); sp.append(b); }
      if (s.dica) { sp.addEventListener("pointermove", (ev) => Lab.mostrarDica(ev, s.dica[0], s.dica[1])); sp.addEventListener("pointerleave", Lab.esconderDica); }
      barra.append(sp);
    }
    return el("div", { class: "linha" }, el("span", { class: "rot", text: rotulo }), el("div", {}, barra, abaixo ? el("div", { class: "vazio", text: abaixo }) : null));
  };
  /** Rótulos de barra que não cabem: tenta a forma média, depois a curta; se nada couber, sai (fica na dica e na tabela). */
  Lab.ajustarRotulos = (raiz = Lab.cfg.raiz) => {
    const cabe = (b) => { const t = document.createElement("span"); t.textContent = b.textContent; t.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:600 12px var(--fonte-texto)";
      document.body.append(t); const ok = t.offsetWidth <= b.parentElement.clientWidth - 6; t.remove(); return ok; };
    for (const b of raiz.querySelectorAll(".barra span b")) {
      if (!b.isConnected || !b.parentElement.clientWidth) continue;   // fora da página ou em bloco fechado: mede depois (não apaga)
      if (cabe(b)) continue;
      if (b.dataset.medio) { b.textContent = b.dataset.medio; if (cabe(b)) continue; }
      if (b.dataset.curto) b.textContent = b.dataset.curto;
      if (!cabe(b)) b.remove();
    }
  };

  // ------------------------------------------------------------ eixos e atualização
  /** Eixo padronizado: linhas na cor de eixo, rótulos 12px secundários. Uso: g.call(d3.axisBottom(x)).call(Lab.eixo). */
  Lab.eixo = (g) => g.call((x) => x.selectAll("line,path").attr("stroke", token("cor-eixo")))
    .call((x) => x.selectAll("text").style("font-size", "12px").style("fill", token("cor-texto-secundario")));
  /** Atualiza no lugar: mantém altura, posição de rolagem e o foco do controle usado (data-chave). */
  Lab.noLugar = (fazer, raiz = Lab.cfg.raiz) => {
    const y = scrollY;
    const chave = document.activeElement?.dataset?.chave;
    raiz.style.minHeight = `${raiz.offsetHeight}px`;
    fazer();
    scrollTo(0, y);
    if (chave) raiz.querySelector(`[data-chave="${CSS.escape(chave)}"]`)?.focus({ preventScroll: true });
    requestAnimationFrame(() => { raiz.style.minHeight = ""; });
  };
  /** Desenha `fazer()` só quando `no` chega perto da tela (desempenho: mapas com milhares de unidades em seções
   *  fechadas não pesam no carregamento). Até lá, `no` guarda a altura `reserva` (px) para a rolagem não pular.
   *  Sem IntersectionObserver, desenha na hora. */
  Lab.quandoVisivel = (no, fazer, { margem = "400px", reserva = 420 } = {}) => {
    if (!("IntersectionObserver" in window)) { fazer(); return; }
    no.style.minHeight = `${reserva}px`;
    const io = new IntersectionObserver((es) => {
      if (!es.some((e) => e.isIntersecting)) return;
      io.disconnect(); no.style.minHeight = ""; fazer();
    }, { rootMargin: margem });
    io.observe(no);
  };
  /** Largura útil de um gráfico na raiz (entre 320 px e `max`). */
  Lab.largura = (max) => Math.max(320, Math.min(max, Lab.cfg.raiz.clientWidth - 34));
  Lab.estreito = () => Lab.cfg.raiz.clientWidth < 600;
})();

/* ==== web/componentes/lab-selecao.js ==== */
/* lab-selecao.js — seleção de unidades (clique no mapa, no gráfico ou na busca). ADR L0003.
 *
 * Cada bloco (um mapa e o gráfico ligado a ele, ou um gráfico sozinho) marca-se com
 * data-escopo="nome" e tem a sua seleção: selecionar num bloco não afeta os outros.
 * As marcas selecionáveis levam data-u="<id>". A seleção fica só na memória da página.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const selecoes = new Map();   // escopo → unidade
  const paineis = [];           // [escopo, atualizar, chave?] — registrados a cada desenho
  Lab.selecoes = selecoes;

  /** Escopo de um nó (o data-escopo mais próximo) ou o próprio nome, se for texto. */
  Lab.escopoDe = (n) => (typeof n === "string" ? n : n?.closest?.("[data-escopo]")?.dataset.escopo || "geral");
  Lab.selecaoDe = (n) => selecoes.get(Lab.escopoDe(n)) || "";
  /** Seleciona `u` no bloco de `noh` (clicar de novo desfaz); `u` vazio limpa a seleção do bloco. */
  Lab.selecionar = (u, noh) => {
    const esc = Lab.escopoDe(noh);
    if (u && selecoes.get(esc) !== u) selecoes.set(esc, u); else selecoes.delete(esc);
    Lab.aplicarSelecao(esc);
  };
  /** Marca .selecionado nas marcas do bloco, traz a selecionada para a frente e atualiza os painéis. */
  Lab.aplicarSelecao = (esc) => {
    const u = selecoes.get(esc) || "";
    for (const bloco of Lab.cfg.raiz.querySelectorAll(`[data-escopo="${CSS.escape(esc)}"]`)) {
      for (const n of bloco.querySelectorAll("[data-u]")) {
        const sim = Boolean(u) && n.dataset.u === u;
        n.classList.toggle("selecionado", sim);
        if (sim && n.parentNode) n.parentNode.appendChild(n);   // por cima dos vizinhos
      }
      for (const sv of bloco.querySelectorAll("svg")) sv.classList.toggle("com-selecao", Boolean(u) && Boolean(sv.querySelector(".selecionado")));
    }
    for (const [e, atualizar] of paineis) if (e === esc) atualizar();
  };
  /** Reaplica todas as seleções (chamar depois de redesenhar a página). */
  Lab.aplicarSelecoes = () => { for (const esc of selecoes.keys()) Lab.aplicarSelecao(esc); };
  /** Registra um painel; com `chave`, substitui o registro anterior da mesma chave (redesenho não acumula). */
  Lab.registrarPainel = (esc, atualizar, chave = null) => {
    const reg = chave ? paineis.find((p) => p[2] === chave) : null;
    if (reg) reg[1] = atualizar; else paineis.push([esc, atualizar, chave]);
  };
  /** Esquece os painéis (chamar no início de cada redesenho da página). */
  Lab.limparPaineis = () => { paineis.length = 0; };

  /** Conteúdo do painel da unidade: nome, linhas de dados, "Ver ficha" (opcional) e "Limpar seleção". */
  Lab.conteudoPainel = (painel, { u, nome, linhas, abrir = null, rotuloAbrir = "Ver ficha →", esc, acoes = [] }) =>
    painel.replaceChildren(el("b", { text: nome }), ...linhas.filter(Boolean).map((t) => el("span", { text: t })),
      el("div", { class: "acoes-sel" },
        abrir ? el("button", { type: "button", class: "voltar", text: rotuloAbrir, onclick: () => abrir(u) }) : null, ...acoes.filter(Boolean),
        el("button", { type: "button", class: "voltar", text: "Limpar seleção", onclick: () => Lab.selecionar("", esc) })));

  /** Painel da unidade selecionada sob um gráfico. Em telas largas, dentro de .grade2 (mapa ao lado), fica oculto
   *  por CSS; no celular aparece logo abaixo do gráfico tocado. opts: {nome(u), dica(u) → linhas, abrir(u), rotuloAbrir}. */
  Lab.painelGrafico = (alvo, { nome, dica, abrir = null, rotuloAbrir } = {}) => {
    const painel = el("div", { class: "painel-sel painel-grafico", "aria-live": "polite" });
    alvo.append(painel);
    const esc = Lab.escopoDe(alvo);
    const atualizar = () => {
      const u = selecoes.get(esc) || "";
      const existe = u && alvo.querySelector(`[data-u="${CSS.escape(u)}"]`);
      painel.hidden = !existe;
      if (existe) Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: dica(u), abrir, rotuloAbrir, esc });
    };
    Lab.registrarPainel(esc, atualizar);
    atualizar();
    return painel;
  };

  /** Destaque ligado: passar o mouse numa unidade acende a mesma unidade em todos os gráficos da grade. */
  Lab.ligarDestaque = (grade) => {
    const acender = (ev, sim) => { const u = ev.target.closest("[data-u]")?.dataset.u; if (u) for (const n of grade.querySelectorAll(`[data-u="${CSS.escape(u)}"]`)) n.classList.toggle("ligado", sim); };
    grade.addEventListener("pointerover", (ev) => acender(ev, true));
    grade.addEventListener("pointerout", (ev) => acender(ev, false));
  };
})();

/* ==== web/componentes/lab-escalas.js ==== */
/* lab-escalas.js — escalas de tamanho e legendas de cor. ADR L0003.
 *
 * Regras (design.yaml › padroes): legendas de escala ocupam ~70% da largura do gráfico; nos mapas
 * ficam logo abaixo do desenho; texto da legenda em tinta de texto, nunca na cor da série.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Escala de área (raiz) com teto "fora de escala": se a maior unidade tem mais de 3× o valor da segunda,
   *  a escala vai até a segunda e a maior fica no tamanho máximo, com contorno tracejado (decisão de 2026-10-06). */
  Lab.escalaArea = (valores, rMax) => {
    const ord = valores.filter((v) => v > 0).sort((a, b) => b - a);
    const fora = ord.length > 2 && ord[0] > 3 * ord[1];
    const teto = fora ? ord[1] : ord[0] || 1;
    const s = d3.scaleSqrt().domain([0, teto]).range([0, rMax]).clamp(true);
    return { s, teto, fora: (v) => fora && v > teto };
  };
  /** Nota sob o gráfico com as unidades fora de escala. Sem unidades, devolve "" (pode ir direto em append:
   *  o append nativo escreveria "null"). */
  Lab.notaFora = (nomes) => (nomes.length ? el("p", { class: "nota", text: `Fora de escala (contorno tracejado): ${nomes.join(", ")}. O valor é mais de três vezes o da segunda maior unidade; o círculo fica no tamanho máximo para não esmagar os demais.` }) : "");

  /** Legenda de tamanho: três círculos de referência ("Área ∝ …"). */
  Lab.legendaTamanho = (escalaR, rotuloTamanho) => {
    const max = escalaR.domain()[1];
    const ref = d3.ticks(0, max, 3).filter((v) => v > 0).slice(-3);
    const H = 2 * escalaR(d3.max(ref)) + 22;
    const svg = d3.create("svg").attr("width", 260).attr("height", H).attr("role", "img").attr("aria-label", `Legenda de tamanho: ${ref.map((v) => Lab.fmtInt.format(v)).join(", ")}`);
    let x = 4;
    for (const v of ref) {
      const r = escalaR(v), cx = x + Math.max(r, 26);
      svg.append("circle").attr("cx", cx).attr("cy", H - 4 - r).attr("r", r).attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario"));
      svg.append("text").attr("x", cx).attr("y", H - 6 - 2 * r).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", Lab.token("cor-texto-secundario")).text(Lab.fmtInt.format(v));
      x += Math.max(2 * r, 52) + 10;
    }
    svg.attr("width", x + 4);   // largura conforme os círculos (não corta o maior)
    return el("div", { class: "legenda" }, el("span", { text: `Área ∝ ${rotuloTamanho}` }), svg.node());
  };

  /** Rampa de cores (quadros iguais). */
  Lab.rampa = (cores) => el("span", { class: "rampa" }, ...cores.map((c) => { const s = el("span"); s.style.background = c; return s; }));
  /** Escala contínua: rampa na largura toda e rótulos das pontas embaixo (sequencial ou divergente). */
  Lab.legendaRampa = (cores, esquerda, direita) => el("div", { class: "legenda legenda-larga" }, el("span", { text: esquerda }), Lab.rampa(cores), el("span", { text: direita }));
  /** Escala divergente com três marcos: início, centro (neutro) e fim. */
  Lab.legendaTres = (cores, inicio, centro, fim) => el("div", { class: "legenda legenda-tres" }, Lab.rampa(cores), el("span", { text: inicio }), el("span", { text: centro }), el("span", { text: fim }));
  /** Legenda de classes por categoria: uma linha por categoria, quadros de largura fixa com a faixa escrita sobre a cor.
   *  linhas: [{nome, cores: [uma por classe]}] · rotulos: texto de cada classe ("< 40%", "40–50%"…). */
  Lab.legendaClasses = (linhas, rotulos, aria) => {
    const caixa = el("div", { class: "legenda-intensidade", role: "img", "aria-label": aria || `Legenda: ${rotulos.join(", ")}` });
    for (const l of linhas) {
      caixa.append(el("span", { class: "nome", text: l.nome.replaceAll("/", "/​") }));   // quebra após "/" no celular
      l.cores.forEach((cor, i) => { const q = el("span", { class: "quadro", text: rotulos[i] }); q.style.background = cor; Lab.comHalo(q, cor); caixa.append(q); });
    }
    return caixa;
  };
  /** Legenda que filtra/foca (design.yaml › padroes.legendas; pesquisador, 2026-10-12 — o mesmo recurso da Visualização,
   *  Q-079): passar o mouse destaca a categoria em `alvo` (segmentos e linhas com data-cat; os demais esmaecem); tocar fixa
   *  e leva a categoria para a base das barras 100% (à esquerda); tocar de novo desfaz. itens: [[cor, texto, id]].
   *  `alvo`: elemento ou função que o devolve (ex.: o cartão inteiro, para acender também as linhas da tabela). */
  Lab.legendaFoco = (itens, alvo_, ...extras) => {
    let fixa = null;
    const A = () => (typeof alvo_ === "function" ? alvo_() : alvo_);
    const leg = el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Categorias: passe o mouse ou toque para destacar" });
    const ordem = new Map();
    const reordenar = () => {
      for (const barra of A().querySelectorAll(".barra")) {
        const sps = [...barra.children];
        if (!ordem.has(barra)) ordem.set(barra, sps);
        const orig = ordem.get(barra);
        const lista = fixa === null ? orig : [...orig.filter((s) => s.dataset.cat === fixa), ...orig.filter((s) => s.dataset.cat !== fixa)];
        barra.replaceChildren(...lista);
      }
    };
    const aplicar = (id) => {
      const foco = id ?? fixa;
      for (const n of A().querySelectorAll("[data-cat]")) { n.classList.toggle("esmaecido", foco !== null && n.dataset.cat !== foco); n.classList.toggle("em-foco", foco !== null && n.dataset.cat === foco); }
      leg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.foco === fixa)));
    };
    leg.append(...itens.map(([cor, texto, id]) => {
      const am = el("span", { class: "amostra" }); am.style.background = cor;
      return el("button", { type: "button", class: "item-legenda", "data-foco": String(id), "aria-pressed": "false",
        onpointerenter: () => aplicar(String(id)), onpointerleave: () => aplicar(null), onfocus: () => aplicar(String(id)), onblur: () => aplicar(null),
        onclick: () => { fixa = fixa === String(id) ? null : String(id); reordenar(); aplicar(null); } }, am, texto);
    }), ...extras);
    return leg;
  };
  /** Legenda de classes de um MAPA que destaca no desenho (design.yaml › padroes.legendas: "interativa quando os itens
   *  correspondem a elementos do gráfico"; projeto cultura, 2026-10-15): passar o mouse ou o foco num item esmaece as
   *  unidades das outras classes; tocar fixa; tocar de novo desfaz. itens: [[cor, texto]] · mapa: função que devolve o
   *  objeto de Lab.mapa (criado depois da legenda) · classeDe(id) → índice do item da unidade (null = sem dado). */
  Lab.legendaMapa = (itens, mapa, classeDe, ...extras) => {
    let fixa = null;
    const leg = el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Classes do mapa: passe o mouse ou toque para destacar" });
    const aplicar = (i) => {
      const foco = i ?? fixa, m = mapa();
      if (m) m.atualizar({ opacidade: foco === null ? null : (id) => (classeDe(id) === foco ? 1 : 0.15) }, { animar: false });
      leg.querySelectorAll("button").forEach((b, j) => { b.setAttribute("aria-pressed", String(fixa === j)); b.classList.toggle("apagada", foco !== null && j !== foco); });
    };
    leg.append(...itens.map(([cor, texto], i) => {
      const am = el("span", { class: "amostra" }); am.style.background = cor;
      return el("button", { type: "button", class: "item-legenda", "aria-pressed": "false",
        onpointerenter: () => aplicar(i), onpointerleave: () => aplicar(null), onfocus: () => aplicar(i), onblur: () => aplicar(null),
        onclick: () => { fixa = fixa === i ? null : i; aplicar(null); } }, am, texto);
    }), ...extras);
    return leg;
  };
  /** Legenda categórica: amostra + nome, na ordem fixa das categorias. itens: [[cor, texto]]. */
  Lab.legendaCategorias = (itens, ...extras) => el("div", { class: "legenda" }, ...itens.map(([cor, texto]) => Lab.chave(cor, texto)), ...extras);
})();

/* ==== web/componentes/lab-mapa.js ==== */
/* lab-mapa.js — mapa coroplético com alternativa em círculos proporcionais (cartograma de Dorling). ADR L0003, L0006.
 *
 * Anatomia (design.yaml › padroes.mapa): barra sem fundo no topo (busca à esquerda, Mapa | Círculos à
 * direita) → desenho (com controles + − ⟲ no canto) → card da unidade selecionada → legendas → notas.
 * Lacunas em hachura (nunca cinza liso). Fora de escala: rótulo na margem esquerda com linha de ligação.
 *
 * Camadas (de baixo para cima — L0006): fundo opcional (raster Esri cinza ou vetorial OpenFreeMap) → referência
 * (UFs vizinhas, do IBGE; funciona offline) → unidades → limites finos (sobreposicao) → rótulos de referência →
 * seleção e foco.
 *
 * const m = Lab.mapa(alvo, {
 *   contornos,            // FeatureCollection; properties.id = chave da unidade
 *   sobreposicao,         // FeatureCollection fina desenhada por cima (ex.: municípios sob regiões) — opcional
 *   nome(id), preencher(id) → cor (token("cor-grade") = sem dado), dica(id) → linhas,
 *   abrir(id), rotuloAbrir, // botão do card (ex.: "Ver ficha do município →") — opcional
 *   rotuloAria, rotuloBusca,
 *   tamanho(id), rotuloTamanho,              // habilita Mapa | Círculos
 *   forma: { obter() → "mapa"|"bolhas", definir(v) },
 *   legenda,               // elemento de legenda de cor
 *   rotuloLacuna,          // texto da hachura na legenda (padrão: "sem dados"; ex.: "1 a 4 contemplados — sem números")
 *   detalhado,             // muitas unidades pequenas (padrão: mais de 60): raios menores
 *   // ---- L0006 (todos opcionais) ----
 *   camera,                // "estado" (padrão) | {foco: id | [ids], contexto: 1.5, margens?: [topo, pé]} | {centro: [lon, lat], zoom: k}
 *   zoom,                  // false desliga zoom e arrasto (padrão: ligado)
 *   referencia,            // FeatureCollection de contexto (UFs vizinhas) desenhada por baixo, em cinza
 *   rotulos,               // [{nome, coord: [lon, lat]}] — poucas cidades de referência
 *   fundo,                 // null (padrão) | "esri-cinza" | "vetorial" (OpenFreeMap; o modelo carrega o MapLibre)
 *   escalaBolhas,          // "ds" (padrão: fora de escala acima de 3× a segunda) | "fiel" (área sempre proporcional)
 *   compacto, dimensoes,   // story: sem barra, legendas e notas; desenho [W, H] ocupando o contêiner; card dentro do mapa
