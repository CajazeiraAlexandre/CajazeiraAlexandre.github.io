<script>
/* interpolacao.js — interpolação entre conjuntos de polígonos (Ramos, Santos e Cavalcante Neto, SIBGRAPI 2019,
 * doi:10.1109/SIBGRAPI.2019.00027), reimplementada a partir do texto do artigo. Decisões: ADR MR0001.
 *
 * Geometria em coordenadas planas (já projetadas). Polígono = [anelExterno, buraco1, …]; anel = [[x, y], …].
 * Depende de: d3 v7 (d3.Delaunay), polygon-clipping 0.15 (window.polygonClipping), flubber 0.4 (window.flubber).
 *
 * Os blocos "#region nome · referência" são os trechos mostrados na página, ao lado do texto da seção citada:
 * o código mostrado é o código que roda (CLAUDE.md do projeto).
 */
(function () {
  "use strict";
  const I = (window.Interpolacao = {});
  const pc = () => window.polygonClipping;

  // #region geometria · funções de apoio (área, centroide, distâncias)
  /** Área com sinal de um anel (fórmula do laço). */
  const areaAnel = (r) => {
    let s = 0;
    for (let k = 0, n = r.length; k < n; k++) { const [x1, y1] = r[k], [x2, y2] = r[(k + 1) % n]; s += x1 * y2 - x2 * y1; }
    return s / 2;
  };
  /** Área de um polígono com buracos (externo menos buracos). */
  const area = (P) => Math.abs(areaAnel(P[0])) - P.slice(1).reduce((s, h) => s + Math.abs(areaAnel(h)), 0);
  /** Área de um multipolígono (lista de polígonos). */
  const areaMulti = (M) => M.reduce((s, P) => s + area(P), 0);
  /** Centroide de área de um anel. */
  const centroideAnel = (r) => {
    let cx = 0, cy = 0, a = 0;
    for (let k = 0, n = r.length; k < n; k++) {
      const [x1, y1] = r[k], [x2, y2] = r[(k + 1) % n], f = x1 * y2 - x2 * y1;
      a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
    }
    return a === 0 ? r[0].slice() : [cx / (3 * a), cy / (3 * a)];
  };
  /** Centroide de um polígono com buracos (média dos anéis ponderada pela área; buracos subtraem). */
  const centroide = (P) => {
    let A = 0, X = 0, Y = 0;
    P.forEach((r, k) => {
      const a = Math.abs(areaAnel(r)) * (k === 0 ? 1 : -1), [cx, cy] = centroideAnel(r);
      A += a; X += a * cx; Y += a * cy;
    });
    return A === 0 ? centroideAnel(P[0]) : [X / A, Y / A];
  };
  const caixa = (P) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of P[0]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  };
  const caixaDe = (lista) => lista.map(caixa).reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])],
    [Infinity, Infinity, -Infinity, -Infinity]);
  const distCaixas = (a, b) => Math.hypot(Math.max(0, a[0] - b[2], b[0] - a[2]), Math.max(0, a[1] - b[3], b[1] - a[3]));
  /** Ponto dentro de um anel (paridade de cruzamentos). */
  const dentroAnel = ([x, y], r) => {
    let d = false;
    for (let k = 0, j = r.length - 1; k < r.length; j = k++) {
      const [xi, yi] = r[k], [xj, yj] = r[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) d = !d;
    }
    return d;
  };
  const dentro = (p, P) => dentroAnel(p, P[0]) && !P.slice(1).some((h) => dentroAnel(p, h));
  const distPontoSeg = ([px, py], [ax, ay], [bx, by]) => {
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)) : 0;
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  };
  const cruzam = (a, b, c, d) => {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    return o(a, b, c) !== o(a, b, d) && o(c, d, a) !== o(c, d, b);
  };
  /** Menor distância entre dois polígonos (0 se um invade o outro ou as bordas se cruzam). */
  const distancia = (P, Q) => {
    if (dentro(P[0][0], Q) || dentro(Q[0][0], P)) return 0;
    let m = Infinity;
    for (const r of P) for (let a = 0; a < r.length; a++) {
      const p1 = r[a], p2 = r[(a + 1) % r.length];
      for (const s of Q) for (let b = 0; b < s.length; b++) {
        const q1 = s[b], q2 = s[(b + 1) % s.length];
        if (cruzam(p1, p2, q1, q2)) return 0;
        m = Math.min(m, distPontoSeg(p1, q1, q2), distPontoSeg(p2, q1, q2), distPontoSeg(q1, p1, p2), distPontoSeg(q2, p1, p2));
      }
    }
    return m;
  };
  /** Ponto garantidamente interno: meio do trecho mais largo de uma linha horizontal que corta o polígono. */
  const pontoInterno = (P) => {
    const [x0, y0, x1, y1] = caixa(P);
    let melhor = null;
    for (const f of [0.5, 0.37, 0.63, 0.25, 0.75]) {
      const y = y0 + (y1 - y0) * f + (y1 - y0) * 1e-7, xs = [];
      for (const r of P) for (let k = 0, j = r.length - 1; k < r.length; j = k++) {
        const [xi, yi] = r[k], [xj, yj] = r[j];
        if ((yi > y) !== (yj > y)) xs.push(((xj - xi) * (y - yi)) / (yj - yi) + xi);
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) if (!melhor || xs[k + 1] - xs[k] > melhor.w) melhor = { w: xs[k + 1] - xs[k], p: [(xs[k] + xs[k + 1]) / 2, y] };
      if (melhor && melhor.w > (x1 - x0) * 0.2) break;
    }
    return melhor ? melhor.p : centroideAnel(P[0]);
  };
  /** Polo de inacessibilidade aproximado: ponto interno mais distante da borda (grade refinada 3 vezes). */
  const poloInacessibilidade = (P) => {
    const [x0, y0, x1, y1] = caixa(P), distBorda = (p) => Math.min(...P.flatMap((r) => r.map((a, k) => distPontoSeg(p, a, r[(k + 1) % r.length]))));
    let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = x1 - x0, h = y1 - y0, melhor = { d: -1, p: pontoInterno(P) };
    for (let it = 0; it < 3; it++) {
      for (let a = 0; a <= 16; a++) for (let b = 0; b <= 16; b++) {
        const p = [cx - w / 2 + (w * a) / 16, cy - h / 2 + (h * b) / 16];
        if (!dentro(p, P)) continue;
        const d = distBorda(p);
        if (d > melhor.d) melhor = { d, p };
      }
      [cx, cy] = melhor.p; w /= 4; h /= 4;
    }
    return melhor.p;
  };
  Object.assign(I, { areaAnel, area, areaMulti, centroide, caixa, caixaDe, dentro, distancia, pontoInterno, poloInacessibilidade });
  // #endregion

  // #region correspondencias · III-A
  /**
   * Correspondências entre os conjuntos Origem e Alvo (seção III-A). Artigo: Oi e Tj se correspondem se, e somente
   * se, se intersectam espacialmente. Ajustes (MR0001, D1): "area" exige interseção com área > 0; "raio" aceita
   * polígonos a até `raio` de distância (trabalho futuro citado no artigo); "limiar" exige que a área em comum seja
   * pelo menos a fração `limiar` da área do menor dos dois (malhas de anos diferentes, cujas bordas não coincidem).
   * Saída: CO[i] = índices de Alvo que correspondem a Oi; CT[j] = índices de Origem que correspondem a Tj.
   */
  I.correspondencias = (origem, alvo, { modo = "artigo", raio = 0, limiar = 0.05 } = {}) => {
    const CO = origem.map(() => []), CT = alvo.map(() => []);
    const cO = origem.map(caixa), cT = alvo.map(caixa), eps = 1e-9 * Math.hypot(...caixaDe([...origem, ...alvo]).slice(2));
    origem.forEach((O, i) => alvo.forEach((T, j) => {
      const limite = modo === "raio" ? raio : eps;
      if (distCaixas(cO[i], cT[j]) > limite) return;              // caixas distantes: não há como se tocarem
      const comum = () => areaMulti(pc().intersection(O, T));
      const ok = modo === "area" ? comum() > eps
               : modo === "limiar" ? comum() >= limiar * Math.min(area(O), area(T))
               : distancia(O, T) <= limite;                        // artigo: tocar a borda já conta
      if (ok) { CO[i].push(j); CT[j].push(i); }
    }));
    return { CO, CT };
  };
  // #endregion

  // #region sementes · IV-B
  /**
   * Uma semente por polígono correspondente, para o diagrama de Voronoi que divide P (seção IV-B).
   * "artigo": o vértice de cada correspondente mais próximo do centroide de P ("we chose as seed the position of the
   * vertex closest to the centroid of the polygon to be divided"). "interno" (MR0001, D2): ponto interno de c ∩ P.
   */
  I.sementes = (P, C, regra = "artigo") => {
    const [px, py] = centroide(P);
    return C.map((c) => {
      if (regra === "interno") {
        const inter = pc().intersection(P, c);
        if (inter.length) return pontoInterno(inter.reduce((a, b) => (area(b) > area(a) ? b : a)));
      }
      let m = Infinity, v = c[0][0];
      for (const p of c[0]) { const d = (p[0] - px) ** 2 + (p[1] - py) ** 2; if (d < m) { m = d; v = p; } }
      return v.slice();
    });
  };
  // #endregion

  // #region dividir · IV-B
  /**
   * Divide P em |C| partes, uma por polígono correspondente (função Divide do Algoritmo 1, técnica de Voronoi):
   * 1) diagrama de Voronoi das sementes; 2) interseção de P com cada célula. Com |C| = 1, P fica inteiro.
   * Devolve, na ordem de C, cada parte como multipolígono (pode sair em vários pedaços: ver juntarFragmentos).
   */
  I.dividir = (P, C, { semente = "artigo" } = {}) => {
    if (C.length === 1) return { partes: [[P]], sementes: [] };
    const s = I.sementes(P, C, semente);
    const [x0, y0, x1, y1] = caixaDe([P, ...C]), folga = Math.hypot(x1 - x0, y1 - y0);
    // sementes repetidas (em malhas, vizinhos dividem vértices; a regra do artigo pode escolher o mesmo para dois deles):
    // a repetida anda 1% do caminho até o centroide do próprio correspondente
    const tolS = folga * 1e-6;
    s.forEach((p, k) => {
      if (!s.slice(0, k).some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < tolS)) return;
      const [cx, cy] = centroide(C[k]);
      s[k] = [p[0] + 0.01 * (cx - p[0]), p[1] + 0.01 * (cy - p[1])];
    });
    const vor = d3.Delaunay.from(s).voronoi([x0 - folga, y0 - folga, x1 + folga, y1 + folga]);
    const partes = s.map((_, k) => { const cel = vor.cellPolygon(k); return cel ? pc().intersection(P, [cel]) : []; });
    return { partes, sementes: s, celulas: s.map((_, k) => vor.cellPolygon(k)) };
  };
  // #endregion

  // #region fragmentos · ajuste MR0001 (D3, provisório)
  /**
   * A célula de Voronoi é convexa e P não precisa ser: P ∩ célula pode sair em vários pedaços (≈ 1 parte em 10 nos
   * testes sintéticos). O pedaço mais próximo da semente (empate: o maior) fica; cada outro vai para a parte vizinha
   * com maior fronteira comum. A soma das áreas não muda (a partição de P é preservada).
   */
  I.juntarFragmentos = (partes, sementes) => {
    const tol = 1e-7 * Math.hypot(...caixaDe(partes.flat()).slice(2));
    const principais = [], soltos = [];
    partes.forEach((M, k) => {
      if (M.length <= 1) { principais.push(M); return; }
      const s = sementes[k], dist = (p) => (!s ? 0 : dentro(s, p) ? 0 : Math.min(...p[0].map((q, b) => distPontoSeg(s, q, p[0][(b + 1) % p[0].length]))));
      // fica o pedaço mais próximo da semente (a do artigo é um vértice do correspondente e pode cair fora de P); empate: o maior
      const prin = M.reduce((a, b) => { const da = dist(a), db = dist(b); return db < da - tol || (Math.abs(db - da) <= tol && area(b) > area(a)) ? b : a; });
      principais.push([prin]);
      M.filter((p) => p !== prin).forEach((g) => soltos.push({ k, g }));
    });
    const fronteira = (g, M) => {                   // comprimento das arestas de g que estão sobre a borda de M
      let L = 0;
      for (const r of g) for (let a = 0; a < r.length - 1; a++) {
        const m = [(r[a][0] + r[a + 1][0]) / 2, (r[a][1] + r[a + 1][1]) / 2];
        if (M.some((P) => P.some((s) => s.some((q, b) => b < s.length - 1 && distPontoSeg(m, q, s[b + 1]) < tol)))) L += Math.hypot(r[a + 1][0] - r[a][0], r[a + 1][1] - r[a][1]);
      }
      return L;
    };
    soltos.sort((a, b) => area(b.g) - area(a.g)).forEach(({ k, g }) => {
      let melhor = { L: 0, j: k };
      principais.forEach((M, j) => { if (j !== k && M.length) { const L = fronteira(g, M); if (L > melhor.L) melhor = { L, j }; } });
      principais[melhor.j] = pc().union(principais[melhor.j], [g]);
    });
    return principais;
  };
  // #endregion

  // #region divisaoEspacial · III-B, Algoritmo 1
  /**
   * Algoritmo 1 (divisão espacial). Entrada: Origem, Alvo, CO, CT. Saída: SPL, a lista de pares de formas 1-1.
   * `passos` registra cada linha executada, para a página acender o pseudocódigo.
   */
  I.divisaoEspacial = (origem, alvo, CO, CT, { semente = "artigo", fragmentos = true, ponto = "centroide" } = {}) => {
    const SPL = [], passos = [], RO = [], RT = [], divisoes = [];
    const alvoPonto = (P) => (ponto === "polo" ? poloInacessibilidade(P) : centroide(P));
    const parte = (P, C, lado, idx) => {
      const d = I.dividir(P, C.map((k) => (lado === "O" ? alvo : origem)[k]), { semente });
      const partes = fragmentos && C.length > 1 ? I.juntarFragmentos(d.partes, d.sementes) : d.partes;
      divisoes.push({ lado, idx, C, sementes: d.sementes, celulas: d.celulas, partes, multipartes: d.partes.filter((m) => m.length > 1).length });
      return Object.fromEntries(C.map((k, n) => [k, partes[n]]));
    };
    origem.forEach((O, i) => {                                                  // linha 2
      if (CO[i].length === 0) {                                                 // linha 3
        const c = alvoPonto(O);                                                 // linha 4: Centroid(Oi)
        SPL.push({ de: [O], para: c, i, j: null, tipo: "desaparece" });         // linha 5
        passos.push({ linha: 5, lado: "O", i });
      } else { RO[i] = parte(O, CO[i], "O", i); passos.push({ linha: 7, lado: "O", i, n: CO[i].length }); } // linha 7: Divide(Oi, COi)
    });
    alvo.forEach((T, j) => {                                                    // linha 10
      if (CT[j].length === 0) {                                                 // linha 11
        const c = alvoPonto(T);                                                 // linha 12: Centroid(Tj)
        SPL.push({ de: c, para: [T], i: null, j, tipo: "surge" });              // linha 13
        passos.push({ linha: 13, lado: "T", j });
      } else { RT[j] = parte(T, CT[j], "T", j); passos.push({ linha: 15, lado: "T", j, n: CT[j].length }); } // linha 15: Divide(Tj, CTj)
    });
    alvo.forEach((_, j) => CT[j].forEach((i) => {                               // linhas 18–19
      SPL.push({ de: RO[i][j], para: RT[j][i], i, j, tipo: "par" });            // linha 20: SPL.append([Rij, Rji])
      passos.push({ linha: 20, i, j });
    }));
    return { SPL, passos, divisoes };                                           // linha 23
  };
  // #endregion

  // #region interpolacao · III-C (flubber)
  /**
   * Interpolação de cada par (seção III-C), com o flubber (Veltman, 2017), que faz os três passos do artigo:
   * 1) iguala o número de vértices (subdivide arestas e acrescenta pontos ao anel menor);
   * 2) escolhe a correspondência de vértices de menor custo de trajetória (rotação com menor soma de distâncias²);
   * 3) interpola linearmente os vértices correspondentes.
   * Pares com ponto (surgir/desaparecer) crescem a partir dele ou colapsam nele.
   * Buracos: em aberto (MR0001, D4) — só o contorno externo é interpolado, e os buracos descartados são contados.
   */
  I.interpoladores = (SPL, { maxSegmentLength = 1 } = {}) => {
    const op = { maxSegmentLength, string: false }, ehPonto = (x) => typeof x[0] === "number";
    let buracos = 0;
    const anel = (M) => {                                   // multipolígono → anel externo do maior pedaço
      buracos += M.reduce((s, p) => s + p.length - 1, 0);   // buracos descartados (D4 em aberto)
      return M.reduce((a, b) => (area(b) > area(a) ? b : a))[0];
    };
    let vazias = 0;   // parte vazia (célula de Voronoi que não alcança o polígono): tratada como ponto, e contada
    const fns = SPL.map((par) => {
      let { de, para } = par;
      if (!ehPonto(de) && !de.length) { vazias++; de = centroide(para[0]); }
      if (!ehPonto(para) && !para.length) { vazias++; para = centroide(de[0]); }
      if (ehPonto(para)) return flubber.toCircle(anel(de), para[0], para[1], 1e-6, op);
      if (ehPonto(de)) return flubber.fromCircle(de[0], de[1], 1e-6, anel(para), op);
      return flubber.interpolate(anel(de), anel(para), op);
    });
    return { fns, buracos, vazias, multipartes: SPL.filter((p) => !ehPonto(p.de) && p.de.length > 1 || !ehPonto(p.para) && p.para.length > 1).length };
  };
  /** Formas do quadro t (0 = Origem, 1 = Alvo). */
  I.quadro = (fns, t) => fns.map((f) => f(t));
  // #endregion

  // #region sobreposicao · R4 medido (MR0001, D8)
  /**
   * Requisito R4 ("os polígonos não devem se intersectar"): o artigo verificou por exemplos; aqui se mede.
   * Área sobreposta entre as formas de um quadro, como fração da soma das áreas. Anéis que se cruzam a si mesmos
   * no meio da animação são contados à parte (podem invalidar a medida de área).
   */
  I.sobreposicao = (aneis) => {
    const P = aneis.map((r) => [r]), cx = P.map(caixa);
    let sobre = 0, total = 0, invalidos = 0;
    P.forEach((p) => { total += Math.abs(areaAnel(p[0])); });
    for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) {
      if (distCaixas(cx[a], cx[b]) > 0) continue;
      try { sobre += areaMulti(pc().intersection(P[a], P[b])); } catch (e) { invalidos++; }
    }
    return { fracao: total ? sobre / total : 0, area: sobre, invalidos };
  };
  // #endregion

  // #region eventos · trabalho futuro do artigo (VI), em avaliação (MR0001, D8)
  /**
   * Eventos derivados das correspondências: componentes conexos do grafo Origem–Alvo, classificados pela cardinalidade
   * (0→1 surge; 1→0 desaparece; 1→n divide; n→1 funde; n→m reorganiza; 1→1 expande, contrai ou estável, com limiar
   * de ±`limiar` na variação de área). Nomes e limiar em avaliação no protótipo.
   */
  I.eventos = (origem, alvo, CO, { limiar = 0.05 } = {}) => {
    const pai = [...origem.map((_, i) => `o${i}`), ...alvo.map((_, j) => `t${j}`)].reduce((m, k) => (m[k] = k, m), {});
    const raiz = (k) => (pai[k] === k ? k : (pai[k] = raiz(pai[k])));
    CO.forEach((js, i) => js.forEach((j) => { pai[raiz(`o${i}`)] = raiz(`t${j}`); }));
    const grupos = {};
    Object.keys(pai).forEach((k) => { (grupos[raiz(k)] ||= { o: [], t: [] })[k[0]].push(+k.slice(1)); });
    return Object.values(grupos).map(({ o, t }) => {
      const aO = o.reduce((s, i) => s + area(origem[i]), 0), aT = t.reduce((s, j) => s + area(alvo[j]), 0);
      const tipo = !o.length ? "surge" : !t.length ? "desaparece" : o.length === 1 && t.length === 1
        ? (aT > aO * (1 + limiar) ? "expande" : aT < aO * (1 - limiar) ? "contrai" : "estavel")
        : o.length === 1 ? "divide" : t.length === 1 ? "funde" : "reorganiza";
      const pts = [...o.map((i) => centroide(origem[i])), ...t.map((j) => centroide(alvo[j]))];
      return { tipo, o, t, variacao: aO ? aT / aO - 1 : null, pos: [d3.mean(pts, (p) => p[0]), d3.mean(pts, (p) => p[1])] };
    });
  };
  // #endregion

  // #region flubberDireto · comparação da Fig. 9
  /**
   * O que o flubber faz sozinho (comparação da Fig. 9): 1-1 com interpolate, 1-n com separate e n-1 com combine,
   * que dividem a forma por triangulação sem olhar a posição dos correspondentes. Não há muitos-para-muitos: esses
   * grupos ficam de fora (null), e a página diz isso.
   */
  I.flubberDireto = (origem, alvo, CO, { maxSegmentLength = 1 } = {}) => {
    const op = { maxSegmentLength, string: false, single: false }, fns = [];
    let semSuporte = 0;
    I.eventos(origem, alvo, CO).forEach(({ o, t }) => {
      const O = o.map((i) => origem[i][0]), T = t.map((j) => alvo[j][0]);
      if (!T.length) { const [x, y] = centroide(origem[o[0]]); fns.push(flubber.toCircle(O[0], x, y, 1e-6, op)); }
      else if (!O.length) { const [x, y] = centroide(alvo[t[0]]); fns.push(flubber.fromCircle(x, y, 1e-6, T[0], op)); }
      else if (O.length === 1 && T.length === 1) fns.push(flubber.interpolate(O[0], T[0], op));
      else if (O.length === 1) fns.push(...flubber.separate(O[0], T, op));
      else if (T.length === 1) fns.push(...flubber.combine(O, T[0], op));
      else semSuporte++;
    });
    return { fns, semSuporte };
  };
  // #endregion
})();

</script>
<script>
Lab.configurar({"autorUrl": "https://github.com/CajazeiraAlexandre"});
/* app.js — página interativa do artigo "A partition approach to interpolate polygon sets for animation" (SIBGRAPI 2019).
 * O algoritmo está em src/interpolacao.js (window.Interpolacao); aqui só se monta a página, desenha e controla.
 * Textos em PT e EN (src/textos.yaml); estado no endereço (#lang=en&…). Decisões: ADR MR0001. Cores: tokens do DS. */
(async function () {
  "use strict";
  const { el } = Lab;
  const I = window.Interpolacao;
  const base = await Lab.decodificar(document.getElementById("dados").textContent.trim());
  const { textos, codigo, refs } = base;
  const casos = Object.fromEntries(base.casos.map((c) => [c.id, c]));
  const app = document.getElementById("app"), capa = document.getElementById("capa");
  Lab.configurar({ raiz: app, autor: "Alexandre Ribeiro Cajazeira Ramos" });

  // ------------------------------------------------------------------ estado (no endereço) e textos
  const est = { lang: "pt", s2caso: "exp3", s2modo: "artigo", s2raio: "4", s2limiar: "5", s3caso: "exp3", s3passo: "0",
                s4caso: "fig9", s4semente: "artigo", s5caso: "exp1a", s6caso: "exp3", s6eventos: "0", s7caso: "pi9100", s7limiar: "5" };
  try { const p = new URLSearchParams(location.hash.slice(1)); for (const k of Object.keys(est)) if (p.has(k)) est[k] = p.get(k); } catch (e) { /* padrão */ }
  const guardar = () => history.replaceState(null, "", `#${new URLSearchParams(est)}`);
  const T = (k, v = {}) => {
    const e = textos[k];
    const s = e ? e[est.lang] ?? e.pt : k;
    return s.replace(/\{(\w+)\}/g, (_, n) => (v[n] ?? `{${n}}`));
  };
  const loc = () => (est.lang === "pt" ? "pt-BR" : "en-US");
  const num = (x, d = 1) => x.toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (x, d = 1) => `${num(100 * x, d)}%`;
  const MSL = 1.4;   // maxSegmentLength do flubber: 1/100 da diagonal do quadro 0–100 (MR0001, D6)

  // ------------------------------------------------------------------ cores (tokens; categóricas em ordem fixa)
  const tk = (n) => Lab.token(n);
  const corO = () => tk("cor-cat-1"), corT = () => tk("cor-cat-2");
  const corParte = (k) => (k < 8 ? tk(`cor-cat-${k + 1}`) : tk("cor-texto-suave"));   // da 9ª em diante: cinza
  const corT_t = (t) => d3.interpolateLab(corO(), corT())(t);

  // ------------------------------------------------------------------ execução do algoritmo (com cache)
  const cache = new Map();
  function executar(caso, { modo = "artigo", raio = 0, limiar = 0.05, semente = "artigo", fragmentos = true, ponto = "centroide" } = {}) {
    const chave = JSON.stringify([caso.id, modo, raio, limiar, semente, fragmentos, ponto]);
    if (caso.id !== "usuario" && cache.has(chave)) return cache.get(chave);
    const { origem, alvo } = caso;
    const { CO, CT } = I.correspondencias(origem, alvo, { modo, raio: +raio, limiar: +limiar });
    const div = I.divisaoEspacial(origem, alvo, CO, CT, { semente, fragmentos, ponto });
    const r = { CO, CT, ...div, ...I.interpoladores(div.SPL, { maxSegmentLength: MSL }) };
    cache.set(chave, r);
    return r;
  }
  const medirSobreposicao = (fns) => d3.range(21).map((k) => ({ t: k / 20, ...I.sobreposicao(I.quadro(fns, k / 20)) }));

  // ------------------------------------------------------------------ desenho
  const caminho = (P) => P.map((r) => `M${r.map((p) => `${+p[0].toFixed(3)},${+p[1].toFixed(3)}`).join("L")}Z`).join("");
  const caminhoMulti = (M) => M.map(caminho).join("");
  const anelCaminho = (r) => `M${r.map((p) => `${+p[0].toFixed(3)},${+p[1].toFixed(3)}`).join("L")}Z`;

  /** Plano SVG no quadro 0–100: contornos de referência (Origem cheio, Alvo tracejado) e camadas para o resto. */
  function plano(caso, { rotulo = "", referencia = true } = {}) {
    const svg = d3.create("svg").attr("class", "plano").attr("viewBox", "-3 -3 106 106").attr("role", "img").attr("aria-label", rotulo);
    const ref = svg.append("g");
    if (referencia) {
      ref.selectAll("path.o").data(caso.origem).join("path").attr("d", caminho).attr("fill", "none").attr("stroke", corO())
        .attr("stroke-width", 1.2).attr("vector-effect", "non-scaling-stroke").attr("fill-rule", "evenodd");
      ref.selectAll("path.t").data(caso.alvo).join("path").attr("d", caminho).attr("fill", "none").attr("stroke", corT())
        .attr("stroke-width", 1.2).attr("stroke-dasharray", "4 3").attr("vector-effect", "non-scaling-stroke").attr("fill-rule", "evenodd");
    }
    const camadas = { ref, fundo: svg.insert("g", ":first-child"), formas: svg.append("g"), extra: svg.append("g"), rotulos: svg.append("g") };
    return { svg, no: svg.node(), ...camadas };
  }
  const rotulo = (g, [x, y], texto, classe = "rotulo") => g.append("text").attr("class", classe).attr("x", x).attr("y", y)
    .attr("text-anchor", "middle").attr("dominant-baseline", "middle").text(texto);
  const ponto = (g, [x, y], cor, r = 1.1) => g.append("circle").attr("cx", x).attr("cy", y).attr("r", r).attr("fill", cor)
    .attr("stroke", tk("cor-superficie")).attr("stroke-width", 1.5).attr("vector-effect", "non-scaling-stroke");
  const preencher = (g, M, cor, op = 0.8) => g.append("path").attr("d", caminhoMulti(M)).attr("fill", cor).attr("fill-opacity", op)
    .attr("fill-rule", "evenodd").attr("stroke", tk("cor-superficie")).attr("stroke-width", 1).attr("vector-effect", "non-scaling-stroke");
  const chaves = () => el("div", { class: "chaves" },
    el("span", {}, Object.assign(el("span", { class: "tr" }), { style: `border-color:${corO()}` }), T("origem")),
    el("span", {}, Object.assign(el("span", { class: "tr tracejado" }), { style: `border-color:${corT()}` }), T("alvo")));

  /** Formas de um quadro: preenchimento que vai da cor da Origem à do Alvo; sobreposições ficam mais escuras. */
  function desenharQuadro(p, aneis, t, estaticos = []) {
    p.formas.selectAll("path").data([...aneis.map((r) => ({ d: anelCaminho(r) })), ...estaticos.map((P) => ({ d: caminho(P), est: true }))])
      .join("path").attr("d", (d) => d.d).attr("fill", (d) => (d.est ? tk("cor-texto-suave") : corT_t(t))).attr("fill-opacity", 0.6)
      .attr("stroke", tk("cor-superficie")).attr("stroke-width", 0.8).attr("vector-effect", "non-scaling-stroke");
  }

  /** Tocador: botão animar/pausar + controle deslizante de t. Sem início automático. */
  function tocador(aoT, inicial = 0) {
    let t = inicial, quadroAnim = null;
    const saida = el("output", {});
    const faixa = el("input", { type: "range", min: 0, max: 1, step: 0.01, value: t, "aria-label": T("quadro_t") });
    const botao = el("button", { type: "button", class: "botao", text: T("tocar") });
    const mostrar = (v) => { t = v; faixa.value = v; saida.textContent = `t = ${num(v, 2)}`; aoT(v); };
    const parar = () => { if (quadroAnim) cancelAnimationFrame(quadroAnim); quadroAnim = null; botao.textContent = T("tocar"); };
    faixa.addEventListener("input", () => { parar(); mostrar(+faixa.value); });
    botao.addEventListener("click", () => {
      if (quadroAnim) return parar();
      if (Lab.semMovimento()) return mostrar(t >= 1 ? 0 : 1);
      const t0 = t >= 1 ? 0 : t, inicio = performance.now(), dur = 3000 * (1 - t0);
      botao.textContent = T("pausar");
      const passo = (agora) => {
        const v = Math.min(1, t0 + ((agora - inicio) / dur) * (1 - t0));
        mostrar(d3.easeCubicInOut(v));
        if (v < 1) quadroAnim = requestAnimationFrame(passo); else parar();
      };
      quadroAnim = requestAnimationFrame(passo);
    });
    requestAnimationFrame(() => mostrar(inicial));
    return { no: el("div", { class: "tocador" }, botao, faixa, saida), mostrar };
  }

  /** Curva da área sobreposta por quadro (R4): uma série por variante comparada (legenda + rótulo direto quando há
   *  mais de uma), marcador no t atual e dica com os valores de todas as séries. */
  function curvaSobreposicao(series) {
    const L = 600, A = 120, m = { t: 18, d: 12, b: 22, e: 44 };
    const x = d3.scaleLinear([0, 1], [m.e, L - m.d]);
    const maxV = d3.max(series, (s) => d3.max(s.medidas, (d) => d.fracao));
    const y = d3.scaleLinear([0, Math.max(0.01, maxV * 1.15)], [A - m.b, m.t]).nice(3);
    const svg = d3.create("svg").attr("viewBox", `0 0 ${L} ${A}`).attr("role", "img").attr("aria-label", T("sobreposicao_titulo"));
    svg.append("g").attr("transform", `translate(0,${A - m.b})`).call(d3.axisBottom(x).ticks(5).tickFormat((v) => num(v, 2)).tickSizeOuter(0))
      .call((g) => g.selectAll("text").attr("font-size", 11).attr("fill", tk("cor-texto-secundario")))
      .call((g) => g.selectAll("line,path").attr("stroke", tk("cor-eixo")));
    svg.append("g").attr("transform", `translate(${m.e},0)`).call(d3.axisLeft(y).ticks(3).tickFormat((v) => pct(v, 1)).tickSize(-(L - m.e - m.d)))
      .call((g) => g.select(".domain").remove())
      .call((g) => g.selectAll("line").attr("stroke", tk("cor-grade")))
      .call((g) => g.selectAll("text").attr("font-size", 11).attr("fill", tk("cor-texto-secundario")));
    if (series.length === 1) svg.append("path").datum(series[0].medidas).attr("fill", series[0].cor).attr("fill-opacity", 0.2)
      .attr("d", d3.area().x((d) => x(d.t)).y0(y(0)).y1((d) => y(d.fracao)));
    series.forEach((s) => {
      svg.append("path").datum(s.medidas).attr("fill", "none").attr("stroke", s.cor).attr("stroke-width", 2)
        .attr("d", d3.line().x((d) => x(d.t)).y((d) => y(d.fracao)));
    });
    // rótulo direto no pico de cada série (com mais de uma); omitido se colidir com outro ou se a série for nula
    if (series.length > 1) {
      const picos = series.map((s) => ({ s, p: s.medidas.reduce((a, b) => (b.fracao > a.fracao ? b : a)) }));
      const colide = picos.some((a, k) => picos.some((b, j) => j > k && Math.abs(y(a.p.fracao) - y(b.p.fracao)) < 14 && Math.abs(x(a.p.t) - x(b.p.t)) < 140));
      if (!colide) picos.filter(({ p }) => p.fracao > 1e-6).forEach(({ s, p }) => svg.append("text").attr("x", x(p.t)).attr("y", y(p.fracao) - 6)
        .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", tk("cor-texto-secundario")).text(s.rotulo));
    }
    const marca = svg.append("line").attr("y1", m.t).attr("y2", A - m.b).attr("stroke", tk("cor-texto")).attr("stroke-width", 1);
    svg.append("rect").attr("x", m.e).attr("y", 0).attr("width", L - m.e - m.d).attr("height", A).attr("fill", "transparent")
      .on("mousemove", (ev) => {
        const [px] = d3.pointer(ev), k = Math.round(Math.max(0, Math.min(1, x.invert(px))) * 20);
        Lab.mostrarDica(ev, `t = ${num(k / 20, 2)}`, series.map((s) => `${series.length > 1 ? `${s.rotulo}: ` : ""}${pct(s.medidas[k].fracao, 2)}`));
      }).on("mouseleave", Lab.esconderDica);
    const notas = series.map((s) => {
      const mx = s.medidas.reduce((a, b) => (b.fracao > a.fracao ? b : a)), inval = d3.sum(s.medidas, (d) => d.invalidos);
      const txt = mx.fracao > 1e-6 ? T("sobreposicao_max", { v: pct(mx.fracao, 2), t: num(mx.t, 2) }) : T("sobreposicao_zero");
      return el("p", { class: "nota" }, series.length > 1 ? `${s.rotulo}: ` : "", txt, inval ? ` ${T("invalidos", { n: inval })}` : "");
    });
    const legenda = series.length > 1 ? el("div", { class: "chaves" }, ...series.map((s) => Lab.chave(s.cor, s.rotulo))) : null;
    const caixa = el("div", { class: "curva" }, el("p", { class: "titulo-curva", text: T("sobreposicao_titulo") }), legenda, svg.node(), ...notas);
    return { no: caixa, marcar: (t) => marca.attr("x1", x(t)).attr("x2", x(t)) };
  }

  /** Bloco de código: trecho de src/interpolacao.js (gerado das regiões #region), com os comentários destacados. */
  function blocoCodigo(...regioes) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const pre = el("pre", {});
    pre.innerHTML = regioes.map((r) => {
      const c = codigo[r];
      return `<span class="c">// ${esc(c.arquivo)}, linhas ${c.inicio}–${c.fim} · ${esc(c.ref)}</span>\n` +
        esc(c.texto).replace(/(\/\*\*[\s\S]*?\*\/|\/\/[^\n]*)/g, '<span class="c">$1</span>');
    }).join("\n\n");
    return el("details", { class: "codigo-passo", open: matchMedia("(min-width: 1100px)").matches ? "" : null },
      el("summary", {}, `</> ${T("codigo")} · ${T("codigo_arquivo")}`), pre);
  }
  const secao = (id, titulo, ref) => el("section", { class: "etapa", id }, el("h2", { text: titulo }), ref ? el("p", { class: "ref-artigo", text: ref }) : null);
  const grade = (colTexto, ...regioes) => el("div", { class: "grade-passo" }, colTexto, el("div", { class: "col-codigo" }, blocoCodigo(...regioes)));
  const opcoesCasos = (ids) => ids.map((id) => [id, `${casos[id].titulo[est.lang]} · ${casos[id].ref}`]);
  function trocar(no, novo) { no.replaceWith(novo); return novo; }

  // ------------------------------------------------------------------ figuras animadas (uma ou duas, lado a lado)
  /** Prepara uma variante: algoritmo do artigo (Voronoi) ou flubber direto, com as opções de correspondência. */
  function prepararAnim(caso, { metodo = "voronoi", op = {} } = {}) {
    const r = executar(caso, op);
    if (metodo !== "flubber") return { r, fns: r.fns, estaticosFn: () => [], semSuporte: 0, buracos: r.buracos };
    const f = I.flubberDireto(caso.origem, caso.alvo, r.CO, { maxSegmentLength: MSL });
    const nm = I.eventos(caso.origem, caso.alvo, r.CO).filter((g) => g.o.length > 1 && g.t.length > 1);
    // grupos muitos-para-muitos: sem suporte no flubber; mostrados parados (Origem até a metade, Alvo depois)
    const estaticosFn = (t) => nm.flatMap((g) => (t < 0.5 ? g.o.map((i) => caso.origem[i]) : g.t.map((j) => caso.alvo[j])));
    return { r, fns: f.fns, estaticosFn, semSuporte: f.semSuporte, buracos: 0 };
  }

  /** Uma ou mais variantes do mesmo caso, lado a lado, com um só tocador (mesmo t), a curva de sobreposição de cada
   *  uma e, opcionalmente, eventos e quadros estáticos. lados: [{rotulo, metodo, op, cor}]. */
  function comparacao(caso, lados, { eventos = false, curva = true, estatico = false } = {}) {
    const A = lados.map((l) => ({ ...l, ...prepararAnim(caso, l) }));
    const ps = A.map((a) => {
      const p = plano(caso, { rotulo: `${caso.titulo[est.lang]}${a.rotulo ? ` · ${a.rotulo}` : ""}: ${caso.origem.length} → ${caso.alvo.length}` });
      if (eventos) I.eventos(caso.origem, caso.alvo, a.r.CO).forEach((e) => rotulo(p.rotulos, e.pos, T(`ev_${e.tipo}`), "rotulo rotulo-ev"));
      return p;
    });
    const c = curva ? curvaSobreposicao(A.map((a) => ({ rotulo: a.rotulo, cor: a.cor, medidas: medirSobreposicao(a.fns) }))) : null;
    const tc = tocador((t) => { A.forEach((a, k) => desenharQuadro(ps[k], I.quadro(a.fns, t), t, a.estaticosFn(t))); if (c) c.marcar(t); });
    const dupla = A.length > 1;
    const figs = dupla ? el("div", { class: "dupla" }, ...A.map((a, k) => el("figure", { style: "margin:0" }, ps[k].no,
      el("figcaption", {}, Lab.chip(a.cor), ` ${a.rotulo} · ${T("interpolacoes", { n: a.fns.length })}`)))) : ps[0].no;
    const avisos = A.flatMap((a) => [
      a.semSuporte ? el("p", { class: "aviso", text: `${dupla ? `${a.rotulo}: ` : ""}${T("sem_suporte", { n: a.semSuporte })}` }) : null,
      a.buracos ? el("p", { class: "aviso aberto", text: T("buracos_aviso", { n: a.buracos }) }) : null]).filter(Boolean);
    const quadros = estatico ? el("div", {}, el("p", { class: "titulo-curva nota", text: T("estatico") }), ...A.map((a) => el("div", {},
      dupla ? el("p", { class: "nota", style: "margin:6px 0 2px" }, Lab.chip(a.cor), ` ${a.rotulo}`) : null,
      el("div", { class: "estatico" }, ...[0, 0.25, 0.5, 0.75, 1].map((t) => {
        const q = plano(caso, { rotulo: `${a.rotulo} t = ${t}` });
        desenharQuadro(q, I.quadro(a.fns, t), t, a.estaticosFn(t));
        return el("figure", { style: "margin:0" }, q.no, el("figcaption", { text: `t = ${num(t, 2)}` }));
      }))))) : null;
    return el("div", { class: "figura" }, figs, chaves(), tc.no, ...avisos, c ? c.no : null, quadros,
      ...A.filter((a) => a.metodo !== "flubber").map((a) => tabelaPares(caso, a.r, dupla ? a.rotulo : "")));
  }
  const figuraAnimada = (caso, { metodo = "voronoi", op = {}, ...resto } = {}) =>
    comparacao(caso, [{ rotulo: "", metodo, op, cor: tk("cor-seq-6") }], resto);

  /** Tabela alternativa: os pares da SPL, com as áreas de partida e de chegada. */
  function tabelaPares(caso, r, rotuloLado = "") {
    const nomes = { O: caso.nomes_origem, T: caso.nomes_alvo };
    const nome = (lado, k) => (k === null ? "—" : nomes[lado] ? nomes[lado][k] : `${lado}${k + 1}`);
    const areaDe = (x) => (typeof x[0] === "number" ? 0 : I.areaMulti(x));
    const linhas = r.SPL.map((s) => [nome("O", s.i), nome("T", s.j), s.tipo, num(areaDe(s.de), 1), num(areaDe(s.para), 1)]);
    const t = Lab.tabela(["O", "T", est.lang === "pt" ? "tipo" : "type", est.lang === "pt" ? "área de partida" : "start area",
      est.lang === "pt" ? "área de chegada" : "end area"], linhas);
    return el("details", { class: "info" }, el("summary", {}, `${rotuloLado ? `${rotuloLado} · ` : ""}${T("pares", { n: r.SPL.length })} · ${est.lang === "pt" ? "tabela" : "table"}`), t);
  }

    r.CO.forEach((js, i) => js.forEach((j) => p.extra.append("line").attr("x1", cO[i][0]).attr("y1", cO[i][1]).attr("x2", cT[j][0]).attr("y2", cT[j][1])
      .attr("stroke", tk("cor-texto")).attr("stroke-width", 1.2).attr("vector-effect", "non-scaling-stroke")));
    cO.forEach((c, i) => rotulo(p.rotulos, c, `O${i + 1}`));
    cT.forEach((c, j) => rotulo(p.rotulos, [c[0], c[1] + 3.2], `T${j + 1}`));
    const lista = (L, lado) => L.map((x, k) => [`${lado === "O" ? "CO" : "CT"}${k + 1}`, x.length ? x.map((v) => `${lado === "O" ? "T" : "O"}${v + 1}`).join(", ") : "∅"]);
    const tabela = el("table", { class: "listas" }, el("caption", { class: "nota", style: "text-align:left", text: T("tabela_co") }),
      ...d3.zip(lista(r.CO, "O"), lista(r.CT, "T")).map(([a, b]) => el("tr", {}, el("th", { text: a?.[0] ?? "" }), el("td", { text: a?.[1] ?? "" }),
        el("th", { text: b?.[0] ?? "" }), el("td", { text: b?.[1] ?? "" }))));
    const ctr = el("div", { class: "controles" },
      Lab.seletor(T("caso"), opcoesCasos(["exp3", "hotspots", "fig9", "pi9100", "pi1022"]), est.s2caso, (v) => { est.s2caso = v; atualizar(s, s2); }),
      Lab.alternar(T("s2_modo"), [["artigo", T("modo_artigo")], ["area", T("modo_area")], ["raio", T("modo_raio")], ["limiar", T("modo_limiar")]], est.s2modo, (v) => { est.s2modo = v; atualizar(s, s2); }, true),
      est.s2modo === "limiar" ? el("label", { class: "campo" }, `${T("limiar")}: ${est.s2limiar}%`,
        el("input", { type: "range", min: 1, max: 20, step: 1, value: est.s2limiar, onchange: (e) => { est.s2limiar = e.target.value; atualizar(s, s2); } })) : null,
      est.s2modo === "raio" ? el("label", { class: "campo" }, `${T("raio")}: ${est.s2raio}`,
        el("input", { type: "range", min: 0, max: 15, step: 0.5, value: est.s2raio, onchange: (e) => { est.s2raio = e.target.value; atualizar(s, s2); } })) : null);
    s.append(grade(el("div", {}, el("p", { text: T("s2_texto") }), ctr, p.no, chaves(), tabela), "correspondencias"));

  // ------------------------------------------------------------------ 3. Algoritmo 1, passo a passo
  const ALG1 = ["Input: Origin, Target, CO and CT", "Output: SPL", "SPL ← ∅", "for each Oi ∈ Origin do", "  if COi = ∅ then",
    "    c ← Centroid(Oi)", "    SPL.append([Oi, c])", "  else", "    Ri ← Divide(Oi, COi)", "  end if", "end for", "for each Tj ∈ Target do",
    "  if CTj = ∅ then", "    c ← Centroid(Tj)", "    SPL.append([c, Tj])", "  else", "    Rj ← Divide(Tj, CTj)", "  end if", "end for",
    "for each Tj ∈ Target do", "  for each Oi in CTj do", "    SPL.append([Rij, Rji])", "  end for", "end for", "return SPL"];
  // linha do artigo (1–23) de cada item acima (as duas primeiras são cabeçalho)
  const NUM_ALG1 = [null, null, ...d3.range(1, 24)];
  const ACENDE = { 5: [3, 4, 5], 7: [6, 7], 13: [11, 12, 13], 15: [14, 15], 20: [18, 19, 20] };
  function s3() {
    const s = secao("s3", T("s3_titulo"), T("s3_ref"));
    const caso = casos[est.s3caso], r = executar(caso);
    const n = r.passos.length, k = Math.min(+est.s3passo, n - 1), ps = r.passos[k];
    const p = plano(caso, { rotulo: T("s3_titulo") });
    const div = (lado, idx) => r.divisoes.find((d) => d.lado === lado && d.idx === idx);
    let desc = "";

  function desenharDivisao(caso, d, rotuloTxt) {
    const p = plano(caso, { rotulo: rotuloTxt, referencia: false });
    const P = d.lado === "O" ? caso.origem[d.idx] : caso.alvo[d.idx];
    const C = d.C.map((k) => (d.lado === "O" ? caso.alvo : caso.origem)[k]);
    d.partes.forEach((M, q) => preencher(p.formas, M, corParte(q), 0.75));
    p.extra.append("g").selectAll("path").data(d.celulas || []).join("path").attr("d", (r) => anelCaminho(r)).attr("fill", "none")
      .attr("stroke", tk("cor-texto-suave")).attr("stroke-width", 0.8).attr("vector-effect", "non-scaling-stroke");
    C.forEach((c) => p.extra.append("path").attr("d", caminho(c)).attr("fill", "none").attr("stroke", tk("cor-texto"))
      .attr("stroke-dasharray", "3 2").attr("stroke-width", 1).attr("vector-effect", "non-scaling-stroke"));
    p.extra.append("path").attr("d", caminho(P)).attr("fill", "none").attr("stroke", tk("cor-texto")).attr("stroke-width", 1.6).attr("vector-effect", "non-scaling-stroke");
    (d.sementes || []).forEach((sp, q) => ponto(p.extra, sp, corParte(q), 1.3));

  /** Arquivos do leitor → caso no quadro 0–100: filtro, dissolução, partes, projeção, área mínima, simplificação. */
  function prepararDados(gjO, gjT, op) {
    const feicoes = (gj) => {
      let fs = (gj.type === "FeatureCollection" ? gj.features : gj.type === "Feature" ? [gj] : [{ type: "Feature", properties: {}, geometry: gj }])
        .filter((x) => x.geometry && /Polygon$/.test(x.geometry.type));
      if (op.filtro.includes("=")) { const [k, v] = op.filtro.split("=").map((x) => x.trim()); fs = fs.filter((x) => String(x.properties?.[k]) === v); }
      const polis = (g) => (g.type === "Polygon" ? [g.coordinates] : g.coordinates);
      if (op.dissolver) {
        const grupos = d3.group(fs, (x) => x.properties?.[op.dissolver]);
        return [...grupos.values()].flatMap((g) => polygonClipping.union(...g.map((x) => polis(x.geometry))));
      }
      return fs.flatMap((x) => (op.corrigir ? polygonClipping.union(polis(x.geometry)) : polis(x.geometry)));
    };
    let O = feicoes(gjO), Tt = feicoes(gjT);
    // projeção: proj4 informada; geográficas → azimutal de áreas iguais centrada nos dados (MR0001, D7); planas → y invertido
    const todos = [...O, ...Tt].flatMap((P) => P[0]);
    const geografico = todos.every(([x, y]) => Math.abs(x) <= 180 && Math.abs(y) <= 90);
    let proj;
    if (op.projecao) { const pr = proj4(op.projecao); proj = ([x, y]) => { const [a, b] = pr.forward([x, y]); return [a, -b]; }; }
    else if (geografico) {
      const lon = d3.mean(d3.extent(todos, (p) => p[0])), lat = d3.mean(d3.extent(todos, (p) => p[1]));
      const pr = d3.geoAzimuthalEqualArea().rotate([-lon, -lat]).scale(1000).translate([0, 0]);
      proj = (p) => pr(p);
    } else proj = ([x, y]) => [x, -y];
    const projetar = (L) => L.map((P) => P.map((r) => r.map(proj)));
    O = projetar(O); Tt = projetar(Tt);
    // quadro 0–100 (mesma escala para os dois conjuntos)
    const [x0, y0, x1, y1] = I.caixaDe([...O, ...Tt]), esc = 100 / Math.max(x1 - x0, y1 - y0);
    const normal = (L) => L.map((P) => P.map((r) => r.map(([x, y]) => [(x - x0) * esc, (y - y0) * esc])));
    O = normal(O); Tt = normal(Tt);
    // área mínima e simplificação (Douglas–Peucker por anel)
    const maxA = d3.max([...O, ...Tt], I.area);
    const filtroArea = (L) => L.filter((P) => I.area(P) >= op.areaMin * maxA);
    const dp = (pts, tol) => {
      if (pts.length < 3) return pts;
      let dmax = 0, idx = 0;
      const [a, b] = [pts[0], pts[pts.length - 1]];
      for (let k = 1; k < pts.length - 1; k++) {
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-12;
        const d = Math.abs(dy * pts[k][0] - dx * pts[k][1] + b[0] * a[1] - b[1] * a[0]) / L;
        if (d > dmax) { dmax = d; idx = k; }
      }
      return dmax > tol ? [...dp(pts.slice(0, idx + 1), tol).slice(0, -1), ...dp(pts.slice(idx), tol)] : [a, b];
    };
    const tol = op.simplificar * Math.SQRT2 * 100;
    const simplificar = (L) => L.map((P) => P.map((r) => { const s = dp(r, tol); return s.length >= 4 ? s : r; }));
    O = simplificar(filtroArea(O)); Tt = simplificar(filtroArea(Tt));
    return { id: "usuario", titulo: { pt: "Seus dados", en: "Your data" }, ref: "", nota: { pt: "", en: "" }, origem: O, alvo: Tt };
  }
