          fantasmas.selectAll("path").data(nos).join("path").attr("d", (n) => caminho(n.f)).attr("fill", (n) => preencherH(n.id))
            .transition().duration(DURACAO).ease(d3.easeCubicInOut).style("opacity", 0).remove();
          formas.attr("d", (n) => caminhoCirculo(n.x0, n.y0, 0.01)).transition().duration(DURACAO).ease(d3.easeCubicInOut).attrTween("d", (n) => interp(n, true));
        } else {        // círculos → mapa: círculos (fantasmas) encolhem para o centro; polígonos surgem
          formas.attr("d", final).style("opacity", 0).transition().duration(DURACAO).ease(d3.easeCubicInOut).style("opacity", 1);
          const fantasmas = cena.append("g").attr("pointer-events", "none");
          fantasmas.selectAll("path").data(nos.filter((n) => n.r > 0)).join("path").attr("fill", (n) => preencherH(n.id))
            .attr("stroke", Lab.token("cor-superficie")).attr("stroke-width", 0.6)
            .transition().duration(DURACAO).ease(d3.easeCubicInOut).attrTween("d", (n) => interp(n, false)).style("opacity", 0).remove();
        }
      } else if (de && opts.tamanho) {
        // interpolações preparadas ANTES de a transição começar: com centenas de unidades o flubber leva perto de 1 s, e
        // dentro do attrTween esse tempo saía da própria transição (o morph aparecia só no fim). Segmentos maiores com
        // muitas unidades (2026-10-14, teste das transições de mapas)
        const seg = nos.length > 100 ? 7 : 4;
        const its = new Map(nos.map((n) => {
          const r = Math.max(n.r, 0.5);
          return [n.id, bolhas ? flubber.toCircle(anelPrincipal(n.f, caminho), n.x, n.y, r, { maxSegmentLength: seg })
                               : flubber.fromCircle(n.x, n.y, r, anelPrincipal(n.f, caminho), { maxSegmentLength: seg })];
        }));
        formas.attr("d", (n) => (bolhas ? anelPrincipal(n.f, caminho) : caminhoCirculo(n.x, n.y, Math.max(n.r, 0.01))))
          .transition().duration(DURACAO).ease(d3.easeCubicInOut)
          .attrTween("d", (n) => { const it = its.get(n.id); return (t) => (t < 1 ? it(t) : final(n)); });
      } else formas.attr("d", final);
      // fora de escala: rótulo na margem esquerda (área vazia), na altura do círculo, ligado por uma linha
      if (bolhas) {
        const gf = cena.append("g").attr("class", "rotulos-fora").attr("pointer-events", "none");
        // na margem esquerda do enquadramento em que as unidades são vistas (no mapa em níveis, de perto), em px de tela
        const kV = est.kV || 1, [vx0, vy0] = transformacaoCamera(opts.cameraBolhas || est.camera, est.geo).invert([0, 0]);
        nos.filter((n) => n.fora).sort((p, q) => p.y - q.y).forEach((n, i) => {
          const tx = vx0 + 10 / kV, ty = Math.max(vy0 + 16 / kV, n.y - 4 / kV + (i * 34) / kV);
          const t = gf.append("text").attr("class", "rotulo-fora").attr("x", tx).attr("y", ty);
          t.append("tspan").attr("x", tx).text(nome(n.id));
          t.append("tspan").attr("x", tx).attr("dy", "1.25em").text(`${Lab.fmtCompacto(opts.tamanho(n.id) || 0)} · fora de escala`);
          const larg = (t.node().getComputedTextLength ? t.node().getBBox().width : 110) / kV;
          const x0 = tx + larg + 6 / kV, x1 = n.x - n.r - 2 / kV;
          if (x1 > x0) gf.append("path").attr("d", `M${x0},${ty + 3 / kV} L${x1 - 6 / kV},${ty + 3 / kV} L${x1},${n.y}`)
            .attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario")).attr("stroke-width", 1).attr("vector-effect", "non-scaling-stroke");
        });
      }
      if (opts.sobreposicao && !bolhas) {
        cena.append("path").datum(opts.sobreposicao).attr("d", caminho).attr("fill", "none").attr("class", "sobreposicao")
          .attr("stroke", Lab.token("cor-texto")).attr("stroke-opacity", 0.12).attr("stroke-width", 0.3).attr("pointer-events", "none");
      }
      // rótulos de referência (poucas cidades), escondidos nos círculos (lá a posição é aproximada)
      const gRot = opts.rotulos && !bolhas ? cena.append("g").attr("class", "rotulos-ref").attr("pointer-events", "none") : null;
      if (gRot) gRot.selectAll("g").data(opts.rotulos).join((e) => {
        const g = e.append("g").attr("transform", (r) => `translate(${proj(r.coord)})`);
        g.append("circle").attr("r", 2.2);
        g.append("text").attr("x", 4).attr("y", -4).text((r) => r.nome);
        return g;
      });
      if (temLacuna || (bolhas && fc.features.some((f) => opts.preencher(f.properties.id) === semDado)))
        zonaLeg.append(el("div", { class: "legenda" }, el("span", { class: "chave" }, el("span", { class: "amostra hachura" }), opts.rotuloLacuna || "sem dados")));
      if (fundo) moldura.append(el("div", { class: "mapa-atribuicao", text: ATRIBUICAO[fundo] }));

      // ------------------------------------------------ card da unidade selecionada (clique ou busca)
      // computador: card flutuante perto da unidade; celular: logo abaixo do desenho, perto do toque (L0006)
      // compacto (story e bancada): o card encaixa no pé ou no alto do próprio mapa, do lado oposto à unidade
      const flutuante = !compacto && matchMedia("(hover: hover) and (pointer: fine)").matches;
      const painel = el("div", { class: `painel-sel${flutuante ? " flutuante" : compacto ? " rodape" : ""}`, "aria-live": "polite" });
      if (flutuante || compacto) moldura.append(painel); else alvo.insertBefore(painel, zonaLeg);
      const posicionarPainel = () => {
        if (!(flutuante || compacto) || painel.hidden) return;
        const sel = Lab.selecoes.get(esc) || "", n = nos.find((x) => x.id === sel);
        if (!n) return;
        const t = est.transform || d3.zoomIdentity, s = est.svg.clientWidth / W;
        const [px, py] = t.apply(bolhas ? [n.x, n.y] : [n.x0, n.y0]).map((v) => v * s);
        if (compacto) { painel.classList.toggle("topo", py > est.svg.clientHeight * 0.55); return; }
        const lw = painel.offsetWidth, lh = painel.offsetHeight, mw = moldura.clientWidth, mh = est.svg.clientHeight;
        let x = px + 16, y = py - lh / 2;
        if (x + lw > mw - 4) x = Math.max(4, px - lw - 16);
        y = Math.max(4, Math.min(mh - lh - 4, y));
        painel.style.left = `${x}px`; painel.style.top = `${y}px`;
      };
      const atualizarPainel = () => {
        const sel = Lab.selecoes.get(esc) || "";
        const u = sel && fc.features.some((f) => f.properties.id === sel) ? sel : null;
        painel.hidden = !u;
        if (!u) { busca.value = ""; return; }
        busca.value = nome(u);
        // compacto: "Aproximar" leva a câmera até a unidade (⟲ volta ao enquadramento do cartão)
        const aproximar = compacto && est.zoom ? el("button", { type: "button", class: "voltar", text: "⊕ Aproximar", onclick: () => {
          painel.classList.remove("topo");   // o card fica no pé; a unidade, na faixa livre acima dele
          api.camera({ foco: u, contexto: 1.6, margens: [0, (painel.offsetHeight + 12) * (W / (est.svg.clientWidth || W))] }, true, { base: false });
        } }) : null;
        Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: opts.dica(u), abrir: opts.abrir, rotuloAbrir: opts.rotuloAbrir, esc, acoes: [aproximar] });
        requestAnimationFrame(posicionarPainel);
      };
      Lab.registrarPainel(esc, atualizarPainel, alvo);   // um registro por mapa (o redesenho troca, não acumula)
      atualizarPainel();
      // troca de cores e textos sem redesenhar (story: o mesmo mapa muda de estado entre cartões)
      est.recolorir = (animar) => {
        temLacuna = false;
        const sel = animar && !Lab.semMovimento() ? formas.transition().duration(650) : formas;
        sel.attr("fill", (n) => preencherH(n.id)).style("fill-opacity", (n) => (opts.opacidade ? opts.opacidade(n.id) * (fundo ? 0.85 : 1) : null))   /* estilo: vence o .85 do fundo no CSS */;
        formas.classed("foco", (n) => Boolean(opts.foco?.(n.id)));
        atualizarPainel();
      };
      if (alvo.isConnected) Lab.aplicarSelecao(esc);
      if (bolhas && !compacto) zonaLeg.append(Lab.legendaTamanho(escalaR, opts.rotuloTamanho));
      if (bolhas && !compacto) alvo.append(Lab.notaFora(nos.filter((n) => n.fora).map((n) => nome(n.id))),
        el("p", { class: "nota", text: "Círculos: cada um parte do centro da unidade e é afastado o mínimo para não se sobrepor; a posição é aproximada." }));

      // ------------------------------------------------ fundo raster: blocos visíveis no zoom atual
      const atualizarTiles = () => { if (gTiles) desenharBlocos(gTiles, proj, W, H, est.transform || d3.zoomIdentity, (est.svg.clientWidth || W) / W); };
      // ------------------------------------------------ fundo vetorial: centro e zoom do MapLibre = câmera do SVG
      const sincronizarVetorial = () => {
        const v = est.vetorial;
        if (!v) return;
        const sv = est.svg, cw = sv.clientWidth, ch = sv.clientHeight;
        if (!cw) return;
        v.caixa.style.width = `${cw}px`; v.caixa.style.height = `${ch}px`;
        v.caixa.style.opacity = bolhas ? 0 : 1;
        const t = est.transform || d3.zoomIdentity;
        const centro = proj.invert(t.invert([W / 2, H / 2]));
        const zoomML = Math.log2((2 * Math.PI * proj.scale() * t.k * (cw / W)) / 512);
        if (!v.mapa) {
          try {
            v.mapa = new maplibregl.Map({ container: v.caixa, style: estiloVetorial(), center: centro, zoom: zoomML, interactive: false, attributionControl: false, fadeDuration: 0 });
            v.mapa.on("error", (e) => console.warn("lab-mapa: fundo vetorial com erro —", e?.error?.message || e));
          } catch (e) {   // sem WebGL, por exemplo: o mapa segue sem fundo
            console.warn("lab-mapa: fundo vetorial indisponível —", e.message);
            v.caixa.remove(); est.vetorial = null;
            moldura.classList.remove("com-fundo"); moldura.querySelector(".mapa-atribuicao")?.remove();
          }
        } else { v.mapa.resize(); v.mapa.jumpTo({ center: centro, zoom: zoomML }); }
      };

      // ------------------------------------------------ câmera, zoom e arrasto (L0006)
      const aplicar = (t) => {
        est.transform = t;
        cena.attr("transform", t);
        // rótulos e marcadores mantêm o tamanho na tela (descontados o zoom e a escala do desenho na página)
        const f = (W / (est.svg.clientWidth || W)) / t.k;
        cena.selectAll(".rotulos-ref text, .rotulo-fora").style("font-size", (d, i, n) => `${(n[i].classList.contains("rotulo-fora") ? 11 : 12) * f}px`)
          .style("stroke-width", `${3 * f}px`);
        cena.selectAll(".rotulos-ref text").attr("x", 4 * f).attr("y", -4 * f);
        cena.selectAll(".rotulos-ref circle").attr("r", 2.4 * f);
        const vistos = [];
        cena.selectAll(".rotulos-ref > g").each(function () {
          this.style.display = "";
          const r = this.getBoundingClientRect();
          const bate = r.width && vistos.some((v) => r.left < v.right + 2 && r.right > v.left - 2 && r.top < v.bottom && r.bottom > v.top);
          if (bate) this.style.display = "none"; else if (r.width) vistos.push(r);
        });
        // no enquadramento inicial, um dedo é da página (ou do story, que passa o cartão deslizando para o lado)
        svg.style("touch-action", t.k > 1.01 ? "none" : compacto ? "pan-y" : "pan-x pan-y");
        posicionarPainel();
        sincronizarVetorial();
        for (const f of est.aoZoom) f(t);
      };
      const inicial = est.transform || transformacaoCamera(est.camera, est.geo);
      if (zoomAtivo) {
        const kE = transformacaoEstado(est.geo).k;
        const zoom = d3.zoom().scaleExtent([Math.min(1, kE), ZOOM_MAX * Math.max(1, kE)]).translateExtent([[-W * 0.3, -H * 0.3], [W * 1.3, H * 1.3]]).clickDistance(4)
          .filter((ev) => {
            const k = (est.transform || d3.zoomIdentity).k;
            if (ev.type === "wheel") return ev.ctrlKey || ev.metaKey;           // roda sozinha rola a página
            if (ev.type.startsWith("touch")) return ev.touches.length > 1;   // um dedo nunca move o mapa (rola a página ou passa o cartão); dois dedos movem e ampliam (L0013)
            if (ev.type === "mousedown") return !ev.button && k > 1.01;          // arrastar só quando ampliado
            return !ev.button;
          })
          .on("zoom", (ev) => aplicar(ev.transform))
          .on("end", () => atualizarTiles());
        est.zoom = zoom;
        svg.call(zoom).on("dblclick.zoom", null);
        svg.style("touch-action", "pan-x pan-y");   // um dedo fica com a página (rolar, passar cartão); a pinça fica com o mapa
        svg.call(zoom.transform, inicial);
        // aviso: Ctrl + roda amplia (a roda sozinha continua rolando a página); dois dedos movem no celular
        const textoRoda = `${/Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl"} + roda do mouse para ampliar`;
        const avisoRoda = el("div", { class: "mapa-aviso", hidden: "", text: textoRoda });
        moldura.append(avisoRoda);
        let tAviso = null;
        function avisar(t) { avisoRoda.textContent = t; avisoRoda.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(() => { avisoRoda.hidden = true; }, 1400); }
        svg.on("wheel.aviso", (ev) => { if (ev.ctrlKey || ev.metaKey) return; avisar(textoRoda); });
        // arrastar com um dedo no mapa ampliado: lembrete dos dois dedos (tocar, sem arrastar, não avisa)
        svg.node().addEventListener("touchmove", (ev) => { if (ev.touches.length === 1 && (est.transform || d3.zoomIdentity).k > 1.01) avisar("Use dois dedos para mover o mapa"); }, { passive: true });
        const mover = (f) => { const s = d3.select(est.svg); (Lab.semMovimento() ? s : s.transition().duration(350)).call(f); };
        moldura.append(el("div", { class: "mapa-controles", role: "group", "aria-label": "Zoom do mapa" },
          el("button", { type: "button", "aria-label": "Ampliar", title: "Ampliar", text: "+", onclick: () => mover((s) => zoom.scaleBy(s, PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Reduzir", title: "Reduzir", text: "−", onclick: () => mover((s) => zoom.scaleBy(s, 1 / PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Voltar ao enquadramento inicial", title: "Voltar ao enquadramento", text: "⟲",
            onclick: () => api.camera(est.camera) })));
      } else {
        aplicar(inicial);
      }
      atualizarTiles();
      // modo de edição (?editar=1): mostra a câmera atual para copiar no roteiro
      if (editar) {
        const saida = el("code");
        const textoCamera = () => {
          const t = est.transform || d3.zoomIdentity, [lon, lat] = proj.invert(t.invert([W / 2, H / 2]));
          return `camera: {centro: [${lon.toFixed(3)}, ${lat.toFixed(3)}], zoom: ${t.k.toFixed(2)}}`;
        };
        const atualizarSaida = () => { saida.textContent = textoCamera(); };
        est.aoZoom = [atualizarSaida];
        atualizarSaida();
        moldura.append(el("div", { class: "mapa-editar" }, saida,
          el("button", { type: "button", text: "Copiar câmera", onclick: async (ev) => {
            try { await navigator.clipboard.writeText(textoCamera()); ev.target.textContent = "Copiado ✓"; } catch (e) { window.prompt("Copie a câmera:", textoCamera()); }
            setTimeout(() => { ev.target.textContent = "Copiar câmera"; }, 1500);
          } })));
      }
      if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => { aplicar(est.transform || d3.zoomIdentity); }).observe(est.svg);
      requestAnimationFrame(() => { sincronizarVetorial(); atualizarTiles(); });
    };

    const api = {
      /** Move a câmera ("estado" | {foco, contexto} | {centro, zoom}) em voo (afasta, atravessa, aproxima), com duração
       *  proporcional ao caminho; sem animação com prefers-reduced-motion. Devolve a duração (ms). */
      camera(camera, animar = true, { base = true, malha = null } = {}) {
        // base: a câmera do cartão (para onde o ⟲ volta); "Aproximar" move sem trocar a base
        // malha: o foco é procurado nesta malha (a que vai entrar, quando o voo vem antes da troca de malha)
        if (base) est.camera = camera || "estado";
        if (!est.geo) return 0;
        const t = transformacaoCamera(camera || "estado", malha ? { ...est.geo, fc: malha } : est.geo);
        if (!est.zoom) { est.transform = t; desenhar(null); return 0; }
        const s = d3.select(est.svg), { duracao, move } = planoVoo(est.transform || d3.zoomIdentity, t, est.geo.W, est.geo.H);
        const animado = animar && move && !Lab.semMovimento();
        (animado ? s.transition().duration(duracao).ease(d3.easeCubicInOut) : s).call(est.zoom.transform, t);
        return animado ? duracao : 0;
      },
      /** O voo até `camera`, sem mover: {k0, k1, duracao, move} (o story escolhe a ordem: conteúdo antes ou depois). */
      planoCamera(camera, malha = null) {
        if (!est.geo) return { k0: 1, k1: 1, duracao: 0, move: false };
        return planoVoo(est.transform || d3.zoomIdentity, transformacaoCamera(camera || "estado", malha ? { ...est.geo, fc: malha } : est.geo), est.geo.W, est.geo.H);
      },
      /** Compacto: o mesmo mapa num palco de outro tamanho (cartão com outro texto ou com um gráfico embaixo). Mantém o
       *  ponto do centro e o zoom na tela; devolve true se redesenhou. */
      dimensoes(d) {
        if (!compacto || !est.geo || !d) return false;
        const [W2, H2] = d.map((v) => Math.max(120, Math.round(v))), { W, H, proj } = est.geo;
        if (Math.abs(W2 - W) < 3 && Math.abs(H2 - H) < 3) return false;
        const t = est.transform || d3.zoomIdentity, tE = transformacaoEstado(est.geo);
        const noEstado = Math.abs(t.k - tE.k) / tE.k < 0.02 && Math.abs(t.x - tE.x) < 2 && Math.abs(t.y - tE.y) < 2;
        est.manter = noEstado ? { estado: true } : { c: proj.invert(t.invert([W / 2, H / 2])), k: t.k };
        opts.dimensoes = [W2, H2];
        desenhar(null);
        return true;
      },
      /** Troca a malha (ex.: territórios → municípios) no mesmo enquadramento e na mesma projeção: a malha antiga fica por
       *  cima e esmaece. `parcial`: opções que mudam junto (preencher, dica, opacidade, foco, nome). */
      contornos(novo, parcial = {}) {
        Object.assign(opts, parcial);
        if (!novo?.features?.length || novo === fc) { if (est.recolorir) est.recolorir(true); return; }
        const velho = est.svg?.querySelector("path.u")?.parentNode?.cloneNode(true);
        fc = novo;
        desenhar(null);
        if (!velho || Lab.semMovimento()) return;
        velho.setAttribute("pointer-events", "none");
        velho.querySelectorAll("[data-u]").forEach((n) => n.removeAttribute("data-u"));   // o fantasma não entra na seleção
        const cena = est.svg.querySelector(".cena");
        cena.insertBefore(velho, cena.querySelector(".rotulos-ref, .sobreposicao"));
        d3.select(velho).transition().duration(DURACAO_MALHA).ease(d3.easeCubicInOut).style("opacity", 0).remove();
      },
      /** Troca cores, textos, opacidade e foco sem redesenhar (com transição). */
      atualizar(parcial = {}, { animar = true } = {}) {
        Object.assign(opts, parcial);
        if (est.recolorir) est.recolorir(animar);
      },
      /** Troca a forma (Mapa | Círculos) com a transição do design system. */
      forma(v, animar = true) {
        if (!opts.forma || !opts.tamanho || opts.forma.obter() === v) return;
        const anterior = opts.forma.obter();
        opts.forma.definir(v);
        if (ctrl) for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
        desenhar(animar && !Lab.semMovimento() ? anterior : null);
      },
      redesenhar() { desenhar(null); },
      /** Escala de raio das bolhas (para a legenda de tamanho no modo compacto — Q-062); null sem tamanho. */
      escalaTamanho() { return est.escalaR || null; },
      /** Círculos no centro de cada unidade, sobrepostos (muitas unidades), em vez de afastados (Dorling). */
      circulosSobrepostos() { return (est.geo?.fc?.features?.length || 0) > SOBREPOR_MIN; },
    };
    desenharMapa(null);
    return api;
  };
})();

/* ==== web/componentes/lab-graficos.js ==== */
/* lab-graficos.js — gráficos do catálogo do design system (design.yaml › graficos). ADR L0003.
 * Todos recebem valores prontos (calculados em Python, L0002) e só posicionam e desenham.
 * Marcas selecionáveis levam data-u; o clique seleciona no bloco (data-escopo) do gráfico.
 * Quando há círculos proporcionais (porPeso), a legenda de tamanho vem antes do desenho e
 * a função devolve { foraIds } para a nota de "fora de escala" (Lab.notaFora) abaixo dele.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const tok = Lab.token;

  /** Linhas por momentos (2 ou mais pontas: 2018 → 2022 → 2026), com rótulos diretos sem sobreposição.
   *  opts: { pontas: ["2018","2022","2026"], series: [{cor, valores: [v por ponta, null = sem dado], rotulo, dicas: [[título, linhas] por ponta],
   *          tracejado (linha tracejada: segunda codificação além da cor)}], fmt, aria, largura, dominio ([min, max] fixo; padrão: 0 até o maior valor),
   *          legenda (true: legenda abaixo, interativa) }
   *  Linha só entre momentos vizinhos com dado. Rótulos: valor na 1ª ponta; valor e nome na última; meio só na dica.
   *  Destaque (design.yaml › graficos.linhas_pontas): passar o mouse/tocar numa série (linha, ponto, rótulo) ou num item da
   *  legenda realça a série e esmaece as demais; tocar num item da legenda fixa o destaque (tocar de novo solta). */
  Lab.linhasPontas = (alvo, { pontas, series, fmt, aria, largura = 500, dominio = null, legenda = false }) => {
    const W = Math.min(largura, Lab.largura(largura)), H = 320, mg = { t: 26, b: 26, l: 58, r: 178 };
    const max = d3.max(series.flatMap((s) => s.valores).filter((v) => v !== null && v !== undefined)) || 1;
    const emPct = fmt === Lab.fmtPct;
    const sy = d3.scaleLinear().domain(dominio || [0, emPct ? Math.ceil(max / 10) * 10 : max * 1.05]).nice().range([H - mg.b, mg.t]);
    const n = pontas.length, x0 = mg.l, x1 = W - mg.r;
    const sx = (i) => (n === 1 ? (x0 + x1) / 2 : x0 + ((x1 - x0) * i) / (n - 1));
    const tem = (v) => v !== null && v !== undefined;
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H).style("max-width", "100%").style("height", "auto")
      .attr("role", "img").attr("aria-label", aria);
    pontas.forEach((t, i) => {
      svg.append("line").attr("x1", sx(i)).attr("x2", sx(i)).attr("y1", mg.t - 6).attr("y2", H - mg.b).attr("stroke", tok("cor-grade"));
      svg.append("text").attr("x", sx(i)).attr("y", 14).attr("text-anchor", "middle").style("font-weight", 700).style("fill", tok("cor-texto")).text(t);
    });
    // rótulos sem sobreposição: empurra para baixo os que ficam a menos de 13 px
    const afastar = (itens) => { itens.sort((a, b) => a.y - b.y); for (let k = 1; k < itens.length; k++) if (itens[k].y - itens[k - 1].y < 13) itens[k].y = itens[k - 1].y + 13; return itens; };
    const rotEsq = afastar(series.filter((s) => tem(s.valores[0])).map((s) => ({ s, y: sy(s.valores[0]) })));
    const rotDir = afastar(series.filter((s) => tem(s.valores[n - 1])).map((s) => ({ s, y: sy(s.valores[n - 1]) })));
    const grupos = new Map(series.map((s) => [s, svg.append("g").attr("class", "serie")]));
    let fixa = null;
    const destacar = (alvoS) => {
      const s_ = alvoS ?? fixa;
      for (const [s, g] of grupos) g.attr("opacity", !s_ || s === s_ ? 1 : 0.18);
      if (s_) grupos.get(s_).raise();
      itensLeg.forEach(([s, it]) => it.classList.toggle("apagada", Boolean(s_) && s !== s_));
    };
    for (const s of series) {
      const g = grupos.get(s).on("pointerenter", () => destacar(s)).on("pointerleave", () => destacar(null));
      for (let i = 1; i < n; i++) if (tem(s.valores[i - 1]) && tem(s.valores[i]))
        g.append("line").attr("x1", sx(i - 1)).attr("y1", sy(s.valores[i - 1])).attr("x2", sx(i)).attr("y2", sy(s.valores[i]))
          .attr("stroke", s.cor).attr("stroke-width", 2.5).attr("stroke-linecap", "round").attr("stroke-dasharray", s.tracejado ? "5 4" : null);
      s.valores.forEach((v, i) => {
        if (!tem(v)) return;
        const d = s.dicas?.[i];
        g.append("circle").attr("class", "ponto").attr("cx", sx(i)).attr("cy", sy(v)).attr("r", 6).attr("fill", s.cor)
          .on("pointermove", (ev) => d && Lab.mostrarDica(ev, d[0], d[1])).on("pointerleave", Lab.esconderDica);
      });
    }
    const rot = (g, x, y, txt, ancora) => g.append("text").attr("x", x).attr("y", y + 4).attr("text-anchor", ancora).style("font-size", "12px").style("font-weight", 600).style("fill", tok("cor-texto")).text(txt);
    for (const { s, y } of rotEsq) rot(grupos.get(s), x0 - 9, y, fmt(s.valores[0]), "end");
    for (const { s, y } of rotDir) rot(grupos.get(s), x1 + 9, y, `${fmt(s.valores[n - 1])} ${s.rotulo}`, "start");
    const itensLeg = [];
    if (legenda) {
      const leg = Lab.el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Séries: passe o mouse ou toque para destacar" });
      for (const s of series) {
        const amostra = Lab.el("span", { class: `amostra-linha${s.tracejado ? " tracejada" : ""}`, "aria-hidden": "true" });
        amostra.style.color = s.cor;
        const it = Lab.el("button", { type: "button", class: "item-legenda", "aria-pressed": "false" }, amostra, ` ${s.rotulo}`);
        it.addEventListener("pointerenter", () => destacar(s));
        it.addEventListener("pointerleave", () => destacar(null));
        it.addEventListener("focus", () => destacar(s));
        it.addEventListener("blur", () => destacar(null));
        it.addEventListener("click", () => { fixa = fixa === s ? null : s; itensLeg.forEach(([x, b]) => b.setAttribute("aria-pressed", String(x === fixa))); destacar(null); });
        itensLeg.push([s, it]);
        leg.append(it);
      }
      alvo.append(leg);
    }
  };
  /** Duas pontas (antes → depois): atalho de Lab.linhasPontas. series: [{cor, v0, v1, rotulo, dica0, dica1}]. */
  Lab.linhasDuasPontas = (alvo, { pontas, series, fmt, aria, largura = 500, legenda = false }) => Lab.linhasPontas(alvo, { pontas, fmt, aria, largura, legenda,
    series: series.map((s) => ({ cor: s.cor, valores: [s.v0, s.v1], rotulo: s.rotulo, dicas: [s.dica0, s.dica1], tracejado: s.tracejado })) });

  /** Distribuição sem eixo vertical (beeswarm): cada unidade na posição do seu valor; 0 no centro.
   *  opts: { pontos: [{u, d, peso}], cor(d), simlog (bool: eixo logarítmico simétrico), marcas, fmtMarca,
   *          rotuloEsq, rotuloDir, rotuloEixo, porPeso, rotuloPeso, raio (fixo), rMaxPeso, alturaMax,
   *          nome(u), dica(u) → linhas, aria } */
  Lab.distribuicao = (alvo, o) => {
    const W = 440, HMAX = o.alturaMax || 360, mg = { t: 30, r: 18, b: 34, l: 18 };
    const M = d3.max(o.pontos, (p) => Math.abs(p.d)) || 1;
    const sx = o.simlog ? d3.scaleSymlog().constant(100).domain([-M, M]).range([mg.l, W - mg.r])
      : d3.scaleLinear().domain([-M, M]).nice().range([mg.l, W - mg.r]);
    const marcas = o.simlog ? (o.marcas || [-100000, -10000, -1000, 0, 1000, 10000, 100000]).filter((v) => Math.abs(v) <= M * 1.0001) : sx.ticks(Lab.estreito() ? 5 : 7);
    const ea = Lab.escalaArea(o.pontos.map((p) => p.peso), o.rMaxPeso || 16);
    const raio = (p) => (o.porPeso ? Math.max(2.5, ea.s(p.peso)) : o.raio || 4.5);
    const meio = (mg.t + HMAX - mg.b) / 2;
    const nos = o.pontos.map((p) => ({ ...p, x: sx(p.d), y: meio, r: raio(p) }));
    const sim = d3.forceSimulation(nos).force("x", d3.forceX((n) => sx(n.d)).strength(1)).force("y", d3.forceY(meio).strength(0.06))
      .force("colisao", d3.forceCollide((n) => n.r + 0.7).iterations(3)).stop();
    for (let i = 0; i < 220; i++) { sim.tick(); for (const n of nos) n.y = Math.max(mg.t + n.r, Math.min(HMAX - mg.b - n.r, n.y)); }
    // altura do desenho = altura ocupada pelos círculos (sem faixa vazia)
    const topoN = d3.min(nos, (n) => n.y - n.r) ?? mg.t, baseN = d3.max(nos, (n) => n.y + n.r) ?? mg.t;
    for (const n of nos) n.y += mg.t + 4 - topoN;
    const H = Math.max(120, baseN - topoN + mg.t + mg.b + 8);
    if (o.porPeso) alvo.append(Lab.legendaTamanho(ea.s, o.rotuloPeso));
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).style("width", "100%").style("max-width", `${W}px`).style("height", "auto")
      .attr("role", "img").attr("aria-label", o.aria);
    const x0 = sx(0);
    svg.append("line").attr("x1", x0).attr("x2", x0).attr("y1", mg.t - 8).attr("y2", H - mg.b).attr("stroke", tok("cor-eixo")).attr("stroke-dasharray", "4 3");
    svg.append("text").attr("x", x0 - 8).attr("y", 14).attr("text-anchor", "end").style("font-size", "12px").style("fill", tok("cor-texto-secundario")).text(`← ${o.rotuloEsq}`);
    svg.append("text").attr("x", x0 + 8).attr("y", 14).style("font-size", "12px").style("fill", tok("cor-texto-secundario")).text(`${o.rotuloDir} →`);
    svg.append("g").attr("transform", `translate(0,${H - mg.b})`).call(d3.axisBottom(sx).tickValues(marcas).tickFormat(o.fmtMarca)).call(Lab.eixo);
    svg.append("text").attr("x", W - mg.r).attr("y", H - 2).attr("text-anchor", "end").style("font-size", "11px").style("fill", tok("cor-texto-secundario")).text(o.rotuloEixo);
    svg.append("g").selectAll("circle").data([...nos].sort((a, b) => b.r - a.r)).join("circle").attr("class", (n) => `ponto${o.porPeso && ea.fora(n.peso) ? " fora-escala" : ""}`)
      .attr("data-u", (n) => n.u).attr("cx", (n) => n.x).attr("cy", (n) => n.y).attr("r", (n) => n.r)
      .attr("fill", (n) => o.cor(n.d)).attr("stroke", tok("cor-superficie")).attr("stroke-width", 0.8).style("cursor", "pointer")
      .on("pointermove", (ev, n) => Lab.mostrarDica(ev, o.nome(n.u), o.dica(n.u)))
      .on("pointerleave", Lab.esconderDica).on("click", (ev, n) => Lab.selecionar(n.u, ev.currentTarget));
    return { foraIds: o.porPeso ? nos.filter((n) => ea.fora(n.peso)).map((n) => n.u) : [] };
  };

  /** Dispersão x × y com linha de igualdade tracejada (mesma escala nos dois eixos).
   *  opts: { pontos: [{u, x, y, peso}], cor, fmtEixo, rotuloX, rotuloY, porPeso, rotuloPeso, raio, rMaxPeso, nome(u), dica(u), aria } */
  Lab.dispersao = (alvo, o) => {
    const W = 440, H = 400, mg = { t: 14, r: 14, b: 42, l: 46 };
    const lim = Math.max(d3.max(o.pontos, (p) => p.x), d3.max(o.pontos, (p) => p.y)) || 1;
    const sx = d3.scaleLinear().domain([0, lim]).nice().range([mg.l, W - mg.r]), sy = d3.scaleLinear().domain(sx.domain()).range([H - mg.b, mg.t]);
    const ea = Lab.escalaArea(o.pontos.map((p) => p.peso), o.rMaxPeso || 22);
    const raio = (p) => (o.porPeso ? Math.max(3, ea.s(p.peso)) : o.raio || 5);
    if (o.porPeso) alvo.append(Lab.legendaTamanho(ea.s, o.rotuloPeso));
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).style("width", "100%").style("max-width", `${W}px`).style("height", "auto")
      .attr("role", "img").attr("aria-label", o.aria);
    svg.append("line").attr("x1", sx(0)).attr("y1", sy(0)).attr("x2", sx(sx.domain()[1])).attr("y2", sy(sx.domain()[1])).attr("stroke", tok("cor-eixo")).attr("stroke-dasharray", "4 3");
    svg.append("g").attr("transform", `translate(0,${H - mg.b})`).call(d3.axisBottom(sx).ticks(5).tickFormat(o.fmtEixo)).call(Lab.eixo);
    svg.append("g").attr("transform", `translate(${mg.l},0)`).call(d3.axisLeft(sy).ticks(5).tickFormat(o.fmtEixo)).call(Lab.eixo);
    svg.append("text").attr("x", W - mg.r).attr("y", H - 6).attr("text-anchor", "end").text(o.rotuloX);
    svg.append("text").attr("x", mg.l + 4).attr("y", mg.t + 10).text(o.rotuloY);
    svg.append("g").selectAll("circle").data([...o.pontos].sort((a, b) => raio(b) - raio(a))).join("circle").attr("class", (p) => `ponto${o.porPeso && ea.fora(p.peso) ? " fora-escala" : ""}`)
      .attr("data-u", (p) => p.u).attr("cx", (p) => sx(p.x)).attr("cy", (p) => sy(p.y)).attr("r", raio)
      .attr("fill", o.cor).attr("fill-opacity", o.porPeso ? 0.55 : 0.75).style("cursor", "pointer")
      .on("pointermove", (ev, p) => Lab.mostrarDica(ev, o.nome(p.u), o.dica(p.u)))
      .on("pointerleave", Lab.esconderDica).on("click", (ev, p) => Lab.selecionar(p.u, ev.currentTarget));
    return { foraIds: o.porPeso ? o.pontos.filter((p) => ea.fora(p.peso)).map((p) => p.u) : [] };
  };

  /** Boxplot horizontal por categoria + um círculo por unidade (posição vertical determinística).
   *  Resumo (quartis, bigodes de Tukey) vem pronto da base Python.
   *  opts: { linhas: [{rotulo, sub, cor, resumo: {n,min,q1,mediana,q3,max,bigode_inf,bigode_sup}, pontos: [{u, v, peso, dica: [título, linhas]}]}],
   *          dominio: [min, max], referencias: [valores com linha fina], fmt, porPeso, rotuloPeso, nomeUnidades, aria } */
  Lab.boxplot = (alvo, o) => {
    const estreito = Lab.estreito();
    const faixa = estreito ? 64 : 72;
    const W = Lab.largura(760), H = faixa * o.linhas.length + 44, mg = { l: estreito ? 84 : 104, r: 16, t: 10, b: 30 };
    const sx = d3.scaleLinear().domain(o.dominio).range([mg.l, W - mg.r]).clamp(true);
    const ea = Lab.escalaArea(o.linhas.flatMap((l) => l.pontos).map((p) => p.peso), estreito ? 22 : 28);
    const raio = (p) => (o.porPeso ? Math.max(3, ea.s(p.peso)) : 4.6);
    if (o.porPeso) alvo.append(Lab.legendaTamanho(ea.s, o.rotuloPeso));
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H).style("max-width", "100%").style("height", "auto")
      .attr("role", "img").attr("aria-label", o.aria);
    svg.append("g").attr("transform", `translate(0,${H - mg.b})`).call(d3.axisBottom(sx).ticks(estreito ? 4 : 8).tickFormat((v) => `${v}%`)).call(Lab.eixo);
    for (const v of o.referencias || []) svg.append("line").attr("x1", sx(v)).attr("x2", sx(v)).attr("y1", mg.t).attr("y2", H - mg.b).attr("stroke", tok("cor-grade"));
    const tinta = tok("cor-texto");
    o.linhas.forEach((l, i) => {
      const y = mg.t + faixa * i + faixa / 2;
      const cor = l.cor, r = l.resumo;
      const g = svg.append("g");
      // nome em até duas linhas (nomes longos quebram no espaço)
      const linhasNome = l.rotulo.length > 12 ? l.rotulo.split(" ") : [l.rotulo];
      const tn = g.append("text").attr("x", mg.l - 10).attr("y", y - 3 - (linhasNome.length - 1) * 13).attr("text-anchor", "end").style("font-weight", 600).style("fill", tinta);
      linhasNome.forEach((t, k) => tn.append("tspan").attr("x", mg.l - 10).attr("dy", k ? 13 : 0).text(t));
      if (l.sub) g.append("text").attr("x", mg.l - 10).attr("y", y + 12).attr("text-anchor", "end").style("font-size", "11px").text(l.sub);
      // hastes e caixa
      g.append("line").attr("x1", sx(r.bigode_inf)).attr("x2", sx(r.q1)).attr("y1", y).attr("y2", y).attr("stroke", tinta).attr("stroke-width", 1.2);
      g.append("line").attr("x1", sx(r.q3)).attr("x2", sx(r.bigode_sup)).attr("y1", y).attr("y2", y).attr("stroke", tinta).attr("stroke-width", 1.2);
      for (const v of [r.bigode_inf, r.bigode_sup]) g.append("line").attr("x1", sx(v)).attr("x2", sx(v)).attr("y1", y - 7).attr("y2", y + 7).attr("stroke", tinta).attr("stroke-width", 1.2);
      // faixa interquartil hachurada na cor da categoria
      const idP = `iq-${i}-${Math.random().toString(36).slice(2, 6)}`;
      const pat = svg.append("defs").append("pattern").attr("id", idP).attr("patternUnits", "userSpaceOnUse").attr("width", 6).attr("height", 6).attr("patternTransform", "rotate(45)");
      pat.append("rect").attr("width", 6).attr("height", 6).attr("fill", d3.interpolateRgb(tok("cor-superficie"), cor)(0.16));
      pat.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 6).attr("stroke", cor).attr("stroke-width", 1.2).attr("stroke-opacity", 0.45);
      g.append("text").attr("x", sx(r.mediana)).attr("y", y - 17).attr("text-anchor", "middle").style("font-size", "11px").style("font-weight", 600).style("fill", tinta).text(`Med. ${o.fmt(r.mediana)}`);
      g.append("rect").attr("x", sx(r.q1)).attr("y", y - 13).attr("width", Math.max(2, sx(r.q3) - sx(r.q1))).attr("height", 26).attr("rx", 3)
        .attr("fill", `url(#${idP})`).attr("stroke", cor).attr("stroke-width", 1.5)
        .on("pointermove", (ev) => Lab.mostrarDica(ev, `${l.rotulo} · ${r.n} ${o.nomeUnidades || "unidades"}`, [`mediana: ${o.fmt(r.mediana)}`, `1º–3º quartil: ${o.fmt(r.q1)} a ${o.fmt(r.q3)}`, `menor–maior: ${o.fmt(r.min)} a ${o.fmt(r.max)}`]))
        .on("pointerleave", Lab.esconderDica);
      g.append("line").attr("x1", sx(r.mediana)).attr("x2", sx(r.mediana)).attr("y1", y - 13).attr("y2", y + 13).attr("stroke", tinta).attr("stroke-width", 2.5).attr("pointer-events", "none");
      // um círculo por unidade, espalhado na vertical (posição determinística)
      const pts = [...l.pontos].sort((a, b) => a.v - b.v).map((p, k) => ({ ...p, dy: ((k * 37) % 23) - 11 }))
        .sort((a, b) => raio(b) - raio(a));   // maiores atrás
      const circ = g.append("g").selectAll("g").data(pts).join("g").style("cursor", "pointer")
        .on("pointermove", (ev, p) => Lab.mostrarDica(ev, p.dica[0], p.dica[1]))
        .on("pointerleave", Lab.esconderDica)
        .on("click", (ev, p) => Lab.selecionar(p.u, ev.currentTarget));
      circ.append("circle").attr("cx", (p) => sx(p.v)).attr("cy", (p) => y + p.dy).attr("r", (p) => Math.max(9, raio(p))).attr("fill", "transparent");
      circ.attr("data-u", (p) => p.u);
      circ.append("circle").attr("class", (p) => `ponto${p.v < r.bigode_inf || p.v > r.bigode_sup ? " discrepante" : ""}${o.porPeso && ea.fora(p.peso) ? " fora-escala" : ""}`).attr("cx", (p) => sx(p.v)).attr("cy", (p) => y + p.dy).attr("r", raio)
        .attr("fill", cor).attr("fill-opacity", o.porPeso ? 0.55 : 0.8);
    });
    return { foraIds: o.porPeso ? o.linhas.flatMap((l) => l.pontos).filter((p) => ea.fora(p.peso)).map((p) => p.u) : [] };
  };

  // ------------------------------------------------------------ pontos conectados (desproporções)
  /** Pontos conectados para exploratórios (D12; promovido da Visualização — design.yaml › graficos.pontos_conectados): uma
   *  linha por grupo, um ponto por medida (ex.: % da população, % dos contemplados, % do valor) no mesmo eixo, ligados do
   *  menor ao maior. Lê "quanto cada grupo pesa em cada régua"; a distância entre os pontos é a desproporção.
   *  Lab.pontosConectados(alvo, { grupos: [rótulo], medidas: [{chave, rotulo, cor, vazado}], valor(g, chave) → número | null,
   *    fmt(v) → texto, dica(g) → linhas, aria, largura })
   *  Valor nulo (célula suprimida) não desenha o ponto; o grupo fica com a nota "1 a 4". Legenda: passar o mouse num item
   *  realça a medida; tocar fixa. */
  // ausente: texto de valor ausente na dica e sufixo do rótulo (padrão: supressão "1 a 4"; ex.: "sem dado" quando a fonte não tem a medida)
  Lab.pontosConectados = (alvo, { grupos, medidas, valor, fmt = (v) => `${v.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%`, dica = null, aria = "", largura = 760, ausente = "1 a 4", sufixoAusente = true, fmtEixo = (v) => `${v}%`, delta = true, referencia = null }) => {
    // referencia (opcional): {valor, rotulo} — linha vertical tracejada (ex.: a meta, ou 1 = iguais)
    const W = Math.min(largura, Math.max(320, alvo.clientWidth || largura)), estreito = W < 560;
    const mRot = estreito ? 0 : Math.min(230, W * 0.32), lh = estreito ? 44 : 30, topo = referencia ? 24 : 8, pe = 26;
    const H = topo + pe + grupos.length * lh;
    const vals = grupos.flatMap((g) => medidas.map((m) => valor(g, m.chave))).filter((v) => v !== null && v !== undefined);
    const x = d3.scaleLinear().domain([0, Math.max(1, d3.max(vals), referencia ? referencia.valor : 0)]).nice().range([mRot + 8, W - 46]);
    const svg = d3.select(alvo).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", "100%").attr("role", "img").attr("aria-label", aria).style("max-width", `${W}px`).style("overflow", "visible");
    svg.append("g").attr("transform", `translate(0,${H - pe + 4})`).call(d3.axisBottom(x).ticks(estreito ? 4 : 6).tickFormat(fmtEixo)).call(Lab.eixo).call((g) => g.select(".domain").remove());
    svg.append("g").selectAll("line").data(x.ticks(estreito ? 4 : 6)).join("line").attr("x1", x).attr("x2", x).attr("y1", topo).attr("y2", H - pe).attr("stroke", Lab.token("cor-grade")).attr("stroke-width", 1);
    if (referencia) {
      const xr = x(referencia.valor);
      svg.append("line").attr("x1", xr).attr("x2", xr).attr("y1", topo - 4).attr("y2", H - pe).attr("stroke", Lab.token("cor-texto"))
        .attr("stroke-width", 1.5).attr("stroke-dasharray", "4 3");

 * Lab.sankey(alvo, {

 *   contagem(id): quantas unidades cada sequência representa (padrão 1) — para fluxos de VALOR com sequências

 *   semLista: true esconde "Ver lista" (sequências agregadas não são itens nomeáveis),
 *   vertical: etapas de cima para baixo. PADRÃO com 2 etapas (validado pelo pesquisador em 2026-10-08, melhor no
 *             celular); com 3 ou mais, horizontal. `vertical: false|true` força a orientação,
 *   Legenda interativa: passar o mouse num item destaca os fluxos que tocam a categoria; clicar fixa (Esc desfaz),
 *   Legendas por lado: com categorias diferentes no primeiro e no último lado (duas variáveis), a legenda do primeiro
 *             fica ACIMA do diagrama e a do último ABAIXO, centralizadas; com as mesmas categorias, uma só, acima,
 *   formatoValor(v) → texto do valor de um fluxo ou total (ex.: "R$ 1,2 bi", "831 proponentes"); padrão: número inteiro.
 *   Distribuição do destaque (como o card do mapa): passar o mouse numa barra ou num item da legenda mostra, numa dica,
 *             "Para onde vai" (destinos, com valor e parte do que saiu da categoria) e "De onde vem" (origens, com a parte
 *             do que chegou nela); clicar fixa o destaque e mostra a mesma distribuição num card abaixo do desenho,
 *   cabecalhoLados: [nó, nó] — conteúdo no início da legenda de cada lado (ex.: o seletor da variável daquele lado);

      verLista.hidden = !fixo || Boolean(o.semLista);
      mostrarCard(fixo ? pred.foco : null, fixo && !pred.foco ? pred.link : null);
      alternarLista(true);
      Lab.esconderDica();
    }
    // legenda interativa: cada item destaca (passar o mouse / foco) ou fixa (clique, Enter) os fluxos da sua categoria
    const tocaCat = (g) => Object.assign((x) => x.source.g === g || x.target.g === g, { foco: { g } });
    legendas.flatMap((lg) => [...lg.querySelectorAll(".chave")]).forEach((item) => {
      const g = item.dataset.cat;
      item.setAttribute("tabindex", "0"); item.setAttribute("role", "button");
      item.setAttribute("aria-label", `Destacar os fluxos de ${o.nome(g)}`);
      item.addEventListener("pointerenter", () => { if (!fixo) destacar(tocaCat(g)); });
      item.addEventListener("pointerleave", () => { if (!fixo) destacar(null); Lab.esconderDica(); });
      item.addEventListener("pointermove", (ev) => { if (!fixo) Lab.mostrarDica(ev, o.nome(g), [...linhasDist(distribuicao(g)), "clique para fixar"]); });
      item.addEventListener("focus", () => { if (!fixo) destacar(tocaCat(g)); });
      item.addEventListener("blur", () => { if (!fixo) destacar(null); });
      const fixarCat = () => { Lab.esconderDica(); fixar(`c|${g}`, tocaCat(g), { titulo: o.nome(g), filtro: (s) => s.includes(g) }); };
      item.addEventListener("click", fixarCat);
      item.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fixarCat(); } });
    });
    if (escAtual) removeEventListener("keydown", escAtual);
    escAtual = (ev) => { if (ev.key === "Escape" && fixo) fixar(null); };
    addEventListener("keydown", escAtual);
    alvo.append(painel);                          // card da distribuição fixada, logo abaixo do desenho (como no mapa)
    if (legendas[1]) alvo.append(legendas[1]);   // legenda do último lado, abaixo do diagrama
    alvo.append(o.nota ? el("p", { class: "nota", text: o.nota }) : "", caixaLista);
  };
})();

/* lab-metodologia.js — bloco "Fontes de Dados, Metodologia e Códigos", padrão de todos os produtos (ADR L0003).
 * Modelo: README do Agregador de Pesquisas (O POVO/DATADOC). O conteúdo vem pronto do Python
 * (labdados.metodologia.montar): textos do produto (src/metodologia.yaml) + partes automáticas
 * (fontes com datas e hashes do manifesto, ADRs, trechos de código, conferência de qualidade, versão).
 *
 * Lab.blocoMetodologia(m, { baixar: { rotulo, acao }, linkAutor: { href, texto } })
 * Lab.rodapePagina(m, opts) → bloco + assinatura final (preenche o <footer id="rodape">).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Diagrama de fluxo dos dados (pesquisador, 2026-10-12; vale para os exploratórios): bases que entram → operações
   *  (cruzamentos, filtros, agrupamentos…) → saídas do produto. Declarado em src/metodologia.yaml › fluxo:
   *    entradas: [{id, rotulo, nota?, restrita?}] · operacoes: [{id, rotulo, tipo, de: [ids], nota?}] · saidas: [{id, rotulo, de, link?, nota?}]
   *    transversais: [{id, rotulo, tipo, nota?, exceto?: [ids de saídas]}] — operações que valem para todas as saídas (ex.:
   *    supressão de 1 a 4): ficam numa faixa à parte, sob o diagrama, sem uma ligação para cada saída; passar o mouse na
   *    faixa acende as saídas a que ela se aplica (pesquisador, 2026-10-14).
   *  Colunas por profundidade (uma operação que parte de outra vai para a coluna seguinte); ligações em SVG redesenhadas a
   *  cada mudança de tamanho. Passar o mouse (ou focar) num nó acende o caminho dele — de onde vem e para onde vai. No
   *  celular, uma coluna só, e cada nó diz de onde vem ("← …"). */
  const TIPOS_FLUXO = { base: "base", cruzamento: "⨝ cruzamento", filtro: "⧩ filtro", agrupamento: "Σ agrupamento", derivacao: "ƒ derivação",
    conferencia: "✓ conferência", supressao: "▦ supressão", saida: "saída" };
  Lab.diagramaFluxo = (f) => {
    const nos = new Map();
    const add = (n, papel) => nos.set(n.id, { ...n, papel, de: [].concat(n.de || []) });
    (f.entradas || []).forEach((n) => add(n, "entrada"));
    (f.operacoes || []).forEach((n) => add(n, "operacao"));
    (f.saidas || []).forEach((n) => add(n, "saida"));
    const prof = new Map();
    const nivel = (id, pilha = new Set()) => {
      if (prof.has(id)) return prof.get(id);
      const n = nos.get(id);
      if (!n || pilha.has(id)) return 0;
      pilha.add(id);
      const v = n.papel === "entrada" ? 0 : 1 + Math.max(0, ...n.de.map((d) => nivel(d, pilha)));
      prof.set(id, v);
      return v;
    };
    [...nos.keys()].forEach((id) => nivel(id));
    // três faixas: bases | operações (uma coluna, na ordem do caminho — profundidade, depois a ordem declarada) | saídas
    const ordemDecl = [...nos.keys()];
    const faixa = (papel) => [...nos.values()].filter((n) => n.papel === papel).sort((a, b) => (papel === "operacao" ? prof.get(a.id) - prof.get(b.id) : 0) || ordemDecl.indexOf(a.id) - ordemDecl.indexOf(b.id));
    const colunas = [["Bases que entram", faixa("entrada")], ["Operações", faixa("operacao")], ["Saídas", faixa("saida")]];
    const cor = { entrada: Lab.token("cor-cat-1"), operacao: Lab.token("cor-cat-3"), saida: Lab.token("cor-cat-2") };
    const caixa = el("div", { class: "fluxo", role: "group", "aria-label": "Fluxo dos dados: bases, operações e saídas" });
    const els = new Map();
    for (const [k, [titulo, col]] of colunas.entries()) {
      caixa.append(el("div", { class: `fluxo-col fluxo-col-${k}` }, el("h4", { text: titulo }), ...col.map((n) => {
        const tipo = n.papel === "entrada" ? "base" : n.papel === "saida" ? "saida" : n.tipo || "derivacao";
        const nomeDe = n.de.map((d) => nos.get(d)?.rotulo || d).join(", ");
        const no = el("div", { class: `fluxo-no${n.restrita ? " restrita" : ""}`, tabindex: "0", "data-id": n.id,
          "aria-label": `${n.rotulo}${nomeDe ? `, a partir de: ${nomeDe}` : ""}${n.nota ? `. ${n.nota}` : ""}` },
          el("span", { class: "tipo", text: TIPOS_FLUXO[tipo] || tipo }),
          n.link ? el("b", {}, el("a", { href: n.link, text: n.rotulo })) : el("b", { text: n.rotulo }),
          n.nota ? el("span", { class: "nota", text: n.nota }) : null,
          nomeDe ? el("span", { class: "de", text: `← ${nomeDe}` }) : null);
        no.style.setProperty("--cor-fluxo", cor[n.papel]);
        els.set(n.id, no);
        return no;
      })));
    }
    const svg = d3.select(caixa).append("svg").attr("aria-hidden", "true");
    const arestas = [...nos.values()].flatMap((n) => n.de.filter((d) => nos.has(d)).map((d) => ({ de: d, para: n.id })));
    const desenhar = () => {
      const r0 = caixa.getBoundingClientRect();
      if (!r0.width) return;
      const ops = faixa("operacao").map((n) => n.id);
      svg.selectAll("path").data(arestas).join("path").attr("d", (a) => {
        const A = els.get(a.de).getBoundingClientRect(), B = els.get(a.para).getBoundingClientRect();
        const y1 = A.top + A.height / 2 - r0.top, y2 = B.top + B.height / 2 - r0.top;
        if (nos.get(a.de).papel === "operacao" && nos.get(a.para).papel === "operacao") {   // dentro da coluna: arco pela margem esquerda
          const x1 = A.left - r0.left, x2 = B.left - r0.left, g = 10 + 5 * Math.min(4, Math.abs(ops.indexOf(a.para) - ops.indexOf(a.de)) - 1);
          return `M${x1},${y1}C${x1 - g},${y1} ${x2 - g},${y2} ${x2},${y2}`;
        }
        const x1 = A.right - r0.left, x2 = B.left - r0.left, m = (x1 + x2) / 2;
        return `M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}`;
      });
    };
    new ResizeObserver(desenhar).observe(caixa);
    // operações transversais: faixa à parte, aplicada a todas as saídas (menos as de `exceto`)
    const transv = (f.transversais || []).map((t) => {
      const exceto = new Set(t.exceto || []), alvo = faixa("saida").filter((n) => !exceto.has(n.id)).map((n) => n.id);
      const nomesExc = [...exceto].map((id) => nos.get(id)?.rotulo || id);
      const no = el("div", { class: "fluxo-no fluxo-transversal", tabindex: "0", "data-id": t.id,
        "aria-label": `${t.rotulo}: vale para todas as saídas${nomesExc.length ? `, exceto ${nomesExc.join(", ")}` : ""}${t.nota ? `. ${t.nota}` : ""}` },
        el("span", { class: "tipo", text: `${TIPOS_FLUXO[t.tipo] || t.tipo || "operação"} · transversal` }), el("b", { text: t.rotulo }),
        t.nota ? el("span", { class: "nota", text: t.nota }) : null,
        el("span", { class: "nota alcance", text: `Vale para todas as saídas${nomesExc.length ? `, exceto: ${nomesExc.join(", ")}` : ""}.` }));
      no.style.setProperty("--cor-fluxo", cor.operacao);
      return { t, no, alvo };
    });
    const faixaT = transv.length ? el("div", { class: "fluxo-transversais" }, el("h4", { text: "Operações transversais" }), ...transv.map((x) => x.no)) : null;
    const focarT = (x) => {
      caixa.classList.toggle("focado", !!x);
      const lig = new Set(x ? x.alvo : []);
      for (const [k, no] of els) no.classList.toggle("ligado", lig.has(k));
      svg.selectAll("path").classed("ligado", false);
      for (const y of transv) y.no.classList.toggle("ligado", y === x);
    };
    for (const x of transv) {
      x.no.addEventListener("pointerenter", () => focarT(x)); x.no.addEventListener("pointerleave", () => focarT(null));
      x.no.addEventListener("focus", () => focarT(x)); x.no.addEventListener("blur", () => focarT(null));
    }
    // caminho de um nó: ancestrais e descendentes
    const sobe = (id, s = new Set()) => { for (const a of arestas) if (a.para === id && !s.has(a.de)) { s.add(a.de); sobe(a.de, s); } return s; };
    const desce = (id, s = new Set()) => { for (const a of arestas) if (a.de === id && !s.has(a.para)) { s.add(a.para); desce(a.para, s); } return s; };
    const focar = (id) => {
      caixa.classList.toggle("focado", !!id);
      const lig = id ? new Set([id, ...sobe(id), ...desce(id)]) : new Set();
      for (const [k, no] of els) no.classList.toggle("ligado", lig.has(k));
      svg.selectAll("path").classed("ligado", (a) => lig.has(a.de) && lig.has(a.para));
      // a faixa transversal acende junto quando o caminho chega a uma saída a que ela se aplica
      for (const x of transv) x.no.classList.toggle("ligado", !!id && x.alvo.some((s) => lig.has(s)));
    };
    for (const [k, no] of els) {
      no.addEventListener("pointerenter", () => focar(k)); no.addEventListener("pointerleave", () => focar(null));
      no.addEventListener("focus", () => focar(k)); no.addEventListener("blur", () => focar(null));
    }
    caixa.classList.toggle("com-transversais", !!faixaT);
    return faixaT ? el("div", { class: "fluxo-envelope" }, caixa, faixaT) : caixa;
  };

  /** Seções do bloco (o mesmo conteúdo no fim da página ou em camadas na folha ✎ Notas e fontes — L0014). */
  const secoesMetodologia = (m, { baixar = null, linkAutor = null, endereco = null } = {}, secao) => {
    const fontes = el("div", { class: "rolagem" }, Lab.tabela(["Base", "Órgão", "Arquivos (gerado na fonte · baixado em · hash)", "Link"],
      m.fontes.map((f) => [
        [el("code", { text: f.id }), el("div", { class: "nota", text: f.descricao })],
        f.orgao,
        [el("ul", { class: "arquivos" }, ...f.arquivos.map((a) => el("li", {}, el("code", { text: a.arquivo }),
          ` · ${a.gerado_na_fonte ? a.gerado_na_fonte.replace(/ \d\d:\d\d:\d\d GMT$/, "") : "—"} · ${a.baixado_em || "—"} · ${a.sha256 || "—"}`)))],
        f.url ? [el("a", { href: f.url, target: "_blank", rel: "noopener", text: "página oficial ↗" })] : "—"])));
    const passos = el("ol", { class: "passos" }, ...m.passos.map((p) => el("li", {},
      el("b", { text: p.titulo }), el("p", { text: p.texto }),
      p.adrs ? el("div", { class: "nota" }, "Decisões: ", ...p.adrs.flatMap((id, k) => [k ? ", " : "", el("a", { href: `#adr-${id}`, text: id })])) : null,
      p.trecho ? el("details", { class: "codigo" }, el("summary", {}, "Ver código"), el("pre", {}, el("code", { text: p.trecho }))) : null)));
    const q = m.qualidade || {};
    const adrs = el("ul", { class: "adrs" }, ...m.adrs.map((a) => el("li", { id: `adr-${a.id}` },
      el("b", { text: `${a.id} — ${a.titulo}` }), el("span", { class: "nota", text: ` (${a.status})` }), el("div", { text: a.decisao }),
      el("div", { class: "nota" }, "No repositório: ", el("code", { text: a.arquivo })))));
    const codigos = el("div", { class: "rolagem" }, Lab.tabela(["Arquivo", "O que faz"], m.codigos.map((c) => [[el("code", { text: c.arquivo })], c.papel])));
    const v = m.versao;
    const citar = `${m.citacao || ""} Disponível em: ${endereco || location.href.split("#")[0]}. Acesso em: ${new Date().toLocaleDateString("pt-BR")}.`.trim();
    return [

        secao("Fontes de dados", fontes,

  /** O bloco em camadas, para a folha ✎ Notas e fontes de Visualizações e stories (L0014): cada seção recolhida; os

  Lab.metodologiaEmCamadas = (m, opts = {}) => {

  /** Rodapé da página: bloco de metodologia + assinatura com link para a página do autor. */
  Lab.rodapePagina = (m, { baixar = null, linkAutor = null } = {}) => {
    const rodape = document.getElementById(Lab.cfg.ancoraRodape);
    rodape.replaceChildren(Lab.blocoMetodologia(m, { baixar, linkAutor }),

        linkAutor ? " · " : null, linkAutor ? el("a", { href: linkAutor.href, target: "_blank", rel: "noopener", text: linkAutor.rotuloCurto || linkAutor.texto }) : null));
    // só o link interno ("Fontes, métodos e códigos ↓") leva à metodologia; o nome do autor abre o portfólio em nova aba
    // o mesmo para o item do menu do topo marcado com data-metodologia (exploratórios; pesquisador, 2026-10-12)
    for (const a of document.querySelectorAll('.assinatura a[href^="#"], a[data-metodologia]')) a.addEventListener("click", Lab.irRodape);
  };
})();

<script>
/* interpolacao.js — interpolação entre conjuntos de polígonos (Ramos, Santos e Cavalcante Neto, SIBGRAPI 2019,
 * doi:10.1109/SIBGRAPI.2019.00027), reimplementada a partir do texto do artigo. Decisões: ADR MR0001.
 *
 * Geometria em coordenadas planas (já projetadas). Polígono = [anelExterno, buraco1, …]; anel = [[x, y], …].
 * Depende de: d3 v7 (d3.Delaunay), polygon-clipping 0.15 (window.polygonClipping), flubber 0.4 (window.flubber).
 *
 * Os blocos "#region nome · referência" são os trechos mostrados na página, ao lado do texto da seção citada:
 * o código mostrado é o código que roda (CLAUDE.md do projeto).
 */
(function () {
  "use strict";
  const I = (window.Interpolacao = {});
  const pc = () => window.polygonClipping;

  // #region geometria · funções de apoio (área, centroide, distâncias)
  /** Área com sinal de um anel (fórmula do laço). */
  const areaAnel = (r) => {
    let s = 0;
    for (let k = 0, n = r.length; k < n; k++) { const [x1, y1] = r[k], [x2, y2] = r[(k + 1) % n]; s += x1 * y2 - x2 * y1; }
    return s / 2;
  };
  /** Área de um polígono com buracos (externo menos buracos). */
  const area = (P) => Math.abs(areaAnel(P[0])) - P.slice(1).reduce((s, h) => s + Math.abs(areaAnel(h)), 0);
  /** Área de um multipolígono (lista de polígonos). */
  const areaMulti = (M) => M.reduce((s, P) => s + area(P), 0);
  /** Centroide de área de um anel. */
  const centroideAnel = (r) => {
    let cx = 0, cy = 0, a = 0;
    for (let k = 0, n = r.length; k < n; k++) {
      const [x1, y1] = r[k], [x2, y2] = r[(k + 1) % n], f = x1 * y2 - x2 * y1;
      a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
    }
    return a === 0 ? r[0].slice() : [cx / (3 * a), cy / (3 * a)];
  };
  /** Centroide de um polígono com buracos (média dos anéis ponderada pela área; buracos subtraem). */
  const centroide = (P) => {
    let A = 0, X = 0, Y = 0;
    P.forEach((r, k) => {
      const a = Math.abs(areaAnel(r)) * (k === 0 ? 1 : -1), [cx, cy] = centroideAnel(r);
      A += a; X += a * cx; Y += a * cy;
    });
    return A === 0 ? centroideAnel(P[0]) : [X / A, Y / A];
  };
  const caixa = (P) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of P[0]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  };
  const caixaDe = (lista) => lista.map(caixa).reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])],
    [Infinity, Infinity, -Infinity, -Infinity]);
  const distCaixas = (a, b) => Math.hypot(Math.max(0, a[0] - b[2], b[0] - a[2]), Math.max(0, a[1] - b[3], b[1] - a[3]));
  /** Ponto dentro de um anel (paridade de cruzamentos). */
  const dentroAnel = ([x, y], r) => {
    let d = false;
    for (let k = 0, j = r.length - 1; k < r.length; j = k++) {
      const [xi, yi] = r[k], [xj, yj] = r[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) d = !d;
    }
    return d;
  };
  const dentro = (p, P) => dentroAnel(p, P[0]) && !P.slice(1).some((h) => dentroAnel(p, h));
  const distPontoSeg = ([px, py], [ax, ay], [bx, by]) => {
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)) : 0;
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  };
  const cruzam = (a, b, c, d) => {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    return o(a, b, c) !== o(a, b, d) && o(c, d, a) !== o(c, d, b);
  };
  /** Menor distância entre dois polígonos (0 se um invade o outro ou as bordas se cruzam). */
  const distancia = (P, Q) => {
    if (dentro(P[0][0], Q) || dentro(Q[0][0], P)) return 0;
    let m = Infinity;
    for (const r of P) for (let a = 0; a < r.length; a++) {
      const p1 = r[a], p2 = r[(a + 1) % r.length];
      for (const s of Q) for (let b = 0; b < s.length; b++) {
        const q1 = s[b], q2 = s[(b + 1) % s.length];
        if (cruzam(p1, p2, q1, q2)) return 0;
        m = Math.min(m, distPontoSeg(p1, q1, q2), distPontoSeg(p2, q1, q2), distPontoSeg(q1, p1, p2), distPontoSeg(q2, p1, p2));
      }
    }
    return m;
  };
  /** Ponto garantidamente interno: meio do trecho mais largo de uma linha horizontal que corta o polígono. */
  const pontoInterno = (P) => {
    const [x0, y0, x1, y1] = caixa(P);
    let melhor = null;
    for (const f of [0.5, 0.37, 0.63, 0.25, 0.75]) {
      const y = y0 + (y1 - y0) * f + (y1 - y0) * 1e-7, xs = [];
      for (const r of P) for (let k = 0, j = r.length - 1; k < r.length; j = k++) {
        const [xi, yi] = r[k], [xj, yj] = r[j];
        if ((yi > y) !== (yj > y)) xs.push(((xj - xi) * (y - yi)) / (yj - yi) + xi);
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) if (!melhor || xs[k + 1] - xs[k] > melhor.w) melhor = { w: xs[k + 1] - xs[k], p: [(xs[k] + xs[k + 1]) / 2, y] };
      if (melhor && melhor.w > (x1 - x0) * 0.2) break;
    }
    return melhor ? melhor.p : centroideAnel(P[0]);
  };
  /** Polo de inacessibilidade aproximado: ponto interno mais distante da borda (grade refinada 3 vezes). */
  const poloInacessibilidade = (P) => {
    const [x0, y0, x1, y1] = caixa(P), distBorda = (p) => Math.min(...P.flatMap((r) => r.map((a, k) => distPontoSeg(p, a, r[(k + 1) % r.length]))));
    let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = x1 - x0, h = y1 - y0, melhor = { d: -1, p: pontoInterno(P) };
    for (let it = 0; it < 3; it++) {
      for (let a = 0; a <= 16; a++) for (let b = 0; b <= 16; b++) {
        const p = [cx - w / 2 + (w * a) / 16, cy - h / 2 + (h * b) / 16];
        if (!dentro(p, P)) continue;
        const d = distBorda(p);
        if (d > melhor.d) melhor = { d, p };
      }
      [cx, cy] = melhor.p; w /= 4; h /= 4;
    }
    return melhor.p;
  };
  Object.assign(I, { areaAnel, area, areaMulti, centroide, caixa, caixaDe, dentro, distancia, pontoInterno, poloInacessibilidade });
  // #endregion

  // #region correspondencias · III-A
  /**
   * Correspondências entre os conjuntos Origem e Alvo (seção III-A). Artigo: Oi e Tj se correspondem se, e somente
   * se, se intersectam espacialmente. Ajustes (MR0001, D1): "area" exige interseção com área > 0; "raio" aceita
   * polígonos a até `raio` de distância (trabalho futuro citado no artigo); "limiar" exige que a área em comum seja
   * pelo menos a fração `limiar` da área do menor dos dois (malhas de anos diferentes, cujas bordas não coincidem).
   * Saída: CO[i] = índices de Alvo que correspondem a Oi; CT[j] = índices de Origem que correspondem a Tj.
   */
  I.correspondencias = (origem, alvo, { modo = "artigo", raio = 0, limiar = 0.05 } = {}) => {
    const CO = origem.map(() => []), CT = alvo.map(() => []);
    const cO = origem.map(caixa), cT = alvo.map(caixa), eps = 1e-9 * Math.hypot(...caixaDe([...origem, ...alvo]).slice(2));
    origem.forEach((O, i) => alvo.forEach((T, j) => {
      const limite = modo === "raio" ? raio : eps;
      if (distCaixas(cO[i], cT[j]) > limite) return;              // caixas distantes: não há como se tocarem
      const comum = () => areaMulti(pc().intersection(O, T));
      const ok = modo === "area" ? comum() > eps
               : modo === "limiar" ? comum() >= limiar * Math.min(area(O), area(T))
               : distancia(O, T) <= limite;                        // artigo: tocar a borda já conta
      if (ok) { CO[i].push(j); CT[j].push(i); }
    }));
    return { CO, CT };
  };
  // #endregion

  // #region sementes · IV-B
  /**
   * Uma semente por polígono correspondente, para o diagrama de Voronoi que divide P (seção IV-B).
   * "artigo": o vértice de cada correspondente mais próximo do centroide de P ("we chose as seed the position of the
   * vertex closest to the centroid of the polygon to be divided"). "interno" (MR0001, D2): ponto interno de c ∩ P.
   */
  I.sementes = (P, C, regra = "artigo") => {
    const [px, py] = centroide(P);
    return C.map((c) => {
      if (regra === "interno") {
        const inter = pc().intersection(P, c);
        if (inter.length) return pontoInterno(inter.reduce((a, b) => (area(b) > area(a) ? b : a)));
      }
      let m = Infinity, v = c[0][0];
      for (const p of c[0]) { const d = (p[0] - px) ** 2 + (p[1] - py) ** 2; if (d < m) { m = d; v = p; } }
      return v.slice();
    });
  };
  // #endregion

  // #region dividir · IV-B
  /**
   * Divide P em |C| partes, uma por polígono correspondente (função Divide do Algoritmo 1, técnica de Voronoi):
   * 1) diagrama de Voronoi das sementes; 2) interseção de P com cada célula. Com |C| = 1, P fica inteiro.
   * Devolve, na ordem de C, cada parte como multipolígono (pode sair em vários pedaços: ver juntarFragmentos).
   */
  I.dividir = (P, C, { semente = "artigo" } = {}) => {
    if (C.length === 1) return { partes: [[P]], sementes: [] };
    const s = I.sementes(P, C, semente);
    const [x0, y0, x1, y1] = caixaDe([P, ...C]), folga = Math.hypot(x1 - x0, y1 - y0);
    // sementes repetidas (em malhas, vizinhos dividem vértices; a regra do artigo pode escolher o mesmo para dois deles):
    // a repetida anda 1% do caminho até o centroide do próprio correspondente
    const tolS = folga * 1e-6;
    s.forEach((p, k) => {
      if (!s.slice(0, k).some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < tolS)) return;
      const [cx, cy] = centroide(C[k]);
      s[k] = [p[0] + 0.01 * (cx - p[0]), p[1] + 0.01 * (cy - p[1])];
    });
    const vor = d3.Delaunay.from(s).voronoi([x0 - folga, y0 - folga, x1 + folga, y1 + folga]);
    const partes = s.map((_, k) => { const cel = vor.cellPolygon(k); return cel ? pc().intersection(P, [cel]) : []; });
    return { partes, sementes: s, celulas: s.map((_, k) => vor.cellPolygon(k)) };
  };
  // #endregion

  // #region fragmentos · ajuste MR0001 (D3, provisório)
  /**
   * A célula de Voronoi é convexa e P não precisa ser: P ∩ célula pode sair em vários pedaços (≈ 1 parte em 10 nos
   * testes sintéticos). O pedaço mais próximo da semente (empate: o maior) fica; cada outro vai para a parte vizinha
   * com maior fronteira comum. A soma das áreas não muda (a partição de P é preservada).
   */
  I.juntarFragmentos = (partes, sementes) => {
    const tol = 1e-7 * Math.hypot(...caixaDe(partes.flat()).slice(2));
    const principais = [], soltos = [];
    partes.forEach((M, k) => {
      if (M.length <= 1) { principais.push(M); return; }
      const s = sementes[k], dist = (p) => (!s ? 0 : dentro(s, p) ? 0 : Math.min(...p[0].map((q, b) => distPontoSeg(s, q, p[0][(b + 1) % p[0].length]))));
      // fica o pedaço mais próximo da semente (a do artigo é um vértice do correspondente e pode cair fora de P); empate: o maior
      const prin = M.reduce((a, b) => { const da = dist(a), db = dist(b); return db < da - tol || (Math.abs(db - da) <= tol && area(b) > area(a)) ? b : a; });
      principais.push([prin]);
      M.filter((p) => p !== prin).forEach((g) => soltos.push({ k, g }));
    });
    const fronteira = (g, M) => {                   // comprimento das arestas de g que estão sobre a borda de M
      let L = 0;
      for (const r of g) for (let a = 0; a < r.length - 1; a++) {
        const m = [(r[a][0] + r[a + 1][0]) / 2, (r[a][1] + r[a + 1][1]) / 2];
        if (M.some((P) => P.some((s) => s.some((q, b) => b < s.length - 1 && distPontoSeg(m, q, s[b + 1]) < tol)))) L += Math.hypot(r[a + 1][0] - r[a][0], r[a + 1][1] - r[a][1]);
      }
      return L;
    };
    soltos.sort((a, b) => area(b.g) - area(a.g)).forEach(({ k, g }) => {
      let melhor = { L: 0, j: k };
      principais.forEach((M, j) => { if (j !== k && M.length) { const L = fronteira(g, M); if (L > melhor.L) melhor = { L, j }; } });
      principais[melhor.j] = pc().union(principais[melhor.j], [g]);
    });
    return principais;
  };
  // #endregion

  // #region divisaoEspacial · III-B, Algoritmo 1
  /**
   * Algoritmo 1 (divisão espacial). Entrada: Origem, Alvo, CO, CT. Saída: SPL, a lista de pares de formas 1-1.
   * `passos` registra cada linha executada, para a página acender o pseudocódigo.
   */
  I.divisaoEspacial = (origem, alvo, CO, CT, { semente = "artigo", fragmentos = true, ponto = "centroide" } = {}) => {
    const SPL = [], passos = [], RO = [], RT = [], divisoes = [];
    const alvoPonto = (P) => (ponto === "polo" ? poloInacessibilidade(P) : centroide(P));
    const parte = (P, C, lado, idx) => {
      const d = I.dividir(P, C.map((k) => (lado === "O" ? alvo : origem)[k]), { semente });
      const partes = fragmentos && C.length > 1 ? I.juntarFragmentos(d.partes, d.sementes) : d.partes;
      divisoes.push({ lado, idx, C, sementes: d.sementes, celulas: d.celulas, partes, multipartes: d.partes.filter((m) => m.length > 1).length });
      return Object.fromEntries(C.map((k, n) => [k, partes[n]]));
    };
    origem.forEach((O, i) => {                                                  // linha 2
      if (CO[i].length === 0) {                                                 // linha 3
        const c = alvoPonto(O);                                                 // linha 4: Centroid(Oi)
        SPL.push({ de: [O], para: c, i, j: null, tipo: "desaparece" });         // linha 5
        passos.push({ linha: 5, lado: "O", i });
      } else { RO[i] = parte(O, CO[i], "O", i); passos.push({ linha: 7, lado: "O", i, n: CO[i].length }); } // linha 7: Divide(Oi, COi)
    });
    alvo.forEach((T, j) => {                                                    // linha 10
      if (CT[j].length === 0) {                                                 // linha 11
        const c = alvoPonto(T);                                                 // linha 12: Centroid(Tj)
        SPL.push({ de: c, para: [T], i: null, j, tipo: "surge" });              // linha 13
        passos.push({ linha: 13, lado: "T", j });
      } else { RT[j] = parte(T, CT[j], "T", j); passos.push({ linha: 15, lado: "T", j, n: CT[j].length }); } // linha 15: Divide(Tj, CTj)
    });
    alvo.forEach((_, j) => CT[j].forEach((i) => {                               // linhas 18–19
      SPL.push({ de: RO[i][j], para: RT[j][i], i, j, tipo: "par" });            // linha 20: SPL.append([Rij, Rji])
      passos.push({ linha: 20, i, j });
    }));
    return { SPL, passos, divisoes };                                           // linha 23
  };
  // #endregion

  // #region interpolacao · III-C (flubber)
  /**
   * Interpolação de cada par (seção III-C), com o flubber (Veltman, 2017), que faz os três passos do artigo:
   * 1) iguala o número de vértices (subdivide arestas e acrescenta pontos ao anel menor);
   * 2) escolhe a correspondência de vértices de menor custo de trajetória (rotação com menor soma de distâncias²);
   * 3) interpola linearmente os vértices correspondentes.
   * Pares com ponto (surgir/desaparecer) crescem a partir dele ou colapsam nele.
   * Buracos: em aberto (MR0001, D4) — só o contorno externo é interpolado, e os buracos descartados são contados.
   */
  I.interpoladores = (SPL, { maxSegmentLength = 1 } = {}) => {
    const op = { maxSegmentLength, string: false }, ehPonto = (x) => typeof x[0] === "number";
    let buracos = 0;
    const anel = (M) => {                                   // multipolígono → anel externo do maior pedaço
      buracos += M.reduce((s, p) => s + p.length - 1, 0);   // buracos descartados (D4 em aberto)
      return M.reduce((a, b) => (area(b) > area(a) ? b : a))[0];
    };
    let vazias = 0;   // parte vazia (célula de Voronoi que não alcança o polígono): tratada como ponto, e contada
    const fns = SPL.map((par) => {
      let { de, para } = par;
      if (!ehPonto(de) && !de.length) { vazias++; de = centroide(para[0]); }
      if (!ehPonto(para) && !para.length) { vazias++; para = centroide(de[0]); }
      if (ehPonto(para)) return flubber.toCircle(anel(de), para[0], para[1], 1e-6, op);
      if (ehPonto(de)) return flubber.fromCircle(de[0], de[1], 1e-6, anel(para), op);
      return flubber.interpolate(anel(de), anel(para), op);
    });
    return { fns, buracos, vazias, multipartes: SPL.filter((p) => !ehPonto(p.de) && p.de.length > 1 || !ehPonto(p.para) && p.para.length > 1).length };
  };
  /** Formas do quadro t (0 = Origem, 1 = Alvo). */
  I.quadro = (fns, t) => fns.map((f) => f(t));
  // #endregion

  // #region sobreposicao · R4 medido (MR0001, D8)
  /**
   * Requisito R4 ("os polígonos não devem se intersectar"): o artigo verificou por exemplos; aqui se mede.
   * Área sobreposta entre as formas de um quadro, como fração da soma das áreas. Anéis que se cruzam a si mesmos
   * no meio da animação são contados à parte (podem invalidar a medida de área).
   */
  I.sobreposicao = (aneis) => {
    const P = aneis.map((r) => [r]), cx = P.map(caixa);
    let sobre = 0, total = 0, invalidos = 0;
    P.forEach((p) => { total += Math.abs(areaAnel(p[0])); });
    for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) {
      if (distCaixas(cx[a], cx[b]) > 0) continue;
      try { sobre += areaMulti(pc().intersection(P[a], P[b])); } catch (e) { invalidos++; }
    }
    return { fracao: total ? sobre / total : 0, area: sobre, invalidos };
  };
  // #endregion

  // #region eventos · trabalho futuro do artigo (VI), em avaliação (MR0001, D8)
  /**
   * Eventos derivados das correspondências: componentes conexos do grafo Origem–Alvo, classificados pela cardinalidade
   * (0→1 surge; 1→0 desaparece; 1→n divide; n→1 funde; n→m reorganiza; 1→1 expande, contrai ou estável, com limiar
   * de ±`limiar` na variação de área). Nomes e limiar em avaliação no protótipo.
   */
  I.eventos = (origem, alvo, CO, { limiar = 0.05 } = {}) => {
    const pai = [...origem.map((_, i) => `o${i}`), ...alvo.map((_, j) => `t${j}`)].reduce((m, k) => (m[k] = k, m), {});
    const raiz = (k) => (pai[k] === k ? k : (pai[k] = raiz(pai[k])));
    CO.forEach((js, i) => js.forEach((j) => { pai[raiz(`o${i}`)] = raiz(`t${j}`); }));
    const grupos = {};
    Object.keys(pai).forEach((k) => { (grupos[raiz(k)] ||= { o: [], t: [] })[k[0]].push(+k.slice(1)); });
    return Object.values(grupos).map(({ o, t }) => {
      const aO = o.reduce((s, i) => s + area(origem[i]), 0), aT = t.reduce((s, j) => s + area(alvo[j]), 0);
      const tipo = !o.length ? "surge" : !t.length ? "desaparece" : o.length === 1 && t.length === 1
        ? (aT > aO * (1 + limiar) ? "expande" : aT < aO * (1 - limiar) ? "contrai" : "estavel")
        : o.length === 1 ? "divide" : t.length === 1 ? "funde" : "reorganiza";
      const pts = [...o.map((i) => centroide(origem[i])), ...t.map((j) => centroide(alvo[j]))];
      return { tipo, o, t, variacao: aO ? aT / aO - 1 : null, pos: [d3.mean(pts, (p) => p[0]), d3.mean(pts, (p) => p[1])] };
    });
  };
  // #endregion

  // #region flubberDireto · comparação da Fig. 9
  /**
   * O que o flubber faz sozinho (comparação da Fig. 9): 1-1 com interpolate, 1-n com separate e n-1 com combine,
   * que dividem a forma por triangulação sem olhar a posição dos correspondentes. Não há muitos-para-muitos: esses
   * grupos ficam de fora (null), e a página diz isso.
   */
  I.flubberDireto = (origem, alvo, CO, { maxSegmentLength = 1 } = {}) => {
    const op = { maxSegmentLength, string: false, single: false }, fns = [];
    let semSuporte = 0;
    I.eventos(origem, alvo, CO).forEach(({ o, t }) => {
      const O = o.map((i) => origem[i][0]), T = t.map((j) => alvo[j][0]);
      if (!T.length) { const [x, y] = centroide(origem[o[0]]); fns.push(flubber.toCircle(O[0], x, y, 1e-6, op)); }
      else if (!O.length) { const [x, y] = centroide(alvo[t[0]]); fns.push(flubber.fromCircle(x, y, 1e-6, T[0], op)); }
      else if (O.length === 1 && T.length === 1) fns.push(flubber.interpolate(O[0], T[0], op));
      else if (O.length === 1) fns.push(...flubber.separate(O[0], T, op));
      else if (T.length === 1) fns.push(...flubber.combine(O, T[0], op));
      else semSuporte++;
    });
    return { fns, semSuporte };
  };
  // #endregion
})();

</script>
<script>
Lab.configurar({"autorUrl": "https://github.com/CajazeiraAlexandre"});
/* app.js — página interativa do artigo "A partition approach to interpolate polygon sets for animation" (SIBGRAPI 2019).

 * Estrutura (pesquisador, 2026-10-15): 1 problema · 2 abordagem do artigo · 3 limitações e atualizações · 4 testes livres ·
 * 5 seus dados · 6 referências — seções em acordeão (padrão das exploratórias) e subseções montadas ao abrir.
