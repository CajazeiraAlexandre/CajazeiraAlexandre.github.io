(async function () {
  "use strict";
  const { el } = Lab;
  const I = window.Interpolacao;
  const base = await Lab.decodificar(document.getElementById("dados").textContent.trim());
  const { textos, codigo, refs } = base;
  const casosBase = Object.fromEntries(base.casos.map((c) => [c.id, c]));
  const series = Object.fromEntries((base.series || []).map((s) => [s.id, s]));
  const app = document.getElementById("app"), capa = document.getElementById("capa"), nav = document.getElementById("nav");
  Lab.configurar({ raiz: app, autor: "Alexandre Ribeiro Cajazeira Ramos" });

  // ------------------------------------------------------------------ configurações do método (MR0001)
  const CFG_ARTIGO = { metodo: "voronoi", modo: "artigo", raio: 4, limiar: 5, semente: "artigo", pedacos: "juntar", ponto: "centroide", msl: 1.4 };
  const CFG_AJUSTES = { ...CFG_ARTIGO, modo: "limiar", semente: "interno" };
  const cfgDe = (txt, padrao) => { try { return { ...padrao, ...JSON.parse(txt) }; } catch (e) { return { ...padrao }; } };

  // ------------------------------------------------------------------ estado (no endereço) e textos
  const est = { lang: "pt", fundo: "1", p1caso: "exp3", p2caso: "exp3", p2passo: "0", p3caso: "fig9", p4caso: "exp1a", p5caso: "exp3",
                c1caso: "hotspots", c1modo: "raio", c1raio: "4", c1limiar: "5", c6caso: "pi9100", c6limiar: "5", c7serie: "desmat-labrea", c7modo: "serie", c7cfg: "ajustes", c7de: "", c7ate: "",
                s4caso: "exp3", s4de: "", s4ate: "", s4b: "0", s4ev: "0", s4cfgA: "", s4cfgB: "", s5b: "0", s5cfgA: "", s5cfgB: "" };
  try { const p = new URLSearchParams(location.hash.slice(1)); for (const k of Object.keys(est)) if (p.has(k)) est[k] = p.get(k); } catch (e) { /* padrão */ }
  const guardar = () => history.replaceState(null, "", `#${new URLSearchParams(Object.entries(est).filter(([, v]) => v !== ""))}`);
  const T = (k, v = {}) => {
    const e = textos[k];
    const s = e ? e[est.lang] ?? e.pt : k;
    return s.replace(/\{(\w+)\}/g, (_, n) => (v[n] ?? `{${n}}`));
  };
  const loc = () => (est.lang === "pt" ? "pt-BR" : "en-US");
  const num = (x, d = 1) => x.toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (x, d = 1) => `${num(100 * x, d)}%`;

  // ------------------------------------------------------------------ cores (tokens; categóricas em ordem fixa)
  const tk = (n) => Lab.token(n);
  const corO = () => tk("cor-cat-1"), corT = () => tk("cor-cat-2");
  const corParte = (k) => (k < 8 ? tk(`cor-cat-${k + 1}`) : tk("cor-texto-suave"));   // da 9ª em diante: cinza
  const corT_t = (t) => d3.interpolateLab(corO(), corT())(t);
  const corA = () => tk("cor-cat-3"), corB = () => tk("cor-cat-4");                   // variantes A e B nas comparações

  // ------------------------------------------------------------------ casos (sintéticos, malhas, séries anuais, leitor)
  let casoUsuario = null;
  const memoSerie = new Map();
  /** Caso por id; séries (desmatamento acumulado) viram um caso com o par de anos escolhido. */
  function caso(id, de = "", ate = "") {
    if (id === "usuario") return casoUsuario;
    if (casosBase[id]) return casosBase[id];
    const s = series[id];
    if (!s) return null;
    const anos = Object.keys(s.anos);
    const a = anos.includes(de) ? de : anos[0], b = anos.includes(ate) && ate !== a ? ate : anos[anos.length - 1];
    const chave = `${id}:${a}:${b}`;
    if (!memoSerie.has(chave)) memoSerie.set(chave, { id: chave, serie: id, de: a, ate: b, geo: s.geo,
      titulo: { pt: `${s.titulo.pt}, ${a} → ${b}`, en: `${s.titulo.en}, ${a} → ${b}` }, ref: s.ref, nota: s.nota,
      origem: s.anos[a], alvo: s.anos[b] });
    return memoSerie.get(chave);
  }
  const tituloCaso = (id) => { const c = casosBase[id] || series[id]; return c ? `${c.titulo[est.lang]}${c.ref ? ` · ${c.ref}` : ""}` : id; };
  const opcoesCasos = (ids) => ids.filter((id) => casosBase[id] || series[id]).map((id) => [id, tituloCaso(id)]);
  /** Seletor de anos de uma série (início e fim). */
  function seletorAnos(id, de, ate, aoMudar) {
    const s = series[id];
    if (!s) return null;
    const anos = Object.keys(s.anos), c = caso(id, de, ate);
    const lista = (v, f) => { const sel = el("select", { onchange: (e) => f(e.target.value) }); anos.forEach((a) => sel.append(el("option", { value: a, text: s.rotulos?.[a] || a }))); sel.value = v; return sel; };
    return el("span", { class: "campo" }, `${T("ano_inicio")} `, lista(c.de, (v) => aoMudar(v, c.ate)), ` ${T("ano_fim")} `, lista(c.ate, (v) => aoMudar(c.de, v)));
  }

  // ------------------------------------------------------------------ execução do algoritmo (com cache)
  const cache = new Map();
  function executar(c, cfg) {
    const op = { modo: cfg.modo, raio: +cfg.raio, limiar: +cfg.limiar / 100, semente: cfg.semente, fragmentos: cfg.pedacos !== "manter", ponto: cfg.ponto, msl: +cfg.msl };
    const chave = JSON.stringify([c.id, op]);
    if (c.id !== "usuario" && cache.has(chave)) return cache.get(chave);
    const t0 = performance.now();
    const { CO, CT } = I.correspondencias(c.origem, c.alvo, op);
    const div = I.divisaoEspacial(c.origem, c.alvo, CO, CT, op);
    const r = { CO, CT, ...div, ...I.interpoladores(div.SPL, { maxSegmentLength: op.msl }) };
    r.pedacos = d3.sum(div.divisoes, (d) => d.multipartes);
    r.ms = performance.now() - t0;
    cache.set(chave, r);
    return r;
  }
  /** Uma variante: algoritmo do artigo (Voronoi) ou flubber direto. */
  function prepararAnim(c, cfg) {
    const r = executar(c, cfg);
    if (cfg.metodo !== "flubber") return { r, fns: r.fns, estaticosFn: () => [], semSuporte: 0, buracos: r.buracos, vazias: r.vazias, pedacos: r.pedacos, ms: r.ms };
    const t0 = performance.now();
    const f = I.flubberDireto(c.origem, c.alvo, r.CO, { maxSegmentLength: +cfg.msl });
    const nm = I.eventos(c.origem, c.alvo, r.CO).filter((g) => g.o.length > 1 && g.t.length > 1);
    // grupos muitos-para-muitos: sem suporte no flubber; mostrados parados (Origem até a metade, Alvo depois)
    const estaticosFn = (t) => nm.flatMap((g) => (t < 0.5 ? g.o.map((i) => c.origem[i]) : g.t.map((j) => c.alvo[j])));
    return { r, fns: f.fns, estaticosFn, semSuporte: f.semSuporte, buracos: 0, vazias: 0, pedacos: 0, ms: performance.now() - t0 };
  }
  /** Medidas por quadro (MR0001, D8): sobreposição (R4) e vãos (área coberta abaixo da reta entre início e fim). */
  const cacheMedidas = new WeakMap();
  function medir(c, a) {
    if (cacheMedidas.has(a.fns)) return cacheMedidas.get(a.fns);
    const uniao = (aneis) => { try { return aneis.length ? I.areaMulti(polygonClipping.union(...aneis.map((r) => [[r]]))) : 0; } catch (e) { return NaN; } };
    const U0 = uniao(c.origem.map((P) => P[0])), U1 = uniao(c.alvo.map((P) => P[0]));
    const passos = c.origem.length + c.alvo.length > 120 ? 10 : 20;
    const m = d3.range(passos + 1).map((k) => {
      const t = k / passos, aneis = [...I.quadro(a.fns, t), ...a.estaticosFn(t).map((P) => P[0])];
      const s = I.sobreposicao(aneis), esperado = (1 - t) * U0 + t * U1, coberto = uniao(aneis);
      return { t, fracao: s.fracao, invalidos: s.invalidos, vao: esperado > 0 && Number.isFinite(coberto) ? Math.max(0, esperado - coberto) / esperado : 0 };
    });
    cacheMedidas.set(a.fns, m);
    return m;
  }

  // ------------------------------------------------------------------ desenho: plano (quadro 0–100) ou sobre o fundo de mapa
  const escuro = () => document.documentElement.dataset.theme === "dark" ||
    (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const invGeo = (g) => { const pr = d3.geoAzimuthalEqualArea().rotate([-g.lon0, -g.lat0]).scale(g.k).translate([0, 0]);
    return ([X, Y]) => pr.invert([X / g.esc + g.x0, Y / g.esc + g.y0]); };
  const temFundo = (c) => !!(c && c.geo && window.maplibregl);
  /** Plano de desenho. Sem fundo: SVG no quadro 0–100. Com fundo (casos reais, est.fundo = 1): mapa MapLibre com o
   *  fundo do laboratório (OpenFreeMap/OSM) e o SVG por cima; as formas voltam a lon/lat (invGeo) e são projetadas pelo mapa. */
  function plano(c, { rotulo = "", fundo = false } = {}) {
    const geo = fundo && est.fundo === "1" && temFundo(c);
    const svg = d3.create("svg").attr("class", "plano").attr("role", "img").attr("aria-label", rotulo);
    const p = { svg, fundo: svg.append("g"), ref: svg.append("g"), formas: svg.append("g"), extra: svg.append("g"), rotulos: svg.append("g"),
                pj: (q) => q, pronto: true, tarefas: new Map(), geo };
    p.quando = (chave, fn) => { p.tarefas.set(chave, fn); if (p.pronto) fn(); };
    p.d = (r) => `M${r.map((q) => p.pj(q).map((v) => +v.toFixed(2)).join(",")).join("L")}Z`;
    p.dP = (P) => P.map(p.d).join("");
    p.desenharRef = (cc) => p.quando("ref", () => {
      p.ref.selectAll("path.o").data(cc.origem).join("path").attr("class", "o").attr("d", p.dP).attr("fill", "none").attr("stroke", corO())
        .attr("stroke-width", 1.2).attr("vector-effect", "non-scaling-stroke").attr("fill-rule", "evenodd");
      p.ref.selectAll("path.t").data(cc.alvo).join("path").attr("class", "t").attr("d", p.dP).attr("fill", "none").attr("stroke", corT())
        .attr("stroke-width", 1.2).attr("stroke-dasharray", "4 3").attr("vector-effect", "non-scaling-stroke").attr("fill-rule", "evenodd");
    });
    p.desenharRef(c);
    if (!geo) { svg.attr("viewBox", "-3 -3 106 106"); p.no = svg.node(); return p; }
    p.pronto = false;
    const inv = invGeo(c.geo);
    const cantos = [[0, 0], [100, 0], [0, 100], [100, 100]].map(inv);
    const limites = [[d3.min(cantos, (q) => q[0]), d3.min(cantos, (q) => q[1])], [d3.max(cantos, (q) => q[0]), d3.max(cantos, (q) => q[1])]];
    const div = el("div", { class: "plano-mapa" }), caixa = el("div", { class: "plano-geo" }, div, svg.node());
    p.no = el("div", {}, caixa, el("p", { class: "atribuicao", text: "© OpenFreeMap · © colaboradores do OpenStreetMap" }));
    const semFundo = () => { svg.attr("viewBox", "-3 -3 106 106"); p.pj = (q) => q; p.pronto = true; p.tarefas.forEach((fn) => fn()); };
    requestAnimationFrame(() => {
      try {
        const mapa = new maplibregl.Map({ container: div, style: `https://tiles.openfreemap.org/styles/${escuro() ? "dark" : "positron"}`,
          interactive: false, attributionControl: false, bounds: limites, fitBoundsOptions: { padding: 10 } });
        caixa._mapa = mapa;
        const ajustar = () => {
          svg.attr("viewBox", `0 0 ${div.clientWidth} ${div.clientHeight}`);
          p.pj = (q) => { const s = mapa.project(inv(q)); return [s.x, s.y]; };
          p.pronto = true;
          p.tarefas.forEach((fn) => fn());
        };
        mapa.on("load", () => { mapa.resize(); mapa.fitBounds(limites, { padding: 10, animate: false }); ajustar(); });
        new ResizeObserver(() => { if (div.clientWidth && Math.abs(mapa.getCanvas().clientHeight - div.clientHeight) > 1) mapa.resize(); }).observe(div);
        mapa.on("resize", () => { mapa.fitBounds(limites, { padding: 10, animate: false }); if (p.pronto) ajustar(); });
      } catch (e) { semFundo(); }
    });
    return p;
  }
  const limparMapas = (no) => no.querySelectorAll(".plano-geo").forEach((c) => { try { c._mapa?.remove(); } catch (e) { /* já removido */ } });
  const ajustarMapas = (no) => no.querySelectorAll(".plano-geo").forEach((c) => c._mapa?.resize());
  const rotulo = (p, q, texto, classe = "rotulo") => p.quando(`rot-${texto}-${q}`, () => {
    p.rotulos.selectAll("text").filter(function () { return this.dataset.k === `${texto}-${q}`; }).remove();
    const [x, y] = p.pj(q);
    p.rotulos.append("text").attr("data-k", `${texto}-${q}`).attr("class", classe).attr("x", x).attr("y", y)
      .attr("text-anchor", "middle").attr("dominant-baseline", "middle").text(texto);
  });
  const ponto = (g, [x, y], cor, r = 1.1) => g.append("circle").attr("cx", x).attr("cy", y).attr("r", r).attr("fill", cor)
    .attr("stroke", tk("cor-superficie")).attr("stroke-width", 1.5).attr("vector-effect", "non-scaling-stroke");
  const preencher = (g, M, cor, op = 0.8) => g.append("path").attr("d", M.map((P) => P.map((r) => `M${r.join("L")}Z`).join("")).join(""))
    .attr("fill", cor).attr("fill-opacity", op).attr("fill-rule", "evenodd").attr("stroke", tk("cor-superficie")).attr("stroke-width", 1).attr("vector-effect", "non-scaling-stroke");
  const chaves = () => el("div", { class: "chaves" },
    el("span", {}, Object.assign(el("span", { class: "tr" }), { style: `border-color:${corO()}` }), T("origem")),
    el("span", {}, Object.assign(el("span", { class: "tr tracejado" }), { style: `border-color:${corT()}` }), T("alvo")));
  /** Formas de um quadro: preenchimento que vai da cor da Origem à do Alvo; sobreposições ficam mais escuras. */
  function desenharQuadro(p, aneis, t, estaticos = []) {
    p.quando("quadro", () => p.formas.selectAll("path").data([...aneis.map((r) => ({ d: p.d(r) })), ...estaticos.map((P) => ({ d: p.dP(P), est: true }))])
      .join("path").attr("d", (d) => d.d).attr("fill", (d) => (d.est ? tk("cor-texto-suave") : corT_t(t))).attr("fill-opacity", p.geo ? 0.72 : 0.6)
      .attr("stroke", tk("cor-superficie")).attr("stroke-width", 0.8).attr("vector-effect", "non-scaling-stroke"));
  }

  /** Tocador: botão animar/pausar + controle deslizante de t. Sem início automático. */
  function tocador(aoT, inicial = 0, { max = 1, duracao = 3000, rotulo = (v) => `t = ${num(v, 2)}` } = {}) {
    let t = inicial, quadroAnim = null;
    const saida = el("output", {});
    const faixa = el("input", { type: "range", min: 0, max, step: 0.01, value: t, "aria-label": T("quadro_t") });
    const botao = el("button", { type: "button", class: "botao", text: T("tocar") });
    const mostrar = (v) => { t = v; faixa.value = v; saida.textContent = rotulo(v); aoT(v); };
    const parar = () => { if (quadroAnim) cancelAnimationFrame(quadroAnim); quadroAnim = null; botao.textContent = T("tocar"); };
    faixa.addEventListener("input", () => { parar(); mostrar(+faixa.value); });
    botao.addEventListener("click", () => {
      if (quadroAnim) return parar();
      if (Lab.semMovimento()) return mostrar(t >= max ? 0 : max);
      const t0 = t >= max ? 0 : t, inicio = performance.now(), dur = duracao * (max - t0) / max;
      botao.textContent = T("pausar");
      const passo = (agora) => {
        const v = Math.min(max, t0 + ((agora - inicio) / dur) * (max - t0));
        mostrar(max === 1 ? d3.easeCubicInOut(v) : v);   // série encadeada: velocidade constante entre os anos
        if (v < max) quadroAnim = requestAnimationFrame(passo); else parar();
      };
      quadroAnim = requestAnimationFrame(passo);
    });
    requestAnimationFrame(() => mostrar(inicial));
    return { no: el("div", { class: "tocador" }, botao, faixa, saida), mostrar, t: () => t };
  }

  /** Curva de uma medida por quadro: uma série por variante (legenda e rótulo direto no pico quando há mais de uma),
   *  marcador no t atual e dica com os valores de todas as séries. */
  function curvaMedida(series_, campo, titulo) {
    const L = 600, A = 110, m = { t: 18, d: 12, b: 22, e: 44 };
    const x = d3.scaleLinear([0, 1], [m.e, L - m.d]);
    const maxV = d3.max(series_, (s) => d3.max(s.medidas, (d) => d[campo]));
    const y = d3.scaleLinear([0, Math.max(0.01, maxV * 1.15)], [A - m.b, m.t]).nice(3);
    const svg = d3.create("svg").attr("viewBox", `0 0 ${L} ${A}`).attr("role", "img").attr("aria-label", titulo);
    svg.append("g").attr("transform", `translate(0,${A - m.b})`).call(d3.axisBottom(x).ticks(5).tickFormat((v) => num(v, 2)).tickSizeOuter(0))
      .call((g) => g.selectAll("text").attr("font-size", 11).attr("fill", tk("cor-texto-secundario")))
      .call((g) => g.selectAll("line,path").attr("stroke", tk("cor-eixo")));
    svg.append("g").attr("transform", `translate(${m.e},0)`).call(d3.axisLeft(y).ticks(3).tickFormat((v) => pct(v, 1)).tickSize(-(L - m.e - m.d)))
      .call((g) => g.select(".domain").remove())
      .call((g) => g.selectAll("line").attr("stroke", tk("cor-grade")))
      .call((g) => g.selectAll("text").attr("font-size", 11).attr("fill", tk("cor-texto-secundario")));
    if (series_.length === 1) svg.append("path").datum(series_[0].medidas).attr("fill", series_[0].cor).attr("fill-opacity", 0.2)
      .attr("d", d3.area().x((d) => x(d.t)).y0(y(0)).y1((d) => y(d[campo])));
    series_.forEach((s) => svg.append("path").datum(s.medidas).attr("fill", "none").attr("stroke", s.cor).attr("stroke-width", 2)
      .attr("d", d3.line().x((d) => x(d.t)).y((d) => y(d[campo]))));
    if (series_.length > 1) {   // rótulo direto no pico de cada série; omitido se colidir ou se a série for nula
      const picos = series_.map((s) => ({ s, p: s.medidas.reduce((a, b) => (b[campo] > a[campo] ? b : a)) }));
      const colide = picos.some((a, k) => picos.some((b, j) => j > k && Math.abs(y(a.p[campo]) - y(b.p[campo])) < 14 && Math.abs(x(a.p.t) - x(b.p.t)) < 140));
      if (!colide) picos.filter(({ p }) => p[campo] > 1e-6).forEach(({ s, p }) => svg.append("text").attr("x", x(p.t)).attr("y", y(p[campo]) - 6)
        .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", tk("cor-texto-secundario")).text(s.rotulo));
    }
    const marca = svg.append("line").attr("y1", m.t).attr("y2", A - m.b).attr("stroke", tk("cor-texto")).attr("stroke-width", 1);
    svg.append("rect").attr("x", m.e).attr("y", 0).attr("width", L - m.e - m.d).attr("height", A).attr("fill", "transparent")
      .on("mousemove", (ev) => {
        const [px] = d3.pointer(ev), tt = Math.max(0, Math.min(1, x.invert(px)));
        Lab.mostrarDica(ev, `t = ${num(tt, 2)}`, series_.map((s) => {
          const d = s.medidas.reduce((a, b) => (Math.abs(b.t - tt) < Math.abs(a.t - tt) ? b : a));
          return `${series_.length > 1 ? `${s.rotulo}: ` : ""}${pct(d[campo], 2)}`;
        }));
      }).on("mouseleave", Lab.esconderDica);
    const notas = series_.map((s) => {
      const mx = s.medidas.reduce((a, b) => (b[campo] > a[campo] ? b : a)), inval = campo === "fracao" ? d3.sum(s.medidas, (d) => d.invalidos) : 0;
      const txt = mx[campo] > 1e-6 ? T("medida_max", { v: pct(mx[campo], 2), t: num(mx.t, 2) }) : T("medida_zero");
      return el("p", { class: "nota" }, series_.length > 1 ? `${s.rotulo}: ` : "", txt, inval ? ` ${T("invalidos", { n: inval })}` : "");
    });
    const legenda = series_.length > 1 ? el("div", { class: "chaves" }, ...series_.map((s) => Lab.chave(s.cor, s.rotulo))) : null;
    return { no: el("div", { class: "curva" }, el("p", { class: "titulo-curva", text: titulo }), legenda, svg.node(), ...notas),
             marcar: (t) => marca.attr("x1", x(t)).attr("x2", x(t)) };
  }

  /** Bloco de código: trecho de src/interpolacao.js (gerado das regiões #region), com os comentários destacados. */
  function blocoCodigo(...regioes) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const pre = el("pre", {});
    pre.innerHTML = regioes.map((r) => {
      const c = codigo[r];
      return `<span class="c">// ${esc(c.arquivo)}, linhas ${c.inicio}–${c.fim} · ${esc(c.ref)}</span>\n` +
        esc(c.texto).replace(/(\/\*\*[\s\S]*?\*\/|\/\/[^\n]*)/g, '<span class="c">$1</span>');
    }).join("\n\n");
    return el("details", { class: "codigo-passo", open: matchMedia("(min-width: 1100px)").matches ? "" : null },
      el("summary", {}, `</> ${T("codigo")} · ${T("codigo_arquivo")}`), pre);
  }
  const grade = (colTexto, ...regioes) => el("div", { class: "grade-passo" }, colTexto, el("div", { class: "col-codigo" }, blocoCodigo(...regioes)));
  const seloSituacao = (s) => el("span", { class: `situacao ${s}` }, { decidido: "✓", provisorio: "◐", aberto: "○", avaliacao: "◇" }[s], " ", T(`st_${s}`));

  /** Tabela alternativa: os pares da SPL, com as áreas de partida e de chegada (nomes, quando o caso tem). */
  function tabelaPares(c, r, rotuloLado = "") {
    const nomes = { O: c.nomes_origem, T: c.nomes_alvo };
    const nome = (lado, k) => (k === null ? "—" : nomes[lado] ? nomes[lado][k] : `${lado}${k + 1}`);
    const areaDe = (x) => (typeof x[0] === "number" ? 0 : I.areaMulti(x));
    const linhas = r.SPL.map((s) => [nome("O", s.i), nome("T", s.j), s.tipo, num(areaDe(s.de), 1), num(areaDe(s.para), 1)]);
    const t = Lab.tabela(["O", "T", est.lang === "pt" ? "tipo" : "type", est.lang === "pt" ? "área de partida" : "start area",
      est.lang === "pt" ? "área de chegada" : "end area"], linhas);
    return el("details", { class: "info" }, el("summary", {}, `${rotuloLado ? `${rotuloLado} · ` : ""}${T("pares", { n: r.SPL.length })} · ${est.lang === "pt" ? "tabela" : "table"}`), t);
  }

  // ------------------------------------------------------------------ figuras animadas (uma ou mais variantes lado a lado)

  /** Divisão de um polígono: partes coloridas, células de Voronoi, sementes e correspondentes tracejados. */

  /** Arquivos do leitor → caso no quadro 0–100: filtro, dissolução, partes, projeção, área mínima, simplificação. */
  function prepararDados(gjO, gjT, op) {
    const feicoes = (gj) => {

      const polis = (g) => (g.type === "Polygon" ? [g.coordinates] : g.coordinates);
      if (op.dissolver) {

      const [a, b] = [pts[0], pts[pts.length - 1]];
      for (let k = 1; k < pts.length - 1; k++) {
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-12;
        const d = Math.abs(dy * pts[k][0] - dx * pts[k][1] + b[0] * a[1] - b[1] * a[0]) / L;
        if (d > dmax) { dmax = d; idx = k; }
      }
      return dmax > tol ? [...dp(pts.slice(0, idx + 1), tol).slice(0, -1), ...dp(pts.slice(idx), tol)] : [a, b];
    };
    const tol = op.simplificar * Math.SQRT2 * 100;
    const simplificar = (L) => L.map((P) => P.map((r) => { const s = dp(r, tol); return s.length >= 4 ? s : r; }));
    O = simplificar(filtroArea(O)); Tt = simplificar(filtroArea(Tt));
    return { id: "usuario", titulo: { pt: "Seus dados", en: "Your data" }, ref: "", nota: { pt: "", en: "" }, origem: O, alvo: Tt, geo };
  }

  function s5() {
    const ler = async (arq) => {
      const nome = arq.name.toLowerCase();
      if (nome.endsWith(".zip")) { const g = await shp(await arq.arrayBuffer()); return Array.isArray(g) ? { type: "FeatureCollection", features: g.flatMap((x) => x.features) } : g; }
      return JSON.parse(await arq.text());
    };
    // passo 1: orientações e exemplos
    const exemplos = () => el("p", { class: "nota" }, T("d1_exemplos"), " ",
      ...[["pi9100", "origem", "serra-da-capivara-municipios-1991.geojson"], ["pi9100", "alvo", "serra-da-capivara-municipios-2000.geojson"],
        ...(series["desmat-labrea"] ? [["desmat-labrea", "origem", "labrea-desmatamento-2019.geojson"], ["desmat-labrea", "alvo", "labrea-desmatamento-2025.geojson"]] : [])]
        .flatMap(([id, lado, nome], k) => [k ? " · " : "", el("a", { href: "#", text: nome, onclick: (e) => {
          e.preventDefault();
          baixar(nome, "application/geo+json", exemploGeojson(id.startsWith("desmat") ? caso(id, "2019", "2025") : caso(id), lado));
        } })]));
    const passo1 = () => [el("ul", { class: "guia" }, ...[1, 2, 3, 4, 5].map((k) => el("li", { text: T(`d1_item${k}`) }))), exemplos(), el("p", { class: "nota", text: T("d1_erros") })];
    // passo 2: carregar e diagnosticar
    const diagO = el("div", {}), diagT = el("div", {}), diagPar = el("div", {});
    const atualizarDiag = () => { diagO.replaceChildren(...[diagnostico("origem")].filter(Boolean)); diagT.replaceChildren(...[diagnostico("alvo")].filter(Boolean)); diagPar.replaceChildren(...[diagnosticoPar()].filter(Boolean)); };
    const entrada = (lado) => el("label", {}, T(lado === "origem" ? "arq_origem" : "arq_alvo"),
      el("input", { type: "file", accept: ".zip,.geojson,.json", onchange: async (e) => {
        const arq = e.target.files[0];
        if (!arq) return;
        try { dadosLeitor[lado] = await ler(arq); dadosLeitor.nomes[lado] = arq.name; dadosLeitor.diag[lado] = lerFeicoes(dadosLeitor[lado]); }
        catch (erro) { dadosLeitor[lado] = null; dadosLeitor.diag[lado] = null; diagPar.replaceChildren(el("p", { class: "aviso", text: T("erro_arquivo", { e: erro.message || erro }) })); return; }
        atualizarDiag();
      } }));
    const passo2 = () => { atualizarDiag(); return [el("div", { class: "arquivos" }, entrada("origem"), entrada("alvo")), diagO, diagT, diagPar]; };
    // passo 3: limpeza e transformação
    const f = {
      filtro: el("input", { type: "text", placeholder: "UF=PI" }), dissolver: el("input", { type: "text", placeholder: "classe" }),
      areaMin: el("input", { type: "number", min: 0, max: 100, step: 0.1, value: 0 }), simplificar: el("input", { type: "number", min: 0, max: 5, step: 0.05, value: 0.1 }),
      corrigir: el("input", { type: "checkbox", checked: "" }), projecao: el("input", { type: "text", placeholder: "+proj=utm +zone=23 +south +ellps=GRS80 +units=m" }),
    };
    const avisoAplicar = el("div", {});
    const resultado = el("div", {}, el("p", { class: "nota", text: T("d5_antes") }));
    let quadroAtual = { t: 0, A: null };
    const mostrarResultado = () => {
      if (!casoUsuario) return;
      limparMapas(resultado);
      const refazer = () => { guardar(); mostrarResultado(); };
      const b = bancada(casoUsuario, ["s5cfgA", "s5cfgB", "s5b"], refazer, { aoQuadro: (t, A) => { quadroAtual = { t, A }; } });
      const exportar = el("div", { class: "exportar" },
        el("button", { type: "button", class: "botao", text: `↓ ${T("exp_pares")}`, onclick: () => {
          const r = executar(casoUsuario, cfgDe(est.s5cfgA, CFG_ARTIGO));
          const linhas = [["par", "i_origem", "j_alvo", "tipo"], ...r.SPL.map((s, k) => [k + 1, s.i === null ? "" : s.i + 1, s.j === null ? "" : s.j + 1, s.tipo])];
          baixar("pares-interpolacao.csv", "text/csv", linhas.map((l) => l.join(",")).join("\n"));
        } }),
        el("button", { type: "button", class: "botao", text: `↓ ${T("exp_quadro")}`, onclick: () => {
          const a = quadroAtual.A?.[0];
          if (!a) return;
          const inv = casoUsuario.geo ? invGeo(casoUsuario.geo) : (q) => q;
          const aneis = I.quadro(a.fns, quadroAtual.t);
          baixar(`quadro-t${quadroAtual.t.toFixed(2)}.geojson`, "application/geo+json", JSON.stringify({ type: "FeatureCollection",
            features: aneis.map((r, k) => ({ type: "Feature", properties: { forma: k + 1, t: +quadroAtual.t.toFixed(2) }, geometry: { type: "Polygon", coordinates: [[...r, r[0]].map(inv)] } })) }));
        } }),
        el("button", { type: "button", class: "botao", text: `↓ ${T("exp_svg")}`, onclick: () => {
          const svg = resultado.querySelector("svg.plano");
          if (!svg) return;
          const copia = svg.cloneNode(true);
          copia.setAttribute("xmlns", "http://www.w3.org/2000/svg");
          baixar(`quadro-t${quadroAtual.t.toFixed(2)}.svg`, "image/svg+xml", new XMLSerializer().serializeToString(copia));
        } }));
      resultado.replaceChildren(el("p", { class: "nota", text: T("resumo_dados", { o: casoUsuario.origem.length, t: casoUsuario.alvo.length }) }),
        el("div", { class: "controles" }, marcar(T("comparar_b"), "s5b", refazer), marcar(T("mostrar_eventos"), "s4ev", refazer), temFundo(casoUsuario) ? controleFundo(refazer) : null),
        b.paineis, b.fig, b.tabela, exportar);
    };
    const aplicar = el("button", { type: "button", class: "botao", text: T("aplicar"), onclick: () => {
      if (!dadosLeitor.origem || !dadosLeitor.alvo) { avisoAplicar.replaceChildren(el("p", { class: "aviso", text: T("faltam_arquivos") })); return; }
      try {
        casoUsuario = prepararDados(dadosLeitor.origem, dadosLeitor.alvo, { filtro: f.filtro.value.trim(), dissolver: f.dissolver.value.trim(),
          areaMin: +f.areaMin.value / 100, simplificar: +f.simplificar.value / 100, corrigir: f.corrigir.checked, projecao: f.projecao.value.trim() });
        avisoAplicar.replaceChildren();
        const d5 = document.getElementById("d5");
        d5.open = true;
        mostrarResultado();
        d5.scrollIntoView({ block: "start", behavior: Lab.semMovimento() ? "auto" : "smooth" });
      } catch (erro) { avisoAplicar.replaceChildren(el("p", { class: "aviso", text: T("erro_arquivo", { e: erro.message || erro }) })); }
    } });
    const passo3 = () => [el("div", { class: "limpeza" },
      el("label", {}, T("l_filtro"), f.filtro), el("label", {}, T("l_dissolver"), f.dissolver), el("label", {}, T("l_area_min"), f.areaMin),
      el("label", {}, T("l_simplificar"), f.simplificar), el("label", { class: "marcar" }, f.corrigir, " ", T("l_corrigir")),
      el("label", {}, T("l_projecao"), f.projecao)), aplicar, avisoAplicar];
    const passo4 = () => [el("p", { class: "nota", text: est.lang === "pt" ? "A configuração (A, e B se quiser comparar) fica junto do resultado, no passo 5, e pode ser trocada a qualquer momento: comece pela do artigo ou pela com ajustes." : "The configuration (A, and B if you want to compare) sits with the result, in step 5, and can be changed at any time: start from the paper's or the adjusted one." })];
    const d5 = el("details", { class: "sub", id: "d5" }, el("summary", {}, T("d5_titulo")), el("div", { class: "sub-corpo" }, resultado));
    d5.addEventListener("toggle", () => { if (d5.open) ajustarMapas(resultado); });
    if (casoUsuario) requestAnimationFrame(() => { d5.open = true; mostrarResultado(); });
    return secao("s5", T("s5_titulo"), T("s5_texto"), el("p", { text: T("s5_texto") }),
      sub("d1", T("d1_titulo"), passo1, { aberta: true }), sub("d2", T("d2_titulo"), passo2, { aberta: true }),
      sub("d3", T("d3_titulo"), passo3, { aberta: true }), sub("d4", T("d4_titulo"), passo4), d5);
  }

  // ------------------------------------------------------------------ 6. referências e o que mudou
  const s6 = () => secao("s6", T("s6_titulo"), T("s6_caixa"),
    el("p", { class: "caixa-ia", text: T("s6_caixa") }), el("p", { text: T("s6_texto") }), el("h3", { text: T("refs_titulo") }),
    el("ol", { class: "refs" }, ...refs.map((r) => el("li", {}, r.texto, r.link ? " " : null,
      r.link ? el("a", { href: r.link, target: "_blank", rel: "noopener", text: "↗" }) : null,
      /a conferir/.test(r.verificado || "") ? el("span", { class: "situacao avaliacao", style: "margin-left:6px" }, T("ref_conferir")) : null))));

  // ------------------------------------------------------------------ montagem
  function montar() {
    document.documentElement.lang = est.lang === "pt" ? "pt-BR" : "en";
    document.title = T("titulo");
    limparMapas(app);
    montadores.clear();
    montarCapa();
    app.replaceChildren(s1(), s2(), s3(), s4(), s5(), s6(), el("p", { class: "nota", text: T("rodape_nota") }));
    atualizarBotaoTudo();
  }
  // links internos abrem a seção de destino (e a subseção, se for o caso)
  document.addEventListener("click", (ev) => {
    const a = ev.target.closest('a[href^="#"]');
    if (!a || a.getAttribute("href").length < 2 || a.hasAttribute("data-metodologia") || a.getAttribute("href") === "#rodape") return;
    const alvo = document.getElementById(a.getAttribute("href").slice(1));
    const sec = alvo?.closest("section.acc");
    if (sec && !abertas.has(sec.id)) abrir(sec, true);
    if (alvo?.tagName === "DETAILS") alvo.open = true;
  });
  montar();
  if (base.metodologia) Lab.rodapePagina(base.metodologia, { linkAutor: { href: "https://cajazeiraalexandre.github.io/", texto: "Página do autor ↗" } });
  if (location.hash.length > 1 && !location.hash.includes("=")) {
    const alvo = document.querySelector(location.hash);
    const sec = alvo?.closest("section.acc");
    if (sec) abrir(sec, true);
    if (alvo?.tagName === "DETAILS") alvo.open = true;
    alvo?.scrollIntoView();
  }
})().catch((erro) => {
  document.getElementById("app").textContent = `Não foi possível carregar a página / Could not load the page: ${erro}`;
  console.error(erro); window.__erro = String(erro && erro.stack);
});

</script>
