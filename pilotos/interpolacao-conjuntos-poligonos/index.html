    onchange: (e) => { est[chave] = e.target.checked ? "1" : "0"; refazer(); } }), " ", rot));
  function s4conteudo(refazer) {
    const ehSerie = !!series[est.s4caso];
    const c = caso(est.s4caso, est.s4de, est.s4ate) || casosBase.exp3;
    const b = bancada(c, ["s4cfgA", "s4cfgB", "s4b"], refazer);
    return [el("div", { class: "controles" },
        Lab.seletor(T("caso"), CASOS_LIVRES(), ehSerie ? est.s4caso : c.id, (v) => { est.s4caso = v; refazer(); }),
        ehSerie ? seletorAnos(est.s4caso, c.de, c.ate, (a, b_) => { est.s4de = a; est.s4ate = b_; refazer(); }) : null,
        marcar(T("comparar_b"), "s4b", refazer), marcar(T("mostrar_eventos"), "s4ev", refazer), temFundo(c) ? controleFundo(refazer) : null),
      b.paineis, b.fig, b.tabela, c.nota?.[est.lang] ? el("p", { class: "nota", text: c.nota[est.lang] }) : null];
  }
  function s4() {
    const corpo = el("div", {});
    let feito = false;
    const refazer = () => { guardar(); limparMapas(corpo); const novo = s4conteudo(refazer).filter(Boolean); Lab.noLugar(() => corpo.replaceChildren(...novo)); };
    montadores.set("s4", () => { if (!feito) { feito = true; refazer(); } });
    const sec = secao("s4", T("s4_titulo"), T("s4_texto"), el("p", { class: "caixa-ia" }, T("s4_destaque"), " ", el("a", { href: "#s6", text: `${T("aviso_mais")} ↓` })),
      el("p", { text: T("s4_texto") }), corpo);
    if (abertas.has("s4")) montadores.get("s4")();
    return sec;
  }

  // ------------------------------------------------------------------ 5. seus dados
  const dadosLeitor = { origem: null, alvo: null, nomes: {}, diag: {} };
  /** Diagnóstico de um arquivo: feições, polígonos, vértices, buracos, coordenadas e extensão. */
  function lerFeicoes(gj) {
    const fs = gj.type === "FeatureCollection" ? gj.features : gj.type === "Feature" ? [gj] : [{ type: "Feature", properties: {}, geometry: gj }];
    const poli = fs.filter((x) => x.geometry && /Polygon$/.test(x.geometry.type));
    const partes = poli.flatMap((x) => (x.geometry.type === "Polygon" ? [x.geometry.coordinates] : x.geometry.coordinates));
    const todos = partes.flatMap((P) => P[0]);
    return { feicoes: fs.length, ignoradas: fs.length - poli.length, poligonos: partes.length,
      vertices: d3.sum(partes, (P) => d3.sum(P, (r) => r.length)), buracos: d3.sum(partes, (P) => P.length - 1),
      geografico: todos.length > 0 && todos.every(([x, y]) => Math.abs(x) <= 180 && Math.abs(y) <= 90),
      caixa: todos.length ? [d3.min(todos, (q) => q[0]), d3.min(todos, (q) => q[1]), d3.max(todos, (q) => q[0]), d3.max(todos, (q) => q[1])] : null };
  }
  function diagnostico(lado) {
    const d = dadosLeitor.diag[lado];
    if (!d) return null;
    return el("ul", { class: "diagnostico" }, ...[
      el("li", { text: `${dadosLeitor.nomes[lado]}: ${T("dg_feicoes", { n: d.feicoes })}; ${T("dg_poligonos", { n: d.poligonos })}; ${T("dg_vertices", { n: d.vertices.toLocaleString(loc()) })}; ${T("dg_buracos", { n: d.buracos })}` }),
      d.ignoradas ? el("li", { text: T("dg_ignoradas", { n: d.ignoradas }) }) : null,
      el("li", { text: d.geografico ? T("dg_crs_geo") : T("dg_crs_plano") }),
      d.poligonos > 300 ? el("li", { text: T("dg_muitos", { n: d.poligonos }) }) : null].filter(Boolean));
  }
  function diagnosticoPar() {
    const a = dadosLeitor.diag.origem?.caixa, b = dadosLeitor.diag.alvo?.caixa;
    if (!a || !b) return null;
    const area = (q) => Math.max(0, q[2] - q[0]) * Math.max(0, q[3] - q[1]);
    const inter = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])];
    const f = area(inter) / Math.max(1e-12, Math.min(area(a), area(b)));
    return f < 0.2 ? el("p", { class: "aviso", text: T("dg_regioes", { v: pct(f, 0) }) }) : null;
  }
  /** Exemplos para baixar: os casos reais em lon/lat (GeoJSON), com nomes quando houver. */
  function exemploGeojson(c, lado) {
    const inv = invGeo(c.geo), nomes = lado === "origem" ? c.nomes_origem : c.nomes_alvo;
    return JSON.stringify({ type: "FeatureCollection", features: c[lado].map((P, k) => ({ type: "Feature", properties: nomes ? { nome: nomes[k] } : { id: k + 1 },
      geometry: { type: "Polygon", coordinates: P.map((r) => [...r, r[0]].map((q) => inv(q).map((v) => +v.toFixed(6)))) } })) });
  }
  const baixar = (nome, tipo, texto) => { const a = el("a", { href: URL.createObjectURL(new Blob([texto], { type: tipo })), download: nome }); document.body.append(a); a.click(); a.remove(); };

  /** Arquivos do leitor → caso no quadro 0–100: filtro, dissolução, partes, projeção, área mínima, simplificação. */
  function prepararDados(gjO, gjT, op) {
    const feicoes = (gj) => {
      let fs = (gj.type === "FeatureCollection" ? gj.features : gj.type === "Feature" ? [gj] : [{ type: "Feature", properties: {}, geometry: gj }])
        .filter((x) => x.geometry && /Polygon$/.test(x.geometry.type));
      if (op.filtro.includes("=")) { const [k, v] = op.filtro.split("=").map((x) => x.trim()); fs = fs.filter((x) => String(x.properties?.[k]) === v); }
      const polis = (g) => (g.type === "Polygon" ? [g.coordinates] : g.coordinates);
      if (op.dissolver) {
        const grupos = d3.group(fs, (x) => x.properties?.[op.dissolver]);
        return [...grupos.values()].flatMap((g) => polygonClipping.union(...g.map((x) => polis(x.geometry))));
      }
      return fs.flatMap((x) => (op.corrigir ? polygonClipping.union(polis(x.geometry)) : polis(x.geometry)));
    };
    let O = feicoes(gjO), Tt = feicoes(gjT);
    // projeção: proj4 informada; geográficas → azimutal de áreas iguais centrada nos dados (MR0001, D7); planas → y invertido
    const todos = [...O, ...Tt].flatMap((P) => P[0]);
    const geografico = todos.every(([x, y]) => Math.abs(x) <= 180 && Math.abs(y) <= 90);
    let proj, geo = null;
    if (op.projecao) { const pr = proj4(op.projecao); proj = ([x, y]) => { const [a, b] = pr.forward([x, y]); return [a, -b]; }; }
    else if (geografico) {
      const lon = d3.mean(d3.extent(todos, (q) => q[0])), lat = d3.mean(d3.extent(todos, (q) => q[1]));
      const pr = d3.geoAzimuthalEqualArea().rotate([-lon, -lat]).scale(1000).translate([0, 0]);
      proj = (q) => pr(q);
      geo = { lon0: lon, lat0: lat, k: 1000 };
    } else proj = ([x, y]) => [x, -y];
    const projetar = (L) => L.map((P) => P.map((r) => r.map(proj)));
    O = projetar(O); Tt = projetar(Tt);
    // quadro 0–100 (mesma escala para os dois conjuntos)
    const [x0, y0, x1, y1] = I.caixaDe([...O, ...Tt]), esc = 100 / Math.max(x1 - x0, y1 - y0);
    if (geo) Object.assign(geo, { x0, y0, esc });
    const normal = (L) => L.map((P) => P.map((r) => r.map(([x, y]) => [(x - x0) * esc, (y - y0) * esc])));
    O = normal(O); Tt = normal(Tt);
    // área mínima e simplificação (Douglas–Peucker por anel)
    const maxA = d3.max([...O, ...Tt], I.area);
    const filtroArea = (L) => L.filter((P) => I.area(P) >= op.areaMin * maxA);
    const dp = (pts, tol) => {
      if (pts.length < 3) return pts;
      let dmax = 0, idx = 0;
      const [a, b] = [pts[0], pts[pts.length - 1]];
      for (let k = 1; k < pts.length - 1; k++) {
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-12;
        const d = Math.abs(dy * pts[k][0] - dx * pts[k][1] + b[0] * a[1] - b[1] * a[0]) / L;
        if (d > dmax) { dmax = d; idx = k; }
      }
      return dmax > tol ? [...dp(pts.slice(0, idx + 1), tol).slice(0, -1), ...dp(pts.slice(idx), tol)] : [a, b];
    };
    const tol = op.simplificar * Math.SQRT2 * 100;
    const simplificar = (L) => L.map((P) => P.map((r) => { const s = dp(r, tol); return s.length >= 4 ? s : r; }));
    O = simplificar(filtroArea(O)); Tt = simplificar(filtroArea(Tt));
    return { id: "usuario", titulo: { pt: "Seus dados", en: "Your data" }, ref: "", nota: { pt: "", en: "" }, origem: O, alvo: Tt, geo };
  }

  function s5() {
    const ler = async (arq) => {
      const nome = arq.name.toLowerCase();
      if (nome.endsWith(".zip")) { const g = await shp(await arq.arrayBuffer()); return Array.isArray(g) ? { type: "FeatureCollection", features: g.flatMap((x) => x.features) } : g; }
      return JSON.parse(await arq.text());
    };
    // passo 1: orientações e exemplos
    const exemplos = () => el("p", { class: "nota" }, T("d1_exemplos"), " ",
      ...[["pi9100", "origem", "serra-da-capivara-municipios-1991.geojson"], ["pi9100", "alvo", "serra-da-capivara-municipios-2000.geojson"],
        ...(series.desmat ? [["desmat", "origem", "serra-da-capivara-desmatamento-inicio.geojson"], ["desmat", "alvo", "serra-da-capivara-desmatamento-fim.geojson"]] : [])]
        .flatMap(([id, lado, nome], k) => [k ? " · " : "", el("a", { href: "#", text: nome, onclick: (e) => {
          e.preventDefault();
          baixar(nome, "application/geo+json", exemploGeojson(caso(id), lado));
        } })]));
    const passo1 = () => [el("ul", { class: "guia" }, ...[1, 2, 3, 4, 5].map((k) => el("li", { text: T(`d1_item${k}`) }))), exemplos(), el("p", { class: "nota", text: T("d1_erros") })];
    // passo 2: carregar e diagnosticar
    const diagO = el("div", {}), diagT = el("div", {}), diagPar = el("div", {});
    const atualizarDiag = () => { diagO.replaceChildren(...[diagnostico("origem")].filter(Boolean)); diagT.replaceChildren(...[diagnostico("alvo")].filter(Boolean)); diagPar.replaceChildren(...[diagnosticoPar()].filter(Boolean)); };
    const entrada = (lado) => el("label", {}, T(lado === "origem" ? "arq_origem" : "arq_alvo"),
      el("input", { type: "file", accept: ".zip,.geojson,.json", onchange: async (e) => {
        const arq = e.target.files[0];
        if (!arq) return;
        try { dadosLeitor[lado] = await ler(arq); dadosLeitor.nomes[lado] = arq.name; dadosLeitor.diag[lado] = lerFeicoes(dadosLeitor[lado]); }
        catch (erro) { dadosLeitor[lado] = null; dadosLeitor.diag[lado] = null; diagPar.replaceChildren(el("p", { class: "aviso", text: T("erro_arquivo", { e: erro.message || erro }) })); return; }
        atualizarDiag();
      } }));
    const passo2 = () => { atualizarDiag(); return [el("div", { class: "arquivos" }, entrada("origem"), entrada("alvo")), diagO, diagT, diagPar]; };
    // passo 3: limpeza e transformação
    const f = {
      filtro: el("input", { type: "text", placeholder: "UF=PI" }), dissolver: el("input", { type: "text", placeholder: "classe" }),
      areaMin: el("input", { type: "number", min: 0, max: 100, step: 0.1, value: 0 }), simplificar: el("input", { type: "number", min: 0, max: 5, step: 0.05, value: 0.1 }),
      corrigir: el("input", { type: "checkbox", checked: "" }), projecao: el("input", { type: "text", placeholder: "+proj=utm +zone=23 +south +ellps=GRS80 +units=m" }),
    };
    const avisoAplicar = el("div", {});
    const resultado = el("div", {}, el("p", { class: "nota", text: T("d5_antes") }));
    let quadroAtual = { t: 0, A: null };
    const mostrarResultado = () => {
      if (!casoUsuario) return;
      limparMapas(resultado);
      const refazer = () => { guardar(); mostrarResultado(); };
      const b = bancada(casoUsuario, ["s5cfgA", "s5cfgB", "s5b"], refazer, { aoQuadro: (t, A) => { quadroAtual = { t, A }; } });
      const exportar = el("div", { class: "exportar" },
        el("button", { type: "button", class: "botao", text: `↓ ${T("exp_pares")}`, onclick: () => {
          const r = executar(casoUsuario, cfgDe(est.s5cfgA, CFG_ARTIGO));
          const linhas = [["par", "i_origem", "j_alvo", "tipo"], ...r.SPL.map((s, k) => [k + 1, s.i === null ? "" : s.i + 1, s.j === null ? "" : s.j + 1, s.tipo])];
          baixar("pares-interpolacao.csv", "text/csv", linhas.map((l) => l.join(",")).join("\n"));
        } }),
        el("button", { type: "button", class: "botao", text: `↓ ${T("exp_quadro")}`, onclick: () => {
          const a = quadroAtual.A?.[0];
          if (!a) return;
          const inv = casoUsuario.geo ? invGeo(casoUsuario.geo) : (q) => q;
          const aneis = I.quadro(a.fns, quadroAtual.t);
          baixar(`quadro-t${quadroAtual.t.toFixed(2)}.geojson`, "application/geo+json", JSON.stringify({ type: "FeatureCollection",
            features: aneis.map((r, k) => ({ type: "Feature", properties: { forma: k + 1, t: +quadroAtual.t.toFixed(2) }, geometry: { type: "Polygon", coordinates: [[...r, r[0]].map(inv)] } })) }));
        } }),
        el("button", { type: "button", class: "botao", text: `↓ ${T("exp_svg")}`, onclick: () => {
          const svg = resultado.querySelector("svg.plano");
          if (!svg) return;
          const copia = svg.cloneNode(true);
          copia.setAttribute("xmlns", "http://www.w3.org/2000/svg");
          baixar(`quadro-t${quadroAtual.t.toFixed(2)}.svg`, "image/svg+xml", new XMLSerializer().serializeToString(copia));
        } }));
      resultado.replaceChildren(el("p", { class: "nota", text: T("resumo_dados", { o: casoUsuario.origem.length, t: casoUsuario.alvo.length }) }),
        el("div", { class: "controles" }, marcar(T("comparar_b"), "s5b", refazer), marcar(T("mostrar_eventos"), "s4ev", refazer), temFundo(casoUsuario) ? controleFundo(refazer) : null),
        b.paineis, b.fig, b.tabela, exportar);
    };
    const aplicar = el("button", { type: "button", class: "botao", text: T("aplicar"), onclick: () => {
      if (!dadosLeitor.origem || !dadosLeitor.alvo) { avisoAplicar.replaceChildren(el("p", { class: "aviso", text: T("faltam_arquivos") })); return; }
      try {
        casoUsuario = prepararDados(dadosLeitor.origem, dadosLeitor.alvo, { filtro: f.filtro.value.trim(), dissolver: f.dissolver.value.trim(),
          areaMin: +f.areaMin.value / 100, simplificar: +f.simplificar.value / 100, corrigir: f.corrigir.checked, projecao: f.projecao.value.trim() });
        avisoAplicar.replaceChildren();
        const d5 = document.getElementById("d5");
        d5.open = true;
        mostrarResultado();
        d5.scrollIntoView({ block: "start", behavior: Lab.semMovimento() ? "auto" : "smooth" });
      } catch (erro) { avisoAplicar.replaceChildren(el("p", { class: "aviso", text: T("erro_arquivo", { e: erro.message || erro }) })); }
    } });
    const passo3 = () => [el("div", { class: "limpeza" },
      el("label", {}, T("l_filtro"), f.filtro), el("label", {}, T("l_dissolver"), f.dissolver), el("label", {}, T("l_area_min"), f.areaMin),
      el("label", {}, T("l_simplificar"), f.simplificar), el("label", { class: "marcar" }, f.corrigir, " ", T("l_corrigir")),
      el("label", {}, T("l_projecao"), f.projecao)), aplicar, avisoAplicar];
    const passo4 = () => [el("p", { class: "nota", text: est.lang === "pt" ? "A configuração (A, e B se quiser comparar) fica junto do resultado, no passo 5, e pode ser trocada a qualquer momento: comece pela do artigo ou pela com ajustes." : "The configuration (A, and B if you want to compare) sits with the result, in step 5, and can be changed at any time: start from the paper's or the adjusted one." })];
    const d5 = el("details", { class: "sub", id: "d5" }, el("summary", {}, T("d5_titulo")), el("div", { class: "sub-corpo" }, resultado));
    d5.addEventListener("toggle", () => { if (d5.open) ajustarMapas(resultado); });
    if (casoUsuario) requestAnimationFrame(() => { d5.open = true; mostrarResultado(); });
    return secao("s5", T("s5_titulo"), T("s5_texto"), el("p", { text: T("s5_texto") }),
      sub("d1", T("d1_titulo"), passo1, { aberta: true }), sub("d2", T("d2_titulo"), passo2, { aberta: true }),
      sub("d3", T("d3_titulo"), passo3, { aberta: true }), sub("d4", T("d4_titulo"), passo4), d5);
  }

  // ------------------------------------------------------------------ 6. referências e o que mudou
  const s6 = () => secao("s6", T("s6_titulo"), T("s6_caixa"),
    el("p", { class: "caixa-ia", text: T("s6_caixa") }), el("p", { text: T("s6_texto") }), el("h3", { text: T("refs_titulo") }),
    el("ol", { class: "refs" }, ...refs.map((r) => el("li", {}, r.texto, r.link ? " " : null,
      r.link ? el("a", { href: r.link, target: "_blank", rel: "noopener", text: "↗" }) : null,
      /a conferir/.test(r.verificado || "") ? el("span", { class: "situacao avaliacao", style: "margin-left:6px" }, T("ref_conferir")) : null))));

  // ------------------------------------------------------------------ montagem
  function montar() {
    document.documentElement.lang = est.lang === "pt" ? "pt-BR" : "en";
    document.title = T("titulo");
    limparMapas(app);
    montadores.clear();
    montarCapa();
    app.replaceChildren(s1(), s2(), s3(), s4(), s5(), s6(), el("p", { class: "nota", text: T("rodape_nota") }));
    atualizarBotaoTudo();
  }
  // links internos abrem a seção de destino (e a subseção, se for o caso)
  document.addEventListener("click", (ev) => {
    const a = ev.target.closest('a[href^="#"]');
    if (!a || a.getAttribute("href").length < 2 || a.hasAttribute("data-metodologia") || a.getAttribute("href") === "#rodape") return;
    const alvo = document.getElementById(a.getAttribute("href").slice(1));
    const sec = alvo?.closest("section.acc");
    if (sec && !abertas.has(sec.id)) abrir(sec, true);
    if (alvo?.tagName === "DETAILS") alvo.open = true;
  });
  montar();
  if (base.metodologia) Lab.rodapePagina(base.metodologia, { linkAutor: { href: "https://cajazeiraalexandre.github.io/", texto: "Página do autor ↗" } });
  if (location.hash.length > 1 && !location.hash.includes("=")) {
    const alvo = document.querySelector(location.hash);
    const sec = alvo?.closest("section.acc");
    if (sec) abrir(sec, true);
    if (alvo?.tagName === "DETAILS") alvo.open = true;
    alvo?.scrollIntoView();
  }
})().catch((erro) => {
  document.getElementById("app").textContent = `Não foi possível carregar a página / Could not load the page: ${erro}`;
  console.error(erro); window.__erro = String(erro && erro.stack);
});

</script>
