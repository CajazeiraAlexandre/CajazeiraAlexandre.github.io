    return f;
  };

  // ------------------------------------------------------------ tabelas e quadros
  /** Tabela simples; colunas numéricas alinhadas à direita (detecção automática ou `numericas`).
   *  Célula pode ser texto ou lista de nós (ex.: [chip, "nome"]). */
  Lab.tabela = (cab, linhas, numericas = false) => {
    const ehNum = (c) => typeof c === "string" && /([\d—]|%|p\.p\.)$/.test(c.trim()) && /\d|—/.test(c);
    const num = cab.map((_, i) => i > 0 && (numericas || (linhas.length > 0 && linhas.every((l) => ehNum(l[i])))));
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, ...cab.map((c, i) => el("th", { class: num[i] ? "n" : null, scope: "col" }, ...(Array.isArray(c) ? c : [c]))))));
    t.append(el("tbody", {}, ...linhas.map((l) => el("tr", {}, ...l.map((c, i) => el("td", { class: num[i] ? "n" : null }, ...(Array.isArray(c) ? c : [c])))))));
    return t;
  };
  /** Tabela de dados — PADRÃO DE TODA TABELA DE DADOS DO LABORATÓRIO (design.yaml › padroes.tabelas; pesquisador,
   *  2026-10-12 e 2026-10-14):
   *  - ordenar ao clicar no cabeçalho (crescente → decrescente → ordem original); ordena pelos números sem formatação
   *    (`bruto`) ou, sem eles, pelo texto lido como número em pt-BR ("R$ 1,2 mi", "45,3%", "1.234"); "—" e "1 a 4" vão
   *    para o fim; linhas fixas (`fixas(i)`; padrão: a que começa com "Total") ficam sempre no fim;
   *  - até `limite` linhas visíveis (10) e "Mostrar todas as N";
   *  - "Baixar tabela (CSV)" na ordem da tela, com os números SEM formatação (`bruto`; sem ela, o texto das células):
   *    ";" como separador, vírgula decimal e BOM (abre no Excel);
   *  - filtro de linhas opcional: `filtro` "auto" (quando passa do limite), true ou false.
   *  `cat(i)`: id da linha para a Lab.legendaFoco. Aceita `tabela` (um <table> de Lab.tabela) no lugar de cab/linhas.
   *  `arquivo`: nome sem extensão, ou função (caixa) → nome, chamada no clique. `ordenar: false` para tabelas com
   *  hierarquia (linhas "dos quais"). */
  Lab.tabelaDados = ({ cab, linhas, tabela = null, bruto = null, arquivo = "tabela", limite = 10, numericas = false, cat = null,
    ordenar = true, filtro = "auto", fixas = null, barras = null, calor = null }) => {
    const t = tabela || Lab.tabela(cab, linhas, numericas);
    if (tabela) {   // tabela já montada (Lab.tabela): cabeçalho e linhas lidos do próprio elemento
      cab = [...t.tHead.rows[0].cells].map((c) => c.textContent);
      linhas = [...t.tBodies[0].rows].map((tr) => [...tr.cells].map((c) => c.textContent));
    }
    const tbody = t.tBodies[0];
    const norm = (x) => String(x).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const fixa = fixas || ((i) => /^total\b/i.test(String(linhas[i]?.[0]?.textContent ?? linhas[i]?.[0] ?? "").trim()));
    const R = [...tbody.rows].map((tr, i) => ({ tr, i, texto: norm(tr.textContent), fixa: !!fixa(i) }));
    if (cat) R.forEach((r) => { const c = cat(r.i); if (c !== undefined && c !== null) r.tr.dataset.cat = String(c); });
    // valor de ordenação de uma célula: número (do bruto ou lido do texto) ou texto; vazio → null (vai para o fim)
    const numTexto = (s) => {
      const x = String(s ?? "").trim();
      if (!x || /^(—|-|1 a 4)$/.test(x)) return null;
      const m = x.replace(/\s/g, " ").match(/^(R\$\s*)?([-−]?[\d.]+(,\d+)?)\s*(%|p\.p\.|mil|mi|bi)?\b/i);
      if (!m) return undefined;
      const v = Number(m[2].replace("−", "-").replaceAll(".", "").replace(",", "."));
      return v * ({ mil: 1e3, mi: 1e6, bi: 1e9 }[(m[4] || "").toLowerCase()] || 1);
    };
    const chave = (r, j) => {
      const b = bruto?.[r.i]?.[j];
      if (typeof b === "number") return b;
      const cel = r.tr.cells[j]?.textContent ?? "";
      const n = typeof b === "string" && b !== "" ? numTexto(b) : numTexto(cel);
      if (n === null) return null;
      return n === undefined ? norm(typeof b === "string" && b !== "" ? b : cel) : n;
    };
    // barra na célula (D15): proporcional ao maior valor da coluna; cor nas células (D16): escala comum às colunas (matrizes)
    const numDe = (r, j) => { const v = chave(r, j); return typeof v === "number" && Number.isFinite(v) ? v : null; };
    const corpoR = R.filter((r) => !r.fixa);
    for (const j of barras || []) {
      const max = Math.max(0, ...corpoR.map((r) => Math.abs(numDe(r, j) ?? 0)));
      if (max > 0) for (const r of corpoR) { const v = numDe(r, j), td = r.tr.cells[j]; if (v === null || !td) continue; td.classList.add("cel-barra"); td.style.setProperty("--p", `${(100 * Math.abs(v)) / max}%`); }
    }
    if (calor?.length) {
      const vs = corpoR.flatMap((r) => calor.map((j) => numDe(r, j))).filter((v) => v !== null), lo = Math.min(...vs), hi = Math.max(...vs);
      if (vs.length && hi > lo) for (const r of corpoR) for (const j of calor) { const v = numDe(r, j), td = r.tr.cells[j]; if (v === null || !td) continue; td.classList.add("cel-calor"); td.style.setProperty("--p", `${Math.round(6 + (50 * (v - lo)) / (hi - lo))}%`); }
    }
    let ordem = null, todas = false, termo = "";
    const longa = linhas.length > limite;
    const mais = longa ? el("button", { type: "button", class: "tabela-mais" }) : null;
    const contagem = el("span", { class: "nota" });
    const ordenadas = () => {
      const corpo = R.filter((r) => !r.fixa), fim = R.filter((r) => r.fixa);
      if (!ordem) return [...corpo, ...fim];
      const { j, dir } = ordem;
      const cmp = (a, b) => {
        const x = chave(a, j), y = chave(b, j);
        if (x === null && y === null) return a.i - b.i;
        if (x === null) return 1; if (y === null) return -1;
        const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR");
        return (c || a.i - b.i) * (c ? dir : 1);
      };
      return [...corpo.sort(cmp), ...fim];
    };
    const aplicar = () => {
      const L = ordenadas();
      tbody.replaceChildren(...L.map((r) => r.tr));
      let vis = 0;
      for (const r of L) { const casa = !termo || r.texto.includes(termo); const mostra = casa && (todas || termo || r.fixa || vis < limite); r.tr.hidden = !mostra; if (mostra && !r.fixa) vis++; }
      const casam = termo ? R.filter((r) => r.texto.includes(termo)).length : linhas.length;
      contagem.textContent = termo ? `${casam} de ${linhas.length} linhas` : longa && !todas ? `${limite} de ${linhas.length} linhas` : `${linhas.length} linhas`;
      if (mais) { mais.hidden = !!termo; mais.textContent = todas ? "Mostrar menos" : `Mostrar todas as ${linhas.length} linhas`; }
      if (ordenar) [...t.tHead.rows[0].cells].forEach((th, j) => th.setAttribute("aria-sort", ordem?.j === j ? (ordem.dir > 0 ? "ascending" : "descending") : "none"));
    };
    if (ordenar) [...t.tHead.rows[0].cells].forEach((th, j) => {
      const rot = [...th.childNodes];
      const bt = el("button", { type: "button", class: "tabela-ordenar", title: "Ordenar por esta coluna" }, ...rot, el("span", { class: "seta", "aria-hidden": "true" }));
      bt.addEventListener("click", () => {
        ordem = ordem?.j !== j ? { j, dir: th.classList.contains("n") ? -1 : 1 } : ordem.dir === (th.classList.contains("n") ? -1 : 1) ? { j, dir: -ordem.dir } : null;   // 3º clique: ordem original
        aplicar();
      });
      th.replaceChildren(bt);
    });
    mais?.addEventListener("click", () => { todas = !todas; aplicar(); });
    const csv = () => {
      const cel = (v) => { if (v === null || v === undefined) return ""; if (typeof v === "number") return String(Math.round(v * 1e6) / 1e6).replace(".", ","); const s = Array.isArray(v) ? v.map((n) => n.textContent ?? n).join(" ") : String(v?.textContent ?? v); return /[;"\n]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s; };
      const corpo = ordenadas().map((r) => (bruto || linhas)[r.i].map(cel).join(";"));
      const texto = "﻿" + [cab.map(cel).join(";"), ...corpo].join("\r\n");
      const a = el("a", { href: URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" })), download: `${typeof arquivo === "function" ? arquivo(caixa) : arquivo}.csv` });
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const comFiltro = filtro === true || (filtro === "auto" && longa);
    const busca = comFiltro ? el("input", { type: "search", class: "tabela-busca", placeholder: "Filtrar linhas…", "aria-label": "Filtrar linhas da tabela" }) : null;
    busca?.addEventListener("input", () => { termo = norm(busca.value.trim()); aplicar(); });
    const barra = el("div", { class: "tabela-barra" }, busca, contagem,
      el("button", { type: "button", class: "tabela-baixar", onclick: csv, title: "Na ordem da tela; números sem formatação, separador ponto e vírgula" }, "▦ Baixar tabela (CSV)"));
    aplicar();
    const caixa = el("div", { class: "tabela-dados" }, barra, el("div", { class: "rolagem" }, t), mais);
    return caixa;
  };
  /** Quadros com um número grande por item. itens: [{chave, rotulo, cor, valor}].
   *  Com `aoEscolher`, viram botões (o escolhido ganha a borda na cor do item). */
  Lab.quadros = (itens, { atual = null, aoEscolher = null, chaveDado = "Quadro", rotulo = "Escolha" } = {}) =>
    el("div", aoEscolher ? { class: "tiles", role: "group", "aria-label": rotulo } : { class: "tiles" }, ...itens.map((it) => {
      const corpo = [el("div", { class: "rot" }, Lab.chip(it.cor), it.rotulo), el("div", { class: "val", text: it.valor })];
      if (!aoEscolher) return el("div", { class: "tile" }, ...corpo);
      const b = el("button", { type: "button", class: "tile tile-botao", "aria-pressed": it.chave === atual, "data-chave": `${chaveDado}|${it.chave}`, onclick: () => aoEscolher(it.chave) }, ...corpo);
      b.style.setProperty("--cor-grupo", it.cor);
      return b;
    }));

  // ------------------------------------------------------------ barra 100% (composição)
  /** Uma linha de barra empilhada de 100%. segmentos: [{id?, cor, pct, texto, medio, curto, dica: [título, linhas]}]
   *  (`id` liga o segmento à Lab.legendaFoco).
   *  O rótulo encolhe (texto → medio → curto) ou sai quando não cabe: ver Lab.ajustarRotulos. */
  Lab.linhaBarra100 = ({ rotulo, segmentos, abaixo = null, aria = null }) => {
    const barra = el("div", { class: "barra", role: aria ? "img" : null, "aria-label": aria });
    for (const s of segmentos) {
      if (vazio(s.pct) || s.pct <= 0) continue;
      const sp = el("span"); sp.style.width = `${s.pct}%`; sp.style.background = s.cor;
      if (s.id !== undefined && s.id !== null) sp.dataset.cat = String(s.id);
      if (s.texto) { const b = el("b", { text: s.texto, "data-medio": s.medio || null, "data-curto": s.curto || null }); Lab.comHalo(b, s.cor); sp.append(b); }
      if (s.dica) { sp.addEventListener("pointermove", (ev) => Lab.mostrarDica(ev, s.dica[0], s.dica[1])); sp.addEventListener("pointerleave", Lab.esconderDica); }
      barra.append(sp);
    }
    return el("div", { class: "linha" }, el("span", { class: "rot", text: rotulo }), el("div", {}, barra, abaixo ? el("div", { class: "vazio", text: abaixo }) : null));
  };
  /** Rótulos de barra que não cabem: tenta a forma média, depois a curta; se nada couber, sai (fica na dica e na tabela). */
  Lab.ajustarRotulos = (raiz = Lab.cfg.raiz) => {
    const cabe = (b) => { const t = document.createElement("span"); t.textContent = b.textContent; t.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:600 12px var(--fonte-texto)";
      document.body.append(t); const ok = t.offsetWidth <= b.parentElement.clientWidth - 6; t.remove(); return ok; };
    for (const b of raiz.querySelectorAll(".barra span b")) {
      if (!b.isConnected || !b.parentElement.clientWidth) continue;   // fora da página ou em bloco fechado: mede depois (não apaga)
      if (cabe(b)) continue;
      if (b.dataset.medio) { b.textContent = b.dataset.medio; if (cabe(b)) continue; }
      if (b.dataset.curto) b.textContent = b.dataset.curto;
      if (!cabe(b)) b.remove();
    }
  };

  // ------------------------------------------------------------ eixos e atualização
  /** Eixo padronizado: linhas na cor de eixo, rótulos 12px secundários. Uso: g.call(d3.axisBottom(x)).call(Lab.eixo). */
  Lab.eixo = (g) => g.call((x) => x.selectAll("line,path").attr("stroke", token("cor-eixo")))
    .call((x) => x.selectAll("text").style("font-size", "12px").style("fill", token("cor-texto-secundario")));
  /** Atualiza no lugar: mantém altura, posição de rolagem e o foco do controle usado (data-chave). */
  Lab.noLugar = (fazer, raiz = Lab.cfg.raiz) => {
    const y = scrollY;
    const chave = document.activeElement?.dataset?.chave;
    raiz.style.minHeight = `${raiz.offsetHeight}px`;
    fazer();
    scrollTo(0, y);
    if (chave) raiz.querySelector(`[data-chave="${CSS.escape(chave)}"]`)?.focus({ preventScroll: true });
    requestAnimationFrame(() => { raiz.style.minHeight = ""; });
  };
  /** Desenha `fazer()` só quando `no` chega perto da tela (desempenho: mapas com milhares de unidades em seções
   *  fechadas não pesam no carregamento). Até lá, `no` guarda a altura `reserva` (px) para a rolagem não pular.
   *  Sem IntersectionObserver, desenha na hora. */
  Lab.quandoVisivel = (no, fazer, { margem = "400px", reserva = 420 } = {}) => {
    if (!("IntersectionObserver" in window)) { fazer(); return; }
    no.style.minHeight = `${reserva}px`;
    const io = new IntersectionObserver((es) => {
      if (!es.some((e) => e.isIntersecting)) return;
      io.disconnect(); no.style.minHeight = ""; fazer();
    }, { rootMargin: margem });
    io.observe(no);
  };
  /** Largura útil de um gráfico na raiz (entre 320 px e `max`). */
  Lab.largura = (max) => Math.max(320, Math.min(max, Lab.cfg.raiz.clientWidth - 34));
  Lab.estreito = () => Lab.cfg.raiz.clientWidth < 600;
})();

/* ==== web/componentes/lab-selecao.js ==== */
/* lab-selecao.js — seleção de unidades (clique no mapa, no gráfico ou na busca). ADR L0003.
 *
 * Cada bloco (um mapa e o gráfico ligado a ele, ou um gráfico sozinho) marca-se com
 * data-escopo="nome" e tem a sua seleção: selecionar num bloco não afeta os outros.
 * As marcas selecionáveis levam data-u="<id>". A seleção fica só na memória da página.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const selecoes = new Map();   // escopo → unidade
  const paineis = [];           // [escopo, atualizar, chave?] — registrados a cada desenho
  Lab.selecoes = selecoes;

  /** Escopo de um nó (o data-escopo mais próximo) ou o próprio nome, se for texto. */
  Lab.escopoDe = (n) => (typeof n === "string" ? n : n?.closest?.("[data-escopo]")?.dataset.escopo || "geral");
  Lab.selecaoDe = (n) => selecoes.get(Lab.escopoDe(n)) || "";
  /** Seleciona `u` no bloco de `noh` (clicar de novo desfaz); `u` vazio limpa a seleção do bloco. */
  Lab.selecionar = (u, noh) => {
    const esc = Lab.escopoDe(noh);
    if (u && selecoes.get(esc) !== u) selecoes.set(esc, u); else selecoes.delete(esc);
    Lab.aplicarSelecao(esc);
  };
  /** Marca .selecionado nas marcas do bloco, traz a selecionada para a frente e atualiza os painéis. */
  Lab.aplicarSelecao = (esc) => {
    const u = selecoes.get(esc) || "";
    for (const bloco of Lab.cfg.raiz.querySelectorAll(`[data-escopo="${CSS.escape(esc)}"]`)) {
      for (const n of bloco.querySelectorAll("[data-u]")) {
        const sim = Boolean(u) && n.dataset.u === u;
        n.classList.toggle("selecionado", sim);
        if (sim && n.parentNode) n.parentNode.appendChild(n);   // por cima dos vizinhos
      }
      for (const sv of bloco.querySelectorAll("svg")) sv.classList.toggle("com-selecao", Boolean(u) && Boolean(sv.querySelector(".selecionado")));
    }
    for (const [e, atualizar] of paineis) if (e === esc) atualizar();
  };
  /** Reaplica todas as seleções (chamar depois de redesenhar a página). */
  Lab.aplicarSelecoes = () => { for (const esc of selecoes.keys()) Lab.aplicarSelecao(esc); };
  /** Registra um painel; com `chave`, substitui o registro anterior da mesma chave (redesenho não acumula). */
  Lab.registrarPainel = (esc, atualizar, chave = null) => {
    const reg = chave ? paineis.find((p) => p[2] === chave) : null;
    if (reg) reg[1] = atualizar; else paineis.push([esc, atualizar, chave]);
  };
  /** Esquece os painéis (chamar no início de cada redesenho da página). */
  Lab.limparPaineis = () => { paineis.length = 0; };

  /** Conteúdo do painel da unidade: nome, linhas de dados, "Ver ficha" (opcional) e "Limpar seleção". */
  Lab.conteudoPainel = (painel, { u, nome, linhas, abrir = null, rotuloAbrir = "Ver ficha →", esc, acoes = [] }) =>
    painel.replaceChildren(el("b", { text: nome }), ...linhas.filter(Boolean).map((t) => el("span", { text: t })),
      el("div", { class: "acoes-sel" },
        abrir ? el("button", { type: "button", class: "voltar", text: rotuloAbrir, onclick: () => abrir(u) }) : null, ...acoes.filter(Boolean),
        el("button", { type: "button", class: "voltar", text: "Limpar seleção", onclick: () => Lab.selecionar("", esc) })));

  /** Painel da unidade selecionada sob um gráfico. Em telas largas, dentro de .grade2 (mapa ao lado), fica oculto
   *  por CSS; no celular aparece logo abaixo do gráfico tocado. opts: {nome(u), dica(u) → linhas, abrir(u), rotuloAbrir}. */
  Lab.painelGrafico = (alvo, { nome, dica, abrir = null, rotuloAbrir } = {}) => {
    const painel = el("div", { class: "painel-sel painel-grafico", "aria-live": "polite" });
    alvo.append(painel);
    const esc = Lab.escopoDe(alvo);
    const atualizar = () => {
      const u = selecoes.get(esc) || "";
      const existe = u && alvo.querySelector(`[data-u="${CSS.escape(u)}"]`);
      painel.hidden = !existe;
      if (existe) Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: dica(u), abrir, rotuloAbrir, esc });
    };
    Lab.registrarPainel(esc, atualizar);
    atualizar();
    return painel;
  };

  /** Destaque ligado: passar o mouse numa unidade acende a mesma unidade em todos os gráficos da grade. */
  Lab.ligarDestaque = (grade) => {
    const acender = (ev, sim) => { const u = ev.target.closest("[data-u]")?.dataset.u; if (u) for (const n of grade.querySelectorAll(`[data-u="${CSS.escape(u)}"]`)) n.classList.toggle("ligado", sim); };
    grade.addEventListener("pointerover", (ev) => acender(ev, true));
    grade.addEventListener("pointerout", (ev) => acender(ev, false));
  };
})();

/* ==== web/componentes/lab-escalas.js ==== */
/* lab-escalas.js — escalas de tamanho e legendas de cor. ADR L0003.
 *
 * Regras (design.yaml › padroes): legendas de escala ocupam ~70% da largura do gráfico; nos mapas
 * ficam logo abaixo do desenho; texto da legenda em tinta de texto, nunca na cor da série.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Escala de área (raiz) com teto "fora de escala": se a maior unidade tem mais de 3× o valor da segunda,
   *  a escala vai até a segunda e a maior fica no tamanho máximo, com contorno tracejado (decisão de 2026-10-06). */
  Lab.escalaArea = (valores, rMax) => {
    const ord = valores.filter((v) => v > 0).sort((a, b) => b - a);
    const fora = ord.length > 2 && ord[0] > 3 * ord[1];
    const teto = fora ? ord[1] : ord[0] || 1;
    const s = d3.scaleSqrt().domain([0, teto]).range([0, rMax]).clamp(true);
    return { s, teto, fora: (v) => fora && v > teto };
  };
  /** Nota sob o gráfico com as unidades fora de escala. Sem unidades, devolve "" (pode ir direto em append:
   *  o append nativo escreveria "null"). */
  Lab.notaFora = (nomes) => (nomes.length ? el("p", { class: "nota", text: `Fora de escala (contorno tracejado): ${nomes.join(", ")}. O valor é mais de três vezes o da segunda maior unidade; o círculo fica no tamanho máximo para não esmagar os demais.` }) : "");

  /** Legenda de tamanho: três círculos de referência ("Área ∝ …"). */
  Lab.legendaTamanho = (escalaR, rotuloTamanho) => {
    const max = escalaR.domain()[1];
    const ref = d3.ticks(0, max, 3).filter((v) => v > 0).slice(-3);
    const H = 2 * escalaR(d3.max(ref)) + 22;
    const svg = d3.create("svg").attr("width", 260).attr("height", H).attr("role", "img").attr("aria-label", `Legenda de tamanho: ${ref.map((v) => Lab.fmtInt.format(v)).join(", ")}`);
    let x = 4;
    for (const v of ref) {
      const r = escalaR(v), cx = x + Math.max(r, 26);
      svg.append("circle").attr("cx", cx).attr("cy", H - 4 - r).attr("r", r).attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario"));
      svg.append("text").attr("x", cx).attr("y", H - 6 - 2 * r).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", Lab.token("cor-texto-secundario")).text(Lab.fmtInt.format(v));
      x += Math.max(2 * r, 52) + 10;
    }
    svg.attr("width", x + 4);   // largura conforme os círculos (não corta o maior)
    return el("div", { class: "legenda" }, el("span", { text: `Área ∝ ${rotuloTamanho}` }), svg.node());
  };

  /** Rampa de cores (quadros iguais). */
  Lab.rampa = (cores) => el("span", { class: "rampa" }, ...cores.map((c) => { const s = el("span"); s.style.background = c; return s; }));
  /** Escala contínua: rampa na largura toda e rótulos das pontas embaixo (sequencial ou divergente). */
  Lab.legendaRampa = (cores, esquerda, direita) => el("div", { class: "legenda legenda-larga" }, el("span", { text: esquerda }), Lab.rampa(cores), el("span", { text: direita }));
  /** Escala divergente com três marcos: início, centro (neutro) e fim. */
  Lab.legendaTres = (cores, inicio, centro, fim) => el("div", { class: "legenda legenda-tres" }, Lab.rampa(cores), el("span", { text: inicio }), el("span", { text: centro }), el("span", { text: fim }));
  /** Legenda de classes por categoria: uma linha por categoria, quadros de largura fixa com a faixa escrita sobre a cor.
   *  linhas: [{nome, cores: [uma por classe]}] · rotulos: texto de cada classe ("< 40%", "40–50%"…). */
  Lab.legendaClasses = (linhas, rotulos, aria) => {
    const caixa = el("div", { class: "legenda-intensidade", role: "img", "aria-label": aria || `Legenda: ${rotulos.join(", ")}` });
    for (const l of linhas) {
      caixa.append(el("span", { class: "nome", text: l.nome.replaceAll("/", "/​") }));   // quebra após "/" no celular
      l.cores.forEach((cor, i) => { const q = el("span", { class: "quadro", text: rotulos[i] }); q.style.background = cor; Lab.comHalo(q, cor); caixa.append(q); });
    }
    return caixa;
  };
  /** Legenda que filtra/foca (design.yaml › padroes.legendas; pesquisador, 2026-10-12 — o mesmo recurso da Visualização,
   *  Q-079): passar o mouse destaca a categoria em `alvo` (segmentos e linhas com data-cat; os demais esmaecem); tocar fixa
   *  e leva a categoria para a base das barras 100% (à esquerda); tocar de novo desfaz. itens: [[cor, texto, id]].
   *  `alvo`: elemento ou função que o devolve (ex.: o cartão inteiro, para acender também as linhas da tabela). */
  Lab.legendaFoco = (itens, alvo_, ...extras) => {
    let fixa = null;
    const A = () => (typeof alvo_ === "function" ? alvo_() : alvo_);
    const leg = el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Categorias: passe o mouse ou toque para destacar" });
    const ordem = new Map();
    const reordenar = () => {
      for (const barra of A().querySelectorAll(".barra")) {
        const sps = [...barra.children];
        if (!ordem.has(barra)) ordem.set(barra, sps);
        const orig = ordem.get(barra);
        const lista = fixa === null ? orig : [...orig.filter((s) => s.dataset.cat === fixa), ...orig.filter((s) => s.dataset.cat !== fixa)];
        barra.replaceChildren(...lista);
      }
    };
    const aplicar = (id) => {
      const foco = id ?? fixa;
      for (const n of A().querySelectorAll("[data-cat]")) { n.classList.toggle("esmaecido", foco !== null && n.dataset.cat !== foco); n.classList.toggle("em-foco", foco !== null && n.dataset.cat === foco); }
      leg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.foco === fixa)));
    };
    leg.append(...itens.map(([cor, texto, id]) => {
      const am = el("span", { class: "amostra" }); am.style.background = cor;
      return el("button", { type: "button", class: "item-legenda", "data-foco": String(id), "aria-pressed": "false",
        onpointerenter: () => aplicar(String(id)), onpointerleave: () => aplicar(null), onfocus: () => aplicar(String(id)), onblur: () => aplicar(null),
        onclick: () => { fixa = fixa === String(id) ? null : String(id); reordenar(); aplicar(null); } }, am, texto);
    }), ...extras);
    return leg;
  };
  /** Legenda de classes de um MAPA que destaca no desenho (design.yaml › padroes.legendas: "interativa quando os itens
   *  correspondem a elementos do gráfico"; projeto cultura, 2026-10-15): passar o mouse ou o foco num item esmaece as
   *  unidades das outras classes; tocar fixa; tocar de novo desfaz. itens: [[cor, texto]] · mapa: função que devolve o
   *  objeto de Lab.mapa (criado depois da legenda) · classeDe(id) → índice do item da unidade (null = sem dado). */
  Lab.legendaMapa = (itens, mapa, classeDe, ...extras) => {
    let fixa = null;
    const leg = el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Classes do mapa: passe o mouse ou toque para destacar" });
    const aplicar = (i) => {
      const foco = i ?? fixa, m = mapa();
      if (m) m.atualizar({ opacidade: foco === null ? null : (id) => (classeDe(id) === foco ? 1 : 0.15) }, { animar: false });
      leg.querySelectorAll("button").forEach((b, j) => { b.setAttribute("aria-pressed", String(fixa === j)); b.classList.toggle("apagada", foco !== null && j !== foco); });
    };
    leg.append(...itens.map(([cor, texto], i) => {
      const am = el("span", { class: "amostra" }); am.style.background = cor;
      return el("button", { type: "button", class: "item-legenda", "aria-pressed": "false",
        onpointerenter: () => aplicar(i), onpointerleave: () => aplicar(null), onfocus: () => aplicar(i), onblur: () => aplicar(null),
        onclick: () => { fixa = fixa === i ? null : i; aplicar(null); } }, am, texto);
    }), ...extras);
    return leg;
  };
  /** Legenda categórica: amostra + nome, na ordem fixa das categorias. itens: [[cor, texto]]. */
  Lab.legendaCategorias = (itens, ...extras) => el("div", { class: "legenda" }, ...itens.map(([cor, texto]) => Lab.chave(cor, texto)), ...extras);
})();

/* ==== web/componentes/lab-mapa.js ==== */
/* lab-mapa.js — mapa coroplético com alternativa em círculos proporcionais (cartograma de Dorling). ADR L0003, L0006.
 *
 * Anatomia (design.yaml › padroes.mapa): barra sem fundo no topo (busca à esquerda, Mapa | Círculos à
 * direita) → desenho (com controles + − ⟲ no canto) → card da unidade selecionada → legendas → notas.
 * Lacunas em hachura (nunca cinza liso). Fora de escala: rótulo na margem esquerda com linha de ligação.
 *
 * Camadas (de baixo para cima — L0006): fundo opcional (raster Esri cinza ou vetorial OpenFreeMap) → referência
 * (UFs vizinhas, do IBGE; funciona offline) → unidades → limites finos (sobreposicao) → rótulos de referência →
 * seleção e foco.
 *
 * const m = Lab.mapa(alvo, {
 *   contornos,            // FeatureCollection; properties.id = chave da unidade
 *   sobreposicao,         // FeatureCollection fina desenhada por cima (ex.: municípios sob regiões) — opcional
 *   nome(id), preencher(id) → cor (token("cor-grade") = sem dado), dica(id) → linhas,
 *   abrir(id), rotuloAbrir, // botão do card (ex.: "Ver ficha do município →") — opcional
 *   rotuloAria, rotuloBusca,
 *   tamanho(id), rotuloTamanho,              // habilita Mapa | Círculos
 *   forma: { obter() → "mapa"|"bolhas", definir(v) },
 *   legenda,               // elemento de legenda de cor
 *   rotuloLacuna,          // texto da hachura na legenda (padrão: "sem dados"; ex.: "1 a 4 contemplados — sem números")
 *   detalhado,             // muitas unidades pequenas (padrão: mais de 60): raios menores
 *   // ---- L0006 (todos opcionais) ----
 *   camera,                // "estado" (padrão) | {foco: id | [ids], contexto: 1.5, margens?: [topo, pé]} | {centro: [lon, lat], zoom: k}
 *   zoom,                  // false desliga zoom e arrasto (padrão: ligado)
 *   referencia,            // FeatureCollection de contexto (UFs vizinhas) desenhada por baixo, em cinza
 *   rotulos,               // [{nome, coord: [lon, lat]}] — poucas cidades de referência
 *   fundo,                 // null (padrão) | "esri-cinza" | "vetorial" (OpenFreeMap; o modelo carrega o MapLibre)
 *   escalaBolhas,          // "ds" (padrão: fora de escala acima de 3× a segunda) | "fiel" (área sempre proporcional)
 *   compacto, dimensoes,   // story: sem barra, legendas e notas; desenho [W, H] ocupando o contêiner; card dentro do mapa
 *   opacidade(id), foco(id), aoClicar(id)   // opcionais: opacidade do preenchimento, contorno de foco, aviso do toque
 *   tocar(id) → true      // opcional: o toque/clique é do produto (ex.: abrir o nível de baixo) e não seleciona nem abre o card
 *   ajuste,                // FeatureCollection que define a projeção e o "estado" (padrão: a malha do primeiro desenho)
 *   cameraBolhas,          // câmera em que as unidades serão vistas (raios em px de tela; padrão: a câmera atual)
 * })
 * m.camera(camera, animar = true)  // move a câmera em voo (story: um enquadramento por cartão); devolve a duração (ms)
 * m.planoCamera(camera)            // {k0, k1, duracao, move}: o voo até `camera`, sem mover (coreografia do story)
 * m.dimensoes([W, H])              // compacto: o mesmo mapa num palco de outro tamanho, mantendo centro e zoom na tela
 * m.contornos(fc, parcial)         // troca a malha (ex.: territórios → municípios) no mesmo enquadramento, esmaecendo a antiga
 * m.atualizar({preencher, dica, opacidade, foco, nome}, {animar})   // troca cores e textos sem redesenhar
 * m.forma("mapa" | "bolhas", animar = true)                          // troca a forma (com a transição suave)
 * m.redesenhar()
 * Com ?editar=1 no endereço, o mapa mostra a câmera atual e "Copiar câmera" (para colar no roteiro de um story).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const DURACAO = 1400;      // ms, ida e volta (design.yaml › padroes.mapa_transicao)
  // Voo da câmera (proposta 2026-10-14, Q-093, em teste): trajetória de van Wijk & Nuij (d3.interpolateZoom — afasta,
  // atravessa e aproxima); a duração acompanha o tamanho do voo, entre VOO_MIN e VOO_MAX
  const VOO_MIN = 900, VOO_MAX = 2800, VOO_FATOR = 1.1;
  const DURACAO_MALHA = 650; // troca de malha no mesmo enquadramento: a antiga esmaece por cima da nova
  const MORPH_MAX = 600;     // acima disso, transição alternativa (morph de milhares de polígonos trava o navegador)
  // acima disso, os círculos ficam no centro de cada unidade, sobrepostos e translúcidos (símbolos proporcionais): afastá-los

        .classed("foco", (n) => Boolean(opts.foco?.(n.id)))
        .on("pointermove", (ev, n) => {   // a unidade selecionada já está no card: sem dica repetida por cima
          if (ev.pointerType !== "mouse" || (Lab.selecoes.get(esc) === n.id && !painel.hidden)) { Lab.esconderDica(); return; }
          Lab.mostrarDica(ev, nome(n.id), [...opts.dica(n.id), bolhas ? `${opts.rotuloTamanho}: ${Lab.fmtInt.format(opts.tamanho(n.id) || 0)}` : null]);
        })
        .on("pointerleave", Lab.esconderDica)
        .on("click", (ev, n) => { Lab.esconderDica(); if (opts.tocar?.(n.id)) return; Lab.selecionar(n.id, esc); opts.aoClicar?.(n.id); });
      const final = (n) => (bolhas ? caminhoCirculo(n.x, n.y, Math.max(n.r, 0.01)) : caminho(n.f));
      // Transição Mapa ⇄ Círculos (design.yaml › padroes.mapa_transicao): morph de cada unidade com flubber; sem
      // flubber ou com muitas unidades, transição alternativa (polígonos desbotam enquanto os círculos crescem a partir
      // do centro de cada unidade, e o inverso). Sem animação com prefers-reduced-motion (de = null).
      const morph = typeof flubber !== "undefined" && nos.length <= MORPH_MAX;
      if (de && opts.tamanho && sobrepor && !Lab.semMovimento()) {   // milhares de unidades: a troca é um esmaecimento do desenho inteiro
        formas.attr("d", final);
        d3.select(formas.node()?.parentNode).style("opacity", 0).transition().duration(450).ease(d3.easeCubicOut).style("opacity", 1);
        de = null;
      }
      if (de && opts.tamanho && typeof flubber === "undefined" && !avisouFlubber) {
        avisouFlubber = true;
        console.warn("lab-mapa: flubber ausente — transição Mapa ⇄ Círculos sem morph (inclua flubber 0.4 no modelo do produto).");
      }
      if (de && opts.tamanho && !morph) {
        const interp = (n, ida) => { const xi = d3.interpolateNumber(ida ? n.x0 : n.x, ida ? n.x : n.x0), yi = d3.interpolateNumber(ida ? n.y0 : n.y, ida ? n.y : n.y0),
          ri = d3.interpolateNumber(ida ? 0 : n.r, ida ? n.r : 0); return (t) => caminhoCirculo(xi(t), yi(t), Math.max(ri(t), 0.01)); };
        if (bolhas) {   // mapa → círculos: polígonos (fantasmas) desbotam; círculos crescem do centro de cada unidade
          const fantasmas = cena.insert("g", () => formas.node().parentNode).attr("pointer-events", "none");
          fantasmas.selectAll("path").data(nos).join("path").attr("d", (n) => caminho(n.f)).attr("fill", (n) => preencherH(n.id))
            .transition().duration(DURACAO).ease(d3.easeCubicInOut).style("opacity", 0).remove();
          formas.attr("d", (n) => caminhoCirculo(n.x0, n.y0, 0.01)).transition().duration(DURACAO).ease(d3.easeCubicInOut).attrTween("d", (n) => interp(n, true));
        } else {        // círculos → mapa: círculos (fantasmas) encolhem para o centro; polígonos surgem
          formas.attr("d", final).style("opacity", 0).transition().duration(DURACAO).ease(d3.easeCubicInOut).style("opacity", 1);
          const fantasmas = cena.append("g").attr("pointer-events", "none");
          fantasmas.selectAll("path").data(nos.filter((n) => n.r > 0)).join("path").attr("fill", (n) => preencherH(n.id))
            .attr("stroke", Lab.token("cor-superficie")).attr("stroke-width", 0.6)
            .transition().duration(DURACAO).ease(d3.easeCubicInOut).attrTween("d", (n) => interp(n, false)).style("opacity", 0).remove();
        }
      } else if (de && opts.tamanho) {
        // interpolações preparadas ANTES de a transição começar: com centenas de unidades o flubber leva perto de 1 s, e
        // dentro do attrTween esse tempo saía da própria transição (o morph aparecia só no fim). Segmentos maiores com
        // muitas unidades (2026-10-14, teste das transições de mapas)
        const seg = nos.length > 100 ? 7 : 4;
        const its = new Map(nos.map((n) => {
          const r = Math.max(n.r, 0.5);
          return [n.id, bolhas ? flubber.toCircle(anelPrincipal(n.f, caminho), n.x, n.y, r, { maxSegmentLength: seg })
                               : flubber.fromCircle(n.x, n.y, r, anelPrincipal(n.f, caminho), { maxSegmentLength: seg })];
        }));
        formas.attr("d", (n) => (bolhas ? anelPrincipal(n.f, caminho) : caminhoCirculo(n.x, n.y, Math.max(n.r, 0.01))))
          .transition().duration(DURACAO).ease(d3.easeCubicInOut)
          .attrTween("d", (n) => { const it = its.get(n.id); return (t) => (t < 1 ? it(t) : final(n)); });
      } else formas.attr("d", final);
      // fora de escala: rótulo na margem esquerda (área vazia), na altura do círculo, ligado por uma linha
      if (bolhas) {
        const gf = cena.append("g").attr("class", "rotulos-fora").attr("pointer-events", "none");
        // na margem esquerda do enquadramento em que as unidades são vistas (no mapa em níveis, de perto), em px de tela
        const kV = est.kV || 1, [vx0, vy0] = transformacaoCamera(opts.cameraBolhas || est.camera, est.geo).invert([0, 0]);
        nos.filter((n) => n.fora).sort((p, q) => p.y - q.y).forEach((n, i) => {
          const tx = vx0 + 10 / kV, ty = Math.max(vy0 + 16 / kV, n.y - 4 / kV + (i * 34) / kV);
          const t = gf.append("text").attr("class", "rotulo-fora").attr("x", tx).attr("y", ty);
          t.append("tspan").attr("x", tx).text(nome(n.id));
          t.append("tspan").attr("x", tx).attr("dy", "1.25em").text(`${Lab.fmtCompacto(opts.tamanho(n.id) || 0)} · fora de escala`);
          const larg = (t.node().getComputedTextLength ? t.node().getBBox().width : 110) / kV;
          const x0 = tx + larg + 6 / kV, x1 = n.x - n.r - 2 / kV;
          if (x1 > x0) gf.append("path").attr("d", `M${x0},${ty + 3 / kV} L${x1 - 6 / kV},${ty + 3 / kV} L${x1},${n.y}`)
            .attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario")).attr("stroke-width", 1).attr("vector-effect", "non-scaling-stroke");
        });
      }
      if (opts.sobreposicao && !bolhas) {
        cena.append("path").datum(opts.sobreposicao).attr("d", caminho).attr("fill", "none").attr("class", "sobreposicao")
          .attr("stroke", Lab.token("cor-texto")).attr("stroke-opacity", 0.12).attr("stroke-width", 0.3).attr("pointer-events", "none");
      }
      // rótulos de referência (poucas cidades), escondidos nos círculos (lá a posição é aproximada)
      const gRot = opts.rotulos && !bolhas ? cena.append("g").attr("class", "rotulos-ref").attr("pointer-events", "none") : null;
      if (gRot) gRot.selectAll("g").data(opts.rotulos).join((e) => {
        const g = e.append("g").attr("transform", (r) => `translate(${proj(r.coord)})`);
        g.append("circle").attr("r", 2.2);
        g.append("text").attr("x", 4).attr("y", -4).text((r) => r.nome);
        return g;
      });
      if (temLacuna || (bolhas && fc.features.some((f) => opts.preencher(f.properties.id) === semDado)))
        zonaLeg.append(el("div", { class: "legenda" }, el("span", { class: "chave" }, el("span", { class: "amostra hachura" }), opts.rotuloLacuna || "sem dados")));
      if (fundo) moldura.append(el("div", { class: "mapa-atribuicao", text: ATRIBUICAO[fundo] }));

      // ------------------------------------------------ card da unidade selecionada (clique ou busca)
      // computador: card flutuante perto da unidade; celular: logo abaixo do desenho, perto do toque (L0006)
      // compacto (story e bancada): o card encaixa no pé ou no alto do próprio mapa, do lado oposto à unidade
      const flutuante = !compacto && matchMedia("(hover: hover) and (pointer: fine)").matches;
      const painel = el("div", { class: `painel-sel${flutuante ? " flutuante" : compacto ? " rodape" : ""}`, "aria-live": "polite" });
      if (flutuante || compacto) moldura.append(painel); else alvo.insertBefore(painel, zonaLeg);
      const posicionarPainel = () => {
        if (!(flutuante || compacto) || painel.hidden) return;
        const sel = Lab.selecoes.get(esc) || "", n = nos.find((x) => x.id === sel);
        if (!n) return;
        const t = est.transform || d3.zoomIdentity, s = est.svg.clientWidth / W;
        const [px, py] = t.apply(bolhas ? [n.x, n.y] : [n.x0, n.y0]).map((v) => v * s);
        if (compacto) { painel.classList.toggle("topo", py > est.svg.clientHeight * 0.55); return; }
        const lw = painel.offsetWidth, lh = painel.offsetHeight, mw = moldura.clientWidth, mh = est.svg.clientHeight;
        let x = px + 16, y = py - lh / 2;
        if (x + lw > mw - 4) x = Math.max(4, px - lw - 16);
        y = Math.max(4, Math.min(mh - lh - 4, y));
        painel.style.left = `${x}px`; painel.style.top = `${y}px`;
      };
      const atualizarPainel = () => {
        const sel = Lab.selecoes.get(esc) || "";
        const u = sel && fc.features.some((f) => f.properties.id === sel) ? sel : null;
        painel.hidden = !u;
        if (!u) { busca.value = ""; return; }
        busca.value = nome(u);
        // compacto: "Aproximar" leva a câmera até a unidade (⟲ volta ao enquadramento do cartão)
        const aproximar = compacto && est.zoom ? el("button", { type: "button", class: "voltar", text: "⊕ Aproximar", onclick: () => {
          painel.classList.remove("topo");   // o card fica no pé; a unidade, na faixa livre acima dele

      Lab.registrarPainel(esc, atualizarPainel, alvo);   // um registro por mapa (o redesenho troca, não acumula)
      atualizarPainel();
      // troca de cores e textos sem redesenhar (story: o mesmo mapa muda de estado entre cartões)
      est.recolorir = (animar) => {
        temLacuna = false;

        formas.classed("foco", (n) => Boolean(opts.foco?.(n.id)));
        atualizarPainel();
      };
      if (alvo.isConnected) Lab.aplicarSelecao(esc);
      if (bolhas && !compacto) zonaLeg.append(Lab.legendaTamanho(escalaR, opts.rotuloTamanho));
      if (bolhas && !compacto) alvo.append(Lab.notaFora(nos.filter((n) => n.fora).map((n) => nome(n.id))),
        el("p", { class: "nota", text: "Círculos: cada um parte do centro da unidade e é afastado o mínimo para não se sobrepor; a posição é aproximada." }));

      // ------------------------------------------------ fundo raster: blocos visíveis no zoom atual
      const atualizarTiles = () => { if (gTiles) desenharBlocos(gTiles, proj, W, H, est.transform || d3.zoomIdentity, (est.svg.clientWidth || W) / W); };
      // ------------------------------------------------ fundo vetorial: centro e zoom do MapLibre = câmera do SVG

        const v = est.vetorial;

        if (!cw) return;
        v.caixa.style.width = `${cw}px`; v.caixa.style.height = `${ch}px`;
        v.caixa.style.opacity = bolhas ? 0 : 1;
        const t = est.transform || d3.zoomIdentity;

        const zoomML = Math.log2((2 * Math.PI * proj.scale() * t.k * (cw / W)) / 512);
        if (!v.mapa) {
          try {
            v.mapa = new maplibregl.Map({ container: v.caixa, style: estiloVetorial(), center: centro, zoom: zoomML, interactive: false, attributionControl: false, fadeDuration: 0 });

          }

      };

      // ------------------------------------------------ câmera, zoom e arrasto (L0006)
      const aplicar = (t) => {
        est.transform = t;
        cena.attr("transform", t);
        // rótulos e marcadores mantêm o tamanho na tela (descontados o zoom e a escala do desenho na página)
        const f = (W / (est.svg.clientWidth || W)) / t.k;
        cena.selectAll(".rotulos-ref text, .rotulo-fora").style("font-size", (d, i, n) => `${(n[i].classList.contains("rotulo-fora") ? 11 : 12) * f}px`)
          .style("stroke-width", `${3 * f}px`);
        cena.selectAll(".rotulos-ref text").attr("x", 4 * f).attr("y", -4 * f);
        cena.selectAll(".rotulos-ref circle").attr("r", 2.4 * f);
        const vistos = [];
        cena.selectAll(".rotulos-ref > g").each(function () {
          this.style.display = "";

          const bate = r.width && vistos.some((v) => r.left < v.right + 2 && r.right > v.left - 2 && r.top < v.bottom && r.bottom > v.top);
          if (bate) this.style.display = "none"; else if (r.width) vistos.push(r);

      const inicial = est.transform || transformacaoCamera(est.camera, est.geo);
      if (zoomAtivo) {
        const kE = transformacaoEstado(est.geo).k;

          .filter((ev) => {
            const k = (est.transform || d3.zoomIdentity).k;
            if (ev.type === "wheel") return ev.ctrlKey || ev.metaKey;           // roda sozinha rola a página
            if (ev.type.startsWith("touch")) return ev.touches.length > 1;   // um dedo nunca move o mapa (rola a página ou passa o cartão); dois dedos movem e ampliam (L0013)

            return !ev.button;

          .on("zoom", (ev) => aplicar(ev.transform))
          .on("end", () => atualizarTiles());

        const avisoRoda = el("div", { class: "mapa-aviso", hidden: "", text: textoRoda });
        moldura.append(avisoRoda);
        let tAviso = null;
        function avisar(t) { avisoRoda.textContent = t; avisoRoda.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(() => { avisoRoda.hidden = true; }, 1400); }
        svg.on("wheel.aviso", (ev) => { if (ev.ctrlKey || ev.metaKey) return; avisar(textoRoda); });

        svg.node().addEventListener("touchmove", (ev) => { if (ev.touches.length === 1 && (est.transform || d3.zoomIdentity).k > 1.01) avisar("Use dois dedos para mover o mapa"); }, { passive: true });
        const mover = (f) => { const s = d3.select(est.svg); (Lab.semMovimento() ? s : s.transition().duration(350)).call(f); };
        moldura.append(el("div", { class: "mapa-controles", role: "group", "aria-label": "Zoom do mapa" },
          el("button", { type: "button", "aria-label": "Ampliar", title: "Ampliar", text: "+", onclick: () => mover((s) => zoom.scaleBy(s, PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Reduzir", title: "Reduzir", text: "−", onclick: () => mover((s) => zoom.scaleBy(s, 1 / PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Voltar ao enquadramento inicial", title: "Voltar ao enquadramento", text: "⟲",
            onclick: () => api.camera(est.camera) })));
      } else {
        aplicar(inicial);
      }
      atualizarTiles();
      // modo de edição (?editar=1): mostra a câmera atual para copiar no roteiro
      if (editar) {
        const saida = el("code");
        const textoCamera = () => {
          const t = est.transform || d3.zoomIdentity, [lon, lat] = proj.invert(t.invert([W / 2, H / 2]));
          return `camera: {centro: [${lon.toFixed(3)}, ${lat.toFixed(3)}], zoom: ${t.k.toFixed(2)}}`;

          el("button", { type: "button", text: "Copiar câmera", onclick: async (ev) => {

    const api = {
      /** Move a câmera ("estado" | {foco, contexto} | {centro, zoom}) em voo (afasta, atravessa, aproxima), com duração
       *  proporcional ao caminho; sem animação com prefers-reduced-motion. Devolve a duração (ms). */
      camera(camera, animar = true, { base = true, malha = null } = {}) {
        // base: a câmera do cartão (para onde o ⟲ volta); "Aproximar" move sem trocar a base
        // malha: o foco é procurado nesta malha (a que vai entrar, quando o voo vem antes da troca de malha)
        if (base) est.camera = camera || "estado";
        if (!est.geo) return 0;
        const t = transformacaoCamera(camera || "estado", malha ? { ...est.geo, fc: malha } : est.geo);
        if (!est.zoom) { est.transform = t; desenhar(null); return 0; }
        const s = d3.select(est.svg), { duracao, move } = planoVoo(est.transform || d3.zoomIdentity, t, est.geo.W, est.geo.H);
        const animado = animar && move && !Lab.semMovimento();
        (animado ? s.transition().duration(duracao).ease(d3.easeCubicInOut) : s).call(est.zoom.transform, t);
        return animado ? duracao : 0;
      },
      /** O voo até `camera`, sem mover: {k0, k1, duracao, move} (o story escolhe a ordem: conteúdo antes ou depois). */
      planoCamera(camera, malha = null) {
        if (!est.geo) return { k0: 1, k1: 1, duracao: 0, move: false };
        return planoVoo(est.transform || d3.zoomIdentity, transformacaoCamera(camera || "estado", malha ? { ...est.geo, fc: malha } : est.geo), est.geo.W, est.geo.H);
      },
      /** Compacto: o mesmo mapa num palco de outro tamanho (cartão com outro texto ou com um gráfico embaixo). Mantém o
       *  ponto do centro e o zoom na tela; devolve true se redesenhou. */
      dimensoes(d) {
        if (!compacto || !est.geo || !d) return false;
        const [W2, H2] = d.map((v) => Math.max(120, Math.round(v))), { W, H, proj } = est.geo;
        if (Math.abs(W2 - W) < 3 && Math.abs(H2 - H) < 3) return false;
        const t = est.transform || d3.zoomIdentity, tE = transformacaoEstado(est.geo);
        const noEstado = Math.abs(t.k - tE.k) / tE.k < 0.02 && Math.abs(t.x - tE.x) < 2 && Math.abs(t.y - tE.y) < 2;
        est.manter = noEstado ? { estado: true } : { c: proj.invert(t.invert([W / 2, H / 2])), k: t.k };
        opts.dimensoes = [W2, H2];
        desenhar(null);
        return true;
      },
      /** Troca a malha (ex.: territórios → municípios) no mesmo enquadramento e na mesma projeção: a malha antiga fica por
       *  cima e esmaece. `parcial`: opções que mudam junto (preencher, dica, opacidade, foco, nome). */
      contornos(novo, parcial = {}) {
        Object.assign(opts, parcial);
        if (!novo?.features?.length || novo === fc) { if (est.recolorir) est.recolorir(true); return; }
        const velho = est.svg?.querySelector("path.u")?.parentNode?.cloneNode(true);
        fc = novo;
        desenhar(null);
        if (!velho || Lab.semMovimento()) return;
        velho.setAttribute("pointer-events", "none");
        velho.querySelectorAll("[data-u]").forEach((n) => n.removeAttribute("data-u"));   // o fantasma não entra na seleção
        const cena = est.svg.querySelector(".cena");
        cena.insertBefore(velho, cena.querySelector(".rotulos-ref, .sobreposicao"));
        d3.select(velho).transition().duration(DURACAO_MALHA).ease(d3.easeCubicInOut).style("opacity", 0).remove();
      },
      /** Troca cores, textos, opacidade e foco sem redesenhar (com transição). */
      atualizar(parcial = {}, { animar = true } = {}) {
        Object.assign(opts, parcial);
        if (est.recolorir) est.recolorir(animar);
      },
      /** Troca a forma (Mapa | Círculos) com a transição do design system. */
      forma(v, animar = true) {
        if (!opts.forma || !opts.tamanho || opts.forma.obter() === v) return;
        const anterior = opts.forma.obter();
        opts.forma.definir(v);
        if (ctrl) for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
        desenhar(animar && !Lab.semMovimento() ? anterior : null);
      },
      redesenhar() { desenhar(null); },
      /** Escala de raio das bolhas (para a legenda de tamanho no modo compacto — Q-062); null sem tamanho. */
      escalaTamanho() { return est.escalaR || null; },
      /** Círculos no centro de cada unidade, sobrepostos (muitas unidades), em vez de afastados (Dorling). */
      circulosSobrepostos() { return (est.geo?.fc?.features?.length || 0) > SOBREPOR_MIN; },
    };
    desenharMapa(null);
    return api;
  };
})();

/* ==== web/componentes/lab-metodologia.js ==== */
/* lab-metodologia.js — bloco "Fontes de Dados, Metodologia e Códigos", padrão de todos os produtos (ADR L0003).
 * Modelo: README do Agregador de Pesquisas (O POVO/DATADOC). O conteúdo vem pronto do Python
 * (labdados.metodologia.montar): textos do produto (src/metodologia.yaml) + partes automáticas
 * (fontes com datas e hashes do manifesto, ADRs, trechos de código, conferência de qualidade, versão).
 *
 * Lab.blocoMetodologia(m, { baixar: { rotulo, acao }, linkAutor: { href, texto } })
 * Lab.rodapePagina(m, opts) → bloco + assinatura final (preenche o <footer id="rodape">).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Diagrama de fluxo dos dados (pesquisador, 2026-10-12; vale para os exploratórios): bases que entram → operações
   *  (cruzamentos, filtros, agrupamentos…) → saídas do produto. Declarado em src/metodologia.yaml › fluxo:
   *    entradas: [{id, rotulo, nota?, restrita?}] · operacoes: [{id, rotulo, tipo, de: [ids], nota?}] · saidas: [{id, rotulo, de, link?, nota?}]
   *    transversais: [{id, rotulo, tipo, nota?, exceto?: [ids de saídas]}] — operações que valem para todas as saídas (ex.:
   *    supressão de 1 a 4): ficam numa faixa à parte, sob o diagrama, sem uma ligação para cada saída; passar o mouse na
   *    faixa acende as saídas a que ela se aplica (pesquisador, 2026-10-14).
   *  Colunas por profundidade (uma operação que parte de outra vai para a coluna seguinte); ligações em SVG redesenhadas a
   *  cada mudança de tamanho. Passar o mouse (ou focar) num nó acende o caminho dele — de onde vem e para onde vai. No
   *  celular, uma coluna só, e cada nó diz de onde vem ("← …"). */
  const TIPOS_FLUXO = { base: "base", cruzamento: "⨝ cruzamento", filtro: "⧩ filtro", agrupamento: "Σ agrupamento", derivacao: "ƒ derivação",
    conferencia: "✓ conferência", supressao: "▦ supressão", saida: "saída" };
  Lab.diagramaFluxo = (f) => {
    const nos = new Map();
    const add = (n, papel) => nos.set(n.id, { ...n, papel, de: [].concat(n.de || []) });
    (f.entradas || []).forEach((n) => add(n, "entrada"));
    (f.operacoes || []).forEach((n) => add(n, "operacao"));
    (f.saidas || []).forEach((n) => add(n, "saida"));
    const prof = new Map();
    const nivel = (id, pilha = new Set()) => {
      if (prof.has(id)) return prof.get(id);
      const n = nos.get(id);
      if (!n || pilha.has(id)) return 0;
      pilha.add(id);
      const v = n.papel === "entrada" ? 0 : 1 + Math.max(0, ...n.de.map((d) => nivel(d, pilha)));
      prof.set(id, v);
      return v;
    };
    [...nos.keys()].forEach((id) => nivel(id));
    // três faixas: bases | operações (uma coluna, na ordem do caminho — profundidade, depois a ordem declarada) | saídas
    const ordemDecl = [...nos.keys()];
    const faixa = (papel) => [...nos.values()].filter((n) => n.papel === papel).sort((a, b) => (papel === "operacao" ? prof.get(a.id) - prof.get(b.id) : 0) || ordemDecl.indexOf(a.id) - ordemDecl.indexOf(b.id));
    const colunas = [["Bases que entram", faixa("entrada")], ["Operações", faixa("operacao")], ["Saídas", faixa("saida")]];
    const cor = { entrada: Lab.token("cor-cat-1"), operacao: Lab.token("cor-cat-3"), saida: Lab.token("cor-cat-2") };
    const caixa = el("div", { class: "fluxo", role: "group", "aria-label": "Fluxo dos dados: bases, operações e saídas" });
    const els = new Map();
    for (const [k, [titulo, col]] of colunas.entries()) {
      caixa.append(el("div", { class: `fluxo-col fluxo-col-${k}` }, el("h4", { text: titulo }), ...col.map((n) => {
        const tipo = n.papel === "entrada" ? "base" : n.papel === "saida" ? "saida" : n.tipo || "derivacao";
        const nomeDe = n.de.map((d) => nos.get(d)?.rotulo || d).join(", ");
        const no = el("div", { class: `fluxo-no${n.restrita ? " restrita" : ""}`, tabindex: "0", "data-id": n.id,
          "aria-label": `${n.rotulo}${nomeDe ? `, a partir de: ${nomeDe}` : ""}${n.nota ? `. ${n.nota}` : ""}` },
          el("span", { class: "tipo", text: TIPOS_FLUXO[tipo] || tipo }),
          n.link ? el("b", {}, el("a", { href: n.link, text: n.rotulo })) : el("b", { text: n.rotulo }),
          n.nota ? el("span", { class: "nota", text: n.nota }) : null,
          nomeDe ? el("span", { class: "de", text: `← ${nomeDe}` }) : null);
        no.style.setProperty("--cor-fluxo", cor[n.papel]);
        els.set(n.id, no);
        return no;
      })));
    }
    const svg = d3.select(caixa).append("svg").attr("aria-hidden", "true");
    const arestas = [...nos.values()].flatMap((n) => n.de.filter((d) => nos.has(d)).map((d) => ({ de: d, para: n.id })));
    const desenhar = () => {
      const r0 = caixa.getBoundingClientRect();
      if (!r0.width) return;
      const ops = faixa("operacao").map((n) => n.id);
      svg.selectAll("path").data(arestas).join("path").attr("d", (a) => {
        const A = els.get(a.de).getBoundingClientRect(), B = els.get(a.para).getBoundingClientRect();
        const y1 = A.top + A.height / 2 - r0.top, y2 = B.top + B.height / 2 - r0.top;
        if (nos.get(a.de).papel === "operacao" && nos.get(a.para).papel === "operacao") {   // dentro da coluna: arco pela margem esquerda
          const x1 = A.left - r0.left, x2 = B.left - r0.left, g = 10 + 5 * Math.min(4, Math.abs(ops.indexOf(a.para) - ops.indexOf(a.de)) - 1);
          return `M${x1},${y1}C${x1 - g},${y1} ${x2 - g},${y2} ${x2},${y2}`;
        }
        const x1 = A.right - r0.left, x2 = B.left - r0.left, m = (x1 + x2) / 2;
        return `M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}`;

    };

    // operações transversais: faixa à parte, aplicada a todas as saídas (menos as de `exceto`)
    const transv = (f.transversais || []).map((t) => {
      const exceto = new Set(t.exceto || []), alvo = faixa("saida").filter((n) => !exceto.has(n.id)).map((n) => n.id);
      const nomesExc = [...exceto].map((id) => nos.get(id)?.rotulo || id);
      const no = el("div", { class: "fluxo-no fluxo-transversal", tabindex: "0", "data-id": t.id,
        "aria-label": `${t.rotulo}: vale para todas as saídas${nomesExc.length ? `, exceto ${nomesExc.join(", ")}` : ""}${t.nota ? `. ${t.nota}` : ""}` },
        el("span", { class: "tipo", text: `${TIPOS_FLUXO[t.tipo] || t.tipo || "operação"} · transversal` }), el("b", { text: t.rotulo }),
        t.nota ? el("span", { class: "nota", text: t.nota }) : null,
        el("span", { class: "nota alcance", text: `Vale para todas as saídas${nomesExc.length ? `, exceto: ${nomesExc.join(", ")}` : ""}.` }));
      no.style.setProperty("--cor-fluxo", cor.operacao);
      return { t, no, alvo };
    });
    const faixaT = transv.length ? el("div", { class: "fluxo-transversais" }, el("h4", { text: "Operações transversais" }), ...transv.map((x) => x.no)) : null;
    const focarT = (x) => {
      caixa.classList.toggle("focado", !!x);
      const lig = new Set(x ? x.alvo : []);
      for (const [k, no] of els) no.classList.toggle("ligado", lig.has(k));
      svg.selectAll("path").classed("ligado", false);
      for (const y of transv) y.no.classList.toggle("ligado", y === x);
    };
    for (const x of transv) {
      x.no.addEventListener("pointerenter", () => focarT(x)); x.no.addEventListener("pointerleave", () => focarT(null));
      x.no.addEventListener("focus", () => focarT(x)); x.no.addEventListener("blur", () => focarT(null));
    }
    // caminho de um nó: ancestrais e descendentes
    const sobe = (id, s = new Set()) => { for (const a of arestas) if (a.para === id && !s.has(a.de)) { s.add(a.de); sobe(a.de, s); } return s; };
    const desce = (id, s = new Set()) => { for (const a of arestas) if (a.de === id && !s.has(a.para)) { s.add(a.para); desce(a.para, s); } return s; };
    const focar = (id) => {
      caixa.classList.toggle("focado", !!id);
      const lig = id ? new Set([id, ...sobe(id), ...desce(id)]) : new Set();
      for (const [k, no] of els) no.classList.toggle("ligado", lig.has(k));
      svg.selectAll("path").classed("ligado", (a) => lig.has(a.de) && lig.has(a.para));
      // a faixa transversal acende junto quando o caminho chega a uma saída a que ela se aplica
      for (const x of transv) x.no.classList.toggle("ligado", !!id && x.alvo.some((s) => lig.has(s)));
    };
    for (const [k, no] of els) {
      no.addEventListener("pointerenter", () => focar(k)); no.addEventListener("pointerleave", () => focar(null));
      no.addEventListener("focus", () => focar(k)); no.addEventListener("blur", () => focar(null));
    }
    caixa.classList.toggle("com-transversais", !!faixaT);
    return faixaT ? el("div", { class: "fluxo-envelope" }, caixa, faixaT) : caixa;
  };

  /** Seções do bloco (o mesmo conteúdo no fim da página ou em camadas na folha ✎ Notas e fontes — L0014). */
  const secoesMetodologia = (m, { baixar = null, linkAutor = null, endereco = null } = {}, secao) => {
    const fontes = el("div", { class: "rolagem" }, Lab.tabela(["Base", "Órgão", "Arquivos (gerado na fonte · baixado em · hash)", "Link"],
      m.fontes.map((f) => [
        [el("code", { text: f.id }), el("div", { class: "nota", text: f.descricao })],
        f.orgao,
        [el("ul", { class: "arquivos" }, ...f.arquivos.map((a) => el("li", {}, el("code", { text: a.arquivo }),
          ` · ${a.gerado_na_fonte ? a.gerado_na_fonte.replace(/ \d\d:\d\d:\d\d GMT$/, "") : "—"} · ${a.baixado_em || "—"} · ${a.sha256 || "—"}`)))],
        f.url ? [el("a", { href: f.url, target: "_blank", rel: "noopener", text: "página oficial ↗" })] : "—"])));
    const passos = el("ol", { class: "passos" }, ...m.passos.map((p) => el("li", {},
      el("b", { text: p.titulo }), el("p", { text: p.texto }),
      p.adrs ? el("div", { class: "nota" }, "Decisões: ", ...p.adrs.flatMap((id, k) => [k ? ", " : "", el("a", { href: `#adr-${id}`, text: id })])) : null,
      p.trecho ? el("details", { class: "codigo" }, el("summary", {}, "Ver código"), el("pre", {}, el("code", { text: p.trecho }))) : null)));
    const q = m.qualidade || {};
    const adrs = el("ul", { class: "adrs" }, ...m.adrs.map((a) => el("li", { id: `adr-${a.id}` },
      el("b", { text: `${a.id} — ${a.titulo}` }), el("span", { class: "nota", text: ` (${a.status})` }), el("div", { text: a.decisao }),
      el("div", { class: "nota" }, "No repositório: ", el("code", { text: a.arquivo })))));
    // sem a lista de códigos no metodologia.yaml, a seção some (antes, m.codigos ausente quebrava a folha inteira — 2026-10-16)
    const codigos = m.codigos?.length ? el("div", { class: "rolagem" }, Lab.tabela(["Arquivo", "O que faz"], m.codigos.map((c) => [[el("code", { text: c.arquivo })], c.papel]))) : null;
    const v = m.versao;
    const citar = `${m.citacao || ""} Disponível em: ${endereco || location.href.split("#")[0]}. Acesso em: ${new Date().toLocaleDateString("pt-BR")}.`.trim();
    return [
        secao("Sobre este produto", el("p", { text: m.apresentacao })),
        m.fluxo ? secao("Fluxo dos dados", el("p", { class: "nota", text: "Das bases oficiais às saídas desta página: passe o mouse (ou toque) num item para ver de onde ele vem e para onde vai." }), Lab.diagramaFluxo(m.fluxo)) : null,
        secao("Fontes de dados", fontes,
          el("p", { class: "nota", text: "Datas de geração informadas pela própria fonte; o hash identifica a versão exata de cada arquivo usado." }),

      el("div", { class: "met-corpo" }, ...secoesMetodologia(m, opts, secao)));

/* ==== web/componentes/lab-viz.js ==== */
/* lab-viz.js — renderizador da Visualização declarativa (L0007, L0008, L0011–L0013).
 *
 * Recebe o PLANO compilado em Python (labdados.viz.compilar, a partir do viz.yaml) e desenha a peça: moldura (chapéu,
 * título com controles, subtítulo, abas do companheiro, palco, N, legenda, barra fixa com folhas), cartão de detalhe,
 * legenda interativa, anotações, imagem PNG do estado do momento, CSV e código para embutir. Os gráficos vêm de
 * ADAPTADORES por componente do registro do DS (design/padrao/componentes.yaml): Lab.viz.adaptadores.<id>.
 *
 * Só desenha (L0002): todo número e todo texto com número chega pronto do Python, por estado ({e.…} no plano).
 * Nada de cor ou tamanho fixo: tokens do DS (Lab.token) e cores do produto declaradas no plano (estilo.tokens).
 * Comportamentos decididos na bancada de formatos (docs/bancada.html, fase 0) e registrados na L0013. */
(function () {
  "use strict";
  const { el } = Lab;
  const tok = (n) => Lab.token(n);
  const FORMATOS = { retrato: { w: 360, h: 450, rot: "Retrato 4:5" }, quadrado: { w: 400, h: 400, rot: "Quadrado 1:1" }, paisagem: { w: 640, h: 360, rot: "Paisagem 16:9" } };
  const ANOT_MAX = { retrato: 1, quadrado: 2, paisagem: 3 };       // prioridade máxima visível por formato (L0008)
  const ROTULOS_MAX = { retrato: 3, quadrado: 3, paisagem: 5 };    // rótulos diretos de pontos
  const LIMITE_TEXTO = { retrato: 110, quadrado: 140, paisagem: 200 };   // acima disso, “…” que abre no clique (Q-036)
  const ALTURA_GRAFICO = { retrato: 0.95, quadrado: 0.7, paisagem: 0.5 }; // altura do palco pela largura (altura livre)
  const TAM_IMG = { retrato: [360, 450], quadrado: [400, 400], paisagem: [640, 360] };
  const TETO_IMG = { retrato: 16 / 9, quadrado: 5 / 4, paisagem: 3 / 4 };  // a imagem cresce até 9:16, 4:5, 4:3
  const ESCALA_IMG = 3;
  const formatoFluido = (w) => (w < 480 ? "retrato" : w < 720 ? "quadrado" : "paisagem");
  const formatoQuadro = (w, h) => { const r = w / h; return r < 0.9 ? "retrato" : r <= 1.25 ? "quadrado" : "paisagem"; };
  // ⟦…⟧ = negrito; ⟪…⟫ = frase-chave sublinhada (ex.: "mais que a média do Brasil"); na imagem, só o texto
  const negrito = (t) => String(t).split(/(⟦[^⟧]*⟧|⟪[^⟫]*⟫)/).filter((p) => p !== "")
    .map((p) => (p.startsWith("⟦") ? el("b", { text: p.slice(1, -1) }) : p.startsWith("⟪") ? el("span", { class: "sublinhado", text: p.slice(1, -1) }) : p));
  const semMarcas = (t) => String(t).replace(/[⟦⟧⟪⟫]/g, "");
  const curto = (n, k = 24) => (n.length > k ? `${n.slice(0, k - 1)}…` : n);
  const caixaRelativa = (no, palco) => { const r = no.getBoundingClientRect(), p = palco.getBoundingClientRect(); return { x: r.left - p.left, y: r.top - p.top, w: r.width, h: r.height }; };

  // ------------------------------------------------------------------ marcadores do plano
  /** "{e.caminho}" sozinho devolve o valor (número, objeto, null); dentro de um texto, é substituído. "{c.id}" fica
   *  para quem monta o título (controle no lugar). Um trecho "$id" no caminho é o valor atual do controle `id`
   *  ({e.explore.$variavel.dados}): dados e frases de um cartão variam com o seletor, todos calculados no Python. */
  const pegar = (obj, caminho) => caminho.split(".").reduce((o, k) => (o == null ? undefined : o[k.startsWith("$") ? obj?.$?.[k.slice(1)] : k]), obj);
  function resolver(v, e) {
    if (typeof v !== "string") return Array.isArray(v) ? v.map((x) => resolver(x, e)) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolver(x, e)])) : v;

  /** mapa_pontos (EXPERIMENTAL, L0011) — pontos ou círculos de área proporcional (Dorling), fundo OSM em mapas de
   *  cidade (L0013), zoom pelos botões, Ctrl/⌘ + roda e pinça; um dedo nunca move o mapa (rola a página). */
  adaptadores.mapa_pontos = (C) => {
    const { alvo, lig, linhas, todas, est, frame } = C;
    const W = alvo.clientWidth, H = C.naImagem ? alvo.clientHeight : Math.max(150, alvo.clientHeight);
    const com = linhas.filter((l) => l[lig.lat] !== null && l[lig.lon] !== null);
    if (!com.length) { alvo.append(el("div", { class: "viz-vazio", text: C.resolver(C.espec.vazio) || "Nenhum ponto tem coordenada." })); return null; }
    const qq = (f, p) => d3.quantile(com.map(f).sort(d3.ascending), p);
    // área urbana (3% a 97% das coordenadas), com um mínimo de ~1,5 km para cidades com um ou dois pontos
    let [x0, x1, y0, y1] = [qq((l) => l[lig.lon], 0.03), qq((l) => l[lig.lon], 0.97), qq((l) => l[lig.lat], 0.03), qq((l) => l[lig.lat], 0.97)];
    const MIN = 0.014, cx0 = (x0 + x1) / 2, cy0 = (y0 + y1) / 2;
    if (x1 - x0 < MIN) [x0, x1] = [cx0 - MIN / 2, cx0 + MIN / 2];

    const fundo = C.opcao("fundo") ?? "nenhum";

    const desenharRuas = comOSM ? C.osm.camada(gRuas, proj, W, H, C.naImagem)

      .attr("stroke", tok(comOSM ? "cor-texto-secundario" : "cor-eixo")).attr("vector-effect", "non-scaling-stroke");
    const forma = C.opcao("forma") ?? "pontos", bolhas = forma === "bolhas" && lig.tamanho;
    const nos = com.map((l) => { const [x, y] = proj([l[lig.lon], l[lig.lat]]); return { l, x, y, x0: x, y0: y }; });
    const rMax = W < 420 ? 8 : 11;
    const ea = bolhas ? Lab.escalaArea(nos.map((n) => n.l[lig.tamanho]), 1) : null, sR = bolhas ? d3.scaleSqrt().domain([0, ea.teto]).range([0, rMax]).clamp(true) : null;

    if (bolhas) { const sim = d3.forceSimulation(nos).force("x", d3.forceX((n) => n.x0).strength(0.2)).force("y", d3.forceY((n) => n.y0).strength(0.2)).force("c", d3.forceCollide((n) => n.r + 0.5)).stop(); for (let i = 0; i < 160; i++) sim.tick(); }

    // legenda de tamanho: obrigatória quando o tamanho codifica um valor (L0013, Q-062); acompanha o zoom
    const rotTam = C.col(lig.tamanho).rotulo_tamanho || C.col(lig.tamanho).rotulo || lig.tamanho;
    const zonaTam = bolhas && !C.naImagem ? el("div", { class: "leg-tamanho" }) : null;
    const escTam = (k = 1) => d3.scaleSqrt().domain([0, ea.teto]).range([0, rMax * Math.sqrt(k)]);   // raio na tela: r ÷ √k × k
    const legTam = (k = 1) => Lab.legendaTamanho(escTam(k), rotTam);
    if (zonaTam) { frame.querySelector(".viz-legenda")?.append(zonaTam); zonaTam.replaceChildren(legTam(est.cam?.k || 1)); }
    const camT = (cam) => { const [px, py] = proj(cam.centro); return d3.zoomIdentity.translate(W / 2, H / 2).scale(cam.k).translate(-px, -py); };
    const pts = cena.append("g").selectAll("circle").data(com).join("circle")
      .attr("data-id", (l) => l.id).attr("data-chave", C.chave).attr("cx", (l) => porId.get(l.id).x).attr("cy", (l) => porId.get(l.id).y).attr("r", (l) => porId.get(l.id).r)
      .attr("fill", (l) => C.cor(l) ?? "none").attr("stroke", comOSM ? tok("cor-texto") : tok("cor-superficie")).attr("stroke-width", comOSM ? 0.8 : 0.6).attr("vector-effect", "non-scaling-stroke");
    let tAtual = d3.zoomIdentity, rafZoom = 0;

      const avisar = (t) => { aviso.textContent = t; aviso.hidden = false; clearTimeout(tAv); tAv = setTimeout(() => { aviso.hidden = true; }, 1400); };

      alvo.append(aviso);

      alvo.append(el("div", { class: "zoom-pontos so-interativo", role: "group", "aria-label": "Zoom do mapa" },
        el("button", { type: "button", "aria-label": "Ampliar", text: "+", onclick: () => svg0.transition().duration(300).call(zoom.scaleBy, 1.8) }),
        el("button", { type: "button", "aria-label": "Reduzir", text: "−", onclick: () => svg0.transition().duration(300).call(zoom.scaleBy, 1 / 1.8) }),
        el("button", { type: "button", "aria-label": "Voltar ao enquadramento inicial", text: "⟲", onclick: () => svg0.transition().duration(300).call(zoom.transform, d3.zoomIdentity) })));
      if (comOSM) alvo.append(el("div", { class: "mapa-atribuicao-mini" }, "© ", el("a", { href: "https://www.openstreetmap.org/copyright", target: "_blank", rel: "noopener", text: "OpenStreetMap" })));

      const cTam = (C.P.controles || []).find((c) => c.opcao === "forma" && (c.local || "explorar") === "grafico");
      if (cTam && lig.tamanho) alvo.append(el("div", { class: "fundo-mini so-interativo", role: "group", "aria-label": cTam.rotulo || "Tamanho" },
        el("span", { class: "rot-mini", text: `${cTam.rotulo || "Tamanho"}:` }),
        ...Object.entries(cTam.valores).map(([v, r]) => el("button", { type: "button", "aria-pressed": forma === v, onclick: () => C.trocar(() => { est[cTam.id] = v; }) }, r))));   // vale também para o gráfico

  // ---------------------------------------------------------------- componentes de cartão (story, Q-066): dados prontos do Python
  /** Quebra aproximada de texto em SVG (sem medir): ~0,55 em por caractere. */
  const quebrarAprox = (txt, px, largura) => {
    const max = Math.max(8, Math.floor(largura / (px * 0.55))), ls = [];
    let l = "";
    for (const p of String(txt || "").split(/\s+/)) { const t = l ? `${l} ${p}` : p; if (l && t.length > max) { ls.push(l); l = p; } else l = t; }
    if (l) ls.push(l);
    return ls;
  };
  /** lab.css fixa cor e tamanho de todo `svg text`; aqui o atributo vale (e a imagem, sem CSS, sai igual à tela). */
  const fixarTexto = (svg) => svg.selectAll("text").each(function () {
    const f = this.getAttribute("fill"), fs = this.getAttribute("font-size");
    if (f) this.style.fill = f;
    if (fs) this.style.fontSize = `${fs}px`;
  });
  const corTok = (c, padrao = "cor-texto") => (String(c || "").startsWith("#") ? c : tok(c || padrao));

  /** quadros — números grandes lado a lado (rótulo embaixo) e uma nota de comparação. dados: [{rotulo, valor, cor}]. */
  adaptadores.quadros = (C) => {
    const { alvo } = C, itens = (C.dados || []).filter(Boolean), W = alvo.clientWidth, H = Math.max(160, alvo.clientHeight);
    const svg = d3.select(alvo).append("svg").attr("width", W).attr("height", H).attr("role", "img")
      .attr("aria-label", [...itens.map((q) => `${q.rotulo}: ${q.valor}`), C.opc.nota].filter(Boolean).join("; "));
    // o número cabe na coluna: com valores longos (ex.: "199.205", "R$ 4,17 bi") a fonte diminui (~0,62 em por caractere)
    const maxCar = Math.max(1, ...itens.map((q) => String(q.valor ?? "").length));
    const n = Math.max(1, itens.length), cw = W / n, px = Math.max(20, Math.min(58, cw * 0.3, (cw - 10) / (maxCar * 0.62)));

    const linhasRot = Math.max(1, ...itens.map((q) => quebrarAprox(q.rotulo, 13, cw - 12).length));
    const notaLs = C.opc.nota ? quebrarAprox(C.opc.nota, 12.5, W - 16) : [];
    const altBloco = px * 0.8 + 26 + (linhasRot - 1) * 16 + (notaLs.length ? 34 + notaLs.length * 17 : 0);
    const yN = Math.max(px * 0.85, (H - altBloco) / 2 + px * 0.8);
    itens.forEach((q, k) => {
      const x = k * cw + cw / 2;
      svg.append("text").attr("x", x).attr("y", yN).attr("text-anchor", "middle").style("font-size", `${px}px`).attr("font-size", px).attr("font-weight", 700)
        .attr("fill", corTok(q.cor)).style("fill", corTok(q.cor)).style("font-variant-numeric", "tabular-nums").text(q.valor);
      quebrarAprox(q.rotulo, 13, cw - 12).forEach((l, j) => svg.append("text").attr("x", x).attr("y", yN + 26 + j * 16).attr("text-anchor", "middle")
        .style("font-size", "13px").attr("font-size", 13).attr("fill", tok("cor-texto-secundario")).text(l));
    });
    if (notaLs.length) {
      const y0 = yN + 26 + (linhasRot - 1) * 16 + 34;
      svg.append("line").attr("x1", W * 0.15).attr("x2", W * 0.85).attr("y1", y0 - 20).attr("y2", y0 - 20).attr("stroke", tok("cor-grade"));
      notaLs.forEach((l, j) => svg.append("text").attr("x", W / 2).attr("y", y0 + j * 17).attr("text-anchor", "middle").style("font-size", "12.5px").attr("font-size", 12.5).attr("fill", tok("cor-texto")).text(l));
    }
    fixarTexto(svg);
    return {};
  };

  /** linhas — evolução em poucas pontas (anos), com valor no início e valor + nome no fim (rótulo direto, sem legenda).
   *  dados: {anos, series: [{id, rotulo, cor, valores, tracejado}]}, valores em %. Mesma leitura de Lab.linhasPontas. */
  adaptadores.linhas = (C) => {
    const { alvo } = C, D = C.dados;
    if (!D?.series) { alvo.append(el("div", { class: "viz-vazio", text: "Sem série histórica para esta escolha." })); return null; }
    const S = D.series.filter((s) => s.valores.some((v) => v !== null && v !== undefined));
    let svg = null;

      const destacar = (id) => { const a = id ?? fixa; if (!svg) return; esmaecer(svg.selectAll("[data-serie]")).attr("opacity", function () { return !a || this.dataset.serie === a ? 1 : 0.15; });
        C.legenda.querySelectorAll("button[data-serie]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.serie === fixa))); };
      C.legenda.append(...S.map((s) => {
        const am = d3.create("svg").attr("width", 22).attr("height", 10).attr("aria-hidden", "true").style("vertical-align", "middle");
        am.append("line").attr("x1", 1).attr("x2", 21).attr("y1", 5).attr("y2", 5).attr("stroke", corTok(s.cor)).attr("stroke-width", 2.5).attr("stroke-dasharray", s.tracejado ? "4 3" : null);

      }), C.opc?.legenda_extra ? el("span", { class: "item-extra", text: C.opc.legenda_extra }) : null);

    const tem = (v) => v !== null && v !== undefined;
    const fmt = (v) => Lab.fmtPct(v, 1);

    const max = d3.max(S.flatMap((s) => s.valores).filter(tem)) || 1;

    const passoX = n > 1 ? (W - m.r - m.l) / (n - 1) : Infinity, larg = 7.5 * d3.max(anos, (a) => String(a).length) + 6;

    anos.forEach((a, i) => {

      const mostra = i === 0 || i === n - 1 || (i % salto === 0 && n - 1 - i >= salto);
      if (mostra) svg.append("text").attr("x", sx(i)).attr("y", 13).attr("text-anchor", "middle").attr("font-size", 12).attr("font-weight", 700).attr("fill", tok("cor-texto")).text(a);
    });
    const afastar = (itens) => { itens.sort((a, b) => a.y - b.y); for (let k = 1; k < itens.length; k++) if (itens[k].y - itens[k - 1].y < 13) itens[k].y = itens[k - 1].y + 13; return itens; };
    const grupos = new Map();
    for (const s of S) {
      const c = corTok(s.cor), g = svg.append("g").attr("data-serie", s.id);
      grupos.set(s.id, g);
      for (let i = 1; i < n; i++) if (tem(s.valores[i - 1]) && tem(s.valores[i]))
        g.append("line").attr("x1", sx(i - 1)).attr("y1", sy(s.valores[i - 1])).attr("x2", sx(i)).attr("y2", sy(s.valores[i]))
          .attr("stroke", c).attr("stroke-width", 2.2).attr("stroke-linecap", "round").attr("stroke-dasharray", s.tracejado ? "5 4" : null);
      s.valores.forEach((v, i) => { if (tem(v)) titulo(g.append("circle").attr("cx", sx(i)).attr("cy", sy(v)).attr("r", 4).attr("fill", c), [s.rotulo, `${anos[i]}: ${fmt(v)}`]); });
    }
    const rotulo = (x, y, txt, anc) => svg.append("text").attr("x", x).attr("y", y + 4).attr("text-anchor", anc).attr("font-size", 11).attr("font-weight", 600)
      .attr("fill", tok("cor-texto")).attr("paint-order", "stroke").attr("stroke", tok("cor-superficie")).attr("stroke-width", 3).text(txt);
    // borda "muitos" (contrato): cabem ~(altura útil ÷ 14) rótulos; rotula as maiores no fim, e as menores só se couberem
    const vagas = Math.max(2, Math.floor((H - m.t - m.b) / 15));
    const porValor = S.filter((s) => tem(s.valores[n - 1])).sort((a, b) => b.valores[n - 1] - a.valores[n - 1]);
    const rotuladas = new Set(porValor.slice(0, vagas).filter((s, i) => i < 3 || s.valores[n - 1] >= 0.08 * porValor[0].valores[n - 1]).map((s) => s.id));
    for (const { s, y } of afastar(S.filter((s) => tem(s.valores[0]) && (rotuladas.has(s.id) || !tem(s.valores[n - 1]))).map((s) => ({ s, y: sy(s.valores[0]) })))) rotulo(sx(0) - 7, y, fmt(s.valores[0]), "end");
    // nome longo em duas linhas (ex.: "Flávio / Bolsonaro"), sem cortar; a linha extra conta no afastamento
    const cabe = Math.max(8, Math.floor((m.r - 48) / 6.2));

    // se a pilha passa do fundo, sobe de baixo para cima mantendo o espaço

    for (const { s, y, duas } of dir) {
      const tx = rotulo(sx(n - 1) + 7, y, "", "start"), i0 = s.rotulo.lastIndexOf(" ");
      tx.append("tspan").text(`${fmt(s.valores[n - 1])} ${duas ? s.rotulo.slice(0, i0) : s.rotulo}`);
      if (duas) tx.append("tspan").attr("x", sx(n - 1) + 7 + 6).attr("dy", 12).text(s.rotulo.slice(i0 + 1));

  /** barras100 — barras empilhadas de 100%, uma por linha, em SVG (L0012); linha pontilhada de 50% (elemento implícito).

  adaptadores.barras100 = (C) => {

      for (const k of cats) {

        const r = svg.append("rect").attr("data-cat", k.id).attr("data-k", `${l.id ?? l.rotulo}|${k.id}`).attr("y", y + 17).attr("width", Math.max(0, w - 2)).attr("height", bh).attr("rx", 2).attr("fill", c);

          .attr("fill", Lab.tinta(c)).attr("pointer-events", "none") : null;

  /** fluxos — Sankey entre etapas, com as contagens prontas do Python (sem d3-sankey). Duas etapas: na vertical (DS);

   *  formato?: int | pct | brl, ligacoes: [{etapa (índice da origem), de, para, n}]}.
   *  opcoes: fase (origem = só os blocos da 1ª etapa | blocos = blocos de todas, sem faixas | faixas, o padrão: para
   *  montar e explicar o gráfico em cartões seguidos) e destaque ("de>para" ou lista: essas faixas acesas). O mesmo

    if (E.length < 2 || !lig.length) return semDados(C);

    const fmtN = D.formato ? fmtNum(D.formato) : (v) => Lab.fmtInt.format(v), comUni = (v) => (D.formato === "pct" ? fmtN(v) : `${fmtN(v)} ${uni}`);

    // tamanho de cada bloco: saídas da etapa (ou entradas, na última)
    const blocos = E.map((_, e) => {
      const m = new Map();
      for (const l of lig) if (l.etapa === e) m.set(l.de, (m.get(l.de) || 0) + l.n); else if (e === E.length - 1 && l.etapa === e - 1) m.set(l.para, (m.get(l.para) || 0) + l.n);

      const posEtapa = (e) => (vertical ? (e === 0 ? esp : H - esp - hN) : 6 + (e * (W - 12 - hN)) / (E.length - 1));

          : `M${p0},${a0} C${pm},${a0} ${pm},${a1} ${p1},${a1} L${p1},${a1 + w} C${pm},${a1 + w} ${pm},${a0 + w} ${p0},${a0 + w} Z`;

    ligs.forEach((l, i) => {
      if (!G.faixas[i]) return;

        [`${nomeCat[l.de] || l.de} → ${nomeCat[l.para] || l.para}`, comUni(l.n), l.nota || null, `de ${E[l.etapa]} para ${E[l.etapa + 1]}`]);   // nota: o absoluto por trás da %, do Python

        titulo(r, [nomeCat[g] || g, `${E[e]}: ${comUni(v.n)}`, "as faixas acesas saem e chegam neste bloco"]);
        ge.append("text").attr("class", "num-bloco").attr("data-cat", g).attr("font-size", 11).attr("font-weight", 700).attr("fill", tok("cor-texto"))
          .attr("paint-order", "stroke").attr("stroke", tok("cor-superficie")).attr("stroke-width", 3).attr("pointer-events", "none");
      }
