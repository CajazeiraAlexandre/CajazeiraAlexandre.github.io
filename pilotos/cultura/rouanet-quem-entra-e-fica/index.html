  Lab.largura = (max) => Math.max(320, Math.min(max, Lab.cfg.raiz.clientWidth - 34));
  Lab.estreito = () => Lab.cfg.raiz.clientWidth < 600;
})();

/* ==== web/componentes/lab-selecao.js ==== */
/* lab-selecao.js — seleção de unidades (clique no mapa, no gráfico ou na busca). ADR L0003.
 *
 * Cada bloco (um mapa e o gráfico ligado a ele, ou um gráfico sozinho) marca-se com
 * data-escopo="nome" e tem a sua seleção: selecionar num bloco não afeta os outros.
 * As marcas selecionáveis levam data-u="<id>". A seleção fica só na memória da página.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const selecoes = new Map();   // escopo → unidade
  const paineis = [];           // [escopo, atualizar, chave?] — registrados a cada desenho
  Lab.selecoes = selecoes;

  /** Escopo de um nó (o data-escopo mais próximo) ou o próprio nome, se for texto. */
  Lab.escopoDe = (n) => (typeof n === "string" ? n : n?.closest?.("[data-escopo]")?.dataset.escopo || "geral");
  Lab.selecaoDe = (n) => selecoes.get(Lab.escopoDe(n)) || "";
  /** Seleciona `u` no bloco de `noh` (clicar de novo desfaz); `u` vazio limpa a seleção do bloco. */
  Lab.selecionar = (u, noh) => {
    const esc = Lab.escopoDe(noh);
    if (u && selecoes.get(esc) !== u) selecoes.set(esc, u); else selecoes.delete(esc);
    Lab.aplicarSelecao(esc);
  };
  /** Marca .selecionado nas marcas do bloco, traz a selecionada para a frente e atualiza os painéis. */
  Lab.aplicarSelecao = (esc) => {
    const u = selecoes.get(esc) || "";
    for (const bloco of Lab.cfg.raiz.querySelectorAll(`[data-escopo="${CSS.escape(esc)}"]`)) {
      for (const n of bloco.querySelectorAll("[data-u]")) {
        const sim = Boolean(u) && n.dataset.u === u;
        n.classList.toggle("selecionado", sim);
        if (sim && n.parentNode) n.parentNode.appendChild(n);   // por cima dos vizinhos
      }
      for (const sv of bloco.querySelectorAll("svg")) sv.classList.toggle("com-selecao", Boolean(u) && Boolean(sv.querySelector(".selecionado")));
    }
    for (const [e, atualizar] of paineis) if (e === esc) atualizar();
  };
  /** Reaplica todas as seleções (chamar depois de redesenhar a página). */
  Lab.aplicarSelecoes = () => { for (const esc of selecoes.keys()) Lab.aplicarSelecao(esc); };
  /** Registra um painel; com `chave`, substitui o registro anterior da mesma chave (redesenho não acumula). */
  Lab.registrarPainel = (esc, atualizar, chave = null) => {
    const reg = chave ? paineis.find((p) => p[2] === chave) : null;
    if (reg) reg[1] = atualizar; else paineis.push([esc, atualizar, chave]);
  };
  /** Esquece os painéis (chamar no início de cada redesenho da página). */
  Lab.limparPaineis = () => { paineis.length = 0; };

  /** Conteúdo do painel da unidade: nome, linhas de dados, "Ver ficha" (opcional) e "Limpar seleção". */
  Lab.conteudoPainel = (painel, { u, nome, linhas, abrir = null, rotuloAbrir = "Ver ficha →", esc, acoes = [] }) =>
    painel.replaceChildren(el("b", { text: nome }), ...linhas.filter(Boolean).map((t) => el("span", { text: t })),
      el("div", { class: "acoes-sel" },
        abrir ? el("button", { type: "button", class: "voltar", text: rotuloAbrir, onclick: () => abrir(u) }) : null, ...acoes.filter(Boolean),
        el("button", { type: "button", class: "voltar", text: "Limpar seleção", onclick: () => Lab.selecionar("", esc) })));

  /** Painel da unidade selecionada sob um gráfico. Em telas largas, dentro de .grade2 (mapa ao lado), fica oculto
   *  por CSS; no celular aparece logo abaixo do gráfico tocado. opts: {nome(u), dica(u) → linhas, abrir(u), rotuloAbrir}. */
  Lab.painelGrafico = (alvo, { nome, dica, abrir = null, rotuloAbrir } = {}) => {
    const painel = el("div", { class: "painel-sel painel-grafico", "aria-live": "polite" });
    alvo.append(painel);
    const esc = Lab.escopoDe(alvo);
    const atualizar = () => {
      const u = selecoes.get(esc) || "";
      const existe = u && alvo.querySelector(`[data-u="${CSS.escape(u)}"]`);
      painel.hidden = !existe;
      if (existe) Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: dica(u), abrir, rotuloAbrir, esc });
    };
    Lab.registrarPainel(esc, atualizar);
    atualizar();
    return painel;
  };

  /** Destaque ligado: passar o mouse numa unidade acende a mesma unidade em todos os gráficos da grade. */
  Lab.ligarDestaque = (grade) => {
    const acender = (ev, sim) => { const u = ev.target.closest("[data-u]")?.dataset.u; if (u) for (const n of grade.querySelectorAll(`[data-u="${CSS.escape(u)}"]`)) n.classList.toggle("ligado", sim); };
    grade.addEventListener("pointerover", (ev) => acender(ev, true));
    grade.addEventListener("pointerout", (ev) => acender(ev, false));
  };
})();

/* ==== web/componentes/lab-escalas.js ==== */
/* lab-escalas.js — escalas de tamanho e legendas de cor. ADR L0003.
 *
 * Regras (design.yaml › padroes): legendas de escala ocupam ~70% da largura do gráfico; nos mapas
 * ficam logo abaixo do desenho; texto da legenda em tinta de texto, nunca na cor da série.
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Escala de área (raiz) com teto "fora de escala": se a maior unidade tem mais de 3× o valor da segunda,
   *  a escala vai até a segunda e a maior fica no tamanho máximo, com contorno tracejado (decisão de 2026-10-06). */
  Lab.escalaArea = (valores, rMax) => {
    const ord = valores.filter((v) => v > 0).sort((a, b) => b - a);
    const fora = ord.length > 2 && ord[0] > 3 * ord[1];
    const teto = fora ? ord[1] : ord[0] || 1;
    const s = d3.scaleSqrt().domain([0, teto]).range([0, rMax]).clamp(true);
    return { s, teto, fora: (v) => fora && v > teto };
  };
  /** Nota sob o gráfico com as unidades fora de escala. Sem unidades, devolve "" (pode ir direto em append:
   *  o append nativo escreveria "null"). */
  Lab.notaFora = (nomes) => (nomes.length ? el("p", { class: "nota", text: `Fora de escala (contorno tracejado): ${nomes.join(", ")}. O valor é mais de três vezes o da segunda maior unidade; o círculo fica no tamanho máximo para não esmagar os demais.` }) : "");

  /** Legenda de tamanho: três círculos de referência ("Área ∝ …"). */
  Lab.legendaTamanho = (escalaR, rotuloTamanho) => {
    const max = escalaR.domain()[1];
    const ref = d3.ticks(0, max, 3).filter((v) => v > 0).slice(-3);
    const H = 2 * escalaR(d3.max(ref)) + 22;
    const svg = d3.create("svg").attr("width", 260).attr("height", H).attr("role", "img").attr("aria-label", `Legenda de tamanho: ${ref.map((v) => Lab.fmtInt.format(v)).join(", ")}`);
    let x = 4;
    for (const v of ref) {
      const r = escalaR(v), cx = x + Math.max(r, 26);
      svg.append("circle").attr("cx", cx).attr("cy", H - 4 - r).attr("r", r).attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario"));
      svg.append("text").attr("x", cx).attr("y", H - 6 - 2 * r).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", Lab.token("cor-texto-secundario")).text(Lab.fmtInt.format(v));
      x += Math.max(2 * r, 52) + 10;
    }
    svg.attr("width", x + 4);   // largura conforme os círculos (não corta o maior)
    return el("div", { class: "legenda" }, el("span", { text: `Área ∝ ${rotuloTamanho}` }), svg.node());
  };

  /** Rampa de cores (quadros iguais). */
  Lab.rampa = (cores) => el("span", { class: "rampa" }, ...cores.map((c) => { const s = el("span"); s.style.background = c; return s; }));
  /** Escala contínua: rampa na largura toda e rótulos das pontas embaixo (sequencial ou divergente). */
  Lab.legendaRampa = (cores, esquerda, direita) => el("div", { class: "legenda legenda-larga" }, el("span", { text: esquerda }), Lab.rampa(cores), el("span", { text: direita }));
  /** Escala divergente com três marcos: início, centro (neutro) e fim. */
  Lab.legendaTres = (cores, inicio, centro, fim) => el("div", { class: "legenda legenda-tres" }, Lab.rampa(cores), el("span", { text: inicio }), el("span", { text: centro }), el("span", { text: fim }));
  /** Legenda de classes por categoria: uma linha por categoria, quadros de largura fixa com a faixa escrita sobre a cor.
   *  linhas: [{nome, cores: [uma por classe]}] · rotulos: texto de cada classe ("< 40%", "40–50%"…). */
  Lab.legendaClasses = (linhas, rotulos, aria) => {
    const caixa = el("div", { class: "legenda-intensidade", role: "img", "aria-label": aria || `Legenda: ${rotulos.join(", ")}` });
    for (const l of linhas) {
      caixa.append(el("span", { class: "nome", text: l.nome.replaceAll("/", "/​") }));   // quebra após "/" no celular
      l.cores.forEach((cor, i) => { const q = el("span", { class: "quadro", text: rotulos[i] }); q.style.background = cor; Lab.comHalo(q, cor); caixa.append(q); });
    }
    return caixa;
  };
  /** Legenda que filtra/foca (design.yaml › padroes.legendas; pesquisador, 2026-10-12 — o mesmo recurso da Visualização,
   *  Q-079): passar o mouse destaca a categoria em `alvo` (segmentos e linhas com data-cat; os demais esmaecem); tocar fixa
   *  e leva a categoria para a base das barras 100% (à esquerda); tocar de novo desfaz. itens: [[cor, texto, id]].
   *  `alvo`: elemento ou função que o devolve (ex.: o cartão inteiro, para acender também as linhas da tabela). */
  Lab.legendaFoco = (itens, alvo_, ...extras) => {
    let fixa = null;
    const A = () => (typeof alvo_ === "function" ? alvo_() : alvo_);
    const leg = el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Categorias: passe o mouse ou toque para destacar" });
    const ordem = new Map();
    const reordenar = () => {
      for (const barra of A().querySelectorAll(".barra")) {
        const sps = [...barra.children];
        if (!ordem.has(barra)) ordem.set(barra, sps);
        const orig = ordem.get(barra);
        const lista = fixa === null ? orig : [...orig.filter((s) => s.dataset.cat === fixa), ...orig.filter((s) => s.dataset.cat !== fixa)];
        barra.replaceChildren(...lista);
      }
    };
    const aplicar = (id) => {
      const foco = id ?? fixa;
      for (const n of A().querySelectorAll("[data-cat]")) { n.classList.toggle("esmaecido", foco !== null && n.dataset.cat !== foco); n.classList.toggle("em-foco", foco !== null && n.dataset.cat === foco); }
      leg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.foco === fixa)));
    };
    leg.append(...itens.map(([cor, texto, id]) => {
      const am = el("span", { class: "amostra" }); am.style.background = cor;
      return el("button", { type: "button", class: "item-legenda", "data-foco": String(id), "aria-pressed": "false",
        onpointerenter: () => aplicar(String(id)), onpointerleave: () => aplicar(null), onfocus: () => aplicar(String(id)), onblur: () => aplicar(null),
        onclick: () => { fixa = fixa === String(id) ? null : String(id); reordenar(); aplicar(null); } }, am, texto);
    }), ...extras);
    return leg;
  };
  /** Legenda de classes de um MAPA que destaca no desenho (design.yaml › padroes.legendas: "interativa quando os itens
   *  correspondem a elementos do gráfico"; projeto cultura, 2026-10-15): passar o mouse ou o foco num item esmaece as
   *  unidades das outras classes; tocar fixa; tocar de novo desfaz. itens: [[cor, texto]] · mapa: função que devolve o
   *  objeto de Lab.mapa (criado depois da legenda) · classeDe(id) → índice do item da unidade (null = sem dado). */
  Lab.legendaMapa = (itens, mapa, classeDe, ...extras) => {
    let fixa = null;
    const leg = el("div", { class: "legenda legenda-interativa", role: "group", "aria-label": "Classes do mapa: passe o mouse ou toque para destacar" });
    const aplicar = (i) => {
      const foco = i ?? fixa, m = mapa();
      if (m) m.atualizar({ opacidade: foco === null ? null : (id) => (classeDe(id) === foco ? 1 : 0.15) }, { animar: false });
      leg.querySelectorAll("button").forEach((b, j) => { b.setAttribute("aria-pressed", String(fixa === j)); b.classList.toggle("apagada", foco !== null && j !== foco); });
    };
    leg.append(...itens.map(([cor, texto], i) => {
      const am = el("span", { class: "amostra" }); am.style.background = cor;
      return el("button", { type: "button", class: "item-legenda", "aria-pressed": "false",
        onpointerenter: () => aplicar(i), onpointerleave: () => aplicar(null), onfocus: () => aplicar(i), onblur: () => aplicar(null),
        onclick: () => { fixa = fixa === i ? null : i; aplicar(null); } }, am, texto);
    }), ...extras);
    return leg;
  };
  /** Legenda categórica: amostra + nome, na ordem fixa das categorias. itens: [[cor, texto]]. */
  Lab.legendaCategorias = (itens, ...extras) => el("div", { class: "legenda" }, ...itens.map(([cor, texto]) => Lab.chave(cor, texto)), ...extras);
})();

/* ==== web/componentes/lab-mapa.js ==== */
/* lab-mapa.js — mapa coroplético com alternativa em círculos proporcionais (cartograma de Dorling). ADR L0003, L0006.
 *
 * Anatomia (design.yaml › padroes.mapa): barra sem fundo no topo (busca à esquerda, Mapa | Círculos à
 * direita) → desenho (com controles + − ⟲ no canto) → card da unidade selecionada → legendas → notas.
 * Lacunas em hachura (nunca cinza liso). Fora de escala: rótulo na margem esquerda com linha de ligação.
 *
 * Camadas (de baixo para cima — L0006): fundo opcional (raster Esri cinza ou vetorial OpenFreeMap) → referência
 * (UFs vizinhas, do IBGE; funciona offline) → unidades → limites finos (sobreposicao) → rótulos de referência →
 * seleção e foco.
 *
 * const m = Lab.mapa(alvo, {
 *   contornos,            // FeatureCollection; properties.id = chave da unidade
 *   sobreposicao,         // FeatureCollection fina desenhada por cima (ex.: municípios sob regiões) — opcional
 *   nome(id), preencher(id) → cor (token("cor-grade") = sem dado), dica(id) → linhas,
 *   abrir(id), rotuloAbrir, // botão do card (ex.: "Ver ficha do município →") — opcional
 *   rotuloAria, rotuloBusca,
 *   tamanho(id), rotuloTamanho,              // habilita Mapa | Círculos
 *   forma: { obter() → "mapa"|"bolhas", definir(v) },
 *   legenda,               // elemento de legenda de cor
 *   rotuloLacuna,          // texto da hachura na legenda (padrão: "sem dados"; ex.: "1 a 4 contemplados — sem números")
 *   detalhado,             // muitas unidades pequenas (padrão: mais de 60): raios menores
 *   // ---- L0006 (todos opcionais) ----
 *   camera,                // "estado" (padrão) | {foco: id | [ids], contexto: 1.5, margens?: [topo, pé]} | {centro: [lon, lat], zoom: k}
 *   zoom,                  // false desliga zoom e arrasto (padrão: ligado)
 *   referencia,            // FeatureCollection de contexto (UFs vizinhas) desenhada por baixo, em cinza
 *   rotulos,               // [{nome, coord: [lon, lat]}] — poucas cidades de referência
 *   fundo,                 // null (padrão) | "esri-cinza" | "vetorial" (OpenFreeMap; o modelo carrega o MapLibre)
 *   escalaBolhas,          // "ds" (padrão: fora de escala acima de 3× a segunda) | "fiel" (área sempre proporcional)
 *   compacto, dimensoes,   // story: sem barra, legendas e notas; desenho [W, H] ocupando o contêiner; card dentro do mapa
 *   opacidade(id), foco(id), aoClicar(id)   // opcionais: opacidade do preenchimento, contorno de foco, aviso do toque
 *   tocar(id) → true      // opcional: o toque/clique é do produto (ex.: abrir o nível de baixo) e não seleciona nem abre o card
 *   ajuste,                // FeatureCollection que define a projeção e o "estado" (padrão: a malha do primeiro desenho)
 *   cameraBolhas,          // câmera em que as unidades serão vistas (raios em px de tela; padrão: a câmera atual)
 * })
 * m.camera(camera, animar = true)  // move a câmera em voo (story: um enquadramento por cartão); devolve a duração (ms)
 * m.planoCamera(camera)            // {k0, k1, duracao, move}: o voo até `camera`, sem mover (coreografia do story)
 * m.dimensoes([W, H])              // compacto: o mesmo mapa num palco de outro tamanho, mantendo centro e zoom na tela
 * m.contornos(fc, parcial)         // troca a malha (ex.: territórios → municípios) no mesmo enquadramento, esmaecendo a antiga
 * m.atualizar({preencher, dica, opacidade, foco, nome}, {animar})   // troca cores e textos sem redesenhar
 * m.forma("mapa" | "bolhas", animar = true)                          // troca a forma (com a transição suave)
 * m.redesenhar()
 * Com ?editar=1 no endereço, o mapa mostra a câmera atual e "Copiar câmera" (para colar no roteiro de um story).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;
  const DURACAO = 1400;      // ms, ida e volta (design.yaml › padroes.mapa_transicao)
  // Voo da câmera (proposta 2026-10-14, Q-093, em teste): trajetória de van Wijk & Nuij (d3.interpolateZoom — afasta,
  // atravessa e aproxima); a duração acompanha o tamanho do voo, entre VOO_MIN e VOO_MAX
  const VOO_MIN = 900, VOO_MAX = 2800, VOO_FATOR = 1.1;
  const DURACAO_MALHA = 650; // troca de malha no mesmo enquadramento: a antiga esmaece por cima da nova
  const MORPH_MAX = 600;     // acima disso, transição alternativa (morph de milhares de polígonos trava o navegador)
  // acima disso, os círculos ficam no centro de cada unidade, sobrepostos e translúcidos (símbolos proporcionais): afastá-los
  // um a um levava ~5 s com os 5.570 municípios (piloto do mapa em níveis, 2026-10-14) e pouco ajuda a ler o país inteiro
  const SOBREPOR_MIN = 2000;
  const ZOOM_MAX = 14;
  const PASSO_ZOOM = 1.8;
  let avisouFlubber = false, avisouMapLibre = false;
  const caminhoCirculo = (x, y, r) => `M${x - r},${y}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0Z`;
  function anelPrincipal(f, caminho) {
    const g = f.geometry, polis = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
    const maior = d3.greatest(polis, (p) => d3.geoArea({ type: "Polygon", coordinates: p }));
    return caminho({ type: "Polygon", coordinates: [maior[0]] });
  }
  /** Afasta os círculos o mínimo para não se sobreporem, partindo do centro de cada unidade. */
  // Desempenho (2026-10-13): só os círculos com tamanho entram na simulação, e com milhares de unidades (ex.: 5.570
  // municípios) o número de passos cai — 300 passos com 3 iterações de colisão levavam ~20 s no navegador; o ganho de
  // qualidade depois de ~80 passos é pequeno (a posição já é aproximada por natureza; nota abaixo do mapa).
  // caixa: [[x0, y0], [x1, y1]] em coordenadas da projeção (o recorte com folga; antes, o palco 0..W × 0..H)
  // folga: 1 px de tela em coordenadas da projeção (= 1 / zoom com que as unidades são vistas)
  function posicionarBolhas(nos, [[cx0, cy0], [cx1, cy1]], folga = 1) {
    const vivos = nos.filter((n) => n.r > 0), muitos = vivos.length > 1500;
    if (vivos.length > SOBREPOR_MIN) { for (const n of nos) { n.x = n.x0; n.y = n.y0; } return; }   // no centro, sobrepostos
    const sim = d3.forceSimulation(vivos).force("x", d3.forceX((n) => n.x0).strength(0.2)).force("y", d3.forceY((n) => n.y0).strength(0.2))
      .force("colisao", d3.forceCollide((n) => n.r + 0.8 * folga).iterations(muitos ? 1 : 3)).stop();
    for (let i = 0, passos = muitos ? 80 : 300; i < passos; i++) {
      sim.tick();
      for (const n of vivos) {   // mantém as bolhas dentro da área do desenho
        n.x = Math.max(cx0 + n.r + 2 * folga, Math.min(cx1 - n.r - 2 * folga, n.x));
        n.y = Math.max(cy0 + n.r + 2 * folga, Math.min(cy1 - n.r - 2 * folga, n.y));
      }
    }
  }

  // ---------------------------------------------------------------- fundo (L0006)
  const ATRIBUICAO = {
    "esri-cinza": "Fundo: Esri, HERE, Garmin, © colaboradores do OpenStreetMap",
    vetorial: "Fundo: © OpenFreeMap · © colaboradores do OpenStreetMap",
  };
  const escuro = () => { const t = document.documentElement.dataset.theme; return t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); };
  const urlEsri = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${escuro() ? "World_Dark_Gray_Base" : "World_Light_Gray_Base"}/MapServer/tile/${z}/${y}/${x}`;
  const estiloVetorial = () => `https://tiles.openfreemap.org/styles/${escuro() ? "dark" : "positron"}`;
  // blocos de mapa (Web Mercator, mesma projeção do d3.geoMercator)
  const tileLon = (x, z) => (x / 2 ** z) * 360 - 180;
  const tileLat = (y, z) => { const n = Math.PI - (2 * Math.PI * y) / 2 ** z; return (180 / Math.PI) * Math.atan(Math.sinh(n)); };
  const lonTile = (lon, z) => Math.floor(((lon + 180) / 360) * 2 ** z);
  const latTile = (lat, z) => { const r = (lat * Math.PI) / 180; return Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z); };
  /** Fundo raster Esri cinza (L0006): os blocos visíveis com a transformação `t`, desenhados em `g` nas coordenadas da
   *  projeção (o grupo pai leva `t`); `s` = escala do desenho na página. Também usado por outros mapas (Lab.fundoRaster). */
  function desenharBlocos(g, proj, W, H, t, s = 1) {
    const z = Math.max(0, Math.min(17, Math.round(Math.log2((2 * Math.PI * proj.scale() * t.k * s * Math.min(2, devicePixelRatio || 1)) / 256))));
    const [lon0, lat0] = proj.invert(t.invert([0, 0])), [lon1, lat1] = proj.invert(t.invert([W, H]));
    const blocos = [];
    for (let x = lonTile(lon0, z); x <= lonTile(lon1, z); x++) for (let y = latTile(lat0, z); y <= latTile(lat1, z); y++) blocos.push([x, y, z]);
    if (blocos.length > 120) return;
    g.selectAll("image").data(blocos, (b) => b.join("/")).join("image")
      .attr("preserveAspectRatio", "none").attr("href", ([x, y]) => urlEsri(z, x, y))
      .each(function ([x, y]) {
        const [ax, ay] = proj([tileLon(x, z), tileLat(y, z)]), [bx, by] = proj([tileLon(x + 1, z), tileLat(y + 1, z)]);
        d3.select(this).attr("x", ax).attr("y", ay).attr("width", bx - ax + 0.5).attr("height", by - ay + 0.5);
      })
      .on("error", function () { d3.select(this).remove(); });
  }
  Lab.fundoRaster = { desenhar: desenharBlocos, atribuicao: ATRIBUICAO["esri-cinza"] };

  /** Câmera "estado": o recorte inteiro (a malha do primeiro desenho), com a folga de 12 px. No desenho original é a
   *  identidade; com o mesmo mapa num palco de outra proporção (cartão mais baixo), o zoom pode ficar abaixo de 1. */
  function transformacaoEstado({ caminho, ajuste, fc, W, H }) {
    const [[x0, y0], [x1, y1]] = caminho.bounds(ajuste || fc);

          if (x1 > x0) gf.append("path").attr("d", `M${x0},${ty + 3 / kV} L${x1 - 6 / kV},${ty + 3 / kV} L${x1},${n.y}`)
            .attr("fill", "none").attr("stroke", Lab.token("cor-texto-secundario")).attr("stroke-width", 1).attr("vector-effect", "non-scaling-stroke");
        });
      }
      if (opts.sobreposicao && !bolhas) {
        cena.append("path").datum(opts.sobreposicao).attr("d", caminho).attr("fill", "none").attr("class", "sobreposicao")
          .attr("stroke", Lab.token("cor-texto")).attr("stroke-opacity", 0.12).attr("stroke-width", 0.3).attr("pointer-events", "none");
      }
      // rótulos de referência (poucas cidades), escondidos nos círculos (lá a posição é aproximada)
      const gRot = opts.rotulos && !bolhas ? cena.append("g").attr("class", "rotulos-ref").attr("pointer-events", "none") : null;
      if (gRot) gRot.selectAll("g").data(opts.rotulos).join((e) => {
        const g = e.append("g").attr("transform", (r) => `translate(${proj(r.coord)})`);
        g.append("circle").attr("r", 2.2);
        g.append("text").attr("x", 4).attr("y", -4).text((r) => r.nome);
        return g;
      });
      if (temLacuna || (bolhas && fc.features.some((f) => opts.preencher(f.properties.id) === semDado)))
        zonaLeg.append(el("div", { class: "legenda" }, el("span", { class: "chave" }, el("span", { class: "amostra hachura" }), opts.rotuloLacuna || "sem dados")));
      if (fundo) moldura.append(el("div", { class: "mapa-atribuicao", text: ATRIBUICAO[fundo] }));

      // ------------------------------------------------ card da unidade selecionada (clique ou busca)
      // computador: card flutuante perto da unidade; celular: logo abaixo do desenho, perto do toque (L0006)
      // compacto (story e bancada): o card encaixa no pé ou no alto do próprio mapa, do lado oposto à unidade
      const flutuante = !compacto && matchMedia("(hover: hover) and (pointer: fine)").matches;
      const painel = el("div", { class: `painel-sel${flutuante ? " flutuante" : compacto ? " rodape" : ""}`, "aria-live": "polite" });
      if (flutuante || compacto) moldura.append(painel); else alvo.insertBefore(painel, zonaLeg);
      const posicionarPainel = () => {
        if (!(flutuante || compacto) || painel.hidden) return;
        const sel = Lab.selecoes.get(esc) || "", n = nos.find((x) => x.id === sel);
        if (!n) return;
        const t = est.transform || d3.zoomIdentity, s = est.svg.clientWidth / W;
        const [px, py] = t.apply(bolhas ? [n.x, n.y] : [n.x0, n.y0]).map((v) => v * s);
        if (compacto) { painel.classList.toggle("topo", py > est.svg.clientHeight * 0.55); return; }
        const lw = painel.offsetWidth, lh = painel.offsetHeight, mw = moldura.clientWidth, mh = est.svg.clientHeight;
        let x = px + 16, y = py - lh / 2;
        if (x + lw > mw - 4) x = Math.max(4, px - lw - 16);
        y = Math.max(4, Math.min(mh - lh - 4, y));
        painel.style.left = `${x}px`; painel.style.top = `${y}px`;
      };
      const atualizarPainel = () => {
        const sel = Lab.selecoes.get(esc) || "";
        const u = sel && fc.features.some((f) => f.properties.id === sel) ? sel : null;
        painel.hidden = !u;
        if (!u) { busca.value = ""; return; }
        busca.value = nome(u);
        // compacto: "Aproximar" leva a câmera até a unidade (⟲ volta ao enquadramento do cartão)
        const aproximar = compacto && est.zoom ? el("button", { type: "button", class: "voltar", text: "⊕ Aproximar", onclick: () => {
          painel.classList.remove("topo");   // o card fica no pé; a unidade, na faixa livre acima dele
          api.camera({ foco: u, contexto: 1.6, margens: [0, (painel.offsetHeight + 12) * (W / (est.svg.clientWidth || W))] }, true, { base: false });
        } }) : null;
        Lab.conteudoPainel(painel, { u, nome: nome(u), linhas: opts.dica(u), abrir: opts.abrir, rotuloAbrir: opts.rotuloAbrir, esc, acoes: [aproximar] });
        requestAnimationFrame(posicionarPainel);
      };
      Lab.registrarPainel(esc, atualizarPainel, alvo);   // um registro por mapa (o redesenho troca, não acumula)
      atualizarPainel();
      // troca de cores e textos sem redesenhar (story: o mesmo mapa muda de estado entre cartões)
      est.recolorir = (animar) => {
        temLacuna = false;
        const sel = animar && !Lab.semMovimento() ? formas.transition().duration(650) : formas;
        sel.attr("fill", (n) => preencherH(n.id)).style("fill-opacity", (n) => (opts.opacidade ? opts.opacidade(n.id) * (fundo ? 0.85 : 1) : null))   /* estilo: vence o .85 do fundo no CSS */;
        formas.classed("foco", (n) => Boolean(opts.foco?.(n.id)));
        atualizarPainel();
      };
      if (alvo.isConnected) Lab.aplicarSelecao(esc);
      if (bolhas && !compacto) zonaLeg.append(Lab.legendaTamanho(escalaR, opts.rotuloTamanho));
      if (bolhas && !compacto) alvo.append(Lab.notaFora(nos.filter((n) => n.fora).map((n) => nome(n.id))),
        el("p", { class: "nota", text: "Círculos: cada um parte do centro da unidade e é afastado o mínimo para não se sobrepor; a posição é aproximada." }));

      // ------------------------------------------------ fundo raster: blocos visíveis no zoom atual
      const atualizarTiles = () => { if (gTiles) desenharBlocos(gTiles, proj, W, H, est.transform || d3.zoomIdentity, (est.svg.clientWidth || W) / W); };
      // ------------------------------------------------ fundo vetorial: centro e zoom do MapLibre = câmera do SVG
      const sincronizarVetorial = () => {
        const v = est.vetorial;
        if (!v) return;
        const sv = est.svg, cw = sv.clientWidth, ch = sv.clientHeight;
        if (!cw) return;
        v.caixa.style.width = `${cw}px`; v.caixa.style.height = `${ch}px`;
        v.caixa.style.opacity = bolhas ? 0 : 1;
        const t = est.transform || d3.zoomIdentity;
        const centro = proj.invert(t.invert([W / 2, H / 2]));
        const zoomML = Math.log2((2 * Math.PI * proj.scale() * t.k * (cw / W)) / 512);
        if (!v.mapa) {
          try {
            v.mapa = new maplibregl.Map({ container: v.caixa, style: estiloVetorial(), center: centro, zoom: zoomML, interactive: false, attributionControl: false, fadeDuration: 0 });
            v.mapa.on("error", (e) => console.warn("lab-mapa: fundo vetorial com erro —", e?.error?.message || e));
          } catch (e) {   // sem WebGL, por exemplo: o mapa segue sem fundo
            console.warn("lab-mapa: fundo vetorial indisponível —", e.message);
            v.caixa.remove(); est.vetorial = null;
            moldura.classList.remove("com-fundo"); moldura.querySelector(".mapa-atribuicao")?.remove();
          }
        } else { v.mapa.resize(); v.mapa.jumpTo({ center: centro, zoom: zoomML }); }
      };

      // ------------------------------------------------ câmera, zoom e arrasto (L0006)
      const aplicar = (t) => {
        est.transform = t;
        cena.attr("transform", t);
        // rótulos e marcadores mantêm o tamanho na tela (descontados o zoom e a escala do desenho na página)
        const f = (W / (est.svg.clientWidth || W)) / t.k;
        cena.selectAll(".rotulos-ref text, .rotulo-fora").style("font-size", (d, i, n) => `${(n[i].classList.contains("rotulo-fora") ? 11 : 12) * f}px`)
          .style("stroke-width", `${3 * f}px`);
        cena.selectAll(".rotulos-ref text").attr("x", 4 * f).attr("y", -4 * f);
        cena.selectAll(".rotulos-ref circle").attr("r", 2.4 * f);
        const vistos = [];
        cena.selectAll(".rotulos-ref > g").each(function () {
          this.style.display = "";
          const r = this.getBoundingClientRect();
          const bate = r.width && vistos.some((v) => r.left < v.right + 2 && r.right > v.left - 2 && r.top < v.bottom && r.bottom > v.top);
          if (bate) this.style.display = "none"; else if (r.width) vistos.push(r);
        });

        posicionarPainel();
        sincronizarVetorial();
        for (const f of est.aoZoom) f(t);
      };
      const inicial = est.transform || transformacaoCamera(est.camera, est.geo);
      if (zoomAtivo) {
        const kE = transformacaoEstado(est.geo).k;
        const zoom = d3.zoom().scaleExtent([Math.min(1, kE), ZOOM_MAX * Math.max(1, kE)]).translateExtent([[-W * 0.3, -H * 0.3], [W * 1.3, H * 1.3]]).clickDistance(4)
          .filter((ev) => {
            const k = (est.transform || d3.zoomIdentity).k;
            if (ev.type === "wheel") return ev.ctrlKey || ev.metaKey;           // roda sozinha rola a página
            if (ev.type.startsWith("touch")) return ev.touches.length > 1;   // um dedo nunca move o mapa (rola a página ou passa o cartão); dois dedos movem e ampliam (L0013)

            return !ev.button;

          .on("zoom", (ev) => aplicar(ev.transform))
          .on("end", () => atualizarTiles());
        est.zoom = zoom;
        svg.call(zoom).on("dblclick.zoom", null);
        svg.style("touch-action", "pan-x pan-y");   // um dedo fica com a página (rolar, passar cartão); a pinça fica com o mapa
        svg.call(zoom.transform, inicial);
        // aviso: Ctrl + roda amplia (a roda sozinha continua rolando a página); dois dedos movem no celular
        const textoRoda = `${/Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl"} + roda do mouse para ampliar`;
        const avisoRoda = el("div", { class: "mapa-aviso", hidden: "", text: textoRoda });
        moldura.append(avisoRoda);
        let tAviso = null;
        function avisar(t) { avisoRoda.textContent = t; avisoRoda.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(() => { avisoRoda.hidden = true; }, 1400); }
        svg.on("wheel.aviso", (ev) => { if (ev.ctrlKey || ev.metaKey) return; avisar(textoRoda); });
        // arrastar com um dedo no mapa ampliado: lembrete dos dois dedos (tocar, sem arrastar, não avisa)
        svg.node().addEventListener("touchmove", (ev) => { if (ev.touches.length === 1 && (est.transform || d3.zoomIdentity).k > 1.01) avisar("Use dois dedos para mover o mapa"); }, { passive: true });
        const mover = (f) => { const s = d3.select(est.svg); (Lab.semMovimento() ? s : s.transition().duration(350)).call(f); };
        moldura.append(el("div", { class: "mapa-controles", role: "group", "aria-label": "Zoom do mapa" },
          el("button", { type: "button", "aria-label": "Ampliar", title: "Ampliar", text: "+", onclick: () => mover((s) => zoom.scaleBy(s, PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Reduzir", title: "Reduzir", text: "−", onclick: () => mover((s) => zoom.scaleBy(s, 1 / PASSO_ZOOM)) }),
          el("button", { type: "button", "aria-label": "Voltar ao enquadramento inicial", title: "Voltar ao enquadramento", text: "⟲",
            onclick: () => api.camera(est.camera) })));
      } else {
        aplicar(inicial);
      }
      atualizarTiles();
      // modo de edição (?editar=1): mostra a câmera atual para copiar no roteiro
      if (editar) {
        const saida = el("code");
        const textoCamera = () => {
          const t = est.transform || d3.zoomIdentity, [lon, lat] = proj.invert(t.invert([W / 2, H / 2]));
          return `camera: {centro: [${lon.toFixed(3)}, ${lat.toFixed(3)}], zoom: ${t.k.toFixed(2)}}`;
        };
        const atualizarSaida = () => { saida.textContent = textoCamera(); };
        est.aoZoom = [atualizarSaida];
        atualizarSaida();
        moldura.append(el("div", { class: "mapa-editar" }, saida,
          el("button", { type: "button", text: "Copiar câmera", onclick: async (ev) => {
            try { await navigator.clipboard.writeText(textoCamera()); ev.target.textContent = "Copiado ✓"; } catch (e) { window.prompt("Copie a câmera:", textoCamera()); }

    };

    const api = {
      /** Move a câmera ("estado" | {foco, contexto} | {centro, zoom}) em voo (afasta, atravessa, aproxima), com duração
       *  proporcional ao caminho; sem animação com prefers-reduced-motion. Devolve a duração (ms). */
      camera(camera, animar = true, { base = true, malha = null } = {}) {

        // malha: o foco é procurado nesta malha (a que vai entrar, quando o voo vem antes da troca de malha)
        if (base) est.camera = camera || "estado";

        const t = transformacaoCamera(camera || "estado", malha ? { ...est.geo, fc: malha } : est.geo);
        if (!est.zoom) { est.transform = t; desenhar(null); return 0; }
        const s = d3.select(est.svg), { duracao, move } = planoVoo(est.transform || d3.zoomIdentity, t, est.geo.W, est.geo.H);
        const animado = animar && move && !Lab.semMovimento();
        (animado ? s.transition().duration(duracao).ease(d3.easeCubicInOut) : s).call(est.zoom.transform, t);

      },
      /** O voo até `camera`, sem mover: {k0, k1, duracao, move} (o story escolhe a ordem: conteúdo antes ou depois). */
      planoCamera(camera, malha = null) {
        if (!est.geo) return { k0: 1, k1: 1, duracao: 0, move: false };
        return planoVoo(est.transform || d3.zoomIdentity, transformacaoCamera(camera || "estado", malha ? { ...est.geo, fc: malha } : est.geo), est.geo.W, est.geo.H);
      },
      /** Compacto: o mesmo mapa num palco de outro tamanho (cartão com outro texto ou com um gráfico embaixo). Mantém o
       *  ponto do centro e o zoom na tela; devolve true se redesenhou. */
      dimensoes(d) {
        if (!compacto || !est.geo || !d) return false;
        const [W2, H2] = d.map((v) => Math.max(120, Math.round(v))), { W, H, proj } = est.geo;
        if (Math.abs(W2 - W) < 3 && Math.abs(H2 - H) < 3) return false;
        const t = est.transform || d3.zoomIdentity, tE = transformacaoEstado(est.geo);
        const noEstado = Math.abs(t.k - tE.k) / tE.k < 0.02 && Math.abs(t.x - tE.x) < 2 && Math.abs(t.y - tE.y) < 2;
        est.manter = noEstado ? { estado: true } : { c: proj.invert(t.invert([W / 2, H / 2])), k: t.k };
        opts.dimensoes = [W2, H2];
        desenhar(null);
        return true;
      },
      /** Troca a malha (ex.: territórios → municípios) no mesmo enquadramento e na mesma projeção: a malha antiga fica por
       *  cima e esmaece. `parcial`: opções que mudam junto (preencher, dica, opacidade, foco, nome). */
      contornos(novo, parcial = {}) {
        Object.assign(opts, parcial);
        if (!novo?.features?.length || novo === fc) { if (est.recolorir) est.recolorir(true); return; }
        const velho = est.svg?.querySelector("path.u")?.parentNode?.cloneNode(true);
        fc = novo;
        desenhar(null);
        if (!velho || Lab.semMovimento()) return;
        velho.setAttribute("pointer-events", "none");
        velho.querySelectorAll("[data-u]").forEach((n) => n.removeAttribute("data-u"));   // o fantasma não entra na seleção
        const cena = est.svg.querySelector(".cena");
        cena.insertBefore(velho, cena.querySelector(".rotulos-ref, .sobreposicao"));
        d3.select(velho).transition().duration(DURACAO_MALHA).ease(d3.easeCubicInOut).style("opacity", 0).remove();
      },
      /** Troca cores, textos, opacidade e foco sem redesenhar (com transição). */
      atualizar(parcial = {}, { animar = true } = {}) {
        Object.assign(opts, parcial);
        if (est.recolorir) est.recolorir(animar);
      },
      /** Troca a forma (Mapa | Círculos) com a transição do design system. */
      forma(v, animar = true) {
        if (!opts.forma || !opts.tamanho || opts.forma.obter() === v) return;
        const anterior = opts.forma.obter();
        opts.forma.definir(v);
        if (ctrl) for (const bt of ctrl.querySelectorAll("button")) bt.setAttribute("aria-pressed", bt.dataset.chave === `Representação|${v}`);
        desenhar(animar && !Lab.semMovimento() ? anterior : null);
      },
      redesenhar() { desenhar(null); },
      /** Escala de raio das bolhas (para a legenda de tamanho no modo compacto — Q-062); null sem tamanho. */
      escalaTamanho() { return est.escalaR || null; },
      /** Círculos no centro de cada unidade, sobrepostos (muitas unidades), em vez de afastados (Dorling). */
      circulosSobrepostos() { return (est.geo?.fc?.features?.length || 0) > SOBREPOR_MIN; },
    };
    desenharMapa(null);
    return api;
  };
})();

/* ==== web/componentes/lab-metodologia.js ==== */
/* lab-metodologia.js — bloco "Fontes de Dados, Metodologia e Códigos", padrão de todos os produtos (ADR L0003).
 * Modelo: README do Agregador de Pesquisas (O POVO/DATADOC). O conteúdo vem pronto do Python
 * (labdados.metodologia.montar): textos do produto (src/metodologia.yaml) + partes automáticas
 * (fontes com datas e hashes do manifesto, ADRs, trechos de código, conferência de qualidade, versão).
 *
 * Lab.blocoMetodologia(m, { baixar: { rotulo, acao }, linkAutor: { href, texto } })
 * Lab.rodapePagina(m, opts) → bloco + assinatura final (preenche o <footer id="rodape">).
 */
(function () {
  "use strict";
  const Lab = window.Lab;
  const el = Lab.el;

  /** Diagrama de fluxo dos dados (pesquisador, 2026-10-12; vale para os exploratórios): bases que entram → operações
   *  (cruzamentos, filtros, agrupamentos…) → saídas do produto. Declarado em src/metodologia.yaml › fluxo:
   *    entradas: [{id, rotulo, nota?, restrita?}] · operacoes: [{id, rotulo, tipo, de: [ids], nota?}] · saidas: [{id, rotulo, de, link?, nota?}]
   *    transversais: [{id, rotulo, tipo, nota?, exceto?: [ids de saídas]}] — operações que valem para todas as saídas (ex.:
   *    supressão de 1 a 4): ficam numa faixa à parte, sob o diagrama, sem uma ligação para cada saída; passar o mouse na
   *    faixa acende as saídas a que ela se aplica (pesquisador, 2026-10-14).
   *  Colunas por profundidade (uma operação que parte de outra vai para a coluna seguinte); ligações em SVG redesenhadas a
   *  cada mudança de tamanho. Passar o mouse (ou focar) num nó acende o caminho dele — de onde vem e para onde vai. No
   *  celular, uma coluna só, e cada nó diz de onde vem ("← …"). */
  const TIPOS_FLUXO = { base: "base", cruzamento: "⨝ cruzamento", filtro: "⧩ filtro", agrupamento: "Σ agrupamento", derivacao: "ƒ derivação",
    conferencia: "✓ conferência", supressao: "▦ supressão", saida: "saída" };
  Lab.diagramaFluxo = (f) => {
    const nos = new Map();
    const add = (n, papel) => nos.set(n.id, { ...n, papel, de: [].concat(n.de || []) });
    (f.entradas || []).forEach((n) => add(n, "entrada"));
    (f.operacoes || []).forEach((n) => add(n, "operacao"));
    (f.saidas || []).forEach((n) => add(n, "saida"));
    const prof = new Map();
    const nivel = (id, pilha = new Set()) => {
      if (prof.has(id)) return prof.get(id);
      const n = nos.get(id);
      if (!n || pilha.has(id)) return 0;
      pilha.add(id);
      const v = n.papel === "entrada" ? 0 : 1 + Math.max(0, ...n.de.map((d) => nivel(d, pilha)));
      prof.set(id, v);
      return v;
    };
    [...nos.keys()].forEach((id) => nivel(id));
    // três faixas: bases | operações (uma coluna, na ordem do caminho — profundidade, depois a ordem declarada) | saídas
    const ordemDecl = [...nos.keys()];
    const faixa = (papel) => [...nos.values()].filter((n) => n.papel === papel).sort((a, b) => (papel === "operacao" ? prof.get(a.id) - prof.get(b.id) : 0) || ordemDecl.indexOf(a.id) - ordemDecl.indexOf(b.id));
    const colunas = [["Bases que entram", faixa("entrada")], ["Operações", faixa("operacao")], ["Saídas", faixa("saida")]];
    const cor = { entrada: Lab.token("cor-cat-1"), operacao: Lab.token("cor-cat-3"), saida: Lab.token("cor-cat-2") };
    const caixa = el("div", { class: "fluxo", role: "group", "aria-label": "Fluxo dos dados: bases, operações e saídas" });
    const els = new Map();
    for (const [k, [titulo, col]] of colunas.entries()) {
      caixa.append(el("div", { class: `fluxo-col fluxo-col-${k}` }, el("h4", { text: titulo }), ...col.map((n) => {
        const tipo = n.papel === "entrada" ? "base" : n.papel === "saida" ? "saida" : n.tipo || "derivacao";
        const nomeDe = n.de.map((d) => nos.get(d)?.rotulo || d).join(", ");
        const no = el("div", { class: `fluxo-no${n.restrita ? " restrita" : ""}`, tabindex: "0", "data-id": n.id,
          "aria-label": `${n.rotulo}${nomeDe ? `, a partir de: ${nomeDe}` : ""}${n.nota ? `. ${n.nota}` : ""}` },
          el("span", { class: "tipo", text: TIPOS_FLUXO[tipo] || tipo }),
          n.link ? el("b", {}, el("a", { href: n.link, text: n.rotulo })) : el("b", { text: n.rotulo }),
          n.nota ? el("span", { class: "nota", text: n.nota }) : null,
          nomeDe ? el("span", { class: "de", text: `← ${nomeDe}` }) : null);
        no.style.setProperty("--cor-fluxo", cor[n.papel]);
        els.set(n.id, no);
        return no;
      })));

      if (st.caminho.length) trilha.append(el("button", { type: "button", class: "voltar", onclick: () => ir(st.caminho.slice(0, -1)) }, "‹ Voltar"));
      const passos = [D.raiz?.nome || "Tudo", ...st.caminho.map((id, i) => nomeDe(st.base + i, id))];
      passos.forEach((nm, i) => {
        if (i) trilha.append(el("span", { class: "sep", "aria-hidden": "true", text: "›" }));
        trilha.append(i === passos.length - 1 ? el("b", { text: nm, "aria-current": "location" }) : el("button", { type: "button", onclick: () => ir(st.caminho.slice(0, i)) }, nm));
      });

        el("option", { value: "", text: `Abrir ${N[k].rotulo_um || "unidade"}… ▾` }), ...abriveis.map((id) => el("option", { value: id, text: nomeDe(k, id) }))));

        el("option", { value: "", text: `Procurar ${N[k].rotulo_um || "unidade"}… ▾` }),

        ...[["mapa", "Mapa"], ["bolhas", "Círculos"]].map(([v, r]) => el("button", { type: "button", "aria-pressed": String(st.forma === v), onclick: () => trocarForma(v) }, r)));

    const trocarForma = (v) => {

    // ------------------------------------------------ navegação: abre no alto e desce; volta subindo e só então troca
    function ir(novo, base = st.base) {

  /** mapa (coroplético) — o Lab.mapa do DS (L0006) em modo compacto: a implementação única do mapa de polígonos.
   *  dados: {contornos (FeatureCollection, properties.id) ou malha (nome de uma malha em e.malhas, compartilhada entre
   *          cartões), unidades: {id: {nome, categoria, linhas: [dica], tamanho, opacidade?, foco?}},
   *          categorias: [{id, rotulo, cor}], camera?, forma?, referencia?, rotulos?, rotulo_tamanho?, destaque?,
   *          subnivel?: {rotulo: "municípios", rotulo_pai: "territórios", contornos, unidades: {id: {…, pai}}}}
   *  opcoes: camera, forma (mapa | bolhas), escala_bolhas (ds | fiel), fundo (vetorial | esri-cinza), destaque (id de

   *  Estado entre cartões (proposta 2026-10-14, Q-093, em teste): o MESMO mapa segue de um cartão com mapa para o

  adaptadores.mapa = (C) => {
    if (C.dados?.niveis) return mapaNiveis(C);   // mapa em níveis (Q-094)
    const alvo = C.alvo;
    let D = C.dados;
    // peças grandes ficam uma vez só na base e os cartões citam pelo nome: malha (e.malhas), camada de unidades
    // (e.unidades), referência (e.referencias) e rótulos (e.rotulos)
    const ref = (v, colecao) => (typeof v === "string" ? C.e?.[colecao]?.[v] : v);
    const malhaDe = (Dx) => Dx?.contornos || (Dx?.malha ? C.e?.malhas?.[Dx.malha] : null) || null;
    let MALHA = malhaDe(D);
    if (!MALHA?.features?.length) return semDados(C);
    // aninhamento (Q-080, protótipo): com `dados.subnivel`, o card da unidade oferece abrir o nível de baixo (ex.:
    // território → municípios); a câmera aproxima a unidade e o mapa troca para as unidades dela; "‹ Todos" volta
    const SUB = D.subnivel?.contornos?.features?.length ? D.subnivel : null, est = C.est || {}, chave = `mapa-nivel:${C.espec?.id || ""}`;
    const pai = SUB && est[chave] && MALHA.features.some((f) => f.properties.id === est[chave]) ? est[chave] : null;

    const lerEstado = (Dx, o) => {
      const cs = Dx.categorias || [];
      return { U: (pai ? SUB.unidades : ref(Dx.unidades, "unidades")) || {}, cats: cs, corCat: Object.fromEntries(cs.map((k) => [k.id, corDe(k.cor)])),
        realce: Dx.realce ? new Set([].concat(Dx.realce)) : null,   // unidades em destaque (ex.: as do território escolhido); as demais esmaecem
        dest: o?.destaque ?? Dx.destaque ?? null };                 // categoria fixada pelo roteiro (seleção de legenda)
    };
    const aplicarEstado = (s) => { ({ U, cats, corCat, realce, dest } = s); };
    aplicarEstado(lerEstado(D, C.opc));
    let contornos = pai ? { type: "FeatureCollection", features: SUB.contornos.features.filter((f) => SUB.unidades[f.properties.id]?.pai === pai) } : MALHA;
    // no nível de baixo, as outras unidades de cima viram contexto (contorno cinza), junto com a referência
    const refD = ref(D.referencia, "referencias");
    const referencia = pai ? { type: "FeatureCollection", features: [...(refD?.features || []), ...MALHA.features.filter((f) => f.properties.id !== pai)] } : refD;
    const W = alvo.clientWidth, H = Math.max(180, alvo.clientHeight);
    alvo.dataset.escopo ||= `viz-mapa-${Math.random().toString(36).slice(2, 8)}`;
    const formaDe = (Dx, o) => ((o.forma || Dx.forma) === "bolhas" ? "bolhas" : "mapa");
    let forma = formaDe(D, C.opc);
    const temTamanho = Object.values(U).some((u) => u.tamanho);
    const opBase = (id) => U[id]?.opacidade ?? (realce ? (realce.has(id) ? 1 : 0.22) : 1);
    const comOpacidade = () => Boolean(realce) || Object.values(U).some((u) => u.opacidade != null);
    // opacidade com uma categoria fixada (pela legenda ou pelo roteiro): as outras esmaecem
    const opacidadeCom = (id) => (id ? (u) => (U[u]?.categoria === id ? opBase(u) : 0.18) : comOpacidade() ? opBase : null);
    const focoDe = (id) => Boolean(U[id]?.foco) || Boolean(realce?.has(id) && realce.size === 1);
    const camera = pai ? { foco: contornos.features.map((f) => f.properties.id), contexto: 1.12 } : est[`${chave}:volta`] ? { foco: est[`${chave}:volta`], contexto: 1.12 } : D.camera || C.opc.camera;
    // chegada de um cartão sem mapa (est.voarMapa, marcado pela troca de cartão): parte do recorte inteiro e voa
    const voarAoEntrar = C.interativa && !C.naImagem && !pai && est.voarMapa && camera && camera !== "estado";
    let api = null;
    const abrir = SUB && !pai && C.interativa && !C.naImagem ? (id) => {
      if (!contornos.features.some((f) => f.properties.id === id) || !Object.values(SUB.unidades).some((u) => u.pai === id)) return;
      Lab.selecionar("", alvo);
      api.camera({ foco: id, contexto: 1.12 });   // aproxima a unidade; depois o mapa troca de nível no mesmo enquadramento
      setTimeout(() => { est[chave] = id; redesenhar(); }, Lab.semMovimento() ? 0 : 900);
    } : null;
    const redesenhar = () => { alvo.replaceChildren(); C.legenda?.replaceChildren(); adaptadores.mapa(C); };
    api = Lab.mapa(alvo, { contornos, compacto: true, dimensoes: [W, H], zoom: !C.naImagem,
      nome: (id) => U[id]?.nome || id, preencher: (id) => (D.escala?.tipo === "continua" ? escalaContinua(D.escala)(U[id]?.mud) : corCat[U[id]?.categoria] || tok("cor-grade")), dica: (id) => U[id]?.linhas || [],
      opacidade: opacidadeCom(dest), foco: focoDe,
      rotuloAria: C.opc.aria || `Mapa por ${cats.map((k) => k.rotulo).join(", ")}${pai ? ` — ${SUB.rotulo} de ${D.unidades?.[pai]?.nome || pai}` : ""}.`,
      referencia, rotulos: pai ? null : ref(D.rotulos, "rotulos"), fundo: C.naImagem ? null : C.opc.fundo || D.fundo || null, camera: voarAoEntrar ? "estado" : camera,
      tamanho: temTamanho ? (id) => U[id]?.tamanho || 0 : null, rotuloTamanho: D.rotulo_tamanho || "tamanho",
      forma: { obter: () => forma, definir: (v) => { forma = v; } }, escalaBolhas: (C.opc.escala_bolhas || D.escala_bolhas) === "fiel" ? "fiel" : "ds",
      abrir, rotuloAbrir: SUB ? `Abrir ${SUB.rotulo} ›` : undefined });
    // o palco pode encolher depois do desenho (legenda e nota preenchidas): o mapa toma a medida final, sem faixas
    if (!C.naImagem) requestAnimationFrame(() => {

    });
    if (voarAoEntrar) setTimeout(() => { if (alvo.isConnected) api.camera(camera); }, 380);   // depois do cartão surgir (0,4 s)
    if (est[`${chave}:volta`]) {   // voltando do nível de baixo: começa na unidade e afasta até o enquadramento do cartão
      est[`${chave}:volta`] = null;
      requestAnimationFrame(() => api.camera(C.opc.camera || "estado"));
    }
    if (pai && C.interativa && !C.naImagem) {
      const voltar = () => { est[`${chave}:volta`] = pai; est[chave] = null; redesenhar(); };
      alvo.append(el("div", { class: "fundo-mini so-interativo", role: "group", "aria-label": "Nível do mapa" },
        el("button", { type: "button", onclick: voltar }, `‹ Todos os ${SUB.rotulo_pai || "níveis"}`),
        el("span", { class: "rot-mini", text: D.unidades?.[pai]?.nome || pai })));
    }
    // legenda do estado `s` (o que vai valer no cartão; no story, montada antes da coreografia para o palco ter a altura certa)
    const legenda = (Cx, s = { U, cats, contornos, forma, D }) => {
      const presentes = new Set(s.contornos.features.map((f) => s.U[f.properties.id]?.categoria));
      const continua = s.D.escala?.tipo === "continua";
      legendaCategorias(Cx, continua ? [] : s.cats.filter((k) => presentes.has(k.id)), (id) => api.atualizar({ opacidade: opacidadeCom(id) }),
        [s.contornos.features.some((f) => s.U[f.properties.id]?.categoria == null) ? "hachura: sem dados" : null,
          s.forma === "bolhas" ? `círculos: área proporcional a ${s.D.rotulo_tamanho || "tamanho"}; posição aproximada` : null,
          Object.values(s.U).some((u) => u.foco) ? s.D.rotulo_foco || "contorno: em destaque" : null,
          abrir ? `tocar num ${s.D.rotulo_unidade || "território"} e em “Abrir ${SUB.rotulo}” mostra o nível de baixo` : null]);
      if (continua) legendaContinua(Cx, s.D.escala);

    const legendaTamanho = () => {
      alvo.querySelector(".leg-tamanho-sobre")?.remove();
      const esc = api.escalaTamanho?.();
      if (forma === "bolhas" && esc && !C.naImagem) alvo.append(el("div", { class: "leg-tamanho-sobre" }, Lab.legendaTamanho(esc, D.rotulo_tamanho || "tamanho")));
    };
    // a categoria fixada pelo roteiro aparece pressionada na legenda (o leitor solta com um toque)
    const fixarDestaque = (Cx) => { if (dest != null) Cx.legenda?.querySelector(`button[data-cat="${CSS.escape(String(dest))}"]`)?.click(); };
    legenda(C);
    legendaTamanho();
    fixarDestaque(C);
    if (C.naImagem) svgMapaParaImagem(alvo, W, H);
    let agendados = [];
    const MORPH_MS = 1400;   // troca círculos ⇄ geometrias do Lab.mapa (design.yaml › padroes.mapa_transicao)
    const agendar = (f, ms) => { agendados.push(setTimeout(() => { if (alvo.isConnected) f(); }, ms)); };
    return {
      api,
      /** Próximo cartão (ou outra escolha no Explorar) com mapa: o mesmo mapa muda de estado, sem ser redesenhado do zero.
       *  Coreografia (proposta 2026-10-14, Q-093): quem aproxima muda o conteúdo antes de descer; quem afasta sobe e
       *  depois muda; num voo lateral, a cor muda no meio (o ponto mais alto do voo). Malha e forma redesenham o
       *  desenho: nunca no meio de um voo. Sem animação com prefers-reduced-motion. */
      atualizar(Cn) {

        const recolorir = () => {

          if (trocaMalha) { MALHA = malhaN; contornos = malhaN; forma = nova; api.contornos(malhaN, parcial); }

          else if (p.k1 < p.k0 / 1.25 || redesenha) { const d = voar(); agendar(conteudo, d * 0.92); }             // afasta: sobe e muda

  /** barras100 — barras empilhadas de 100%, uma por linha, em SVG (L0012); linha pontilhada de 50% (elemento implícito).
   *  dados: {categorias: [{id, rotulo, cor}], linhas: [{rotulo, valores: {cat: %}, absolutos?: {cat: texto}}], maioria?: bool} */
  adaptadores.barras100 = (C) => {
    C.passarDestaca = true;   // passar o mouse numa marca destaca a categoria dela
    const D = C.dados, L = D?.linhas || [], cats = D?.categorias || [];
    if (!L.length) return semDados(C);
    const W = C.alvo.clientWidth, H = Math.max(120, C.alvo.clientHeight), larg = W - 2;
    const passo = Math.min(72, (H - 6) / L.length), bh = Math.max(12, Math.min(34, passo * 0.5));
    const y0 = Math.max(0, (H - L.length * passo) / 2);   // poucas linhas: bloco no meio do palco
    const svg = svgDe(C, W, H, L.map((l) => `${l.rotulo}: ${cats.filter((k) => l.valores[k.id]).map((k) => `${k.rotulo} ${Lab.fmtPct(l.valores[k.id])}`).join(", ")}`).join(". "));
    const segs = [];   // um por linha × categoria: a posição depende de qual categoria está na base
    L.forEach((l, i) => {
      const y = y0 + 2 + i * passo;
      svg.append("text").attr("class", "rot-linha").attr("data-linha", l.id ?? l.rotulo).attr("x", 0).attr("y", y + 12).attr("font-size", 12).attr("font-weight", 600).attr("fill", tok("cor-texto")).text(curto(l.rotulo, Math.floor(W / 6.5)));
      for (const k of cats) {
        const v = l.valores[k.id];
        if (!v) continue;
        const w = (larg * v) / 100, c = corDe(k.cor);
        const r = svg.append("rect").attr("data-cat", k.id).attr("data-k", `${l.id ?? l.rotulo}|${k.id}`).attr("y", y + 17).attr("width", Math.max(0, w - 2)).attr("height", bh).attr("rx", 2).attr("fill", c);
        titulo(r, [l.rotulo, `${k.rotulo}: ${Lab.fmtPct(v)}`, l.absolutos?.[k.id] || null]);
        const t = w >= 34 ? svg.append("text").attr("data-cat", k.id).attr("y", y + 17 + bh / 2 + 4).attr("font-size", 11).attr("font-weight", 700)
          .attr("fill", Lab.tinta(c)).attr("pointer-events", "none") : null;
        if (t) t.node().__cor = c;
        segs.push({ i, k: k.id, w, r, t, v });
      }
    });
    // número da fatia: com uma casa decimal (o mesmo número do texto do cartão) quando TODAS as fatias rotuladas o
    // comportam; senão, inteiro em todas — precisão igual dentro do gráfico (projeto cultura, 2026-10-16)
    const decimais = segs.filter((q) => q.t).every((q) => q.w >= 50);
    segs.forEach((q) => q.t?.text(decimais && q.v < 99.95 ? Lab.fmtPct(q.v) : `${Math.round(q.v)}%`));
    // realce de uma categoria (legenda ou destaque do roteiro): as outras fatias clareiam, mas o número delas continua
    // legível — tinta escura por cima da fatia clara, em vez da tinta branca que sumia (2026-10-16)
    const realcar = (id) => {
      esmaecer(svg.selectAll("rect[data-cat]")).attr("opacity", function () { return !id || this.dataset.cat === id ? 1 : 0.22; });
      svg.selectAll("text[data-cat]").each(function () {
        const fora = Boolean(id) && this.dataset.cat !== id;
        d3.select(this).attr("fill", fora ? tok("cor-texto") : Lab.tinta(this.__cor)).attr("opacity", fora ? 0.75 : 1);
      });
    };
    // a categoria na base começa em x = 0 em todas as linhas: comparar o tamanho dela fica fácil (só a ordem muda)
    const posicionar = (base, animar) => {
      const ordem = base ? [base, ...cats.map((k) => k.id).filter((id) => id !== base)] : cats.map((k) => k.id);
      L.forEach((_, i) => {
        let x = 0;
        for (const id of ordem) {
          const sg = segs.find((q) => q.i === i && q.k === id);
          if (!sg) continue;
          const tr = (n) => (animar && !Lab.semMovimento() ? n.transition("base").duration(450).ease(d3.easeCubicInOut) : n);
          tr(sg.r).attr("x", x);
          if (sg.t) tr(sg.t).attr("x", x + 5);
          x += sg.w;
        }
      });
    };
    posicionar(null, false);
    const maioria = D.maioria !== false;
    if (maioria) svg.append("line").attr("x1", larg / 2).attr("x2", larg / 2).attr("y1", y0 + 14).attr("y2", y0 + 2 + (L.length - 1) * passo + 17 + bh + 3)
      .attr("stroke", tok("cor-texto")).attr("stroke-dasharray", "2 3").attr("stroke-width", 1).attr("opacity", 0.55).attr("pointer-events", "none");
    const visiveis = cats.filter((k) => L.some((l) => l.valores[k.id]));
    legendaCategorias(C, visiveis, realcar,
      [maioria ? "pontilhada: 50% (maioria)" : null, C.interativa && visiveis.length > 2 ? "tocar numa categoria a alinha à esquerda" : null], (id) => posicionar(id, true));
    // linha em destaque (a citada no texto): as outras linhas esmaecem e o rótulo dela fica em negrito
    const linhaDest = C.opc.linha_destaque;
    if (linhaDest && L.some((l) => (l.id ?? l.rotulo) === linhaDest)) {
      L.forEach((l, i) => { if ((l.id ?? l.rotulo) !== linhaDest) svg.selectAll(`[data-k^="${CSS.escape(String(l.id ?? l.rotulo))}|"]`).attr("opacity", 0.35); });
      svg.selectAll("text.rot-linha").attr("opacity", function () { return this.dataset.linha === linhaDest ? 1 : 0.55; });
    }
    // destaque do roteiro: a categoria começa fixada (na base, à esquerda; as demais esmaecidas), como ao tocar na legenda
    const dest = C.opc.destaque;
    if (dest && cats.some((k) => k.id === dest)) {
      posicionar(dest, false);
      realcar(dest);
      C.legenda?.querySelector(`button[data-cat="${CSS.escape(dest)}"]`)?.click();
    }
    fixarTexto(svg);
    return {};
  };

  /** fluxos — Sankey entre etapas, com as contagens prontas do Python (sem d3-sankey). Duas etapas: na vertical (DS);
   *  três ou mais: na horizontal. dados: {etapas: [rótulo], categorias: [{id, rotulo, cor}], unidade: "municípios",
   *  formato?: int | pct | brl, ligacoes: [{etapa (índice da origem), de, para, n}]}.
   *  opcoes: fase (origem = só os blocos da 1ª etapa | blocos = blocos de todas, sem faixas | faixas, o padrão: para
   *  montar e explicar o gráfico em cartões seguidos) e destaque ("de>para" ou lista: essas faixas acesas). O mesmo
   *  Sankey segue de um cartão para o outro (estado): `atualizar` só muda o que aparece, com transição. */
  adaptadores.fluxos = (C) => {
    const D = C.dados, E = D?.etapas || [], lig = (D?.ligacoes || []).filter((l) => l.n > 0), cats = D?.categorias || [];
    if (E.length < 2 || !lig.length) return semDados(C);
    const vertical = E.length === 2, uni = D.unidade || "unidades";
    const fmtN = D.formato ? fmtNum(D.formato) : (v) => Lab.fmtInt.format(v), comUni = (v) => (D.formato === "pct" ? fmtN(v) : `${fmtN(v)} ${uni}`);
    const ordem = cats.map((k) => k.id), cor = Object.fromEntries(cats.map((k) => [k.id, corDe(k.cor)])), nomeCat = Object.fromEntries(cats.map((k) => [k.id, k.rotulo]));
    // tamanho de cada bloco: saídas da etapa (ou entradas, na última)
    const blocos = E.map((_, e) => {
      const m = new Map();
      for (const l of lig) if (l.etapa === e) m.set(l.de, (m.get(l.de) || 0) + l.n); else if (e === E.length - 1 && l.etapa === e - 1) m.set(l.para, (m.get(l.para) || 0) + l.n);
      return m;
    });
    const total = d3.max(blocos, (m) => d3.sum([...m.values()])) || 1;
    const esp = vertical ? 36 : 26, gap = 5, hN = 10;              // vertical: o nome da etapa e os números dos blocos em linhas separadas
    const ligs = [...lig].sort((a, b) => a.etapa - b.etapa || ordem.indexOf(a.de) - ordem.indexOf(b.de) || ordem.indexOf(a.para) - ordem.indexOf(b.para));
    /** Geometria para um palco W × H (refeita quando o mesmo Sankey segue para um cartão de outra altura). */
    const geometria = (W, H) => {
      const comprimento = vertical ? W : H - esp;                  // eixo em que os blocos se empilham
      const posEtapa = (e) => (vertical ? (e === 0 ? esp : H - esp - hN) : 6 + (e * (W - 12 - hN)) / (E.length - 1));
      const esc = (comprimento - gap * (ordem.length - 1)) / total;
      const pos = blocos.map((m) => { let a = vertical ? 0 : esp; const p = {}; for (const g of ordem) { const n = m.get(g) || 0; if (!n) continue; p[g] = { a, w: n * esc, n }; a += n * esc + gap; } return p; });
      const cursorS = pos.map((p) => Object.fromEntries(Object.entries(p).map(([g, v]) => [g, v.a])));
      const cursorE = pos.map((p) => Object.fromEntries(Object.entries(p).map(([g, v]) => [g, v.a])));
      const faixas = ligs.map((l) => {
        const e = l.etapa, w = l.n * esc, a0 = cursorS[e][l.de], a1 = cursorE[e + 1][l.para];
        if (a0 === undefined || a1 === undefined) return null;
        cursorS[e][l.de] += w; cursorE[e + 1][l.para] += w;
        const p0 = posEtapa(e) + hN, p1 = posEtapa(e + 1), pm = (p0 + p1) / 2;
        return vertical
          ? `M${a0},${p0} C${a0},${pm} ${a1},${pm} ${a1},${p1} L${a1 + w},${p1} C${a1 + w},${pm} ${a0 + w},${pm} ${a0 + w},${p0} Z`
          : `M${p0},${a0} C${pm},${a0} ${pm},${a1} ${p1},${a1} L${p1},${a1 + w} C${pm},${a1 + w} ${pm},${a0 + w} ${p0},${a0 + w} Z`;
      });
      return { W, H, posEtapa, pos, faixas };
    };
    let G = geometria(C.alvo.clientWidth, Math.max(180, C.alvo.clientHeight));
    const svg = svgDe(C, G.W, G.H, `Fluxos entre ${E.join(", ")}: ` + lig.map((l) => `${nomeCat[l.de] || l.de} para ${nomeCat[l.para] || l.para}, ${comUni(l.n)}`).join("; "));
    const gl = svg.append("g");
    ligs.forEach((l, i) => {
      if (!G.faixas[i]) return;
      titulo(gl.append("path").attr("data-i", i).attr("fill", cor[l.de] || tok("cor-grade")).attr("data-de", l.de).attr("data-para", l.para).attr("data-etapa", l.etapa),
        [`${nomeCat[l.de] || l.de} → ${nomeCat[l.para] || l.para}`, comUni(l.n), l.nota || null, `de ${E[l.etapa]} para ${E[l.etapa + 1]}`]);   // nota: o absoluto por trás da %, do Python
    });
    const gb = svg.append("g");
    G.pos.forEach((p, e) => {
      const ge = gb.append("g").attr("data-etapa", e).attr("class", "etapa");
      for (const [g, v] of Object.entries(p)) {
        const r = ge.append("rect").attr("rx", 2).attr("fill", cor[g] || tok("cor-grade")).attr("data-cat", g).attr("data-etapa", e).attr("class", "bloco");
        titulo(r, [nomeCat[g] || g, `${E[e]}: ${comUni(v.n)}`, "as faixas acesas saem e chegam neste bloco"]);
        ge.append("text").attr("class", "num-bloco").attr("data-cat", g).attr("font-size", 11).attr("font-weight", 700).attr("fill", tok("cor-texto"))
          .attr("paint-order", "stroke").attr("stroke", tok("cor-superficie")).attr("stroke-width", 3).attr("pointer-events", "none");
      }
      ge.append("text").attr("class", "nome-etapa").attr("font-size", 11.5).attr("font-weight", 700).attr("fill", tok("cor-texto-secundario"));
    });
    /** Põe faixas, blocos e rótulos na geometria G (com transição quando o palco muda de altura entre cartões). */
    const posicionar = (tr = (s) => s) => {
      const { W, H, posEtapa, pos, faixas } = G;
      tr(svg).attr("width", W).attr("height", H);
      tr(gl.selectAll("path")).attr("d", function () { return faixas[+this.dataset.i]; });
      gb.selectAll("g.etapa").each(function () {
        const e = +this.dataset.etapa, ge = d3.select(this);
        ge.selectAll("rect.bloco").each(function () {
          const v = pos[e][this.dataset.cat], r = tr(d3.select(this));
          if (vertical) r.attr("x", v.a).attr("y", posEtapa(e)).attr("width", Math.max(1, v.w)).attr("height", hN);
          else r.attr("x", posEtapa(e)).attr("y", v.a).attr("width", hN).attr("height", Math.max(1, v.w));
        });
        ge.selectAll("text.num-bloco").each(function () {   // número no bloco, se couber (o nome fica na legenda; no bloco largo, também o nome)
          const g = this.dataset.cat, v = pos[e][g], cabeB = (t) => v.w >= t.length * 6.6 + 4;
          const txtB = vertical ? [`${nomeCat[g] || g} ${fmtN(v.n)}`, fmtN(v.n)].find(cabeB) || "" : v.w >= 14 ? fmtN(v.n) : "";
          const t = d3.select(this).text(txtB);
          if (vertical) tr(t).attr("x", v.a + 2).attr("y", e === 0 ? posEtapa(e) - 5 : posEtapa(e) + hN + 13);
          else tr(t).attr("x", e === E.length - 1 ? posEtapa(e) - 3 : posEtapa(e) + hN + 3).attr("y", v.a + Math.min(v.w / 2, 12) + 4).attr("text-anchor", e === E.length - 1 ? "end" : "start");
        });
        const te = ge.select("text.nome-etapa").text(curto(E[e], vertical ? 40 : Math.max(10, Math.floor(W / E.length / 6.5))));
        if (vertical) tr(te).attr("x", W).attr("text-anchor", "end").attr("y", e === 0 ? 11 : H - 2);
        else tr(te).attr("x", e === 0 ? posEtapa(e) : e === E.length - 1 ? posEtapa(e) + hN : posEtapa(e) + hN / 2).attr("text-anchor", e === 0 ? "start" : e === E.length - 1 ? "end" : "middle").attr("y", 12);
      });
    };
    posicionar();
    /** Espaço do palco sem o desenho (o SVG da altura antiga empurraria a medida). */
    const medir = () => {
      const n = svg.node(), d = n.style.display;
      n.style.display = "none";
      const w = C.alvo.clientWidth, h = Math.max(180, C.alvo.clientHeight);
      n.style.display = d;
      return [w, h];
    };
    // fase e destaque: o que aparece (blocos de cada etapa, faixas) e quais faixas ficam acesas
    let fase = "faixas", dest = [], bloco = null, catLeg = null;
    const opFaixa = (n) => {
      if (fase !== "faixas") return 0;
      const e = +n.dataset.etapa, de = n.dataset.de, para = n.dataset.para;
      if (bloco) return (e === bloco.e && de === bloco.g) || (e === bloco.e - 1 && para === bloco.g) ? 0.85 : 0.07;
      if (catLeg) return de === catLeg || para === catLeg ? 0.85 : 0.07;
      if (dest.length) return dest.includes(`${de}>${para}`) ? 0.85 : 0.1;
      return 0.42;
    };
    const aplicar = (animar) => {
      const tr = (sel) => (!animar ? sel : animar === "lento" && !Lab.semMovimento() ? sel.transition("leg").duration(550).ease(d3.easeCubicInOut) : esmaecer(sel));   // troca de cartão: mais lenta
      tr(gl.selectAll("path")).attr("opacity", function () { return opFaixa(this); });
      tr(gb.selectAll("g.etapa")).attr("opacity", function () { return fase === "origem" && +this.dataset.etapa > 0 ? 0 : 1; });
      gl.selectAll("path").attr("pointer-events", fase === "faixas" ? null : "none");
    };
    const lerOpcoes = (o) => { fase = o.fase || "faixas"; dest = [].concat(o.destaque || []).map(String); };
    lerOpcoes(C.opc);
    aplicar(false);
    const montarLegenda = (Cx) => legendaCategorias(Cx, cats.filter((k) => G.pos.some((p) => p[k.id])), (id) => { catLeg = id; aplicar(true); },
      [D.formato === "pct" ? "largura: % do total" : `largura: número de ${uni}`, fase !== "faixas" ? null : dest.length ? "acesas: as faixas citadas no texto" : null]);
    montarLegenda(C);
    // bloco: passar o mouse (ou tocar) acende só as faixas que saem dele e as que chegam nele
    if (C.interativa && !C.naImagem) {
      let fixo = null;
      const deBloco = (n) => (n?.classList?.contains("bloco") ? { e: +n.dataset.etapa, g: n.dataset.cat } : null);
      svg.selectAll("rect.bloco").on("pointerenter.fluxo", function () { if (!fixo) { bloco = deBloco(this); aplicar(true); } }).on("pointerleave.fluxo", () => { if (!fixo) { bloco = null; aplicar(true); } });
      svg.on("click.fluxo", (ev) => { const b = deBloco(ev.target); fixo = b && !(fixo && fixo.e === b.e && fixo.g === b.g) ? b : null; bloco = fixo; aplicar(true); });
    }
    fixarTexto(svg);
    return {
      /** Próximo cartão com o mesmo Sankey (mesmos dados): muda fase e destaque, com transição. */
      atualizar(Cn) {
        if (JSON.stringify(Cn.dados) !== JSON.stringify(D)) return false;
        C.legenda = Cn.legenda; C.opc = Cn.opc; C.fecharDica?.();
        lerOpcoes(Cn.opc); bloco = null; catLeg = null;
        aplicar("lento");
        montarLegenda(C);
        // o cartão novo pode ter outra altura (texto e nota mais longos): a etapa de baixo não pode sair do palco
        const [w, h] = medir();
        if (Math.abs(w - G.W) > 2 || Math.abs(h - G.H) > 2) {
          G = geometria(w, h);
          posicionar(Lab.semMovimento() ? (s) => s : (s) => s.transition("tam").duration(550).ease(d3.easeCubicInOut));
        }
        return true;
      },
    };
  };

  /** distribuicao — um círculo por unidade num eixo (beeswarm); posições por simulação de forças (só desenho).
   *  dados: {pontos: [{id, rotulo, valor, peso?, categoria?}], categorias?: [{id, rotulo, cor}], eixo: "rótulo",
   *          referencia?: {valor, rotulo}, formato?: "pp" | "pct" | "num", rotulo_tamanho?} */
  adaptadores.distribuicao = (C) => {
    const D = C.dados, P = (D?.pontos || []).filter((p) => p.valor !== null && p.valor !== undefined);
    if (!P.length) return semDados(C);
    const W = C.alvo.clientWidth, H = Math.max(150, C.alvo.clientHeight), m = { l: 18, r: 14, t: 16, b: 34 };
    const fmtV = D.formato === "pp" ? (v) => Lab.fmtPP(v) : D.formato === "pct" ? (v) => Lab.fmtPct(v) : (v) => Lab.fmtInt.format(v);
    const cats = D.categorias || [], corCat = Object.fromEntries(cats.map((k) => [k.id, corDe(k.cor)]));
    const ext = d3.extent([...P.map((p) => p.valor), D.referencia?.valor].filter((v) => v !== undefined));
    const sx = d3.scaleLinear().domain(ext).nice().range([m.l, W - m.r]);
    const temPeso = P.some((p) => p.peso);
    const rMax = Math.max(3, Math.min(10, Math.sqrt(((W - m.l - m.r) * (H - m.t - m.b) * 0.35) / (Math.PI * P.length)) * 1.4));
    const sr = temPeso ? d3.scaleSqrt().domain([0, d3.max(P, (p) => p.peso)]).range([1.5, rMax]) : () => Math.min(4, rMax);
    const nos = P.map((p) => ({ ...p, x: sx(p.valor), y: (H - m.b + m.t) / 2, r: sr(p.peso || 0) }));
    const sim = d3.forceSimulation(nos).force("x", d3.forceX((n) => sx(n.valor)).strength(1)).force("y", d3.forceY((H - m.b + m.t) / 2).strength(0.06))
      .force("c", d3.forceCollide((n) => n.r + 0.6)).stop();
    for (let i = 0; i < 160; i++) { sim.tick(); for (const n of nos) n.y = Math.max(m.t + n.r, Math.min(H - m.b - n.r, n.y)); }
    const svg = svgDe(C, W, H, `${D.eixo || "Distribuição"}: ${P.length} unidades, de ${fmtV(ext[0])} a ${fmtV(ext[1])}.`);
    eixoX(svg, sx, W, H, m, D.eixo);
    if (D.referencia) {
      const xr = sx(D.referencia.valor);
      svg.append("line").attr("x1", xr).attr("x2", xr).attr("y1", m.t - 4).attr("y2", H - m.b + 2).attr("stroke", tok("cor-texto")).attr("stroke-dasharray", "3 3").attr("opacity", 0.6);
      svg.append("text").attr("x", xr + 4).attr("y", m.t - 4).attr("font-size", 10.5).attr("fill", tok("cor-texto-secundario")).text(D.referencia.rotulo || fmtV(D.referencia.valor));
    }
    const pts = svg.append("g").selectAll("circle").data(nos).join("circle").attr("cx", (n) => n.x).attr("cy", (n) => n.y).attr("r", (n) => n.r)
      .attr("fill", (n) => corCat[n.categoria] || tok("cor-cat-1")).attr("fill-opacity", 0.8).attr("stroke", tok("cor-superficie")).attr("stroke-width", 0.5)
      .attr("data-cat", (n) => n.categoria || "");
    const nomeC = Object.fromEntries(cats.map((k) => [k.id, k.rotulo]));
    titulo(pts, (n) => [n.rotulo, `${D.eixo || "valor"}: ${fmtV(n.valor)}`, n.peso ? `${D.rotulo_tamanho || "peso"}: ${Lab.fmtInt.format(n.peso)}` : null, nomeC[n.categoria] || null]);
    legendaCategorias(C, cats.filter((k) => P.some((p) => p.categoria === k.id)),
      (id) => esmaecer(pts).attr("opacity", (n) => (!id || n.categoria === id ? 1 : 0.15)),
      [`N = ${Lab.fmtInt.format(P.length)}`, temPeso ? `área ∝ ${D.rotulo_tamanho || "peso"}` : null, D.referencia ? `tracejada: ${D.referencia.rotulo || "referência"}` : null]);
    fixarTexto(svg);
    return {};
  };

  /** boxplot — uma linha por grupo: caixa Q1–Q3, mediana rotulada, bigodes (Tukey, calculados no Python) e um ponto
   *  por unidade em enxame. dados: {grupos: [{id, rotulo, cor, resumo: {q1, mediana, q3, bigode_inf, bigode_sup, n},
   *  pontos: [{id, rotulo, valor}]}], eixo, formato?: "pct" | "num"} */
  adaptadores.boxplot = (C) => {
    const D = C.dados, G = (D?.grupos || []).filter((g) => g.resumo);
    if (!G.length) return semDados(C);
    const W = C.alvo.clientWidth, H = Math.max(150, C.alvo.clientHeight), m = { l: 14, r: 14, t: 4, b: 26 };
    const fmtV = D.formato === "num" ? (v) => Lab.fmtInt.format(v) : (v) => Lab.fmtPct(v);
    const vals = G.flatMap((g) => [g.resumo.bigode_inf, g.resumo.bigode_sup, ...(g.pontos || []).map((p) => p.valor)]).filter((v) => v !== null && v !== undefined);
    const sx = d3.scaleLinear().domain(d3.extent(vals)).nice().range([m.l, W - m.r]);
    const passo = (H - m.t - m.b) / G.length, bh = Math.min(22, passo * 0.38);
    const svg = svgDe(C, W, H, `${D.eixo || "Distribuição por grupo"}: ` + G.map((g) => `${g.rotulo}, mediana ${fmtV(g.resumo.mediana)}, ${g.resumo.n} unidades`).join("; "));
    eixoX(svg, sx, W, H, m, null);
    G.forEach((g, i) => {
      const c = corDe(g.cor), yc = m.t + i * passo + passo * 0.62, R = g.resumo, gg = svg.append("g").attr("data-cat", g.id);
      gg.append("text").attr("x", m.l).attr("y", m.t + i * passo + 11).attr("font-size", 11.5).attr("font-weight", 600).attr("fill", tok("cor-texto"))
        .text(`${curto(g.rotulo, 26)} · n = ${Lab.fmtInt.format(R.n)}`);
      const nos = (g.pontos || []).map((p) => ({ ...p, x: sx(p.valor), y: yc }));
      const sim = d3.forceSimulation(nos).force("x", d3.forceX((n) => sx(n.valor)).strength(1)).force("y", d3.forceY(yc).strength(0.1)).force("c", d3.forceCollide(2.3)).stop();
      for (let k = 0; k < 90; k++) { sim.tick(); for (const n of nos) n.y = Math.max(yc - passo * 0.32, Math.min(yc + passo * 0.32, n.y)); }
      gg.append("g").selectAll("circle").data(nos).join("circle").attr("cx", (n) => n.x).attr("cy", (n) => n.y).attr("r", 1.8).attr("fill", c).attr("fill-opacity", 0.45)
        .call((q) => titulo(q, (n) => [n.rotulo, `${g.rotulo}: ${fmtV(n.valor)}`]));
      gg.append("line").attr("x1", sx(R.bigode_inf)).attr("x2", sx(R.bigode_sup)).attr("y1", yc).attr("y2", yc).attr("stroke", tok("cor-texto")).attr("stroke-width", 1.2);
      titulo(gg.append("rect").attr("x", sx(R.q1)).attr("y", yc - bh / 2).attr("width", Math.max(1, sx(R.q3) - sx(R.q1))).attr("height", bh).attr("rx", 2)
        .attr("fill", c).attr("fill-opacity", 0.22).attr("stroke", tok("cor-texto")).attr("stroke-width", 1.2),
        [g.rotulo, `mediana: ${fmtV(R.mediana)}`, `metade do meio: de ${fmtV(R.q1)} a ${fmtV(R.q3)}`, `bigodes: de ${fmtV(R.bigode_inf)} a ${fmtV(R.bigode_sup)}`, `n = ${Lab.fmtInt.format(R.n)}`]);
      gg.append("line").attr("x1", sx(R.mediana)).attr("x2", sx(R.mediana)).attr("y1", yc - bh / 2 - 3).attr("y2", yc + bh / 2 + 3).attr("stroke", tok("cor-texto")).attr("stroke-width", 2.4);
      gg.append("text").attr("x", sx(R.mediana)).attr("y", yc - bh / 2 - 5).attr("text-anchor", "middle").attr("font-size", 10.5).attr("font-weight", 700)
        .attr("fill", tok("cor-texto")).attr("paint-order", "stroke").attr("stroke", tok("cor-superficie")).attr("stroke-width", 3).text(fmtV(R.mediana));
    });
    legendaCategorias(C, G.map((g) => ({ id: g.id, rotulo: g.rotulo, cor: g.cor })),
      (id) => esmaecer(svg.selectAll("g[data-cat]")).attr("opacity", function () { return !id || this.dataset.cat === id ? 1 : 0.2; }),
      [D.eixo ? `eixo: ${D.eixo}` : null, "caixa: metade do meio (Q1 a Q3) · traço grosso: mediana · linha: bigodes (até 1,5 × a caixa)"]);
    fixarTexto(svg);

        .attr("fill", tok("cor-texto")).attr("paint-order", "stroke").attr("stroke", tok("cor-superficie")).attr("stroke-width", 3).text(`${fmt(D.totais[fim])} total`);
    };
    desenhar(false);
    if (!emp) {   // valor do início, sobre a linha (uma série ou sobrepostas), sem sobreposição entre séries
      const ini = S.filter((s) => s.valores[0] != null && !s.tracejado && s.valores[0] !== 0).map((s) => ({ s, y: sy(s.valores[0]) - 7 })).sort((a, b) => a.y - b.y);
      for (let k = 1; k < ini.length; k++) if (ini[k].y - ini[k - 1].y < 12) ini[k].y = ini[k - 1].y + 12;

    if (alternar) botoesModo(C, "Forma das áreas", [["sob", "Sobrepostas"], ["emp", "Empilhadas"]], emp ? "emp" : "sob", (v) => { emp = v === "emp"; desenhar(true); });

      [D.eixo ? `eixo: ${D.eixo}` : null, emp || alternar ? "empilhadas: a altura total é a soma das categorias" : null, S.some((s) => s.tracejado) ? (D.nota_tracejado || "tracejado: fora do total") : null, D.nota_legenda || null],
      (id) => { base = id; if (emp) desenhar(true); });

  };

  /** colunas_empilhadas — colunas por grupo (ex.: ano), empilhadas por categoria; `opcoes.modo`: absoluto (com o total

   *  animada). A categoria fixada na legenda desce para a base (comparar o tamanho dela entre colunas fica fácil).
   *  dados: {grupos: [rótulo], series: [{id, rotulo, cor, valores, pct}], totais?: [n], formato?, eixo?} — pct e totais

  adaptadores.colunas_empilhadas = (C) => {

    const m = { t: (alternar ? 34 : prop ? 8 : 18) + (D.periodos?.length ? ALTURA_PERIODOS : 0), b: 20, l: Math.max(margemEixo(100, "pct"), margemEixo(d3.max(tot), D.formato)), r: 6 };
    const sx = d3.scaleBand().domain(Gs).range([m.l, W - m.r]).padding(0.22), sy = d3.scaleLinear().range([H - m.b, m.t]);
    const val = (s, i) => (prop ? s.pct?.[i] : s.valores[i]) ?? 0;
    const svg = svgDe(C, W, H, `${D.eixo || "Colunas empilhadas"}${prop ? " (proporção)" : ""}: ` + Gs.map((g, i) => `${g}: ${S.map((s) => `${s.rotulo} ${prop ? fmtP(val(s, i)) : fmtA(val(s, i))}`).join(", ")}`).join(". "));
    const gEixo = svg.append("g");
    const cabeX = Math.floor((W - m.l) / 34), passoX = Math.max(1, Math.ceil(Gs.length / cabeX));
    Gs.forEach((g, i) => {
      const ultimo = i === Gs.length - 1, colado = !ultimo && Gs.length - 1 - i < passoX && sx(Gs.at(-1)) - sx(g) < 34;   // não encosta no último
      if ((i % passoX === 0 && !colado) || ultimo) svg.append("text").attr("x", sx(g) + sx.bandwidth() / 2).attr("y", H - 5).attr("text-anchor", "middle").attr("font-size", 10.5).attr("fill", tok("cor-texto-secundario")).text(g);
    });
    const folgaB = (sx.step() - sx.bandwidth()) / 2;

      titulo(r, [`${g} · ${s.rotulo}`, `${fmtA(s.valores[i])}${s.pct?.[i] != null ? ` (${Lab.fmtPct(s.pct[i])} da coluna)` : ""}`, `total de ${g}: ${fmtA(tot[i])}`]);
      const t = svg.append("text").attr("data-cat", s.id).attr("x", sx(g) + sx.bandwidth() / 2).attr("text-anchor", "middle").attr("font-size", 10).attr("font-weight", 700)
