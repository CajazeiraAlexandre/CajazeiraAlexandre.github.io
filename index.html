  `<ul class="lista">${(P.trajetoria || []).map((t) => `<li><span class="quando">${esc(t.periodo)}</span><span>${esc(t.funcao)} — ${esc(t.onde)}</span></li>`).join("")}
   ${(P.formacao || []).map((f) => `<li><span class="quando">${esc(f.nivel)}</span><span>${esc(f.curso)} (${esc(f.instituicao)})${f.trabalho ? `<br><span class="meta">${esc(f.trabalho)}</span>` : ""}</span></li>`).join("")}</ul>`);
el("conteudo").innerHTML = html;
el("nav").innerHTML = secoes.map(([id, t]) => `<a href="#${id}">${t}</a>`).join("");

function refs(filtro) {
  el("refs").innerHTML = D.trabalhos.filter((r) => !filtro || (TIPOS[r.tipo] || r.tipo) === filtro).map((r) => card({
    titulo: r.titulo, link: r.link, meta: `${esc(r.veiculo || "")} · ${esc(r.ano || "")}`, texto: [r.descricao, r.nota].filter(Boolean).join(" "),
    tags: [tag(TIPOS[r.tipo] || r.tipo), ...(r.premios || []).map((p) => tag("★ " + p, "premio")),
           r.acesso === "assinantes" ? tag("assinantes", "fechado") : ""] })).join("");
}
el("f-ref").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  el("f-ref").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  refs(b.dataset.t);
});
refs("");
</script>
</body>
</html>
