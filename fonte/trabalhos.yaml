# Projetos e trabalhos com dados — alimenta a seção de mesmo nome do portfólio.
# Campos: titulo, ano, veiculo, tipo (painel | narrativa | visualizacao | exploratorio | padrao-de-dados | nota-tecnica | sistema-web),
# link, acesso (aberto | assinantes), premios, temas, descricao (texto curto no cartão),
# selo (ex.: Projeto pessoal), codigo (link do código-fonte).
# secao: onde o item aparece — sem secao = "Projetos e trabalhos com dados"; publicacoes = "Outras publicações";
# sistemas = "Desenvolvimento de sistemas". O tipo é só um registro interno (não aparece na página).
# link_suspenso: link oficial guardado enquanto a página está fora do ar (ex.: gov.br no período eleitoral);
# quando voltar, troque link_suspenso por link e apague a nota.

- titulo: Onde estão os votos? Distribuição territorial de candidaturas no Piauí
