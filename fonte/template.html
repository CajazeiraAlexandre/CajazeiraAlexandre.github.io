<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NOME__ — Portfólio</title>
<meta name="description" content="__DESCRICAO__">
<meta property="og:title" content="__NOME__ — Portfólio">
<meta property="og:description" content="__DESCRICAO__">
<meta property="og:image" content="__URL__assets/foto.png">
<meta property="og:type" content="profile">
<link rel="icon" href="assets/foto.png">
<link rel="stylesheet" href="assets/tokens.css">
<!-- Arquivo GERADO por gerar.py a partir de fonte/ — não edite à mão. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--cor-fundo,#f9f9f7);color:var(--cor-texto,#0b0b0b);
       font-family:var(--fonte-texto,system-ui,sans-serif);font-size:var(--fs-texto,16px);line-height:1.55}
  main{max-width:960px;margin:0 auto;padding:48px var(--margem-lateral,16px) 32px}
  a{color:var(--cor-destaque,#2a78d6)}
  header{border-bottom:1px solid var(--cor-borda,#ddd);padding-bottom:24px}
  .topo{display:flex;gap:24px;align-items:center}
  .foto{width:112px;height:112px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--cor-borda,#ddd)}
  h1{font-size:var(--fs-titulo,32px);font-weight:var(--peso-titulo,700);line-height:1.1;margin:0}
  .papel{font-size:18px;color:var(--cor-texto-secundario,#52514e);margin:8px 0 0}
  .resumo{max-width:var(--largura-texto,680px);margin:16px 0 0}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .links a{font-size:14px;text-decoration:none;border:1px solid var(--cor-borda,#ccc);border-radius:999px;padding:6px 12px;color:var(--cor-texto,#111)}
  .links a:hover{border-color:var(--cor-destaque,#2a78d6)}
  nav.secoes{display:flex;flex-wrap:wrap;gap:4px 16px;margin:20px 0 0;font-size:14px}
  nav.secoes a{color:var(--cor-texto-secundario,#555);text-decoration:none}
  nav.secoes a:hover{color:var(--cor-destaque,#2a78d6)}
  h2{font-size:var(--fs-subtitulo,22px);margin:48px 0 4px;scroll-margin-top:16px}
  .intro{color:var(--cor-texto-secundario,#555);margin:0 0 16px;font-size:15px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:var(--cor-superficie,#fff);border:1px solid var(--cor-borda,#ddd);border-radius:var(--raio,6px);
        padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .card h3{font-size:16px;margin:0;line-height:1.35;overflow-wrap:anywhere}
  .card h3 a{color:inherit;text-decoration:none} .card h3 a:hover{color:var(--cor-destaque,#2a78d6)}
  .card p{margin:0;font-size:14px;color:var(--cor-texto-secundario,#555)}
  .meta{font-size:12px;color:var(--cor-texto-suave,#6b6b6b)}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
  .tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--cor-borda,#ccc);color:var(--cor-texto-secundario,#555)}
  .tag.premio{border-color:var(--cor-cat-4,#eda100)}
  .tag.fechado{border-style:dashed}
  .filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .filtros button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--cor-borda,#ccc);
                  background:var(--cor-superficie,#fff);color:var(--cor-texto,#111);cursor:pointer}
  .filtros button[aria-pressed="true"]{border-color:var(--cor-destaque,#2a78d6);color:var(--cor-destaque,#2a78d6)}
  ul.lista{list-style:none;padding:0;margin:0}
  ul.lista li{padding:10px 0;border-bottom:1px solid var(--cor-grade,#eee);display:grid;grid-template-columns:150px 1fr;gap:12px}
  ul.lista .quando{font-size:13px;color:var(--cor-texto-suave,#6b6b6b);font-variant-numeric:tabular-nums}
  footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--cor-borda,#ddd);font-size:13px;color:var(--cor-texto-suave,#6b6b6b)}
  @media (max-width:560px){
    .topo{flex-direction:column;align-items:flex-start;gap:16px}
    .foto{width:96px;height:96px}
    ul.lista li{grid-template-columns:1fr;gap:2px}
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="topo">
      <img class="foto" id="foto" alt="" width="112" height="112">
      <div>
        <h1 id="nome"></h1>
        <p class="papel" id="papel"></p>
      </div>
    </div>
    <p class="resumo" id="resumo"></p>
    <div class="links" id="links"></div>
    <nav class="secoes" id="nav" aria-label="Seções"></nav>
  </header>
  <div id="conteudo"></div>
  <footer><span id="rodape"></span></footer>
</main>
<script>
const D = __DADOS__;
const P = D.perfil || {};
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

el("nome").textContent = P.nome || "";
el("papel").textContent = [P.cargo, P.instituicao].filter(Boolean).join(" · ");
el("resumo").textContent = P.resumo || "";
if (P.foto) { el("foto").src = P.foto; el("foto").alt = `Foto de ${P.nome_curto || P.nome}`; } else el("foto").remove();
const L = P.links || {};
el("links").innerHTML = [["lattes", "Currículo Lattes"], ["github", "GitHub"], ["observable", "Observable"], ["flourish", "Flourish"]]
  .filter(([k]) => L[k]).map(([k, n]) => `<a href="${esc(L[k])}" target="_blank" rel="noopener">${n}</a>`).join("")
  // e-mails: lista {endereco, rotulo}; o endereço aparece por extenso para quem quiser copiar
  + (P.emails || []).map((m) => `<a href="mailto:${esc(m.endereco)}">${esc(m.rotulo ? `${m.rotulo}: ` : "")}${esc(m.endereco)}</a>`).join("");
el("rodape").textContent = `${P.nome_curto || P.nome || ""} · atualizado em ${new Date(D.gerado_em + "T12:00").toLocaleDateString("pt-BR")}`;

const secoes = [];
function secao(id, titulo, intro, html) { secoes.push([id, titulo]); return `<section id="${id}"><h2>${titulo}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${html}</section>`; }
function card({ titulo, link, meta, texto, tags = [] }) {
  const t = link ? `<a href="${esc(link)}" ${/^https?:/.test(link) ? 'target="_blank" rel="noopener"' : ""}>${esc(titulo)}</a>` : esc(titulo);
  return `<article class="card"><div class="meta">${meta || ""}</div><h3>${t}</h3>${texto ? `<p>${esc(texto)}</p>` : ""}
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}</article>`;
}
const tag = (t, cls = "") => `<span class="tag ${cls}">${esc(t)}</span>`;
const itens = (lst) => `<div class="cards">${lst.map((i) => card({ titulo: i.titulo, link: i.link, meta: esc(i.periodo || i.evento || ""), texto: i.descricao })).join("")}</div>`;
// seção sem itens não aparece na página
const seTiver = (lst, id, titulo, intro = "") => (lst && lst.length ? secao(id, titulo, intro, itens(lst)) : "");

let html = "";
// cartão de trabalho: veículo · ano, descrição e selos (prêmios, assinantes) — sem rótulo de tipo
const cartaoTrabalho = (r) => card({ titulo: r.titulo, link: r.link, meta: `${esc(r.veiculo || "")} · ${esc(r.ano || "")}`,
  texto: [r.descricao, r.nota].filter(Boolean).join(" "),
  tags: [...(r.premios || []).map((p) => tag("★ " + p, "premio")), r.acesso === "assinantes" ? tag("assinantes", "fechado") : ""].filter(Boolean) });
const daSecao = (s) => D.trabalhos.filter((r) => (r.secao || "projetos") === s);
html += secao("projetos", "Projetos e trabalhos com dados",
  "Reportagens de dados, visualizações e padrões de dados. Alguns conteúdos jornalísticos são exclusivos para assinantes.",
  `<div class="cards">${daSecao("projetos").map(cartaoTrabalho).join("")}</div>`);
html += seTiver(P.palestras, "palestras", "Palestras e oficinas");
html += seTiver(P.pesquisa, "pesquisa", "Pesquisa");
if (daSecao("publicacoes").length) html += secao("publicacoes", "Outras publicações", "", `<div class="cards">${daSecao("publicacoes").map(cartaoTrabalho).join("")}</div>`);
if (daSecao("sistemas").length) html += secao("sistemas", "Desenvolvimento de sistemas", "", `<div class="cards">${daSecao("sistemas").map(cartaoTrabalho).join("")}</div>`);
html += seTiver(P.extensao, "extensao", "Extensão");
html += seTiver(P.ensino, "ensino", "Ensino");
html += seTiver(P.gestao, "gestao", "Gestão");
html += secao("trajetoria", "Trajetória e formação", "",
  `<ul class="lista">${(P.trajetoria || []).map((t) => `<li><span class="quando">${esc(t.periodo)}</span><span>${esc(t.funcao)} — ${esc(t.onde)}</span></li>`).join("")}
   ${(P.formacao || []).map((f) => `<li><span class="quando">${esc(f.nivel)}</span><span>${esc(f.curso)} (${esc(f.instituicao)})${f.trabalho ? `<br><span class="meta">${esc(f.trabalho)}</span>` : ""}</span></li>`).join("")}</ul>`);
el("conteudo").innerHTML = html;
el("nav").innerHTML = secoes.map(([id, t]) => `<a href="#${id}">${t}</a>`).join("");


</script>
</body>
</html>
